<p class="lead">GitHub Actions는 저장소의 이벤트를 받아 테스트·빌드·배포 명령을 실행하는 자동화 서비스다. 이 강의에서는 작은 YAML 파일을 직접 읽고 작성한 뒤, TripPilot의 수동 AWS 배포를 단계별로 해석한다. 끝나면 어떤 코드가 어떤 권한으로 어느 조건에서 실행되는지 설명할 수 있다.</p>
