name: batch-ci

# 로컬 수집 파이프라인(batch/, TRIP-1468)의 검증 로직과 DAG 구조·실행.
# 실 API 호출 0건 — POI 는 합성 문서, 행사는 리포 사본(ai/data/collected_events.json)으로 DAG 를 돌린다.
# 경로: 검증 규칙이 백엔드 지역 시드와 판정 규칙(RegionResolver — 거울로 따른다), 행사 사본·수집기의 운영 지역 목록(collect_events.py DEFAULT_REGIONS)을 읽으므로 그것들이 바뀌어도 돈다.
# 리포 POI 수집본은 이 CI 가 검증하지 않는다 — 수집 배치의 봇 PR 앞 게이트는 TRIP-1475 가 다룬다.
on:
  push:
    branches: [develop]
    paths: ['batch/**', 'backend/modules/place-data/src/main/kotlin/com/trippilot/placedata/domain/RegionResolver.kt', '.github/workflows/batch-ci.yml', 'backend/app/src/main/resources/db/migration/R__seed_region_catalog.sql', 'ai/data/collected_events.json', 'ai/scripts/collect/collect_events.py']
  pull_request:
    branches: [develop, main]
    paths: ['batch/**', 'backend/modules/place-data/src/main/kotlin/com/trippilot/placedata/domain/RegionResolver.kt', '.github/workflows/batch-ci.yml', 'backend/app/src/main/resources/db/migration/R__seed_region_catalog.sql', 'ai/data/collected_events.json', 'ai/scripts/collect/collect_events.py']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: '3.3.2'
      PYTHON_VERSION: '3.12'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Airflow 설치(제약 파일로 고정)
        run: |
          uv venv -p "$PYTHON_VERSION" .venv-batch
          uv pip install --python .venv-batch "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - name: 검증 로직 + DAG 구조 + 실행
        run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow"
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          export AIRFLOW__CORE__DAGS_FOLDER="$PWD/batch/dags"
          .venv-batch/bin/airflow db migrate
          .venv-batch/bin/python -m unittest discover -s batch/tests -v
