# 임베딩 서비스 이미지 발행 (TRIP-517 후속).
#
# ## 왜 ai-ci 와 별도 워크플로인가
#
# `ai-ci` 는 `ai/**` 전체를 감시한다 — 거기에 이 잡을 넣으면 FastAPI 경계를 한 줄
# 고칠 때마다 2GB 이미지(모델 굽기 포함)를 다시 빌드한다. 정작 `ai/embedding/` 은
# 4파일짜리라 거의 안 바뀐다. 트리거를 그 디렉토리로 좁힌다.
#
# ## 왜 지금 만드나 — compose 가 없는 이미지를 가리키고 있었다
#
# `docker-compose.yml` 의 ai-embedding 은
# `image: ghcr.io/asm-trippilot/trippilot-embedding:${TAG:-develop}` 를 가리키는데
# 그 태그를 발행하는 곳이 없었다. 로컬은 `build:` 폴백으로 돌지만, 그게 없는 곳
# (배포·새 머신)에서는 매번 8분을 빌드하거나 pull 이 실패한다.
name: ai-embedding-ci

on:
  push:
    branches: [develop]
    paths: ['ai/embedding/**', '.github/workflows/ai-embedding-ci.yml']
  pull_request:
    branches: [develop]
    paths: ['ai/embedding/**', '.github/workflows/ai-embedding-ci.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trippilot-embedding

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # HF 에서 fp32 2.1GB 를 받아 fp16 으로 굽는 빌드다 — 러너 디스크를 미리 비운다.
      # 안 비우면 빌드 중간에 "no space left on device" 로 죽는다.
      - name: 러너 디스크 확보
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,format=short

      # **한 번만 빌드해서 로컬에 적재한다** — 검증한 것과 발행하는 것이 같은 이미지여야
      # 한다. ai-ci 는 push 용·load 용을 따로 빌드하는데(캐시가 있어 수 초), 여기는
      # 캐시가 없어 그러면 빌드가 두 번이다. 발행은 검증 뒤 `docker push` 로 한다.
      #
      # 캐시(type=gha)를 안 쓰는 이유: 이 이미지 레이어가 2GB 대라 리포 공용 Actions
      # 캐시(10GB)를 잠식해 ai-ci 캐시를 밀어낸다. 이 워크플로는 드물게 도니 그쪽
      # 손해가 더 크다. 빌드가 잦아지면 그때 scope 를 나눠 붙인다.
      - uses: docker/build-push-action@v6
        with:
          context: ./ai/embedding
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 빌드 성공 ≠ 기동 성공 (TRIP-239 의 교훈). 여기선 한 겹 더 본다 — 기동해도
      # 구워진 가중치 경로가 틀리면 `/embed` 에서야 드러나고, 그때는 이미 운영이다.
      - name: 기동 + 실제 임베딩 검증
        run: |
          docker run -d --rm --name emb -p 8100:8100 ${{ env.IMAGE }}:develop
          # /model 은 모델 로드 없이 답한다 — 프로세스가 떴는지 먼저 본다.
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8100/model > /tmp/model.json; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo '::error::컨테이너가 기동하지 않거나 /model 이 응답하지 않음'
            docker logs emb || true; exit 1
          fi
          cat /tmp/model.json
          # /embed 는 구워진 가중치를 실제로 읽는다(워밍 스레드가 먼저 읽고 있을 수도).
          # 첫 로드가 수 초라 넉넉히 기다린다.
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -X POST http://localhost:8100/embed \
                 -H 'content-type: application/json' \
                 -d '{"texts":["비 오는 날 실내 대안"]}' > /tmp/embed.json; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo '::error::/embed 가 응답하지 않음 — 구워진 가중치를 못 읽었을 수 있다'
            docker logs emb || true; exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/embed.json"))
          # 차원·모델명은 호출측(HttpEmbeddingAdapter)이 대조해 거부하는 값이다 —
          # 여기서 어긋나면 적재된 벡터와 다른 공간으로 질의하게 된다.
          assert d["dim"] == 1024, d["dim"]
          assert d["model"] == "nlpai-lab/KURE-v1", d["model"]
          assert len(d["vectors"]) == 1 and len(d["vectors"][0]) == 1024, "벡터 형태 이상"
          print("ok —", d["model"], d["dim"])
          PY
          docker logs emb | tail -5
          docker stop emb

      # 발행은 develop push 에서만. PR 은 빌드·검증까지.
      - if: github.event_name == 'push'
        run: docker push --all-tags ${{ env.IMAGE }}
