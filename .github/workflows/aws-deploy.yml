name: AWS / Terraform and EKS deploy

# 런 목록에서 대상·선언이 보이고, deploy_gate.py 가 "dev apply app=true" 접두로 개발 앱 배포 런을 찾는다(TRIP-1659).
run-name: ${{ inputs.target }} ${{ inputs.mode }} app=${{ inputs.deploy_application }} kind=${{ inputs.deploy_kind }}

# AWS mutations have a single manual entry point. No push, schedule, or GitOps sync.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 대상 환경
        type: choice
        options: [dev, prd]
        default: dev
        required: true
      target:
        description: 배포 대상 — prod 는 출시 앱이 보는 서버(네임스페이스 trippilot), dev 는 개발 서버(trippilot-dev · dev-api · 개발 DB · Terraform 안 건드림 · 푸시 꺼짐)
        type: choice
        options: [prod, dev]
        default: prod
        required: true
      mode:
        description: plan은 미리보기, apply는 인프라 변경 및 선택한 앱 배포
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      deploy_application:
        description: apply 후 이미지 빌드·DB 초기화·EKS 앱 배포
        type: boolean
        default: true
      embedding_enabled:
        description: 로컬 임베딩 서비스와 pgvector RAG 활성화 (추가 메모리 필요) — 끄면 재계획·대안이 규칙 랭킹으로만 돈다
        type: boolean
        default: true
      push_mode:
        description: 푸시 발송 모드 — keep 은 시크릿에 저장된 값 유지, expo 는 Expo 푸시로 실제 발송, off 는 끔
        type: choice
        options: [keep, off, expo]
        default: keep
      dialogue_orchestrator:
        description: 도우미 오케스트레이터(AI 시크릿 TRIPPILOT_DIALOGUE_ORCHESTRATOR) — keep 은 저장값 유지, on·off 는 배포 역할이 시크릿에 써서 다음 배포에도 남는다
        type: choice
        options: [keep, 'on', 'off']
        default: keep
      llm_feature_models:
        description: 기능별 모델 배정(TRIPPILOT_LLM_FEATURE_MODELS)에 덧씌울 항목 FEATURE=model,… — 같은 기능은 바꾸고 나머지는 그대로 시크릿에 쓴다. 이 커밋과 지금 떠 있는 AI 이미지가 둘 다 아는 이름만 받는다(새 기능은 입력 없이 한 번 배포한 다음 런에서). 비우면 유지
        type: string
        default: ''
      runtime_switches:
        description: 상황 감지 스위치를 시크릿에 쓴다 — KEY=VALUE;KEY=VALUE (쌍 구분은 세미콜론). 허용 키는 PLANB_SITUATION_SWEEP(off|dry-run|on) · PLANB_SITUATION_HORIZON(today|tomorrow|pre-trip) · PLANB_SITUATION_SWEEP_ACCOUNT_IDS(UUID 쉼표 목록) · PLANB_PREPARED_REPLAN(off|on) · HOLIDAY_CLOSURE_MODE(off|on)뿐, KEY= 는 그 키를 지워 앱 기본값으로 되돌린다. 그 밖의 키·형식·값 오류는 배포 실패. 비우면 유지
        type: string
        required: false
        default: ''
      deploy_kind:
        description: 운영 배포 종류(target=prod 의 apply 는 필수) — release 는 주 1회·앱 릴리스일 열차(같은 코드가 최근 72시간 안에 개발 서버에서 검증돼야 함), hotfix 는 "지금 안 고치면 사용자가 오늘 피해를 보는" 경우만(Jira 키·사유 필수, 검증은 사후)
        type: choice
        options: [none, release, hotfix]
        default: none
      deploy_ref:
        description: release 는 릴리스 이름(앱 버전 등, 영문·숫자·.-_ 40자 이하), hotfix 는 Jira 키(TRIP-123)
        type: string
        default: ''
      deploy_reason:
        description: hotfix 사유 한 줄(3~200자). release 는 비워 둔다
        type: string
        default: ''
      dev_sleep_after:
        description: 개발 대상 배포·검증이 끝나면 개발 파드를 0 으로 내린다(기본 켬 — 노드 1대 ≈ $84/월을 돌려준다). 켜 둔 채 QA 를 하려면 끈다
        type: boolean
        default: true
      poi_close_missing:
        description: POI 공유본 적재 때 그 출처의 ACTIVE 중 공유본에 없는 것을 LOST 로 내린다 (기본 off — upsert 만). 비율 가드(409)에 걸리면 스텝이 실패하고 아무것도 닫지 않는다
        type: boolean
        default: false
      poi_close_missing_dry_run:
        description: 퇴출하면 몇 건이 닫힐지만 서버에 묻고(닫지 않음) 평소대로 upsert 한다 — 결과는 배포 요약의 "POI load" 줄. poi_close_missing 이 켜져 있으면 무시
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VERSION: '1.13.5'

jobs:
  # 오프라인 검증은 PR 게이트와 같은 잡이다 — 여기 복제하지 않는다(infra-validate.yml).
  validate:
    uses: ./.github/workflows/infra-validate.yml
    with:
      verify_backend_shutdown: ${{ inputs.mode == 'apply' && inputs.deploy_application }}

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # 선언된 스텝 상한 합: helm 대기 30 + KB 적재 95 + POI 적재 25 = 150분 + 빌드·terraform·smoke.
    # 120 이면 KB 마감(90분, 2026-10-16)보다 잡이 먼저 끊겨 정리 스텝 없이 취소된다 — 180 으로 둔다.
    # 자격 증명은 2시간짜리라 KB·POI 적재 앞에서 다시 받는다(아래 Refresh AWS credentials 두 스텝).
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      actions: read  # deploy_gate.py 가 개발 배포 런 목록을 읽는다
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_TARGET: ${{ inputs.target }}
      DEPLOY_MODE: ${{ inputs.mode }}
      DEPLOY_APPLICATION: ${{ inputs.deploy_application }}
      DEPLOY_KIND: ${{ inputs.deploy_kind }}
      DEPLOY_REF: ${{ inputs.deploy_ref }}
      DEPLOY_REASON: ${{ inputs.deploy_reason }}
      DEV_SLEEP_AFTER: ${{ inputs.dev_sleep_after }}
      EMBEDDING_ENABLED: ${{ inputs.embedding_enabled }}
      PUSH_MODE_INPUT: ${{ inputs.push_mode }}
      DIALOGUE_ORCHESTRATOR_INPUT: ${{ inputs.dialogue_orchestrator }}
      LLM_FEATURE_MODELS_INPUT: ${{ inputs.llm_feature_models }}
      POI_CLOSE_MISSING: ${{ inputs.poi_close_missing }}
      POI_CLOSE_MISSING_DRY_RUN: ${{ inputs.poi_close_missing_dry_run }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      # 주소·인증서는 대상별로 따로 받고 workflow_config 가 골라 ACM_CERTIFICATE_ARN·API_HOSTNAME 으로 내보낸다.
      # 식(`a && b || c`)으로 고르면 개발 변수가 빌 때 조용히 운영 값으로 떨어진다(#1261 검수) — 고르기와 거절을 한 곳에서.
      PROD_ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      PROD_API_HOSTNAME: ${{ vars.API_HOSTNAME }}
      DEV_TARGET_ACM_CERTIFICATE_ARN: ${{ vars.DEV_TARGET_ACM_CERTIFICATE_ARN }}
      DEV_TARGET_API_HOSTNAME: ${{ vars.DEV_TARGET_API_HOSTNAME }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_VAR_deployment_role_arn: ${{ vars.AWS_ROLE_ARN }}
      IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate environment and branch before AWS access
        id: config
        run: python3 infra/scripts/workflow_config.py
      # 운영은 열차·핫픽스만(TRIP-1659). 선언 형식은 위 스텝(workflow_config)이 이미 봤고, 여기서는 열차가 개발 서버에서
      # 검증된 코드인지 본다. 핫픽스는 검증이 사후라 통과. AWS 자격 증명 전에 끝나므로 실패해도 클라우드를 건드리지 않는다.
      # 조건은 선언 검사(workflow_config)와 같은 "운영 apply" — deploy_application=false 인 인프라만의 apply 도 운영 변경이라
      # 앱 배포 여부로 좁히면 release 선언만으로 검증 없이 Terraform 이 나간다(#1678 검수).
      - name: Require a validated dev run for production releases
        if: steps.config.outputs.target == 'prod' && steps.config.outputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KIND: ${{ steps.config.outputs.deploy_kind }}
        run: python3 infra/scripts/deploy_gate.py
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: trippilot-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Check HTTPS certificate
        if: steps.config.outputs.deploy_application == 'true'
        run: |
          test "$(aws acm describe-certificate --certificate-arn "$ACM_CERTIFICATE_ARN" --query 'Certificate.Status' --output text)" = ISSUED
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Initialize existing environment state
        working-directory: infra/terraform/stack
        env:
          TF_STATE_BUCKET: ${{ steps.config.outputs.state_bucket }}
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform validate
      - name: Terraform plan
        working-directory: infra/terraform/stack
        # 개발 대상은 공유 인프라를 바꾸지 않는다 — 출력만 읽는다(아래 Read infrastructure outputs).
        if: steps.config.outputs.terraform == 'true'
        run: terraform plan -lock-timeout=5m -var-file="../environments/$DEPLOY_ENVIRONMENT.tfvars" -out="$RUNNER_TEMP/trippilot.tfplan"
      - name: Apply the saved run plan
        if: inputs.mode == 'apply' && steps.config.outputs.terraform == 'true'
        working-directory: infra/terraform/stack
        run: terraform apply -lock-timeout=5m "$RUNNER_TEMP/trippilot.tfplan"
      - name: Read infrastructure outputs
        if: steps.config.outputs.deploy_application == 'true'
        id: infra
        working-directory: infra/terraform/stack
        run: |
          umask 077
          terraform output -json > "$RUNNER_TEMP/trippilot-outputs.json"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          for component in backend ai embedding; do
            repository=$(jq -r --arg component "$component" '.ecr_repositories.value[$component]' "$RUNNER_TEMP/trippilot-outputs.json")
            echo "${component}_repository=$repository" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-buildx-action@v3
        if: steps.config.outputs.deploy_application == 'true'
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.config.outputs.deploy_application == 'true'
      - name: Build and publish backend
        if: steps.config.outputs.deploy_application == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.backend_repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=aws-backend
          cache-to: type=gha,mode=min,scope=aws-backend
      # 운영 AI 는 이미지 안 data/collected_events.json 을 읽는다(chart ai.yaml EVENTS_STORE). 매일 행사 수집은
      # collect-state 브랜치에만 쌓아서 동봉본이 8-22 이후 멈춰 있었다(10-18 발견) — 빌드 직전에 정본으로 갈아 끼운다.
      # 정본을 못 읽으면 동봉본을 그대로 굽고 경고만 낸다(배포를 막지 않는다).
      - name: Refresh the bundled events store from collect-state
        if: steps.config.outputs.deploy_application == 'true'
        run: |
          if git fetch --depth=1 origin collect-state \
            && git show FETCH_HEAD:collected_events.json > "$RUNNER_TEMP/collect-state-events.json"; then
            python3 deploy/eks/refresh_events.py "$RUNNER_TEMP/collect-state-events.json" ai/data/collected_events.json
          else
            echo "::warning::collect-state 의 collected_events.json 을 못 받았다 — 동봉본을 그대로 굽는다"
          fi
      - name: Build and publish AI
        if: steps.config.outputs.deploy_application == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.ai_repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=aws-ai
          cache-to: type=gha,mode=min,scope=aws-ai
      # 임베딩 이미지 태그는 **빌드 맥락(ai/embedding)의 내용 해시**다 — 런마다 새 태그면 코드가 그대로여도
      # 매 배포 파드가 바뀌고, maxSurge 0(chart embedding.yaml 주석)이라 그때마다 몇 분 엔드포인트가 빈다
      # (10-14 하루 15회+, 재계획 KB 검색이 그 사이 Connection refused 로 강등). 같은 해시가 이미 올라가
      # 있으면 빌드를 건너뛰고 같은 태그를 그대로 쓴다 → 파드 템플릿 무변 → 롤아웃 없음.
      - name: Resolve the embedding image tag
        id: embedding-tag
        if: steps.config.outputs.deploy_application == 'true' && steps.config.outputs.embedding_enabled == 'true'
        env:
          REPOSITORY: ${{ steps.infra.outputs.embedding_repository }}
        run: |
          tag="emb-$(git rev-parse HEAD:ai/embedding)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$REPOSITORY:$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "embedding $tag 이미 있음 — 빌드 생략, 임베딩 롤아웃 없음"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish embedding
        if: steps.config.outputs.deploy_application == 'true' && steps.config.outputs.embedding_enabled == 'true' && steps.embedding-tag.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ai/embedding
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.embedding_repository }}:${{ steps.embedding-tag.outputs.tag }}
          cache-from: type=gha,scope=aws-embedding
          cache-to: type=gha,mode=min,scope=aws-embedding
      - uses: azure/setup-kubectl@v4
        if: steps.config.outputs.deploy_application == 'true'
        with:
          version: v1.35.0
      - uses: azure/setup-helm@v4.3.1
        if: steps.config.outputs.deploy_application == 'true'
        with:
          version: v3.19.0
      - name: Connect to the selected EKS cluster
        if: steps.config.outputs.deploy_application == 'true'
        env:
          CLUSTER_NAME: ${{ steps.infra.outputs.cluster_name }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          python3 deploy/eks/runtime.py ensure-namespace --target "$DEPLOY_TARGET"
      - name: Synchronize runtime secrets and render nonsecret Helm values
        if: steps.config.outputs.deploy_application == 'true'
        env:
          EMBEDDING_IMAGE_TAG: ${{ steps.embedding-tag.outputs.tag }}
          # 공공데이터포털 키(기상특보·에어코리아·특일정보) — 입력이 아니라 저장소 시크릿이다(입력은 실행 화면에 보인다).
          # 이 스텝에만 싣는다. sync-secrets 가 backend·ai 시크릿에 쓰고, 비어 있으면 저장값을 그대로 둔다.
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          # 상황 감지 스위치 입력 — 셸에 직접 끼우지 않고 이 스텝 env 로만 받는다. 형식·허용 키·값 검증은 sync-secrets 가 한다.
          RUNTIME_SWITCHES_INPUT: ${{ inputs.runtime_switches }}
        run: |
          embedding_args=()
          if [ "$EFFECTIVE_EMBEDDING" = true ]; then embedding_args+=(--embedding-enabled); fi
          embedding_tag_args=()
          if [ -n "$EMBEDDING_IMAGE_TAG" ]; then embedding_tag_args+=(--embedding-image-tag "$EMBEDDING_IMAGE_TAG"); fi
          push_args=()
          if [ "$EFFECTIVE_PUSH_MODE" != keep ]; then push_args+=(--push-mode "$EFFECTIVE_PUSH_MODE"); fi
          dialogue_args=()
          if [ "$EFFECTIVE_DIALOGUE_ORCHESTRATOR" != keep ]; then dialogue_args+=(--dialogue-orchestrator "$EFFECTIVE_DIALOGUE_ORCHESTRATOR"); fi
          if [ -n "$EFFECTIVE_LLM_FEATURE_MODELS" ]; then dialogue_args+=(--llm-feature-models "$EFFECTIVE_LLM_FEATURE_MODELS"); fi
          switch_args=()
          if [ -n "$RUNTIME_SWITCHES_INPUT" ]; then switch_args+=(--runtime-switches "$RUNTIME_SWITCHES_INPUT"); fi
          python3 deploy/eks/runtime.py sync-secrets \
            --outputs "$RUNNER_TEMP/trippilot-outputs.json" --target "$DEPLOY_TARGET" "${embedding_args[@]}" "${push_args[@]}" \
            "${dialogue_args[@]}" "${switch_args[@]}"
          python3 deploy/eks/runtime.py render-values --target "$DEPLOY_TARGET" \
            --outputs "$RUNNER_TEMP/trippilot-outputs.json" --image-tag "$IMAGE_TAG" \
            --certificate-arn "$ACM_CERTIFICATE_ARN" --hostname "$API_HOSTNAME" \
            --output "$RUNNER_TEMP/trippilot-values.json" "${embedding_args[@]}" "${embedding_tag_args[@]}"
      - name: Initialize database roles and pgvector before Flyway
        if: steps.config.outputs.deploy_application == 'true'
        run: |
          python3 deploy/eks/runtime.py bootstrap-db --outputs "$RUNNER_TEMP/trippilot-outputs.json" \
            --target "$DEPLOY_TARGET" --run-id "$DEPLOY_RUN_ID"
      # 개발 파드를 0 으로 내려 둔 뒤의 배포: helm 3 의 3-way 병합은 차트 값이 그대로(1→1)면 직접 내린 0 을 되돌리지 않는다 —
      # --wait 도 파드가 없으니 통과하고 스모크에서야 터진다. 그래서 0 인 디플로이먼트만 먼저 1 로 올린다(복제본 수의 정본은 차트).
      # 전제: 개발 차트의 복제본은 항상 1 이상이다(values-dev-target.yaml) — 계약 테스트가 지킨다.
      - name: Wake sleeping dev workloads
        if: steps.config.outputs.deploy_application == 'true' && steps.config.outputs.target == 'dev'
        run: |
          for name in $(kubectl -n "$NAMESPACE" get deploy -o jsonpath='{range .items[?(@.spec.replicas==0)]}{.metadata.name}{"\n"}{end}'); do
            if [ "$name" = embedding ] && [ "$EFFECTIVE_EMBEDDING" != true ]; then continue; fi
            kubectl -n "$NAMESPACE" scale "deploy/$name" --replicas=1
          done
      - name: Deploy and wait for healthy workloads
        if: steps.config.outputs.deploy_application == 'true'
        run: |
          helm upgrade --install trippilot deploy/eks/chart --namespace "$NAMESPACE" \
            -f "deploy/eks/chart/$VALUES_FILE" \
            -f "$RUNNER_TEMP/trippilot-values.json" \
            --set-string "rolloutNonce=$DEPLOY_RUN_ID" \
            --atomic --wait --timeout 30m --history-max 10
      - name: Verify in-cluster API and AI connectivity
        if: steps.config.outputs.deploy_application == 'true'
        run: python3 deploy/eks/runtime.py smoke --target "$DEPLOY_TARGET"
      # 자격 증명 재획득 — 첫 획득(OIDC, 2시간)은 잡 시작 직후라 긴 KB·POI 적재 뒤에는 만료돼 kubectl·aws 가
      # 401 이 되고 cleanup-db 가 RDS 관리자 비밀번호 Secret 을 못 지운다. OIDC 재발급이라 역할 연쇄 1시간 제한이 없다.
      - name: Refresh AWS credentials before the knowledge base load
        if: steps.config.outputs.deploy_application == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: trippilot-${{ github.run_id }}
          role-duration-seconds: 7200
      # 멱등 — 저장본과 같은 문서는 건너뛰므로 재배포마다 돌려도 새 문서·바뀐 문서만 임베딩한다.
      # 첫 적재(KB-5 1,470건)는 임베딩 파드 CPU 로 수 분 걸린다.
      - name: Load the Plan-B knowledge base
        if: steps.config.outputs.deploy_application == 'true' && steps.config.outputs.embedding_enabled == 'true'
        timeout-minutes: 95  # Job 대기 5400s(runtime_kb.DEADLINE_SEC) + 정리
        run: python3 deploy/eks/runtime.py load-kb --target "$DEPLOY_TARGET"
      # 자격 증명 재획득 — 첫 획득(OIDC, 2시간)은 잡 시작 직후라 긴 KB·POI 적재 뒤에는 만료돼 kubectl·aws 가
      # 401 이 되고 cleanup-db 가 RDS 관리자 비밀번호 Secret 을 못 지운다. OIDC 재발급이라 역할 연쇄 1시간 제한이 없다.
      - name: Refresh AWS credentials before the POI load
        if: steps.config.outputs.deploy_application == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: trippilot-${{ github.run_id }}
          role-duration-seconds: 7200
      # 공유본(ai/data/collected_pois.json)을 백엔드 DB 에 upsert — 리뷰·머지된 문서가 이미지에 들어간 뒤라
      # 가이드 §자동화하지 않은 이유의 완충(공유본 PR 리뷰)은 그대로다. 사람의 port-forward 단계만 대체한다.
      - name: Load the POI shared document into the backend
        id: poi-load
        if: steps.config.outputs.deploy_application == 'true'
        timeout-minutes: 25  # Job 대기 1200s(runtime_pois.DEADLINE_SEC) + 정리
        run: |
          poi_args=()
          if [ "$POI_CLOSE_MISSING" = true ]; then poi_args+=(--close-missing); fi
          if [ "$POI_CLOSE_MISSING_DRY_RUN" = true ]; then poi_args+=(--close-missing-dry-run); fi
          python3 deploy/eks/runtime.py load-pois --target "$DEPLOY_TARGET" "${poi_args[@]}"
      # 개발 서버는 검증 때만 켠다(TRIP-1659). 실패하면 원인을 보려고 켜 둔다. 임베딩 5Gi 가 메모리 큰 노드 1대를 잡고 있었다.
      - name: Put the dev workloads to sleep
        if: success() && steps.config.outputs.deploy_application == 'true' && steps.config.outputs.dev_sleep == 'true'
        run: kubectl -n "$NAMESPACE" scale deploy --all --replicas=0
      - name: Deployment summary
        if: success()
        env:
          TF_STATE_BUCKET: ${{ steps.config.outputs.state_bucket }}
          DEPLOYED: ${{ steps.config.outputs.deploy_application }}
          POI_SUMMARY: ${{ steps.poi-load.outputs.summary }}
          KIND: ${{ steps.config.outputs.deploy_kind }}
          REF: ${{ steps.config.outputs.deploy_ref }}
          REASON: ${{ steps.config.outputs.deploy_reason }}
          DEV_SLEEP: ${{ steps.config.outputs.dev_sleep }}
        run: |
          {
            echo "### TripPilot AWS $DEPLOY_ENVIRONMENT · target $DEPLOY_TARGET"
            echo "- Mode: $DEPLOY_MODE"
            echo "- State: $TF_STATE_BUCKET/terraform.tfstate"
            echo "- Commit: $GITHUB_SHA"
            if [ "$DEPLOY_TARGET" = prod ] && [ "$DEPLOY_MODE" = apply ]; then
              echo "- Declared: $KIND $REF${REASON:+ — $REASON}"
            fi
            if [ "$DEV_SLEEP" = true ]; then echo "- Dev workloads: put to sleep (replicas 0)"; fi
            if [ "$DEPLOYED" = true ]; then
              echo "- Image tag: $IMAGE_TAG"
              echo "- API: https://$API_HOSTNAME"
              echo "- POI load: ${POI_SUMMARY:-(skipped)}"
              echo "- Load balancer DNS (point API hostname here):"
              kubectl -n "$NAMESPACE" get service gateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary database administrator credentials
        if: always() && steps.config.outputs.deploy_application == 'true' && steps.infra.outcome == 'success'
        run: python3 deploy/eks/runtime.py cleanup-db --target "$DEPLOY_TARGET" --run-id "$DEPLOY_RUN_ID"
      - name: Remove local generated deployment files
        if: always()
        run: rm -f "$RUNNER_TEMP/trippilot.tfplan" "$RUNNER_TEMP/trippilot-outputs.json" "$RUNNER_TEMP/trippilot-values.json"
