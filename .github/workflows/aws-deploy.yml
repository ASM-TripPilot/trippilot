name: AWS / Terraform and EKS deploy

# AWS mutations have a single manual entry point. No push, schedule, or GitOps sync.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 대상 환경
        type: choice
        options: [dev, prd]
        default: dev
        required: true
      target:
        description: 배포 대상 — prod 는 출시 앱이 보는 서버(네임스페이스 trippilot), dev 는 개발 서버(trippilot-dev · dev-api · 개발 DB · Terraform 안 건드림 · 임베딩·푸시 꺼짐)
        type: choice
        options: [prod, dev]
        default: prod
        required: true
      mode:
        description: plan은 미리보기, apply는 인프라 변경 및 선택한 앱 배포
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      deploy_application:
        description: apply 후 이미지 빌드·DB 초기화·EKS 앱 배포
        type: boolean
        default: true
      embedding_enabled:
        description: 로컬 임베딩 서비스와 pgvector RAG 활성화 (추가 메모리 필요) — 끄면 재계획·대안이 규칙 랭킹으로만 돈다
        type: boolean
        default: true
      push_mode:
        description: 푸시 발송 모드 — keep 은 시크릿에 저장된 값 유지, expo 는 Expo 푸시로 실제 발송, off 는 끔
        type: choice
        options: [keep, off, expo]
        default: keep
      poi_close_missing:
        description: POI 공유본 적재 때 그 출처의 ACTIVE 중 공유본에 없는 것을 LOST 로 내린다 (기본 off — upsert 만). 비율 가드(409)에 걸리면 스텝이 실패하고 아무것도 닫지 않는다
        type: boolean
        default: false
      poi_close_missing_dry_run:
        description: 퇴출하면 몇 건이 닫힐지만 서버에 묻고(닫지 않음) 평소대로 upsert 한다 — 결과는 배포 요약의 "POI load" 줄. poi_close_missing 이 켜져 있으면 무시
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VERSION: '1.13.5'

jobs:
  # 오프라인 검증은 PR 게이트와 같은 잡이다 — 여기 복제하지 않는다(infra-validate.yml).
  validate:
    uses: ./.github/workflows/infra-validate.yml
    with:
      verify_backend_shutdown: ${{ inputs.mode == 'apply' && inputs.deploy_application }}

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_TARGET: ${{ inputs.target }}
      DEPLOY_MODE: ${{ inputs.mode }}
      DEPLOY_APPLICATION: ${{ inputs.deploy_application }}
      EMBEDDING_ENABLED: ${{ inputs.embedding_enabled }}
      PUSH_MODE_INPUT: ${{ inputs.push_mode }}
      POI_CLOSE_MISSING: ${{ inputs.poi_close_missing }}
      POI_CLOSE_MISSING_DRY_RUN: ${{ inputs.poi_close_missing_dry_run }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      # 개발 대상은 자기 주소·인증서를 쓴다(dev-api.) — 운영 값으로 떨어지면 개발 NLB 가 운영 인증서를 단다.
      ACM_CERTIFICATE_ARN: ${{ inputs.target == 'dev' && vars.DEV_TARGET_ACM_CERTIFICATE_ARN || vars.ACM_CERTIFICATE_ARN }}
      API_HOSTNAME: ${{ inputs.target == 'dev' && vars.DEV_TARGET_API_HOSTNAME || vars.API_HOSTNAME }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_VAR_deployment_role_arn: ${{ vars.AWS_ROLE_ARN }}
      IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate environment and branch before AWS access
        id: config
        run: python3 infra/scripts/workflow_config.py
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: trippilot-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Check HTTPS certificate
        if: steps.config.outputs.deploy_application == 'true'
        run: |
          test "$(aws acm describe-certificate --certificate-arn "$ACM_CERTIFICATE_ARN" --query 'Certificate.Status' --output text)" = ISSUED
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Initialize existing environment state
        working-directory: infra/terraform/stack
        env:
          TF_STATE_BUCKET: ${{ steps.config.outputs.state_bucket }}
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform validate
      - name: Terraform plan
        working-directory: infra/terraform/stack
        # 개발 대상은 공유 인프라를 바꾸지 않는다 — 출력만 읽는다(아래 Read infrastructure outputs).
        if: steps.config.outputs.terraform == 'true'
        run: terraform plan -lock-timeout=5m -var-file="../environments/$DEPLOY_ENVIRONMENT.tfvars" -out="$RUNNER_TEMP/trippilot.tfplan"
      - name: Apply the saved run plan
        if: inputs.mode == 'apply' && steps.config.outputs.terraform == 'true'
        working-directory: infra/terraform/stack
        run: terraform apply -lock-timeout=5m "$RUNNER_TEMP/trippilot.tfplan"
      - name: Read infrastructure outputs
        if: steps.config.outputs.deploy_application == 'true'
        id: infra
        working-directory: infra/terraform/stack
        run: |
          umask 077
          terraform output -json > "$RUNNER_TEMP/trippilot-outputs.json"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          for component in backend ai embedding; do
            repository=$(jq -r --arg component "$component" '.ecr_repositories.value[$component]' "$RUNNER_TEMP/trippilot-outputs.json")
            echo "${component}_repository=$repository" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-buildx-action@v3
        if: steps.config.outputs.deploy_application == 'true'
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.config.outputs.deploy_application == 'true'
      - name: Build and publish backend
        if: steps.config.outputs.deploy_application == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.backend_repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=aws-backend
          cache-to: type=gha,mode=min,scope=aws-backend
      - name: Build and publish AI
        if: steps.config.outputs.deploy_application == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.ai_repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=aws-ai
          cache-to: type=gha,mode=min,scope=aws-ai
      # 임베딩 이미지 태그는 **빌드 맥락(ai/embedding)의 내용 해시**다 — 런마다 새 태그면 코드가 그대로여도
      # 매 배포 파드가 바뀌고, maxSurge 0(chart embedding.yaml 주석)이라 그때마다 몇 분 엔드포인트가 빈다
      # (10-14 하루 15회+, 재계획 KB 검색이 그 사이 Connection refused 로 강등). 같은 해시가 이미 올라가
      # 있으면 빌드를 건너뛰고 같은 태그를 그대로 쓴다 → 파드 템플릿 무변 → 롤아웃 없음.
      - name: Resolve the embedding image tag
        id: embedding-tag
        if: steps.config.outputs.deploy_application == 'true' && steps.config.outputs.embedding_enabled == 'true'
        env:
          REPOSITORY: ${{ steps.infra.outputs.embedding_repository }}
        run: |
          tag="emb-$(git rev-parse HEAD:ai/embedding)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$REPOSITORY:$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "embedding $tag 이미 있음 — 빌드 생략, 임베딩 롤아웃 없음"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish embedding
        if: steps.config.outputs.deploy_application == 'true' && steps.config.outputs.embedding_enabled == 'true' && steps.embedding-tag.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ai/embedding
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.embedding_repository }}:${{ steps.embedding-tag.outputs.tag }}
          cache-from: type=gha,scope=aws-embedding
          cache-to: type=gha,mode=min,scope=aws-embedding
      - uses: azure/setup-kubectl@v4
        if: steps.config.outputs.deploy_application == 'true'
        with:
          version: v1.35.0
      - uses: azure/setup-helm@v4.3.1
        if: steps.config.outputs.deploy_application == 'true'
        with:
          version: v3.19.0
      - name: Connect to the selected EKS cluster
        if: steps.config.outputs.deploy_application == 'true'
        env:
          CLUSTER_NAME: ${{ steps.infra.outputs.cluster_name }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          python3 deploy/eks/runtime.py ensure-namespace --target "$DEPLOY_TARGET"
      - name: Synchronize runtime secrets and render nonsecret Helm values
        if: steps.config.outputs.deploy_application == 'true'
        env:
          EMBEDDING_IMAGE_TAG: ${{ steps.embedding-tag.outputs.tag }}
        run: |
          embedding_args=()
          if [ "$EFFECTIVE_EMBEDDING" = true ]; then embedding_args+=(--embedding-enabled); fi
          embedding_tag_args=()
          if [ -n "$EMBEDDING_IMAGE_TAG" ]; then embedding_tag_args+=(--embedding-image-tag "$EMBEDDING_IMAGE_TAG"); fi
          push_args=()
          if [ "$PUSH_MODE_INPUT" != keep ]; then push_args+=(--push-mode "$PUSH_MODE_INPUT"); fi
          python3 deploy/eks/runtime.py sync-secrets \
            --outputs "$RUNNER_TEMP/trippilot-outputs.json" --target "$DEPLOY_TARGET" "${embedding_args[@]}" "${push_args[@]}"
          python3 deploy/eks/runtime.py render-values --target "$DEPLOY_TARGET" \
            --outputs "$RUNNER_TEMP/trippilot-outputs.json" --image-tag "$IMAGE_TAG" \
            --certificate-arn "$ACM_CERTIFICATE_ARN" --hostname "$API_HOSTNAME" \
            --output "$RUNNER_TEMP/trippilot-values.json" "${embedding_args[@]}" "${embedding_tag_args[@]}"
      - name: Initialize database roles and pgvector before Flyway
        if: steps.config.outputs.deploy_application == 'true'
        run: |
          python3 deploy/eks/runtime.py bootstrap-db --outputs "$RUNNER_TEMP/trippilot-outputs.json" \
            --target "$DEPLOY_TARGET" --run-id "$DEPLOY_RUN_ID"
      - name: Deploy and wait for healthy workloads
        if: steps.config.outputs.deploy_application == 'true'
        run: |
          helm upgrade --install trippilot deploy/eks/chart --namespace "$NAMESPACE" \
            -f "deploy/eks/chart/$VALUES_FILE" \
            -f "$RUNNER_TEMP/trippilot-values.json" \
            --set-string "rolloutNonce=$DEPLOY_RUN_ID" \
            --atomic --wait --timeout 30m --history-max 10
      - name: Verify in-cluster API and AI connectivity
        if: steps.config.outputs.deploy_application == 'true'
        run: python3 deploy/eks/runtime.py smoke --target "$DEPLOY_TARGET"
      # 멱등 — 저장본과 같은 문서는 건너뛰므로 재배포마다 돌려도 새 문서·바뀐 문서만 임베딩한다.
      # 첫 적재(KB-5 1,470건)는 임베딩 파드 CPU 로 수 분 걸린다.
      - name: Load the Plan-B knowledge base
        if: steps.config.outputs.deploy_application == 'true' && steps.config.outputs.embedding_enabled == 'true'
        timeout-minutes: 65  # Job 대기 3600s(runtime_kb.DEADLINE_SEC) + 정리
        run: python3 deploy/eks/runtime.py load-kb --target "$DEPLOY_TARGET"
      # 공유본(ai/data/collected_pois.json)을 백엔드 DB 에 upsert — 리뷰·머지된 문서가 이미지에 들어간 뒤라
      # 가이드 §자동화하지 않은 이유의 완충(공유본 PR 리뷰)은 그대로다. 사람의 port-forward 단계만 대체한다.
      - name: Load the POI shared document into the backend
        id: poi-load
        if: steps.config.outputs.deploy_application == 'true'
        timeout-minutes: 25  # Job 대기 1200s(runtime_pois.DEADLINE_SEC) + 정리
        run: |
          poi_args=()
          if [ "$POI_CLOSE_MISSING" = true ]; then poi_args+=(--close-missing); fi
          if [ "$POI_CLOSE_MISSING_DRY_RUN" = true ]; then poi_args+=(--close-missing-dry-run); fi
          python3 deploy/eks/runtime.py load-pois --target "$DEPLOY_TARGET" "${poi_args[@]}"
      - name: Deployment summary
        if: success()
        env:
          TF_STATE_BUCKET: ${{ steps.config.outputs.state_bucket }}
          DEPLOYED: ${{ steps.config.outputs.deploy_application }}
          POI_SUMMARY: ${{ steps.poi-load.outputs.summary }}
        run: |
          {
            echo "### TripPilot AWS $DEPLOY_ENVIRONMENT · target $DEPLOY_TARGET"
            echo "- Mode: $DEPLOY_MODE"
            echo "- State: $TF_STATE_BUCKET/terraform.tfstate"
            echo "- Commit: $GITHUB_SHA"
            if [ "$DEPLOYED" = true ]; then
              echo "- Image tag: $IMAGE_TAG"
              echo "- API: https://$API_HOSTNAME"
              echo "- POI load: ${POI_SUMMARY:-(skipped)}"
              echo "- Load balancer DNS (point API hostname here):"
              kubectl -n "$NAMESPACE" get service gateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary database administrator credentials
        if: always() && steps.config.outputs.deploy_application == 'true' && steps.infra.outcome == 'success'
        run: python3 deploy/eks/runtime.py cleanup-db --target "$DEPLOY_TARGET" --run-id "$DEPLOY_RUN_ID"
      - name: Remove local generated deployment files
        if: always()
        run: rm -f "$RUNNER_TEMP/trippilot.tfplan" "$RUNNER_TEMP/trippilot-outputs.json" "$RUNNER_TEMP/trippilot-values.json"
