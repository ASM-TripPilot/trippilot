# [main 등록용 사본] GitHub은 schedule(cron)·workflow_dispatch를 기본 브랜치의
# 워크플로만 등록한다. main의 ai/ 는 구버전이므로 checkout을 develop으로 고정 —
# 이 파일(트리거 등록)은 main, 실행 코드는 항상 develop. develop 쪽 원본 갱신 시 이 사본도 동기화할 것.
# TourAPI POI 일일 수집 배치 (TRIP-246, U6-05)
#
# ai-ci와 완전히 분리된 워크플로다. push/PR 트리거가 **없어서** CI 실 호출 0건(D37)은
# 그대로 유지된다 — 머지 게이트가 아니며, 실 호출은 스케줄(KST 새벽 4시) 또는 사람이
# Actions 탭에서 Run workflow를 눌렀을 때만.
#
# 산출물은 "등록 제안" JSON일 뿐이다 (INV-1) — POI 정본은 backend C7 단일 소유(PR #76)라
# DB에 직접 쓰지 않는다. 백엔드 수신 API 협의 전까지는 artifact(30일 보존)로만 남긴다.
#
# 키는 Repository Secrets `TOUR_API_KEY`(필수) · `TOUR_API_KEY2` · `TOUR_API_KEY3`(선택)
# 에서만 온다 (모두 data.go.kr **디코딩** 키, 계정별 일일 한도 독립 — 등록 키만큼 합산).
# 키링 로테이션: 현재 키가 **키당 상한**(vars.TOURAPI_MAX_CALLS=1000 — 개발계정 일
# 1,000 전량)을 소진하면 다음 키로 전환하고 수집 시퀀스를 그대로 이어간다 (병렬 아님 —
# 중복 크롤 0). 총 예산 = 키 수 × 키당 상한 (키 3개면 하루 3,000호출).
#
# 지역은 전국 골고루가 기본: TOURAPI_AREA_CODES(쉼표 목록) 미설정('')이면 스크립트가
# 광역 17개 전부를 공평 순회한다 — 총 예산을 미완주 지역에 균등 분할하고, 나머지·조기
# 종료분은 라운드로빈 포인터(수집 상태에 저장 — 매일 시작 지역 순환)로 이월. 완주
# 지역은 색인 스킵 재순회가 저렴해 잔여 예산으로 마지막에. 단수 TOURAPI_AREA_CODE는
# 하위호환 — 설정 시 그 지역만 (전국 순회를 원하면 비워둔다).
#
# TOUR_API_KEY 미등록이면 수집을 생략하고 **성공 종료**한다 — 스케줄이 미리
# 켜져 있어도 빨간불이 나지 않게. 호출 상한 등 비밀 아닌 설정은 Repository Variables
# (TOURAPI_MAX_CALLS · TOURAPI_AREA_CODES · TOURAPI_AREA_CODE · TOURAPI_CONTENT_TYPES)로
# 생략 가능하며, 실행 시 input을 채우면 그게 이긴다.
#
# 커서 이어가기 (TRIP-348): 수집 상태(collect_state.json — 커서 + 기제안 색인)를
# `collect-state` **전용 브랜치**에 커밋·푸시해 실행 간 이어간다 (코드 히스토리 오염
# 없음). 실행 전 브랜치에서 복원 → 스크립트가 커서부터 재개·기제안 스킵 → 실행 후
# 갱신 상태를 다시 푸시. 상태 push 실패는 수집 성공을 뒤집지 않는다 (::warning::만 —
# 다음날 중복은 색인 없이도 게이트가 막고, 낭비만 발생). 파일 I/O는 스크립트,
# 전송(fetch·push)은 여기 워크플로 소관.
name: ai-poi-collect

on:
  workflow_dispatch:
    inputs:
      area_codes:
        description: 'TourAPI 지역 코드 쉼표 목록 — 공평 순회 (비우면 repo Variable → 기본 광역 17개 전부)'
        required: false
        type: string
      area_code:
        description: '단수 지역 코드 하위호환 — 설정 시 그 지역만 (area_codes 무시)'
        required: false
        type: string
      max_calls:
        description: '키당 HTTP 호출 상한 (비우면 repo Variable TOURAPI_MAX_CALLS=1000 → 스크립트 기본 500; 총 예산 = 키 수 × 키당 상한)'
        required: false
        type: string
      content_types:
        description: 'contentTypeId 쉼표 목록 (비우면 기본 12,14,39 — 관광지·문화시설·음식점)'
        required: false
        type: string
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = KST 새벽 4시

concurrency: ai-poi-collect   # 실 호출 워크플로는 동시 1건만 (일일 한도 보호)

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # collect-state 전용 브랜치 push용 (잡 단위 최소 부여, TRIP-348)
      pull-requests: write   # 공유본 자동 갱신 PR (TRIP-392)
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop   # 실행 코드는 develop (main의 ai/는 구버전)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - run: uv sync --locked
      - name: 수집 상태 복원 (collect-state 전용 브랜치 → ai/collect_state.json)
        id: restore
        # 리다이렉트(`git show > file`)는 show가 실패해도 **빈 파일을 남긴다** — 그러면
        # 스크립트가 "상태 파일 손상"으로 처음부터 돌면서도 성공으로 끝난다(TRIP-348 회귀,
        # 8/14~8/18 5일간 신규 3건). 임시 파일에 받아 성공했을 때만 자리에 놓는다.
        # 브랜치에 **한 번이라도** 상태 파일이 있었는데 지금 없으면 유실이다 — 조용히
        # 처음부터 돌지 말고 실패시킨다 (누가 트리를 덮어썼다는 뜻).
        # pathspec은 현재 디렉토리 기준이라 여기(ai/)선 `:(top)` 없이는 루트 파일을
        # 못 찾는다 — ls-tree --full-tree와 같은 함정.
        run: |
          rm -f collect_state.json collect_state.json.tmp
          RESTORED=false
          if ! git fetch origin collect-state 2>/dev/null; then
            echo "::notice::collect-state 브랜치 없음 — 처음부터"
          elif git show FETCH_HEAD:collect_state.json > collect_state.json.tmp 2>/dev/null; then
            mv collect_state.json.tmp collect_state.json
            RESTORED=true
            echo "::notice::수집 상태 복원 — 커서부터 재개"
          elif [ -n "$(git rev-list -1 FETCH_HEAD -- ':(top)collect_state.json')" ]; then
            rm -f collect_state.json.tmp
            echo "::error::수집 상태 유실 — collect-state 브랜치에 있던 collect_state.json이 현재 tip에 없다. 누군가 트리를 통째로 덮어썼다 (이대로 두면 매일 같은 지역만 재수집)."
            exit 1
          else
            rm -f collect_state.json.tmp
            echo "::notice::수집 상태 없음 (최초 실행) — 처음부터"
          fi
          # 신규율 진단은 **이번 실행 전** 색인과 비교해야 한다 — 스크립트가 상태를
          # 제자리에 덮어쓰므로 지금 사본을 떠 둔다.
          [ -f collect_state.json ] && cp collect_state.json collect_state.prev.json
          echo "restored=$RESTORED" >> "$GITHUB_OUTPUT"
      - name: TourAPI 수집 (게이트 통과분 → 등록 제안 JSON)
        id: collect
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_KEY2: ${{ secrets.TOUR_API_KEY2 }}   # 선택 — 미등록('')이면 건너뜀
          TOUR_API_KEY3: ${{ secrets.TOUR_API_KEY3 }}   # 선택 — 키링 세 번째
          # schedule 실행에서는 inputs가 비므로 Variables → 스크립트 기본값 순으로 폴백
          TOURAPI_AREA_CODES: ${{ inputs.area_codes || vars.TOURAPI_AREA_CODES || '' }}  # '' = 코드 기본 17개
          TOURAPI_AREA_CODE: ${{ inputs.area_code || vars.TOURAPI_AREA_CODE }}  # 단수 하위호환 — 설정 시 그것만
          TOURAPI_CONTENT_TYPES: ${{ inputs.content_types || vars.TOURAPI_CONTENT_TYPES }}
          TOURAPI_MAX_CALLS: ${{ inputs.max_calls || vars.TOURAPI_MAX_CALLS || '500' }}
          COLLECT_OUTPUT: collected_pois.json
          COLLECT_STATE: collect_state.json   # 복원 단계가 놓은 경로 — 실행 후 같은 곳에 갱신
        run: |
          if [ -z "$TOUR_API_KEY" ]; then
            echo "::notice::TOUR_API_KEY 미등록 — 수집 생략"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run python scripts/collect_pois.py
      - name: 잡 서머리 (수집·게이트 통과·드롭 통계)
        if: steps.collect.outputs.skipped != 'true'
        run: uv run python scripts/collect_pois.py --summary collected_pois.json >> "$GITHUB_STEP_SUMMARY"
      - name: 수집 상태 영속 (collect-state 전용 브랜치 커밋·푸시)
        if: steps.collect.outputs.skipped != 'true'
        # plumbing(hash-object→mktree→commit-tree)으로 워킹트리를 건드리지 않고 커밋한다.
        # 브랜치 부재 시 부모 없는 커밋(= orphan)으로 생성. push 실패는 수집 성공을
        # 뒤집지 않는다 (::warning::만 — 다음날 중복은 색인 없이도 게이트가 막는다).
        #
        # 브랜치는 ai-llm-smoke의 rehearsal_log.jsonl과 **공유**한다 — 기존 트리를 보존한
        # 채 자기 파일만 교체해야 서로를 지우지 않는다. `git ls-tree`는 현재 디렉토리
        # 프리픽스 기준이라 working-directory가 ai/ 인 여기서는 루트 파일이 **한 줄도 안
        # 나온다** — `--full-tree` 필수 (이게 빠져서 두 워크플로가 서로를 덮어썼다).
        run: |
          if [ ! -f collect_state.json ]; then
            echo "::warning::상태 파일 없음 — 영속 생략"
            exit 0
          fi
          (
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            PARENT=""
            BASE_TREE=""
            if git fetch origin collect-state 2>/dev/null; then
              PARENT="-p FETCH_HEAD"
              BASE_TREE=$(git ls-tree --full-tree FETCH_HEAD | grep -v $'\tcollect_state.json$' || true)
            fi
            BLOB=$(git hash-object -w collect_state.json)
            TREE=$({ [ -n "$BASE_TREE" ] && printf '%s\n' "$BASE_TREE"; \
                     printf '100644 blob %s\tcollect_state.json\n' "$BLOB"; } | git mktree)
            COMMIT=$(git commit-tree $TREE $PARENT -m "chore(ai): 수집 상태 갱신 — run ${{ github.run_id }} (TRIP-348)")
            git push origin "$COMMIT:refs/heads/collect-state"
          ) || echo "::warning::수집 상태 push 실패 — 다음 실행은 이어가기 없이 처음부터 (수집 자체는 성공)"
      - name: 등록 제안 artifact 보존 (30일 — 상태 파일 동봉, 디버깅용)
        if: steps.collect.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collected-pois
          path: |
            ai/collected_pois.json
            ai/collect_state.json
          retention-days: 30
      - name: 신규율 진단 (50% 미만이면 원인·처방까지 — 제자리걸음이면 실패)
        if: steps.collect.outputs.skipped != 'true'
        # "며칠을 돌렸는데 왜 안 늘지"에 산출물로 답한다. 제안을 신규·갱신·반복으로
        # 갈라 신규율을 재고, 임계 미만이면 원인 후보를 증거와 함께 잡 서머리에 남긴다
        # (예산 굶주림·완주 후 재순회·게이트 드롭 편중·색인 미작동 …).
        #
        # 신규율이 낮다고 실패시키지는 않는다 — 지역을 완주한 뒤의 재순회처럼 정당하게
        # 낮은 국면이 있다. 실패는 **제자리걸음**일 때만: 신규 0 · 스킵 0 이거나
        # 같은 modified_time 이 다시 실린 경우. (앞선 판은 "스킵 0건"만 보고 실패시켰다가
        # 미수집 지역 첫 수집(강원 100건 전부 신규)을 회귀로 오인해 빨간불을 냈다.)
        run: |
          uv run python scripts/collect_novelty.py \
            --output collected_pois.json \
            --prev-state collect_state.prev.json \
            --fail-if-stalled >> "$GITHUB_STEP_SUMMARY"
      - name: 팀 공유본 자동 갱신 PR (TRIP-392 — 병합·축소 가드·롤링 브랜치)
        if: steps.collect.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # 갈아끼우기가 아니라 **병합**이다 — merge_pois_docs(같은 content_id는 나중
        # 수집분이 이김, 멱등)로 공유본+금일 산출물을 합친다. 합본이 공유본보다
        # 작아지면 축소 사고로 보고 실패시킨다(조용한 데이터 유실 금지). PR은 롤링
        # 브랜치 하나(chore/poi-data-sync)를 force-push — 열린 PR이 있으면 그대로
        # 갱신되고, **머지는 리뷰 후 사람 몫**(TRIP-392 결정: PR 방식 = 리뷰 가능).
        run: |
          BEFORE=$(uv run python -c "import json;print(len(json.load(open('data/collected_pois.json'))['proposals']))")
          uv run python scripts/merge_pois_docs.py -o data/collected_pois.json \
            data/collected_pois.json collected_pois.json
          AFTER=$(uv run python -c "import json;print(len(json.load(open('data/collected_pois.json'))['proposals']))")
          if [ "$AFTER" -lt "$BEFORE" ]; then
            echo "::error::합본(${AFTER}건)이 공유본(${BEFORE}건)보다 작다 — 축소 덮어쓰기 차단"
            exit 1
          fi
          if git diff --quiet -- data/collected_pois.json; then
            echo "공유본 변화 없음 — PR 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/poi-data-sync
          git add data/collected_pois.json
          git commit -m "chore(ai): 수집 공유본 병합 갱신 — ${BEFORE}→${AFTER}건 (TRIP-392)"
          if ! git push -f origin chore/poi-data-sync; then
            echo "::warning::공유본 브랜치 push 실패 — 수집 자체는 성공 (다음 실행이 재시도)"
            exit 0
          fi
          if [ "$(gh pr list --head chore/poi-data-sync --state open --json number --jq length)" = "0" ]; then
            gh pr create --base develop --head chore/poi-data-sync \
              --title "chore(ai): 수집 공유본 자동 갱신 (TRIP-392)" \
              --body "ai-poi-collect 일일 산출물을 merge_pois_docs로 공유본에 병합한 자동 PR. 같은 content_id는 나중 수집분이 이긴다(멱등)·축소 가드 통과. 백엔드가 이 파일을 POI 소스로 소비하므로 리뷰 후 머지. 매일 force-push로 이 PR이 최신으로 유지된다." \
              || echo "::warning::PR 생성 실패 — 저장소 설정(Actions의 PR 생성 허용) 확인 필요"
          else
            echo "열린 동기화 PR 갱신됨 (force-push)"
          fi
      - name: 이어가기 검증 (상태 왕복 — 다음 실행이 커서부터 재개할 수 있는가)
        if: steps.collect.outputs.skipped != 'true'
        # 이 워크플로의 실패 모드는 "빨간불"이 아니라 **초록불인 채 같은 데이터만
        # 다시 긁는 것**이었다 — 8/14~8/18 5일 연속 성공했는데 신규 POI 3건.
        # 그래서 두 가지를 여기서 깨뜨린다.
        #   (1) 왕복: 방금 push한 상태가 브랜치 tip에 실제로 남아 있는가.
        #       (누가 트리를 덮어쓰면 다음 실행이 처음부터 도는데, 그 사실을
        #        다음 실행이 아니라 **덮어쓴 바로 그 실행**에서 안다.)
        #   (2) 재수집 판정은 앞 스텝(신규율 진단)이 맡는다 — 여기는 왕복만 본다.
        run: |
          FAIL=0
          if git fetch origin collect-state 2>/dev/null \
             && git cat-file -e FETCH_HEAD:collect_state.json 2>/dev/null; then
            echo "상태 왕복 확인 — 다음 실행은 커서부터 재개한다"
          else
            echo "::error::상태 왕복 실패 — push 직후인데 collect-state tip에 collect_state.json이 없다. 다음 실행이 처음부터 돌면서 같은 지역만 재수집하게 된다."
            FAIL=1
          fi
          exit $FAIL
