# TourAPI POI 일일 수집 배치 (TRIP-246, U6-05)
#
# ai-ci와 완전히 분리된 워크플로다. push/PR 트리거가 **없어서** CI 실 호출 0건(D37)은
# 그대로 유지된다 — 머지 게이트가 아니며, 실 호출은 스케줄(KST 새벽 4시) 또는 사람이
# Actions 탭에서 Run workflow를 눌렀을 때만.
#
# 산출물은 "등록 제안" JSON일 뿐이다 (INV-1) — POI 정본은 backend C7 단일 소유(PR #76)라
# DB에 직접 쓰지 않는다. 백엔드 수신 API 협의 전까지는 artifact(30일 보존)로만 남긴다.
#
# 키는 Repository Secrets `TOUR_API_KEY`(필수) · `TOUR_API_KEY2`(선택)에서만 온다
# (둘 다 data.go.kr **디코딩** 키, 계정별 일일 한도 독립 — 키 2개면 합산 사용).
# 키 2개 로테이션: 키 1이 **키당 상한**(TOURAPI_MAX_CALLS, 기본 500)을 소진하면 키 2로
# 전환하고 수집 시퀀스를 그대로 이어간다 (병렬 아님 — 중복 크롤 0). 총 예산 = 키 수 ×
# 키당 상한. TOUR_API_KEY 미등록이면 수집을 생략하고 **성공 종료**한다 — 스케줄이 미리
# 켜져 있어도 빨간불이 나지 않게. 호출 상한 등 비밀 아닌 설정은 Repository Variables
# (TOURAPI_MAX_CALLS · TOURAPI_AREA_CODE · TOURAPI_CONTENT_TYPES)로 생략 가능하며,
# 실행 시 input을 채우면 그게 이긴다.
#
# 커서 이어가기 (TRIP-348): 수집 상태(collect_state.json — 커서 + 기제안 색인)를
# `collect-state` **전용 브랜치**에 커밋·푸시해 실행 간 이어간다 (코드 히스토리 오염
# 없음). 실행 전 브랜치에서 복원 → 스크립트가 커서부터 재개·기제안 스킵 → 실행 후
# 갱신 상태를 다시 푸시. 상태 push 실패는 수집 성공을 뒤집지 않는다 (::warning::만 —
# 다음날 중복은 색인 없이도 게이트가 막고, 낭비만 발생). 파일 I/O는 스크립트,
# 전송(fetch·push)은 여기 워크플로 소관.
name: ai-poi-collect

on:
  workflow_dispatch:
    inputs:
      area_code:
        description: 'TourAPI 지역 코드 (비우면 repo Variable → 기본 39 제주)'
        required: false
        type: string
      max_calls:
        description: '키당 HTTP 호출 상한 (비우면 repo Variable → 기본 500 — 개발계정 일 1,000의 절반; 총 예산 = 키 수 × 키당 상한)'
        required: false
        type: string
      content_types:
        description: 'contentTypeId 쉼표 목록 (비우면 기본 12,14,39 — 관광지·문화시설·음식점)'
        required: false
        type: string
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = KST 새벽 4시

concurrency: ai-poi-collect   # 실 호출 워크플로는 동시 1건만 (일일 한도 보호)

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # collect-state 전용 브랜치 push용 (잡 단위 최소 부여, TRIP-348)
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - run: uv sync --locked
      - name: 수집 상태 복원 (collect-state 전용 브랜치 → ai/collect_state.json)
        run: |
          git fetch origin collect-state 2>/dev/null \
            && git show FETCH_HEAD:collect_state.json > collect_state.json \
            || echo "::notice::수집 상태 없음 — 처음부터"
      - name: TourAPI 수집 (게이트 통과분 → 등록 제안 JSON)
        id: collect
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_KEY2: ${{ secrets.TOUR_API_KEY2 }}   # 선택 — 미등록('')이면 키 1개 동작
          # schedule 실행에서는 inputs가 비므로 Variables → 스크립트 기본값 순으로 폴백
          TOURAPI_AREA_CODE: ${{ inputs.area_code || vars.TOURAPI_AREA_CODE }}
          TOURAPI_CONTENT_TYPES: ${{ inputs.content_types || vars.TOURAPI_CONTENT_TYPES }}
          TOURAPI_MAX_CALLS: ${{ inputs.max_calls || vars.TOURAPI_MAX_CALLS || '500' }}
          COLLECT_OUTPUT: collected_pois.json
          COLLECT_STATE: collect_state.json   # 복원 단계가 놓은 경로 — 실행 후 같은 곳에 갱신
        run: |
          if [ -z "$TOUR_API_KEY" ]; then
            echo "::notice::TOUR_API_KEY 미등록 — 수집 생략"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run python scripts/collect_pois.py
      - name: 잡 서머리 (수집·게이트 통과·드롭 통계)
        if: steps.collect.outputs.skipped != 'true'
        run: uv run python scripts/collect_pois.py --summary collected_pois.json >> "$GITHUB_STEP_SUMMARY"
      - name: 수집 상태 영속 (collect-state 전용 브랜치 커밋·푸시)
        if: steps.collect.outputs.skipped != 'true'
        # plumbing(hash-object→mktree→commit-tree)으로 워킹트리를 건드리지 않고 커밋한다.
        # 브랜치 부재 시 부모 없는 커밋(= orphan)으로 생성. push 실패는 수집 성공을
        # 뒤집지 않는다 — 다음날 중복은 색인 없이도 게이트가 막고, 낭비만 발생.
        run: |
          if [ ! -f collect_state.json ]; then
            echo "::warning::상태 파일 없음 — 영속 생략"
            exit 0
          fi
          (
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            BLOB=$(git hash-object -w collect_state.json)
            TREE=$(printf '100644 blob %s\tcollect_state.json\n' "$BLOB" | git mktree)
            PARENT=""
            if git fetch origin collect-state 2>/dev/null; then
              PARENT="-p FETCH_HEAD"
            fi
            COMMIT=$(git commit-tree $TREE $PARENT -m "chore(ai): 수집 상태 갱신 — run ${{ github.run_id }} (TRIP-348)")
            git push origin "$COMMIT:refs/heads/collect-state"
          ) || echo "::warning::수집 상태 push 실패 — 다음 실행은 이어가기 없이 처음부터 (수집 자체는 성공)"
      - name: 등록 제안 artifact 보존 (30일 — 상태 파일 동봉, 디버깅용)
        if: steps.collect.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collected-pois
          path: |
            ai/collected_pois.json
            ai/collect_state.json
          retention-days: 30
