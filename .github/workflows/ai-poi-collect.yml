# TourAPI POI 일일 수집 배치 (TRIP-246, U6-05)
#
# ai-ci와 완전히 분리된 워크플로다. push/PR 트리거가 **없어서** CI 실 호출 0건(D37)은
# 그대로 유지된다 — 머지 게이트가 아니며, 실 호출은 스케줄(KST 새벽 4시) 또는 사람이
# Actions 탭에서 Run workflow를 눌렀을 때만.
#
# 산출물은 "등록 제안" JSON일 뿐이다 (INV-1) — POI 정본은 backend C7 단일 소유(PR #76)라
# DB에 직접 쓰지 않는다. 백엔드 수신 API 협의 전까지는 artifact(30일 보존)로만 남긴다.
#
# 키는 Repository Secrets `TOUR_API_KEY`(필수) · `TOUR_API_KEY2` · `TOUR_API_KEY3`(선택)
# 에서만 온다 (모두 data.go.kr **디코딩** 키, 계정별 일일 한도 독립 — 등록 키만큼 합산).
# 키링 로테이션: 현재 키가 **키당 상한**(vars.TOURAPI_MAX_CALLS=1000 — 개발계정 일
# 1,000 전량)을 소진하면 다음 키로 전환하고 수집 시퀀스를 그대로 이어간다 (병렬 아님 —
# 중복 크롤 0). 총 예산 = 키 수 × 키당 상한 (키 3개면 하루 3,000호출).
#
# 지역은 전국 골고루가 기본: TOURAPI_AREA_CODES(쉼표 목록) 미설정('')이면 스크립트가
# 광역 17개 전부를 공평 순회한다 — 총 예산을 미완주 지역에 균등 분할하고, 나머지·조기
# 종료분은 라운드로빈 포인터(수집 상태에 저장 — 매일 시작 지역 순환)로 이월. 완주
# 지역은 색인 스킵 재순회가 저렴해 잔여 예산으로 마지막에. 단수 TOURAPI_AREA_CODE는
# 하위호환 — 설정 시 그 지역만 (전국 순회를 원하면 비워둔다).
#
# TOUR_API_KEY 미등록이면 수집을 생략하고 **성공 종료**한다 — 스케줄이 미리
# 켜져 있어도 빨간불이 나지 않게. 호출 상한 등 비밀 아닌 설정은 Repository Variables
# (TOURAPI_MAX_CALLS · TOURAPI_AREA_CODES · TOURAPI_AREA_CODE · TOURAPI_CONTENT_TYPES)로
# 생략 가능하며, 실행 시 input을 채우면 그게 이긴다.
#
# 커서 이어가기 (TRIP-348): 수집 상태(collect_state.json — 커서 + 기제안 색인)를
# `collect-state` **전용 브랜치**에 커밋·푸시해 실행 간 이어간다 (코드 히스토리 오염
# 없음). 실행 전 브랜치에서 복원 → 스크립트가 커서부터 재개·기제안 스킵 → 공유본 병합이
# develop 에 **실제로 머지된 뒤에만** 갱신 상태를 다시 푸시(TRIP-1475 — 조건표는 영속 스텝 주석).
# 병합·머지·상태 push 중 하나라도 실패하면 빨간불이다 — 초록불인 채 영속이 빠지면 같은 자리를
# 매일 다시 긁는다(8/14~8/18 의 실패 모드). 파일 I/O는 스크립트, 전송(fetch·push)은 여기 워크플로 소관.
name: ai-poi-collect

on:
  workflow_dispatch:
    inputs:
      area_codes:
        description: 'TourAPI 지역 코드 쉼표 목록 — 공평 순회 (비우면 repo Variable → 기본 광역 17개 전부)'
        required: false
        type: string
      area_code:
        description: '단수 지역 코드 하위호환 — 설정 시 그 지역만 (area_codes 무시)'
        required: false
        type: string
      max_calls:
        description: '키당 HTTP 호출 상한 (비우면 repo Variable TOURAPI_MAX_CALLS=1000 → 스크립트 기본 500; 총 예산 = 키 수 × 키당 상한)'
        required: false
        type: string
      content_types:
        description: 'contentTypeId 쉼표 목록 (비우면 기본 12,14,39 — 관광지·문화시설·음식점)'
        required: false
        type: string
      attempt:
        description: '재시도 회차 (자동 재시도가 채운다 — 사람이 채울 일 없음, 상한 3)'
        required: false
        type: string
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = KST 새벽 4시

concurrency: ai-poi-collect   # 실 호출 워크플로는 동시 1건만 (일일 한도 보호)

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      retryable: ${{ steps.triage.outputs.retryable }}
    permissions:
      contents: write   # collect-state 전용 브랜치 push용 (잡 단위 최소 부여, TRIP-348)
      pull-requests: write   # 공유본 자동 갱신 PR (TRIP-392)
      actions: write   # 공유본 머지 뒤 backend-ci 디스패치 (봇의 머지 push 로는 push 런을 기대할 수 없다)
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - run: uv sync --locked
      - name: 수집 상태 복원 (collect-state 전용 브랜치 → ai/collect_state.json)
        id: restore
        # 리다이렉트(`git show > file`)는 show가 실패해도 **빈 파일을 남긴다** — 그러면
        # 스크립트가 "상태 파일 손상"으로 처음부터 돌면서도 성공으로 끝난다(TRIP-348 회귀,
        # 8/14~8/18 5일간 신규 3건). 임시 파일에 받아 성공했을 때만 자리에 놓는다.
        # 브랜치에 **한 번이라도** 상태 파일이 있었는데 지금 없으면 유실이다 — 조용히
        # 처음부터 돌지 말고 실패시킨다 (누가 트리를 덮어썼다는 뜻).
        # pathspec은 현재 디렉토리 기준이라 여기(ai/)선 `:(top)` 없이는 루트 파일을
        # 못 찾는다 — ls-tree --full-tree와 같은 함정.
        run: |
          rm -f collect_state.json collect_state.json.tmp
          RESTORED=false
          if ! git fetch origin collect-state 2>/dev/null; then
            echo "::notice::collect-state 브랜치 없음 — 처음부터"
          elif git show FETCH_HEAD:collect_state.json > collect_state.json.tmp 2>/dev/null; then
            mv collect_state.json.tmp collect_state.json
            RESTORED=true
            echo "::notice::수집 상태 복원 — 커서부터 재개"
          elif [ -n "$(git rev-list -1 FETCH_HEAD -- ':(top)collect_state.json')" ]; then
            rm -f collect_state.json.tmp
            echo "::error::수집 상태 유실 — collect-state 브랜치에 있던 collect_state.json이 현재 tip에 없다. 누군가 트리를 통째로 덮어썼다 (이대로 두면 매일 같은 지역만 재수집)."
            exit 1
          else
            rm -f collect_state.json.tmp
            echo "::notice::수집 상태 없음 (최초 실행) — 처음부터"
          fi
          # 신규율 진단은 **이번 실행 전** 색인과 비교해야 한다 — 스크립트가 상태를
          # 제자리에 덮어쓰므로 지금 사본을 떠 둔다.
          [ -f collect_state.json ] && cp collect_state.json collect_state.prev.json
          echo "restored=$RESTORED" >> "$GITHUB_OUTPUT"
      - name: TourAPI 수집 (게이트 통과분 → 등록 제안 JSON)
        id: collect
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_KEY2: ${{ secrets.TOUR_API_KEY2 }}   # 선택 — 미등록('')이면 건너뜀
          TOUR_API_KEY3: ${{ secrets.TOUR_API_KEY3 }}   # 선택 — 키링 세 번째
          # schedule 실행에서는 inputs가 비므로 Variables → 스크립트 기본값 순으로 폴백
          TOURAPI_AREA_CODES: ${{ inputs.area_codes || vars.TOURAPI_AREA_CODES || '' }}  # '' = 코드 기본 17개
          TOURAPI_AREA_CODE: ${{ inputs.area_code || vars.TOURAPI_AREA_CODE }}  # 단수 하위호환 — 설정 시 그것만
          TOURAPI_CONTENT_TYPES: ${{ inputs.content_types || vars.TOURAPI_CONTENT_TYPES }}
          TOURAPI_MAX_CALLS: ${{ inputs.max_calls || vars.TOURAPI_MAX_CALLS || '500' }}
          COLLECT_OUTPUT: collected_pois.json
          COLLECT_STATE: collect_state.json   # 복원 단계가 놓은 경로 — 실행 후 같은 곳에 갱신
        run: |
          if [ -z "$TOUR_API_KEY" ]; then
            echo "::notice::TOUR_API_KEY 미등록 — 수집 생략"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          uv run python scripts/collect/collect_pois.py 2>&1 | tee collect.log
      - name: 실패 성격 판정 (러너 IP 차단인가, 진짜 문제인가)
        id: triage
        if: failure()
        # TourAPI(apis.data.go.kr)가 **일부 러너 IP 대역을 블랙홀 처리한다** — 거부
        # 응답이 아니라 TCP 연결 자체가 안 된다(실측 2026-08-23: 러너 4곳 중 2곳
        # 도달 0/3, 2곳 3/3). 한 실행은 러너 하나 = IP 하나라 전부 되거나 전부 안 된다.
        # 같은 잡 안에서 재시도해도 IP 가 안 바뀌므로 소용없다 — **실행을 새로 띄워야**
        # 새 IP 를 받는다. 그래서 이 경우만 재시도하고, 나머지 실패는 그대로 빨간불로 둔다
        # (아무 실패나 재시도하면 진짜 버그가 3배 로그에 묻힌다).
        run: |
          if grep -q "URLError" collect.log 2>/dev/null && ! grep -q "게이트 통과 [1-9]" collect.log; then
            echo "retryable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::전 호출 실패 — 러너 IP 차단으로 보인다. 새 IP 로 재시도한다."
          else
            echo "retryable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::네트워크 증상이 아니다 — 재시도하지 않는다."
          fi
      - name: 잡 서머리 (수집·게이트 통과·드롭 통계)
        if: steps.collect.outputs.skipped != 'true'
        run: uv run python scripts/collect/collect_pois.py --summary collected_pois.json >> "$GITHUB_STEP_SUMMARY"
      - name: 등록 제안 artifact 보존 (30일 — 상태 파일 동봉, 디버깅용)
        if: steps.collect.outputs.skipped != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: collected-pois
          # seen_refs.json — 목록에서 본 id 전부(스킵 포함). 벤더 삭제 측정용 (TRIP-1248)
          path: |
            ai/collected_pois.json
            ai/collect_state.json
            ai/seen_refs.json
          retention-days: 30
      - name: 신규율 진단 (50% 미만이면 원인·처방까지 — 제자리걸음이면 실패)
        if: steps.collect.outputs.skipped != 'true'
        # "며칠을 돌렸는데 왜 안 늘지"에 산출물로 답한다. 제안을 신규·갱신·반복으로
        # 갈라 신규율을 재고, 임계 미만이면 원인 후보를 증거와 함께 잡 서머리에 남긴다
        # (예산 굶주림·완주 후 재순회·게이트 드롭 편중·색인 미작동 …).
        #
        # **진단이지 병합 게이트가 아니다**(TRIP-1475) — 이 스텝이 실패해도 아래 공유본 병합·상태 영속은 돈다.
        # 제자리걸음이어도 합치는 것은 무해하고(같은 content_id 는 나중 판본이 이길 뿐, 멱등), 막으면 상태만 영속돼
        # 그날 새로 온 행이 기제안 색인에 찍힌 채 공유본에 못 들어간다(`repeated > 0` 은 신규가 있어도 실패한다).
        #
        # 신규율이 낮다고 실패시키지는 않는다 — 지역을 완주한 뒤의 재순회처럼 정당하게
        # 낮은 국면이 있다. 실패는 **제자리걸음**일 때만: 신규 0 · 스킵 0 이거나
        # 같은 modified_time 이 다시 실린 경우. (앞선 판은 "스킵 0건"만 보고 실패시켰다가
        # 미수집 지역 첫 수집(강원 100건 전부 신규)을 회귀로 오인해 빨간불을 냈다.)
        run: |
          uv run python scripts/collect/collect_novelty.py \
            --output collected_pois.json \
            --prev-state collect_state.prev.json \
            --fail-if-stalled >> "$GITHUB_STEP_SUMMARY"
      - name: 팀 공유본 자동 갱신 PR (TRIP-392 — 병합·축소 가드·롤링 브랜치)
        id: sync
        # 서머리·artifact·신규율 진단의 성패와 무관하게 돈다 — 기본 success() 면 그 셋 중 하나만 실패해도 병합이
        # 건너뛰는데, 그날 수집분은 이 스텝으로만 공유본에 들어간다(TRIP-1475). 이 스텝의 성공이 상태 영속의 조건이라,
        # 공유본이 develop 에 들어가지 못한 경우(push·PR·머지 실패)는 전부 실패로 끝낸다.
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.collect.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # 갈아끼우기가 아니라 **병합**이다 — merge_pois_docs(같은 content_id는 나중
        # 수집분이 이김, 멱등)로 공유본+금일 산출물을 합친다. 합본이 공유본보다
        # 작아지면 축소 사고로 보고 실패시킨다(조용한 데이터 유실 금지). PR은 롤링
        # 브랜치 하나(chore/poi-data-sync)를 force-push — 열린 PR이 있으면 그대로 갱신된다.
        #
        # ⚠️ **머지는 auto-merge 다 (2026-09-26 변경).** 종전 규약은 "머지는 리뷰 후
        # 사람 몫"(TRIP-392: PR 방식 = 리뷰 가능)이었는데, 실측으로 그 전제가 안 섰다:
        # PR #534 가 **12일간 열린 채 방치**됐고 그 사이 고친 파서(#588)가 데이터에
        # 닿지 못했다. 리뷰 대상이 19MB JSON diff 라 사람이 읽을 수 있는 물건이 아니고,
        # 배치는 매일 초록이라 방치가 알림으로도 안 드러난다.
        # 실질 안전장치는 리뷰가 아니라 **축소 가드 + 시도 게이트**(아래 병합 단)이고 둘 다 이 스텝 안에
        # 있다 — 즉 **PR 이 열리는 시점에 그 둘은 이미 끝나 있다**(백엔드 수용은 아래). 신규율 진단은 병합을 막지
        # 않는다(위 스텝 주석).
        #
        # ⚠️ 봇 PR 의 CI 는 **승인 대기로 멈춘다** — 런은 생기지만 `action_required` 로 끝나고
        # PR 체크는 0 이다(실측 #917: backend-ci·ai-ci, statusCheckRollup 0 · #534 도 체크 0).
        # 따라서 auto-merge 는 "CI 통과 후"가 아니라 **사실상 즉시 머지**다.
        # 그렇다고 검증할 것이 없지는 않다 — backend-ci 의 실문서 계약 IT(PoiProposalRealDocumentIT:
        # 지역코드미상 0·신규 >500·재적재 멱등)가 이 파일을 읽고(TRIP-535 가 backend-ci paths 에 넣은
        # 이유), 위 두 가드는 "백엔드가 받아 주는가"를 보지 않는다(그중 지역 코드 하나는 병합의 시도 게이트가 먼저 본다 —
        # `merge_pois_docs.quarantine_unresolved_sido`, TRIP-1475). 봇의 머지 push 도 `GITHUB_TOKEN` 이라
        # push 런을 기대할 수 없다(GitHub 문서상 안 생긴다 — 무한루프 방지. 봇 머지 전례가 없어 실측은 아니다).
        # 그래서 **머지 뒤에 backend-ci 를 workflow_dispatch 로 직접 띄운다**(dispatch 는 그 예외라 런이
        # 생긴다 — 아래 retry 잡이 같은 방식으로 실제 런을 띄워 왔다). push 런이 따로 생겨도 같은 검사가 한 번 더 돌 뿐이다.
        # 사람 리뷰를 되살리려면 스텝 끝의 머지 줄(auto·즉시 둘 다)을 빼면 된다(이 주석이 그 자리다). 단 그러면
        # 바로 아래 MERGED 확인이 실패해 상태를 영속하지 않는다(TRIP-1475) — 리뷰 대기 중 커서가 멈추는 게 맞다면
        # 그대로 두고, 아니면 "머지 전 영속은 행 유실"이라는 영속 스텝 주석부터 다시 따져야 한다.
        #
        # ⚠️ **스케줄은 이 파일을 돌지 않는다.** GitHub 은 schedule 을 기본 브랜치(main)의 워크플로로만
        # 돌리고, main 에는 이 파일의 **등록용 사본**이 따로 있다(checkout 만 develop). 사본은 손으로
        # 맞춰야 하는데 #732 의 머지 줄이 사본에 안 옮겨져 **한 번도 실행되지 않았다**(2026-10-04 확인 —
        # 스케줄 run 의 headBranch=main, 사본엔 머지 줄 자체가 없다). #534 가 9/14~10/3 열려 있다
        # 사람 손에 머지되고 #917 이 또 열린 이유가 이것이다. 이 스텝을 고치면 main 사본도 함께 맞출 것.
        run: |
          BEFORE=$(uv run python -c "import json;print(len(json.load(open('data/collected_pois.json'))['proposals']))")
          # `--allow-mixed`: 공유본에는 **출처가 둘** 섞여 있다(TOURAPI + LOCALDATA, 2026-10-14
          # 병합). 합치는 산출물은 TourAPI 라 출처가 갈려서, 플래그 없이는 merge_pois_docs 가
          # 거부한다(일부러 그렇게 막아 뒀다 — 문서 레벨 source 하나만 읽는 수신에 섞인 문서를
          # 부으면 전량이 한 출처로 중복 적재된다). 여기서 섞이는 것은 **의도된 것**이고,
          # 소비자(`ingest_pois.py`)가 항목별 source 로 갈라 보낸다.
          # `--state`: **시도 게이트를 켠다**(백엔드가 시도를 못 정하는 행 격리, TRIP-1475). 앞 판본이 통과하면 그
          # 판본을 지키고, 아니면 빼고, 둘 다 기제안 색인에서 지운다 — 커서가 이미 그 페이지를 지났으므로 다음 실행이
          # 아니라 그 (지역, 타입)을 완주한 뒤 처음부터 다시 훑을 때 다시 받는다. 소급 제거 뒤에 세고, 빼는 것은
          # **공유본에 없던 키**(그날 처음 온 행)뿐이다 — 공유본에 있던 미판정 키는 빼지 않고 경고만 한다. 격리 + 복원이 상한을 넘으면 병합이
          # 실패해 이 스텝이 멈추고, 상태도 영속하지 않는다. (`--state` 없이 부르면 게이트는 경고만 한다 — main 의 구 사본용.)
          uv run python scripts/collect/merge_pois_docs.py --allow-mixed --state collect_state.json \
            -o data/collected_pois.json data/collected_pois.json collected_pois.json
          AFTER=$(uv run python -c "import json;print(len(json.load(open('data/collected_pois.json'))['proposals']))")
          # 소급 제거(관광 무관·폐업·나이트라이프 규칙·판정 reject)는 **의도한 감소**다 — 그 몫을 빼고 비교하지 않으면
          # 정상 동작이 축소 사고로 오인돼 배치가 빨개진다. 빼 주는 것은 **공유본에 있던 키**의 제거(`retro_dropped_existing`)
          # 뿐이다 — 그날 처음 온 행은 BEFORE 에 없었으므로, 그것까지 더하면 가드가 그만큼 느슨해진다. 시도 게이트의 격리는
          # 공유본에 없던 키만 빼므로(공유본에 있던 미판정 행은 남긴다) 더할 몫이 없다.
          DROPPED=$(uv run python -c "import json;print(json.load(open('data/collected_pois.json'))['stats'].get('retro_dropped_existing',0))")
          if [ "$((AFTER + DROPPED))" -lt "$BEFORE" ]; then
            echo "::error::합본(${AFTER}건 + 의도 제거 ${DROPPED}건)이 공유본(${BEFORE}건)보다 작다 — 축소 덮어쓰기 차단"
            exit 1
          fi
          [ "$DROPPED" -gt 0 ] && echo "소급 제거(관광 무관·폐업·나이트라이프·판정 reject) — 공유본에 있던 행 ${DROPPED}건 (축소 가드에서 제외)"
          if git diff --quiet -- data/collected_pois.json; then
            echo "공유본 변화 없음 — PR 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/poi-data-sync
          git add data/collected_pois.json
          git commit -m "chore(ai): 수집 공유본 병합 갱신 — ${BEFORE}→${AFTER}건 (TRIP-392)"
          # push·PR·머지 실패는 **실패로 끝낸다**(exit 1 → 상태 영속 안 함). 영속하면 다음 실행은 develop 에서 롤링
          # 브랜치를 다시 만들어(force-push) 오늘 행이 빠진 채 덮고, 그 행은 기제안 색인에 찍혀 다시 오지 않는다.
          # 영속하지 않으면 다음 실행이 같은 커서·색인에서 오늘 행을 다시 받아 합친다. 경고(초록불)로 끝내면 그게 매일
          # 반복돼도 아무도 모른다 — 신규율 진단은 영속 안 된 색인과 비교하므로 제자리걸음으로 잡지 못한다.
          if ! git push -f origin chore/poi-data-sync; then
            echo "::error::공유본 브랜치 push 실패 — 상태를 영속하지 않는다 (다음 실행이 같은 자리부터 다시 받아 합친다)"
            exit 1
          fi
          if [ "$(gh pr list --head chore/poi-data-sync --state open --json number --jq length)" = "0" ]; then
            gh pr create --base develop --head chore/poi-data-sync \
              --title "chore(ai): 수집 공유본 자동 갱신 (TRIP-392)" \
              --body "ai-poi-collect 일일 산출물을 merge_pois_docs로 공유본에 병합한 자동 PR. 같은 content_id는 나중 수집분이 이긴다(멱등)·축소 가드·시도 게이트 통과(신규율 진단은 병합을 막지 않는다). **자동 머지된다**(2026-09-26 변경 — 종전 사람 머지는 12일 방치돼 고친 파서가 데이터에 닿지 못했다. auto-merge 가 안 되면 즉시 squash 머지). 봇 PR 의 CI 는 승인 대기(action_required)로 멈추므로 사실상 즉시 머지다. 축소 가드·시도 게이트는 이 PR 이 열리기 **전에** 이미 통과했고, 백엔드 실문서 계약 IT(PoiProposalRealDocumentIT)는 머지 직후 backend-ci 를 develop 으로 디스패치해 돌린다 — 그 런이 빨개지면 원인은 이 공유본이다. 멈추려면 워크플로의 머지 줄을 빼야 한다(auto-merge 를 꺼도 다음 실행이 다시 머지한다. 빼면 머지 확인이 실패해 수집 상태가 영속되지 않는다)." \
              || echo "::warning::PR 생성 실패 — 저장소 설정(Actions의 PR 생성 허용) 확인 필요"
          else
            echo "열린 동기화 PR 갱신됨 (force-push)"
          fi
          PR=$(gh pr list --head chore/poi-data-sync --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "::error::열린 공유본 PR 이 없다 — 상태를 영속하지 않는다 (PR 생성 허용 설정 확인)"
            exit 1
          fi
          # 자동 머지 — 방치를 구조로 막는다. 이미 켜져 있으면 무해하다.
          # (봇 PR 의 CI 는 승인 대기로 멈추므로 사실상 즉시 머지다 — 위 주석 참조.)
          # `--auto` 가 실패하면 **바로 squash 머지**로 넘어간다. develop 엔 브랜치 보호가 없어
          # (`gh api …/branches/develop/protection` → 404 "Branch not protected", 2026-10-04 확인)
          # GitHub 이 auto-merge 를 켜 주지 않는다 — 기다릴 요건이 없는 PR 에는 켤 수 없다.
          # gh 는 PR 이 이미 머지 가능(CLEAN·UNSTABLE·HAS_HOOKS)이면 알아서 바로 머지하지만, push 직후라
          # 상태가 아직 UNKNOWN 이면 켜기를 시도하다 실패한다 — 경고 한 줄로 끝나면 PR 이 그대로 남는다.
          #
          # 머지 명령의 종료 코드는 "머지됐다"가 아니다 — `--auto` 는 **켜기만** 해도 0 이다(develop 에 필수 체크나 머지
          # 큐가 생기면 봇 PR 체크가 승인 대기로 멈춰 영영 안 머지된다). 그래서 PR 상태가 MERGED 인지 직접 본다.
          # 즉시 머지도 상태 반영이 잠깐 늦을 수 있어 5초 간격으로 최대 30초 기다린다.
          gh pr merge "$PR" --squash --auto || gh pr merge "$PR" --squash || true
          STATE=""
          for _ in 1 2 3 4 5 6; do
            STATE=$(gh pr view "$PR" --json state --jq .state || true)
            [ "$STATE" = "MERGED" ] && break
            sleep 5
          done
          if [ "$STATE" = "MERGED" ]; then
            # 여기 왔으면 머지됐다. 그 push 로는 backend-ci 를
            # 기대할 수 없어 직접 띄운다 — 공유본을 읽는 실문서 계약 IT 가 이 런에서 돈다(image 잡은 push 전용이라 테스트만).
            gh workflow run backend-ci.yml --ref develop \
              || echo "::warning::backend-ci 디스패치 실패 — 공유본 계약 IT 가 안 돌았다. Actions 에서 backend-ci 를 develop 으로 수동 실행할 것"
          else
            # 30초 뒤에 auto-merge 가 끝날 수도 있다 — 그러면 데이터는 들어갔지만 backend-ci 디스패치는 이 런에서 안 돈다.
            # 머지 전에 미리 띄우지 않는 이유: develop 에 아직 없는 공유본을 검사하게 돼 의미가 없다.
            echo "::error::공유본 PR #${PR} 이 머지되지 않았다(상태 ${STATE:-?}) — 상태를 영속하지 않는다 (다음 실행이 같은 자리부터 다시 받아 합친다). 나중에 머지되면 backend-ci 를 develop 으로 수동 실행할 것"
            exit 1
          fi
      - name: 수집 상태 영속 (collect-state 전용 브랜치 커밋·푸시)
        id: persist
        # **공유본 병합 뒤에, 그날 행이 develop 에 실제로 들어갔을 때만** 영속한다(TRIP-1475). 영속은 그날 수집분을
        # 기제안 색인에 찍고 커서를 넘긴다 — 공유본에 못 들어간 채 찍히면 다음 실행이 "변경 없음"으로 건너뛰어
        # 그 행들이 영구히 안 들어온다. 영속하지 않으면 다음 실행이 같은 커서·색인에서 그 행들을 다시 받는다.
        #
        # 조건표 (sync 가 돌았다 = collect 성공·skipped 아님. 서머리·artifact·신규율 진단의 성패는 sync 를 막지 않는다):
        #   collect 실패·skipped·취소           → sync 안 돎 → 영속 안 함
        #   sync 실패                           → 영속 안 함 (빨간불 — 축소 가드·격리 상한·상태 파일 없음·
        #                                          push·PR 없음·MERGED 미확인. 다음 실행이 같은 자리부터 다시 받아 합친다.
        #                                          MERGED 미확인 뒤에 auto-merge 가 끝나면 backend-ci 는 수동 실행)
        #   sync 성공                           → 영속 (PR 이 MERGED 로 확인됨, 또는 공유본 변화 없음 = 잃을 것 없음)
        #   서머리·artifact·신규율 진단 실패     → 위 두 줄 그대로 (잡은 빨갛지만 병합·영속은 막지 않는다)
        #   영속 스텝 실패(상태 파일 없음·push 실패) → 빨간불, 이어가기 검증 안 돎
        # 기본 success() 를 쓰면 진단 실패만으로 영속이 빠져 커서가 안 나가므로 조건을 직접 쓴다.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # plumbing(hash-object→mktree→commit-tree)으로 워킹트리를 건드리지 않고 커밋한다.
        # 브랜치 부재 시 부모 없는 커밋(= orphan)으로 생성. push 실패는 **스텝 실패**다 — 경고로 넘기면 스텝이
        # 성공으로 남아 이어가기 검증이 옛 tip 을 보고 통과하고, 다음 실행은 그날 머지된 행을 다시 긁는다.
        #
        # 브랜치는 ai-llm-smoke의 rehearsal_log.jsonl과 **공유**한다 — 기존 트리를 보존한
        # 채 자기 파일만 교체해야 서로를 지우지 않는다. `git ls-tree`는 현재 디렉토리
        # 프리픽스 기준이라 working-directory가 ai/ 인 여기서는 루트 파일이 **한 줄도 안
        # 나온다** — `--full-tree` 필수 (이게 빠져서 두 워크플로가 서로를 덮어썼다).
        run: |
          if [ ! -f collect_state.json ]; then
            echo "::error::상태 파일 없음 — 영속할 수 없다 (병합은 --state 로 이 파일을 읽었어야 한다)"
            exit 1
          fi
          (
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            PARENT=""
            BASE_TREE=""
            if git fetch origin collect-state 2>/dev/null; then
              PARENT="-p FETCH_HEAD"
              BASE_TREE=$(git ls-tree --full-tree FETCH_HEAD | grep -v $'\tcollect_state.json$' || true)
            fi
            BLOB=$(git hash-object -w collect_state.json)
            TREE=$({ [ -n "$BASE_TREE" ] && printf '%s\n' "$BASE_TREE"; \
                     printf '100644 blob %s\tcollect_state.json\n' "$BLOB"; } | git mktree)
            COMMIT=$(git commit-tree $TREE $PARENT -m "chore(ai): 수집 상태 갱신 — run ${{ github.run_id }} (TRIP-348)")
            git push origin "$COMMIT:refs/heads/collect-state"
          ) || { echo "::error::수집 상태 push 실패 — 다음 실행은 그날 머지된 행을 같은 자리부터 다시 긁는다"; exit 1; }
      - name: 이어가기 검증 (상태 왕복 — 다음 실행이 커서부터 재개할 수 있는가)
        if: ${{ !cancelled() && steps.persist.outcome == 'success' }}   # 영속한 날만 — 거른 날엔 왕복할 것이 없다
        # 이 워크플로의 실패 모드는 "빨간불"이 아니라 **초록불인 채 같은 데이터만
        # 다시 긁는 것**이었다 — 8/14~8/18 5일 연속 성공했는데 신규 POI 3건.
        # 그래서 두 가지를 여기서 깨뜨린다.
        #   (1) 왕복: 방금 push한 상태가 브랜치 tip에 실제로 남아 있는가.
        #       (누가 트리를 덮어쓰면 다음 실행이 처음부터 도는데, 그 사실을
        #        다음 실행이 아니라 **덮어쓴 바로 그 실행**에서 안다.)
        #   (2) 재수집 판정은 앞 스텝(신규율 진단)이 맡는다 — 여기는 왕복만 본다.
        run: |
          FAIL=0
          if git fetch origin collect-state 2>/dev/null \
             && git cat-file -e FETCH_HEAD:collect_state.json 2>/dev/null; then
            echo "상태 왕복 확인 — 다음 실행은 커서부터 재개한다"
          else
            echo "::error::상태 왕복 실패 — push 직후인데 collect-state tip에 collect_state.json이 없다. 다음 실행이 처음부터 돌면서 같은 지역만 재수집하게 된다."
            FAIL=1
          fi
          exit $FAIL

  # ── 새 IP 로 재시도 (TRIP-246 후속) ────────────────────────────────
  # GitHub 은 러너를 고를 수 없고 잡 하나는 IP 하나를 쓴다. 그래서 재시도 = **실행을
  # 새로 띄우기**다. 표본(2026-08-23 실측, 러너 4곳 중 2곳 도달)으로 회당 ~50% —
  # 3회면 ~88%. 상한 3회는 무한 루프 방지선이자 일일 호출 예산 보호선이다.
  # 스케줄 실행은 inputs 가 비므로 attempt=1 로 시작한다.
  retry:
    needs: collect
    if: failure() && needs.collect.outputs.retryable == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # 자기 자신을 재기동 (이 잡 단위로만 부여)
    steps:
      - name: 다음 회차 띄우기 (상한 3)
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          NEXT=$(( ${ATTEMPT:-1} + 1 ))
          if [ "$NEXT" -gt 3 ]; then
            echo "::error::재시도 3회 모두 실패 — 러너 IP 운이 계속 나빴거나 다른 원인이다. 수동 확인이 필요하다(로컬에서 apis.data.go.kr 도달 여부부터)."
            exit 1
          fi
          echo "::notice::${NEXT}회차를 새 실행으로 띄운다 (새 러너 = 새 IP)."
          # -R 필수: 이 잡은 checkout 을 하지 않아 워킹디렉토리가 git 저장소가 아니다.
          # 빼면 "failed to run git: fatal: not a git repository" 로 디스패치 직전에
          # 죽는다 (2026-08-26 실측 — 판정·회차 계산은 맞았는데 마지막 줄에서 실패).
          gh workflow run ai-poi-collect.yml -R "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f attempt="$NEXT" \
            -f area_codes="${{ inputs.area_codes }}" \
            -f area_code="${{ inputs.area_code }}" \
            -f max_calls="${{ inputs.max_calls }}" \
            -f content_types="${{ inputs.content_types }}"
