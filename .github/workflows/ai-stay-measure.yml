# 숙소 콘텐츠 커버리지 측정 (숙소콘텐츠-수집-설계.md 칸 0)
#
# TourAPI 숙박(contentTypeId=32)이 우리 정본 12,782곳 중 몇 칸을 실제로 채울 수 있는지 잰다.
# **아무것도 등록하지 않는다** — 이 숫자가 칸 1(수집·병합) 착수 여부를 정한다.
#
# ## 왜 ai-poi-collect 에 32 를 더하지 않나
#
# 예산 때문이 아니다. POI 는 일일 3,000 중 **260 만 쓰고 이미 수렴했다**(85칸 전부 완주,
# 신규 0건 — 2026-09-21 collect-state 실측). 분리하는 이유는 **상태 오염**이다:
# 수집 커서가 `cursors[지역][타입]` 이라 32 를 더하면 POI 상태에 숙박 커서가 생기는데,
# 매핑표가 숙박을 버리므로 매일 긁어와 매일 버리는 일이 영구히 돌고 POI 통계도 오염된다.
#
# ## 스케줄
#
# KST 새벽 5시 — POI(04시)와 **한 시간 어긋나게** 둔다. 같은 날 돌아도 예산이 남으므로
# 날짜를 뗄 이유가 없고, 시각만 다르면 동시 호출로 분당 제한에 걸릴 여지가 없다.
# 주 1회다 — 매일 잴 값이 아니다(정본도 TourAPI 도 그 주기로 바뀌지 않는다).
#
# ai-ci 와 분리돼 push/PR 트리거가 **없다** — CI 실 호출 0건 정책(D37)은 그대로다.
# TOUR_API_KEY 미등록이면 건너뛰고 **성공 종료**한다(POI 배치와 같은 규약).
name: ai-stay-measure

on:
  workflow_dispatch:
    inputs:
      area_codes:
        description: '지역 코드 쉼표 목록 (비우면 광역 17개 전부 — 전국이 기본이다)'
        required: false
        type: string
      count_only:
        description: '총건수만 잰다 (지역당 1회 = 17회). 전수 스캔은 비워 둔다'
        required: false
        type: boolean
      attempt:
        description: '재시도 회차 (자동 재시도가 채운다 — 사람이 채울 일 없음, 상한 3)'
        required: false
        type: string
  schedule:
    - cron: '0 20 * * 1'   # UTC 월 20:00 = KST 화 새벽 5시

concurrency: ai-stay-measure   # 실 호출 워크플로는 동시 1건만 (일일 한도 보호)

# 읽기와 artifact 업로드뿐이다 — 상태 브랜치 push 도, 이슈 생성도 없다.
# 리포 기본이 read 라 지금은 같은 값이지만, **기본값이 바뀌면 조용히 넓어진다.**
# 형제 배치(ai-intro2-probe·ai-existence-probe)도 같은 이유로 명시한다.
permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    outputs:
      retryable: ${{ steps.triage.outputs.retryable }}
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - run: uv sync --locked

      - name: TourAPI 숙박 커버리지 측정
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_KEY2: ${{ secrets.TOUR_API_KEY2 }}   # 선택 — 미등록('')이면 건너뜀
          TOUR_API_KEY3: ${{ secrets.TOUR_API_KEY3 }}   # 선택 — 키링 세 번째
          # schedule 실행에서는 inputs 가 비므로 Variables → 스크립트 기본(17개) 순 폴백.
          TOURAPI_AREA_CODES: ${{ inputs.area_codes || vars.TOURAPI_AREA_CODES || '' }}
          TOURAPI_MAX_CALLS: ${{ vars.TOURAPI_MAX_CALLS }}
          STAY_MEASURE_COUNT_ONLY: ${{ inputs.count_only && '1' || '' }}
          STAY_MEASURE_OUTPUT: stay_coverage.json
        # 로그를 파일로도 남긴다 — 아래 판정이 실패 성격을 읽어야 한다.
        run: |
          set -o pipefail
          uv run python scripts/measure_stay_coverage.py 2>&1 | tee measure.log

      - name: 실패 성격 판정 (러너 IP 차단인가, 진짜 문제인가)
        id: triage
        if: failure()
        # TourAPI(apis.data.go.kr)가 **일부 러너 IP 대역을 블랙홀 처리한다** — 거부 응답이
        # 아니라 TCP 연결 자체가 안 된다(ai-poi-collect 가 2026-08-23 에 실측: 러너 4곳 중
        # 2곳 도달 0/3). 한 실행은 러너 하나 = IP 하나라 전부 되거나 전부 안 된다.
        # **첫 실행(2026-09-22, run 35757029078)이 정확히 이것으로 죽었다** — 첫 호출부터
        # `URLError: timed out`. 같은 잡 안에서 다시 걸어도 IP 가 안 바뀌므로 소용없다.
        #
        # 네트워크 증상일 때만 재시도한다 — 아무 실패나 재시도하면 진짜 버그가 3배 로그에 묻힌다.
        run: |
          if grep -q "URLError" measure.log 2>/dev/null && ! grep -q "지역 .* — 총 [0-9]" measure.log; then
            echo "retryable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::한 지역도 못 읽고 URLError — 러너 IP 차단으로 보인다. 새 IP 로 재시도한다."
          else
            echo "retryable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::네트워크 증상이 아니다(또는 일부는 읽었다) — 재시도하지 않는다."
          fi

      - name: 요약을 실행 화면에 적는다
        # 산출물을 열어 봐야만 알 수 있으면 아무도 안 본다 — 판정선을 요약에 함께 적어
        # **다음 행동이 요약만 보고 정해지게** 한다(설계 §3 판정선).
        if: always()
        run: |
          if [ ! -f stay_coverage.json ]; then
            echo "측정 산출물이 없습니다 — 키 미등록이거나 측정이 실패했습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("stay_coverage.json"))
          fill = d["fill_rate_pct"]
          verdict = ("칸 1 진행" if fill >= 30 else
                     "진행하되 '사진 있는 숙소 우선 정렬' 동반" if fill >= 10 else
                     "트랙을 접고 제휴 콘텐츠 API 를 기다린다")
          print("## 숙소 콘텐츠 커버리지\n")
          print(f"- TourAPI 숙박 총건수: **{d['tourapi_total']:,}**")
          print(f"- 훑은 고유 건수: {d['scanned_unique']:,} · 사진 보유: {d['with_image']:,}")
          print(f"- 우리 정본과 매칭: {d['matched']:,} · 그중 사진 있음: {d['matched_with_image']:,}")
          print(f"- **실제로 채워지는 칸: {fill}%** → {verdict}")
          print(f"- HTTP 호출: {d['http_calls']}/{d.get('max_calls', '?')}\n")
          if d.get("budget_exhausted"):
              # 부분 스캔의 비율을 판정선에 그대로 쓰면 거짓 근거가 된다 — 요약 맨 위에서 막는다.
              print(f"> ⚠️ **호출 예산을 다 써서 {d.get('areas_scanned','?')}개 지역만 훑었다.** "
                    "위 비율은 **부분 스캔** 값이라 판정선에 그대로 쓰면 안 된다. "
                    "`TOURAPI_AREA_CODES` 로 나눠 여러 번 재거나 `count_only` 로 규모부터 보라.\n")
          print("거리 임계값별 매칭 — 값이 임계값에 민감하면 칸 1 에서 다시 본다:\n")
          print("| 임계값 | 매칭 |")
          print("|---|---|")
          for t, n in sorted(d["matched_by_threshold_m"].items(), key=lambda kv: int(kv[0])):
              print(f"| {t}m | {n:,} |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stay-coverage
          path: ai/stay_coverage.json
          retention-days: 30
          if-no-files-found: ignore

  # ── 새 IP 로 재시도 ────────────────────────────────────────────────────────
  # GitHub 은 러너를 고를 수 없고 잡 하나는 IP 하나를 쓴다. 그래서 재시도 = **실행을 새로
  # 띄우기**다. `ai-poi-collect` 가 같은 이유로 같은 장치를 갖고 있고, 표본으로 회당 ~50% —
  # 3회면 ~88%. 상한 3회는 무한 루프 방지선이자 일일 호출 예산 보호선이다.
  retry:
    needs: measure
    if: failure() && needs.measure.outputs.retryable == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # 자기 자신을 재기동 (이 잡 단위로만 부여)
    steps:
      - name: 다음 회차 띄우기 (상한 3)
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          NEXT=$(( ${ATTEMPT:-1} + 1 ))
          if [ "$NEXT" -gt 3 ]; then
            echo "::error::재시도 3회 모두 실패 — 러너 IP 운이 계속 나빴거나 다른 원인이다. 로컬에서 apis.data.go.kr 도달 여부부터 확인하라."
            exit 1
          fi
          echo "::notice::${NEXT}회차를 새 실행으로 띄운다 (새 러너 = 새 IP)."
          # -R 필수: 이 잡은 checkout 을 하지 않아 워킹디렉토리가 git 저장소가 아니다.
          # 빼면 "not a git repository" 로 디스패치 직전에 죽는다(ai-poi-collect 실측).
          # count_only 는 **boolean 입력**이라 빈 값을 넘기면 디스패치가 거부된다.
          # 스케줄 실행에서 실패하면 inputs 가 통째로 비어 그 경로를 정확히 탄다 —
          # 형제 배치(ai-poi-collect)는 입력이 전부 string 이라 없던 함정이다.
          # 그래서 **켜져 있을 때만** 싣는다.
          ARGS=(-f attempt="$NEXT" -f area_codes="${{ inputs.area_codes }}")
          if [ "${{ inputs.count_only }}" = "true" ]; then
            ARGS+=(-f count_only=true)
          fi
          gh workflow run ai-stay-measure.yml -R "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" "${ARGS[@]}"
