name: Infrastructure checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'infra/**'
      - 'deploy/eks/**'
      - '.github/workflows/aws-*.yml'
      - '.github/workflows/infra-checks.yml'
  push:
    branches: [develop, main]
    paths:
      - 'infra/**'
      - 'deploy/eks/**'
      - '.github/workflows/aws-*.yml'
      - '.github/workflows/infra-checks.yml'

permissions:
  contents: read

concurrency:
  group: infra-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - name: Test Python runtime and workflow boundaries without AWS credentials
        run: |
          python -m pip install -r infra/requirements-test.txt
          python -m coverage run --rcfile=infra/.coveragerc -m unittest discover -s infra/tests -v
          python -m coverage run --rcfile=infra/.coveragerc --append -m unittest discover -s deploy/eks/tests -v
          python -m coverage report --rcfile=infra/.coveragerc
          python -m unittest discover -s infra/bootstrap/tests -v
          python -m unittest discover -s deploy/eks/chart/tests -v
      - name: Validate Terraform with mock providers
        working-directory: infra/terraform/stack
        run: |
          terraform fmt -check -recursive ..
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate
          terraform test
