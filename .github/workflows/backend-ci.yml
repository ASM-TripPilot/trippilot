name: backend-ci

# backend/ 변경 시에만 실행 (모노레포 경로 트리거)
#
# `ai/docs/openapi.json` 도 트리거에 넣는다 — 백엔드가 그 파일을 계약 정본으로 읽어 드리프트를 막는데
# (`AiBoundaryOpenApiTest`, TRIP-334), backend/ 만 보면 **AI 가 계약을 바꾼 순간에는 이 게이트가 안 돈다**.
# 그러면 다음 백엔드 PR 이 남의 변경 때문에 빨개지고, 그 사이 배포된 백엔드는 이미 어긋나 있다.
on:
  push:
    branches: [develop]
    paths: ['backend/**', 'ai/docs/openapi.json', 'ai/data/collected_pois.json', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [develop]
    paths: ['backend/**', 'ai/docs/openapi.json', 'ai/data/collected_pois.json', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trippilot-backend

jobs:
  # 1) 빌드·테스트 게이트 (Testcontainers IT 포함 — GitHub 러너엔 Docker 있음)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: gradle build (test 포함)
        working-directory: backend
        run: ./gradlew build --no-daemon

  # 2) 이미지 빌드 → GHCR push (develop push 에서만 publish)
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3   # gha 캐시 export 위해 docker-container 드라이버 필요
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
