name: backend-ci

# backend/ 변경 시에만 실행 (모노레포 경로 트리거)
#
# `ai/docs/openapi.json` 도 트리거에 넣는다 — 백엔드가 그 파일을 계약 정본으로 읽어 드리프트를 막는데
# (`AiBoundaryOpenApiTest`, TRIP-334), backend/ 만 보면 **AI 가 계약을 바꾼 순간에는 이 게이트가 안 돈다**.
# 그러면 다음 백엔드 PR 이 남의 변경 때문에 빨개지고, 그 사이 배포된 백엔드는 이미 어긋나 있다.
#
# `docker-compose.yml`·`.env.example`·`deploy/**` 도 같은 이유다(TRIP-858) — `AppleClientIdWiringTest` 가
# **env 가 앱까지 도달하는 통로**를 그 네 파일에서 읽어 검사한다. backend/ 만 보면 통로를 끊는 변경이
# 게이트를 한 번도 안 거치고 머지된다. 실측으로 그 상태가 이미 한 번 있었다: `APPLE_CLIENT_ID` 가
# compose·Helm·시크릿동기화 어디에도 없어 배포해도 애플 로그인이 501 이었는데 전 CI 가 초록이었다.
on:
  push:
    branches: [develop]
    paths: ['backend/**', 'ai/docs/openapi.json', 'ai/data/collected_pois.json', '.github/workflows/backend-ci.yml', 'docker-compose.yml', '.env.example', 'deploy/**']
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', 'ai/docs/openapi.json', 'ai/data/collected_pois.json', '.github/workflows/backend-ci.yml', 'docker-compose.yml', '.env.example', 'deploy/**']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trippilot-backend

jobs:
  # 1) 빌드·테스트 게이트 (Testcontainers IT 포함 — GitHub 러너엔 Docker 있음)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # 의존성·컴파일 캐시. 지금까지 없어서 매 실행이 전체 재다운로드·재컴파일이었다
          # (실측 ~4분/회 × 하루 20회+). buildkit mode=min 전환으로 캐시 자리를 먼저 비웠다 —
          # 10GB 상한이 꽉 찬 상태에서 붙이면 도커 레이어에 밀려 바로 증발한다.
          cache: gradle
      - name: gradle build (test 포함)
        working-directory: backend
        run: ./gradlew build --no-daemon

  # 2) 이미지 빌드 → GHCR push (develop push 에서만 publish)
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3   # gha 캐시 export 위해 docker-container 드라이버 필요
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
