name: backend-ci

# backend/ 변경 시에만 실행 (모노레포 경로 트리거)
#
# `ai/docs/openapi.json` 도 트리거에 넣는다 — 백엔드가 그 파일을 계약 정본으로 읽어 드리프트를 막는데
# (`AiBoundaryOpenApiTest`, TRIP-334), backend/ 만 보면 **AI 가 계약을 바꾼 순간에는 이 게이트가 안 돈다**.
# 그러면 다음 백엔드 PR 이 남의 변경 때문에 빨개지고, 그 사이 배포된 백엔드는 이미 어긋나 있다.
#
# `docker-compose.yml`·`.env.example`·`deploy/**` 도 같은 이유다(TRIP-858) — `AppleClientIdWiringTest` 가
# **env 가 앱까지 도달하는 통로**를 그 네 파일에서 읽어 검사한다. backend/ 만 보면 통로를 끊는 변경이
# 게이트를 한 번도 안 거치고 머지된다. 실측으로 그 상태가 이미 한 번 있었다: `APPLE_CLIENT_ID` 가
# compose·Helm·시크릿동기화 어디에도 없어 배포해도 애플 로그인이 501 이었는데 전 CI 가 초록이었다.
on:
  push:
    branches: [develop]
    paths: ['backend/**', 'ai/docs/openapi.json', 'ai/data/collected_pois.json', '.github/workflows/backend-ci.yml', 'docker-compose.yml', '.env.example', 'deploy/**']
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', 'ai/docs/openapi.json', 'ai/data/collected_pois.json', '.github/workflows/backend-ci.yml', 'docker-compose.yml', '.env.example', 'deploy/**']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trippilot-backend

jobs:
  # 1) 빌드·테스트 게이트 (Testcontainers IT 포함 — GitHub 러너엔 Docker 있음)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # 의존성·컴파일 캐시. 지금까지 없어서 매 실행이 전체 재다운로드·재컴파일이었다
          # (실측 ~4분/회 × 하루 20회+). buildkit mode=min 전환으로 캐시 자리를 먼저 비웠다 —
          # 10GB 상한이 꽉 찬 상태에서 붙이면 도커 레이어에 밀려 바로 증발한다.
          cache: gradle
      - name: 커버리지 게이트 스크립트 검사
        working-directory: backend
        run: python3 -m unittest scripts/test_coverage_gate.py
      # 커버리지를 build 와 **같은 Gradle 호출에** 싣는다 — JVM 기동·구성 단계를 한 번만 거친다.
      # 하한선(전체·모듈별, 규칙은 scripts/coverage_gate.py)은 develop 으로 가는 PR·그 밖의 브랜치 수동 실행(스택 PR 검증에
      # 쓴다)에서 **막는다**. develop push · 릴리스 PR · develop/main 수동 실행은 막지 않는다 — 이미 머지된 코드라(PR 단계에서 게이트를 지났다), 막으면 이미지 발행(image 잡)이나
      # 운영 승격이 커버리지 부채 때문에 멈춘다. 릴리스 PR 은 두 꼴이다: docs/conventions/branch.md 의 `develop` → `main`,
      # 그리고 실제 관행인 `release/main-*`(main 에서 따서 develop 커밋을 머지한 브랜치 — 머지된 릴리스 PR 이 전부 이 이름).
      # main 으로 가는 그 밖의 PR(branch.md 의 hotfix/* 는 main 에서 분기, 관행상 ci/* 등도)은 develop 을 거치지 않은
      # 코드라 **막는다**. 판정이 브랜치 이름이라(fork 에서 온 PR 은 이름이 같아도 릴리스로 보지 않는다), 이 저장소 안에서
      # 릴리스가 아닌 수정을 `release/main-*` 로 올리면 경고로만 지나간다. main 이 이미 하한 미달이면(advisory 로 나간
      # 릴리스의 부채) hotfix 도 자기 변경과 무관하게 빨개진다 — 그때는 요약의 모듈 표로 자기 변경분을 판단한다.
      # 대신 막지 않는 경우의 실패를
      # `::warning::` 주석으로 커밋 체크에 남긴다(COVERAGE_ADVISORY). 각자 통과한 PR 둘이 합쳐 하한을 넘은 시점이
      # 그 머지 커밋에 보이게 — 안 남기면 무관한 다음 PR 이 처음 빨개져 원인을 거꾸로 추적해야 한다.
      # 표와 실패 사유는 잡 요약(Summary 탭)에 남는다.
      - name: gradle build (test 포함) + 커버리지
        working-directory: backend
        env:
          # 막지 않는 경우: develop push · 릴리스 PR(develop 또는 release/main-* → main) · develop/main 자체를 수동 실행(이미 머지된 코드다)
          COVERAGE_ADVISORY: ${{ (github.event_name == 'push' || (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'develop' || startsWith(github.head_ref, 'release/main-'))) || (github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || github.ref_name == 'main'))) && '1' || '' }}
        run: ./gradlew build :app:coverageGate --no-daemon
      - name: 커버리지 리포트 보관
        if: ${{ !cancelled() && github.event_name != 'push' }}   # 검토용(PR·수동) — 실패해도 남기되, 취소된 실행은 건너뛴다
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/app/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7   # PR 검토 동안만 쓸모 있다 — 기본 90일이면 하루 20회+ 실행분이 할당량을 쌓는다

  # 2) 이미지 빌드 → GHCR push (develop push 에서만 publish)
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3   # gha 캐시 export 위해 docker-container 드라이버 필요
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
