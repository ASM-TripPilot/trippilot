# 요금 값이 어디에 있는지 훑는다 — 엔드포인트·필드 전수 스캔 (탐색용 1회성).
#
# `usefee` 실측에서 나온 것: 타입 14 에만 있고 후보풀 전체로는 0.9%. 나머지
# 96.9% 를 채울 수 있는지 답하려면 다른 엔드포인트(detailInfo2 반복정보)와
# 산문 필드(usetime·expguide)에 요금이 섞여 있는지를 봐야 한다.
#
# 수동 실행 전용. 실 API 를 쓰므로 머지 게이트에 얹지 않는다(리포 규약: CI 는
# 외부 호출 0). 상태(커서·기제안 색인)를 읽지도 쓰지도 않는다.
name: ai-fee-sources-probe

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: 'contentTypeId 쉼표 목록'
        required: false
        default: '12,14,28,38,39'
        type: string
      per_kind:
        description: '타입당 POI 수 (엔드포인트 2종이라 호출은 이 값의 2배)'
        required: false
        default: '80'
        type: string
      from_doc:
        description: '제안 문서 경로 — 여기서 content_id 를 뽑는다'
        required: false
        default: 'data/collected_pois.json'
        type: string
      endpoints:
        description: '부를 엔드포인트. 필드를 아는 2차 실측이면 하나로 줄여 호출 절반'
        required: false
        default: 'detailIntro2,detailInfo2'
        type: string
      dump_fields:
        description: '원문을 전부 남길 필드 (반복정보는 info:이용요금). 분포가 필요할 때'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 요금 필드 스캔
        working-directory: ai
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_KEY2: ${{ secrets.TOUR_API_KEY2 }}
          TOUR_API_KEY3: ${{ secrets.TOUR_API_KEY3 }}
        run: |
          args=(--from-doc "${{ inputs.from_doc }}"
                --kinds "${{ inputs.kinds }}"
                --per-kind "${{ inputs.per_kind }}"
                --endpoints "${{ inputs.endpoints }}"
                --out fee_sources.json)
          [ -n "${{ inputs.dump_fields }}" ] && args+=(--dump-fields "${{ inputs.dump_fields }}")
          uv run python scripts/probe_fee_sources.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fee-sources
          path: ai/fee_sources.json
          if-no-files-found: warn
          retention-days: 30
