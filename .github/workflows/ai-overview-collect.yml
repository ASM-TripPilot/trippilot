# KB-5 장소 지식 2단계 — 관광공사 개요(detailCommon2 의 overview) 수집 (2026-10-19)
#
# 관광공사 장소 20,940곳을 일일 한도(키 3개 × 오퍼레이션별 1,000) 안에서 **여러 날에 걸쳐** 받는다.
# detailCommon2 는 매일 POI 수집(ai-poi-collect — 목록·detailIntro2)이 안 쓰는 오퍼레이션이라 한도가 겹치지
# 않는다(장소 데이터 담당 확인 2026-10-19). 매일 POI 수집은 04시 cron,
# 장소 데이터 담당의 수동 수집은 밤이다.
#
# 누적본은 `overview-state` 전용 브랜치에 두고, 실행 시작에 복원 → 끝에 갱신 push 한다(ai-fee-collect 와 같은
# 패턴). 이미 받은 content_id 는 건너뛴다. 첫 실행은 표본 200 — 요약의 길이 분포·전량 환산 벡터 크기로
# 저장 방식을 정한다. 전량이 모이면 조각 벡터를 만들어 develop 의 KB-5 시드로 올린다(별도 PR).
#
# 매일 KST 00:30 에 한 번 돈다(키 3개 × 키당 950 ≈ 2,850곳 — 오퍼레이션 한도 1,000 에 여유). 키는 하나씩 돌아
# 한도가 찬 키는 건너뛴다. 볼거리부터 받는다(`_PRIORITY`) — 볼거리가 끝나면 다 모이기 전에 KB-5 시드로 먼저 올린다. 다 모이면 받을 곳이
# 없어 호출 0 으로 끝난다 — 그때 이 cron 을 지운다. 표본(10-19 런 39245192434): 개요 있음 99% · 중앙 270자 · 200건 실패 0.
# 실 API 를 쓰므로 머지 게이트에 얹지 않는다(리포 규약: CI 는 외부 호출 0).
name: ai-overview-collect

on:
  schedule:
    - cron: '30 15 * * *'  # UTC 15:30 = KST 00:30 — 한도가 KST 자정에 새로 차므로 그날 첫머리에 받는다(10-19 단축)
  workflow_dispatch:
    inputs:
      max_calls:
        description: '이번 실행의 호출 상한 (첫 실행은 표본 200, 이후 하루 3,000 미만)'
        required: false
        default: '200'
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # overview-state 전용 브랜치 push 용 (잡 단위 최소 부여)
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 누적본 복원 — 브랜치가 없으면 빈 상태로 시작한다(첫 실행).
      - name: 누적본 복원
        run: |
          set -o pipefail
          if git fetch origin overview-state --depth=1 2>/dev/null; then
            git show FETCH_HEAD:place_corpus_overview.jsonl.gz > ai/data/place_corpus_overview.jsonl.gz
            echo "복원: $(python3 -c 'import gzip; print(sum(1 for l in gzip.open("ai/data/place_corpus_overview.jsonl.gz", "rt") if l.strip()))') 곳"
          else
            echo "overview-state 브랜치 없음 — 처음부터 시작"
          fi

      - name: 개요 수집
        working-directory: ai
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_KEY2: ${{ secrets.TOUR_API_KEY2 }}
          TOUR_API_KEY3: ${{ secrets.TOUR_API_KEY3 }}
        run: |
          # `| tee` 가 파이프 앞 종료 코드를 삼킨다 — 실패율 가드가 안 닿는다(ai-fee-collect 실측).
          set -o pipefail
          uv run python scripts/collect/collect_place_overviews.py \
            --max-calls "${{ inputs.max_calls || '2850' }}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # 누적본 갱신 — orphan 커밋 하나로 브랜치를 덮는다(히스토리 불필요). 실패율로 끝난 날도 받은 데까지는
      # 스크립트가 저장했으니 올린다(한도 소진이면 다음 실행이 이어받는다).
      - name: 누적본 갱신
        if: always()
        run: |
          set -o pipefail
          [ -f ai/data/place_corpus_overview.jsonl.gz ] || { echo "누적본 없음 — 건너뜀"; exit 0; }
          (
            cd "$(mktemp -d)"
            git init -q . && git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp "$GITHUB_WORKSPACE/ai/data/place_corpus_overview.jsonl.gz" place_corpus_overview.jsonl.gz
            git add place_corpus_overview.jsonl.gz
            git commit -q -m "chore(kb5): 관광공사 개요 누적본 갱신 ($(date -u +%Y-%m-%d))"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
              HEAD:refs/heads/overview-state
          ) || echo "::warning::누적본 push 실패 — artifact 로는 남았다"

      - name: 결과 보존
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: place-corpus-overview
          path: ai/data/place_corpus_overview.jsonl.gz
          if-no-files-found: warn
          retention-days: 30
