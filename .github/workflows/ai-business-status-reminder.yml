# [main 등록용 사본] GitHub은 schedule(cron)·workflow_dispatch를 기본 브랜치의
# 워크플로만 등록한다. main의 ai/ 는 구버전이므로 checkout을 develop으로 고정 —
# 이 파일(트리거 등록)은 main, 실행 코드는 항상 develop. develop 쪽 원본 갱신 시 이 사본도 동기화할 것.
# POI 영업상태 데이터 신선도 리마인더 (TRIP-280)
#
# `ai/data/poi_business_status.json`(수집 POI 의 폐업 여부·인허가일자)은 **자동 갱신이
# 불가능하다** — 원본이 공공데이터포털의 862MB CSV 2개인데, localdata.go.kr 은 러너에서
# TCP 연결 자체가 막히고 data.go.kr 파일 다운로드는 로그인이 필요하다. 즉 사람이 손으로
# 받아 돌려야 하고, **잊으면 조용히 낡는다** — 낡은 폐업 정보는 문 닫은 가게를 계속
# 추천한다(빨간불도 안 나므로 아무도 모른다).
#
# 그래서 이 워크플로는 수집을 하지 않는다. 월 1회 파일의 generated_at 만 보고, 기준일수
# (vars.BIZ_STATUS_MAX_AGE_DAYS, 기본 60일)를 넘겼으면 **GitHub 이슈**로 알린다 —
# 이슈여야 담당자에게 이메일이 가고, 갱신 절차를 본문에 담아 그대로 따라 할 수 있다.
# 신선하면 아무것도 하지 않는다(조용한 성공 — 매달 알림이 오면 아무도 안 읽는다).
name: ai-business-status-reminder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'   # UTC 매월 1일 00:00 = KST 1일 09:00

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      issues: write    # 리마인더 이슈 생성·코멘트 (잡 단위 최소 부여)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop   # 판정 대상 데이터는 develop (main의 ai/는 구버전)
      - name: 신선도 판정 (generated_at 이 기준일수를 넘겼는가)
        id: age
        env:
          MAX_AGE: ${{ vars.BIZ_STATUS_MAX_AGE_DAYS || '60' }}
        # 파일이 아직 없을 수 있다(다른 브랜치에서 작업 중) — 그건 실패가 아니다.
        # generated_at 이 없거나 파싱이 안 되면 **낡은 것으로 친다**: 나이를 모르는 것과
        # 신선한 것을 같게 취급하면 이 워크플로가 막으려던 조용한 노후가 그대로 재현된다.
        run: |
          F=ai/data/poi_business_status.json
          if [ ! -f "$F" ]; then
            echo "::notice::$F 없음 — 아직 생성 전이다. 확인 생략(성공 종료)."
            exit 0
          fi
          GEN=$(jq -r '.generated_at // empty' "$F")
          TS=""
          # 빈 값은 date 에 넘기지 않는다 — `date -d ""` 가 오늘로 해석되면 깨진 파일이
          # 신선으로 둔갑한다(이 워크플로가 막으려는 바로 그 상태).
          if [ -n "$GEN" ]; then TS=$(date -d "$GEN" +%s 2>/dev/null || true); fi
          if [ -z "$TS" ]; then
            STALE=true
            AGE_TXT="알 수 없음 — generated_at 이 없거나 읽을 수 없다(값: '${GEN}')"
          else
            AGE=$(( ($(date +%s) - TS) / 86400 ))
            AGE_TXT="${AGE}일 전"
            [ "$AGE" -gt "$MAX_AGE" ] && STALE=true || STALE=false
          fi
          echo "::notice::generated_at=${GEN} (${AGE_TXT}), 기준 ${MAX_AGE}일 → stale=${STALE}"
          {
            echo "stale=$STALE"
            echo "generated_at=$GEN"
            echo "age_txt=$AGE_TXT"
          } >> "$GITHUB_OUTPUT"
      - name: 갱신 리마인더 이슈 (같은 이슈가 열려 있으면 코멘트로만)
        if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[정기] POI 영업상태 데이터(poi_business_status.json) 갱신 필요'
          GEN: ${{ steps.age.outputs.generated_at }}
          AGE_TXT: ${{ steps.age.outputs.age_txt }}
          MAX_AGE: ${{ vars.BIZ_STATUS_MAX_AGE_DAYS || '60' }}
        # 제목 고정 문자열로 열린 이슈를 찾는다 — 매달 새 이슈를 열면 도배가 되고,
        # 도배된 알림은 읽히지 않는다. 검색 API(--search) 대신 목록을 받아 정확히
        # 비교하는 이유는 색인 지연이 없어 결정적이기 때문.
        run: |
          {
            printf '`ai/data/poi_business_status.json` 이 낡았다 — generated_at `%s` (%s), 기준 %s일.\n\n' \
              "$GEN" "$AGE_TXT" "$MAX_AGE"
            cat <<'EOF'
          폐업 정보가 낡으면 **문 닫은 가게를 계속 추천한다.** 원본이 로그인·차단으로 자동화가
          안 돼서(공공데이터포털 862MB CSV 2개) 사람이 손으로 갱신해야 한다.

          ## 갱신 절차

          1. 공공데이터포털에서 CSV 2개를 내려받는다 (로그인 필요):
             - 전국일반음식점표준데이터 — https://www.data.go.kr/data/15096283/standard.do
             - 행정안전부_휴게음식점 — https://www.data.go.kr/data/15006730/fileData.do
          2. 두 CSV 를 한 디렉토리에 두고 `ai/` 에서 매칭 스크립트를 돌린다:
             ```bash
             cd ai
             LOCALDATA_DIR=<CSV 받은 경로> uv run python scripts/match_business_status.py
             ```
          3. 갱신된 `ai/data/poi_business_status.json` 만 커밋해 PR 로 올린다 (base: `develop`).

          ## 주의

          - **원본 CSV 는 커밋하지 말 것** — 합쳐서 862MB 다. 리포에 들어가면 되돌리기 어렵다.
          - 갱신 후 이 이슈를 닫는다. 다음 달 점검에서 다시 낡았으면 새 이슈가 열린다.
          - 기준일수는 repo Variable `BIZ_STATUS_MAX_AGE_DAYS` 로 조정한다 (미설정 시 60일).
          EOF
          } > /tmp/reminder-body.md
          # 열린 이슈 100건까지만 훑는다 — 그 이상 쌓인 리포면 도배 방지보다 큰 문제가 있다.
          N=$(gh issue list --state open --limit 100 --json number,title \
                --jq 'map(select(.title == $ENV.TITLE)) | .[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body-file /tmp/reminder-body.md
            echo "::notice::기존 이슈 #${N} 에 코멘트로 갱신했다."
          else
            gh issue create --title "$TITLE" --body-file /tmp/reminder-body.md
          fi
