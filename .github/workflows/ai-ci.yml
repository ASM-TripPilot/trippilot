name: ai-ci

on:
  push:
    branches: [develop]
    paths: ['ai/**', '.github/workflows/ai-ci.yml']
  pull_request:
    branches: [develop]
    paths: ['ai/**', '.github/workflows/ai-ci.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trippilot-ai

jobs:
  # U1+ 테스트 게이트 — PBT 52개(불변식·직렬화 왕복·결정론·아키텍처 순수성).
  # 전부 fake 기반: 실 LLM·외부 API 호출 0 (D37). 실패 시 image 잡이 돌지 않는다(블로킹).
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  image:
    needs: test   # 테스트 통과해야만 이미지 빌드·발행 (블로킹 게이트)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3   # gha 캐시 export 위해 docker-container 드라이버 필요
      # publish 는 develop push 에서만. PR 은 빌드 검증만.
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./ai
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
