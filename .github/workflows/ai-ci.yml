name: ai-ci

on:
  push:
    branches: [develop]
    paths: ['ai/**', '.github/workflows/ai-ci.yml']
  pull_request:
    branches: [develop]
    paths: ['ai/**', '.github/workflows/ai-ci.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trippilot-ai

jobs:
  # U1+ 테스트 게이트 — PBT 52개(불변식·직렬화 왕복·결정론·아키텍처 순수성).
  # 전부 fake 기반: 실 LLM·외부 API 호출 0 (D37). 실패 시 image 잡이 돌지 않는다(블로킹).
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  image:
    needs: test   # 테스트 통과해야만 이미지 빌드·발행 (블로킹 게이트)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3   # gha 캐시 export 위해 docker-container 드라이버 필요
      # publish 는 develop push 에서만. PR 은 빌드 검증만.
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./ai
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # push 와 load 는 동시 불가라 단계를 나눈다 — 위 단계의 gha 캐시를 그대로 재사용해 수 초면 끝.
      - name: 스모크용 이미지 로드 (gha 캐시 재사용)
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          load: true
          tags: trippilot-ai-smoke:ci
          cache-from: type=gha
      # 빌드 성공 ≠ 기동 성공 — Dockerfile이 main.py만 복사해 컨테이너가 즉사한 사고(TRIP-239)의 재발 방지.
      - name: 컨테이너 기동 검증 — 빌드 성공 ≠ 기동 성공 (TRIP-239에서 실제 겪은 사고)
        run: |
          docker run -d --rm --name ai-smoke -p 8000:8000 trippilot-ai-smoke:ci
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health | grep -q '"UP"'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo '::error::컨테이너가 기동하지 않거나 /health가 응답하지 않음'
            docker logs ai-smoke || true
            exit 1
          fi
          docker stop ai-smoke
