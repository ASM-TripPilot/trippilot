# KB-5 장소 웹 확인 사실 수집 — 문서 없는 장소를 벤더 웹 검색 근거로(2026-10-30, KB-5 대체 문서 #1707 의 웹 사실 칸)
#
# 유료다. 한 곳 = 검색 1회(0.01달러) + 검색 결과 본문이 든 입력 ≈1.7만 토큰 — sonnet-5-5 곳당 ≈0.046달러(입력이 74%,
# 키·시크릿 세션 10-30 실측), haiku-5-5 는 토큰 단가가 1/20 이라 ≈0.012달러(검색 수수료가 대부분 — 2026-10-30 공식 가격표로 셈).
# 사용자 결정은 "충전되는 200달러 크레딧 안에서만". 그래서 키는 운영과 **다른 워크스페이스**(trippilot-collect, 월 한도 하드 캡)의
# `ANTHROPIC_COLLECT_API_KEY` 만 쓴다 — 운영 키와 크레딧을 나누면 수집 버그 한 번에 운영이 멈춘다(10-14 사고).
# 코드 쪽 상한(`--budget-usd`)은 두 번째 방어선이다.
#
# 공개 리포라 지출 권한 있는 시크릿을 PR 코드가 읽지 못하게 **workflow_dispatch 만** 둔다(pull_request 금지).
# 규모를 정하기 전에는 schedule 도 두지 않는다. 첫 실행은 **시험**(pilot, 기본값) — 네 갈래(sonnet·haiku × 기본 검색·동적 필터링)가
# 아직 안 물은 같은 N곳을 물어 곳당 실비·찾은 비율·문서가 된 비율을 나란히 잰다. 시험 뒤 이긴 갈래를 기본값으로 바꾼다.
#
# 누적 상태는 `web-facts-state` 전용 브랜치(orphan 커밋 하나)에 둔다 — ai-overview-collect 와 같은 패턴. 실행 시작에 복원,
# 끝에 갱신. 복원이 실패하면 멈춘다(빈 상태로 덮어쓰지 않게). 결과 문서(place_web_facts.jsonl.gz)는 artifact 로 남기고,
# develop 반영은 사람이 PR 로 한다.
name: ai-web-facts-collect

on:
  workflow_dispatch:
    inputs:
      pilot:
        description: '시험 — 네 갈래가 같은 N곳을 물어 나란히 잰다(아래 model·search_tool 은 무시)'
        required: false
        default: true
        type: boolean
      max_places:
        description: '이번 실행에서 물을 장소 수 상한 (시험이면 갈래마다)'
        required: false
        default: '20'
        type: string
      budget_usd:
        description: '지출 상한(달러, 시험이면 갈래마다) — 닿으면 멈춘다'
        required: false
        default: '2'
        type: string
      rpm:
        description: '분당 요청 시작 수 상한'
        required: false
        default: '6'
        type: string
      model:
        description: '모델 (시험이 아닐 때)'
        required: false
        default: claude-sonnet-5-5
        type: choice
        options: [claude-sonnet-5-5, claude-haiku-5-5]
      search_tool:
        description: '검색 도구 판 (시험이 아닐 때) — 20260318 은 동적 필터링'
        required: false
        default: web_search_20250305
        type: choice
        options: [web_search_20250305, web_search_20260318]

permissions:
  contents: read

concurrency: ai-web-facts-collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write   # web-facts-state 브랜치 push (잡 단위 최소 부여)
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 누적 상태 복원
        id: restore
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/state"
          rc=0; git ls-remote --exit-code --heads origin web-facts-state >/dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "web-facts-state 브랜치 없음 — 처음부터 시작"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::상태 브랜치 조회 실패(rc=$rc) — 빈 상태로 덮어쓰지 않게 멈춘다"; exit 1
          else
            git fetch origin web-facts-state --depth=1
            for f in $(git ls-tree --name-only FETCH_HEAD); do git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/state/$f"; done
            echo "복원: $(cat "$RUNNER_TEMP"/state/*.jsonl 2>/dev/null | wc -l) 줄"
          fi

      - name: 웹 확인 수집
        working-directory: ai
        env:
          WEB_FACTS_VENDOR: claude
          WEB_FACTS_API_KEY: ${{ secrets.ANTHROPIC_COLLECT_API_KEY }}
          # 입력은 env 로만 — run 본문에 `${{ inputs.* }}` 를 바로 넣으면 셸 주입 경로가 된다
          PILOT: ${{ inputs.pilot }}
          MODEL: ${{ inputs.model }}
          SEARCH_TOOL: ${{ inputs.search_tool }}
          MAX_PLACES: ${{ inputs.max_places }}
          BUDGET_USD: ${{ inputs.budget_usd }}
          RPM: ${{ inputs.rpm }}
        run: |
          set -o pipefail
          [ -n "$WEB_FACTS_API_KEY" ] || { echo "::error::ANTHROPIC_COLLECT_API_KEY 미등록 — 수집 전용 워크스페이스 키가 필요하다"; exit 1; }
          collect() {  # $1 모델 · $2 검색 판 · $3 상태 파일(그 폴더의 jsonl 전부가 '이미 받은 곳')
            WEB_FACTS_MODEL="$1" WEB_FACTS_SEARCH_TOOL="$2" uv run python scripts/collect/collect_place_web_facts.py run --state "$3" \
              --max "$MAX_PLACES" --budget-usd "$BUDGET_USD" --rpm "$RPM" --workers 2 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if [ "$PILOT" = "true" ]; then
            # 갈래마다 복원본의 사본만 '이미 받은 곳'으로 본다 — 앞 갈래가 받은 곳을 뒤 갈래가 건너뛰면 같은 곳을 비교하지 못한다
            base="$RUNNER_TEMP/base"; mkdir -p "$base" && cp "$RUNNER_TEMP"/state/*.jsonl "$base/" 2>/dev/null || true
            for arm in claude-sonnet-5-5:web_search_20250305 claude-sonnet-5-5:web_search_20260318 \
                       claude-haiku-5-5:web_search_20250305 claude-haiku-5-5:web_search_20260318; do
              model="${arm%%:*}"; tool="${arm#*:}"; name="pilot-${model#claude-}-${tool#web_search_}-$GITHUB_RUN_ID"
              dir="$RUNNER_TEMP/arms/$name"; mkdir -p "$dir/own" && cp "$base"/*.jsonl "$dir/" 2>/dev/null || true
              echo "### $model · $tool" >> "$GITHUB_STEP_SUMMARY"
              collect "$model" "$tool" "$dir/$name.jsonl" || echo "::warning::$name 갈래 실패 — 다음 갈래로"
              [ -f "$dir/$name.jsonl" ] || continue
              cp "$dir/$name.jsonl" "$dir/own/"
              uv run python scripts/collect/collect_place_web_facts.py build --state "$dir/own" \
                --out "$RUNNER_TEMP/arms/$name.jsonl.gz" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            done
            for own in "$RUNNER_TEMP"/arms/*/own/*.jsonl; do [ -f "$own" ] && cp "$own" "$RUNNER_TEMP/state/"; done  # 산 답은 남긴다
            python3 - "$RUNNER_TEMP/arms" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import gzip, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          print("\n| 갈래 | 유료 조회 | 지출 $ | 곳당 $ | 찾음 | 문서 | 문서당 $ | 입력 평균 | 출력 평균 | 검색 평균 | 오류 |")
          print("|---|---|---|---|---|---|---|---|---|---|---|")
          for own in sorted(root.glob("*/own/*.jsonl")):
              rows = [json.loads(l) for l in own.read_text().splitlines() if l.strip()]
              paid = [r for r in rows if r.get("cost") is not None]
              spent, tokens = sum(r["cost"] for r in paid), [r["tokens"] for r in paid if r.get("tokens")]
              built = root / f"{own.stem}.jsonl.gz"
              docs = sum(1 for _ in gzip.open(built, "rt")) if built.exists() else 0
              avg = lambda xs: sum(xs) / max(len(xs), 1)
              print(f"| {own.stem.removeprefix('pilot-').rsplit('-', 1)[0]} | {len(paid)} | {spent:.3f} | {spent / max(len(paid), 1):.4f} "
                    f"| {sum(r.get('status') == 'found' for r in rows)} | {docs} | {spent / max(docs, 1):.4f} "
                    f"| {avg([t[0] for t in tokens]):.0f} | {avg([t[1] for t in tokens]):.0f} | {avg([r.get('searches', 0) for r in paid]):.2f} "
                    f"| {sum(r.get('status') == 'error' for r in rows)} |")
          PY
          else
            collect "$MODEL" "$SEARCH_TOOL" "$RUNNER_TEMP/state/state.jsonl"
            uv run python scripts/collect/collect_place_web_facts.py build --state "$RUNNER_TEMP/state" \
              --out "$RUNNER_TEMP/place_web_facts.jsonl.gz" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python3 - "$RUNNER_TEMP/state" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys, pathlib
          rows = [json.loads(l) for f in pathlib.Path(sys.argv[1]).glob("*.jsonl") for l in f.read_text().splitlines() if l.strip()]
          paid = [r for r in rows if r.get("cost") is not None]
          spent = sum(r["cost"] for r in paid)
          found = sum(r.get("status") == "found" for r in paid)
          print(f"\n누적 지출(기록된 셈) {spent:.2f} 달러 · 유료 조회 {len(paid)}곳 · 찾음 {found} · 곳당 {spent / max(len(paid), 1):.4f} 달러")
          PY

      - name: 누적 상태 갱신
        if: always() && steps.restore.outcome == 'success'
        run: |
          set -o pipefail
          ls "$RUNNER_TEMP"/state/*.jsonl >/dev/null 2>&1 || { echo "상태 없음 — 건너뜀"; exit 0; }
          (
            cd "$(mktemp -d)"
            git init -q . && git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp "$RUNNER_TEMP"/state/*.jsonl .
            git add ./*.jsonl
            git commit -q -m "chore(kb5): 웹 확인 사실 수집 상태 ($(date -u +%Y-%m-%d))"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/web-facts-state
          ) || echo "::warning::상태 push 실패 — artifact 로는 남았다"

      - name: 결과 보존
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: place-web-facts
          path: |
            ${{ runner.temp }}/place_web_facts.jsonl.gz
            ${{ runner.temp }}/state/*.jsonl
            ${{ runner.temp }}/arms/*.jsonl.gz
          if-no-files-found: warn
          retention-days: 30
