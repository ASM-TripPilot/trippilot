# v0.4 — **사람 검수 완료** (2026-09-13). 121문장을 의도별로 전수 확인해 `reviewed: true` 로 전환했다.
#   이제 실 DB 편입이 가능하다 (ai/data/README.md 검수 절차).
#
#   검수에서 나온 이동 4건 (entry_id 는 로더와 같은 0-based, v0.3 기준):
#     GET_NEXT_SLOT#01·#05·#06 → SHOW_SCHEDULE  ("다음 한 곳"이 아니라 그 이후를 통째로 묻는 말)
#     GENERATE_SCHEDULE#07     → REGENERATE      ("새" 를 "새로 다시" 로 읽는 판정)
#   빠진 문장 0건. GET_NEXT_SLOT 이 6문장으로 줄어 4문장 보강 — 후보 8개를 심사해
#   평가셋 leak(≥0.90) 1건과 저margin 3건을 기각한 나머지다(같은의도 최근접 − 다른의도 최근접 ≥ +0.07).
#
#   앞선 기계 검수 1차(TRIP-678, 2026-09-08): 의도 간 ≥0.90 위반 0 · 경계 문장 3개 개작
#   (EDIT_SCHEDULE#00 · SHOW_SCHEDULE#07 · GENERATE_REFLECTION#01).
#   평가셋(intent_eval_set.yaml)을 근거로 뱅크를 보강하지 않는다 — §6 게이트가 무력화된다.
#
# - 의도 라벨: orchestrator-delegation-design.md §5 라우팅 테이블의 closed-set 13종
#   (CONFIRM/CANCEL/UNDO는 버튼형 상태 전이라 질문뱅크 대상에서 제외 — §3.2의 "13종"과 일치)
# **v0.5 (2026-09-14) — §3.2 ② 증강 292문장 추가, 총 417문장.** seed 125 는 그대로 두고 의도마다
#   `augmented:` 목록을 따로 둔다(로더가 `origin: augmented` 로 싣는다) — 수기와 LLM 생성분을
#   한 목록에 섞으면 뱅크가 "전부 사람이 쓴 문장" 이라고 거짓말하고, 증강분만 되돌릴 수단도 없다.
#   생성·관문·제안 파일은 `scripts/augment_bank.py` 와 `data/intent_bank_augment_20260914.yaml`.
#   **사람 검수는 예외만** — 관문 5종을 통과하고 margin ≥ 0.05 인 것은 자동 채택했다(팀 결정
#   2026-09-14, §3.2 ② "생성 후 사람 검수 필수" 의 운용 변경). 관문에 걸린 33건은 검수 대기다.
#
# **v0.6 (2026-09-15) — 검수 대기분 33문장 편입, 총 450문장.** v0.5 에서 관문이 판단을 보류한
#   (margin < 0.05) 33건을 사람이 전수 판정했다 — 채택 32 · 이동 1 · 기각 0.
#   이동 1건: "{장소} 방문 계획을 삭제해 주세요" EDIT_SCHEDULE → REGENERATE.
#   "그 장소만 빼라"인지 "계획을 지우라"인지 문장만으로는 안 갈린다는 판단이다.
#   기각이 0인 것은 관문이 이미 명백한 것을 걸러 냈다는 뜻이다 — 사람에게 올라온 33건은
#   전부 "맞는 문장인데 경계에 가깝다" 였다. 예외 검수 방식이 작동한 증거로 기록해 둔다.
#
# - seed 는 의도당 9~12문장(총 125). 증강 포함 의도당 28~40문장.
# - 특정 지역명·POI명은 슬롯 자리로 일반화: {장소} {지역} {날짜} {기간}
# - 검수·편입 절차와 평가셋 분리 원칙은 ai/data/README.md 참조.

