# 의도 라우터 평가셋 v0.1-draft (intent-matching-design §6, TRIP-678)
#
# - 뱅크(intent_question_bank.yaml)와 **완전 분리** — 뱅크 문장·그 변형을 재사용하지 않는다(leak 금지).
#   러너(`scripts/trace_intents.py --eval`)가 실행 시 뱅크와 임베딩 유사도 ≥ 0.90 인 항목을 leak 로 보고한다.
# - 라벨은 작성자 판단(2026-09-08) — **사람 검수 전**. 경계 3종(EDIT/REPLAN/GENERATE)과 회고↔요약,
#   실 지역명·POI 명 포함 발화(뱅크의 {지역}/{장소} 자리표시자 효과 측정), 범위 밖 10건을 일부러 넣었다.
# - OUT_OF_SCOPE 의 정답 = 라우터가 폴백(FALLBACK)으로 거절하는 것.
# - 사람 검수 시 라벨 재검토 후보: "이번 여행 회고 좀 만들어줘"(GENERATE_REFLECTION 로 뒀으나 여행 단위
#   회고는 TRIP_SUMMARY 와 경계 — 2026-09-08 실측에서 유일한 오답, 득표율 0.754 로 두 의도 근접).
# - 사용법: LLM_PROVIDER=mixed uv run --env-file ../.env python scripts/trace_intents.py --eval data/intent_eval_set.yaml
version: "0.1-draft"
reviewed: false
cases:
  - intent: GENERATE_SCHEDULE
    utterances:
      - "부산 가서 이틀 자고 오는데 어디어디 돌면 좋을지 짜줘"
      - "다음 달 초에 속초 가는데 코스 좀 짜 줄래"
      - "전주 당일치기 코스 추천해줄 수 있어?"
      - "강릉 쪽으로 하룻밤 자는 여행 가려는데 어떻게 돌면 좋을까"
      - "부모님 모시고 경주 3일 가는데 무리 없게 계획 세워줘"
      - "내가 찜해둔 데들 묶어서 여행 계획 좀 만들어봐"
  - intent: REGENERATE
    utterances:
      - "이건 아닌 것 같아, 아예 새 일정으로 가자"
      - "전부 갈아엎고 새로 부탁해"
      - "지금 짜준 거 별로야, 다른 버전으로 다시 줘"
      - "일정 초기화하고 새로 뽑아볼래?"
      - "이번엔 느긋한 스타일로 전체를 다시 짜줘"
      - "싹 다 다시 만들어줘"
  - intent: REPLAN
    utterances:
      - "비 와서 오늘 일정 못 하겠어, 다시 조정해줘"
      - "가려던 데가 오늘 휴무래, 일정 좀 손봐줘"
      - "한 시간 넘게 지체됐어, 남은 오후 일정 다시 맞춰줘"
      - "태풍 온다는데 내일 야외 일정 어떻게 좀 해줘"
      - "애가 아파서 오늘은 짧게 가야 해, 남은 계획 줄여줘"
      - "지하철이 멈췄대, 지금부터 일정 다시 잡아줄래"
  - intent: SUGGEST_ALTERNATIVE
    utterances:
      - "여기 말고 근처에 갈 만한 다른 데 있어?"
      - "지금 갈 곳 대신 실내에서 할 만한 거 추천해줘"
      - "이 카페 줄이 너무 길어, 비슷한 데 다른 곳 없을까"
      - "여긴 공사 중이래, 대신 갈 곳 하나 골라줘"
      - "다음 장소 대체할 만한 데 알려줄래?"
      - "이 박물관 대신 갈 만한 곳 있으면 하나만"
  - intent: GENERATE_REFLECTION
    utterances:
      - "이번 여행 회고 좀 만들어줘"
      - "여행 끝났는데 기록으로 남기고 싶어"
      - "오늘 다녀온 데들로 짧은 일기 하나 써줘"
      - "하루 마무리로 오늘을 되돌아보는 글 부탁해"
      - "카메라롤에 있는 오늘 사진들 보고 소감 하나 적어줘"
      - "오늘 어땠는지 회고 카드 만들어줘"
  - intent: TRIP_SUMMARY
    utterances:
      - "여행 마치고 나니 전체 흐름이 궁금해, 정리 부탁"
      - "지난 제주 여행 요약본 보여줘"
      - "3박 4일 동안 뭐 했는지 한 장으로 요약해줘"
      - "이번 여행 전체 통계 같은 거 보여줄 수 있어?"
      - "여행 끝났으니 전체 정리 리포트 뽑아줘"
      - "우리 이번에 총 몇 군데 갔어?"
  - intent: STYLE_ANALYSIS
    utterances:
      - "내 여행 데이터로 보면 나는 어떤 사람이야?"
      - "나는 어떤 타입의 여행자야?"
      - "지금까지 다닌 거 보면 나 뭘 좋아하는 것 같아?"
      - "내가 자연파야 도시파야?"
      - "내 여행 취향 정리해서 알려줘"
      - "이런 곳들만 가는 걸 보면 나 무슨 성향이지?"
  - intent: EDIT_SCHEDULE
    utterances:
      - "둘째 날 오후에 서점 들르는 거 넣어줘"
      - "일정에서 박물관은 빼 줘"
      - "마지막 날 순서를 거꾸로 바꿔줄래"
      - "저녁 식사 시간을 7시로 미뤄줘"
      - "첫날 마지막 코스를 둘째 날 아침으로 옮겨줘"
      - "이 카페 대신 아까 본 빵집으로 바꿔 넣어줘"
  - intent: GET_NEXT_SLOT
    utterances:
      - "이거 끝나고 어디 가기로 했더라"
      - "우리 이제 어디로 가면 돼?"
      - "이거 끝나고 바로 어디로 가?"
      - "다음 스팟 이름 뭐였지"
      - "이 다음엔 뭐 하기로 했어?"
      - "다음 일정 언제 출발이야?"
  - intent: SHOW_SCHEDULE
    utterances:
      - "내일 우리 뭐 하기로 했더라?"
      - "지금까지 잡혀 있는 계획 쭉 보여줄래"
      - "모레 계획 좀 보여줄래"
      - "오늘 남은 일정 뭐뭐 있어?"
      - "우리 여행 타임테이블 좀 볼 수 있을까"
      - "셋째 날 일정 확인 좀"
  - intent: GET_WEATHER
    utterances:
      - "내일 경주 날씨 어때?"
      - "오후에 비 온대?"
      - "모레 강릉 춥대?"
      - "이번 주 토요일 비 예보 있어?"
      - "지금 밖에 바람 많이 불어?"
      - "내일 미세먼지 어떻대?"
  - intent: GET_DISTANCE
    utterances:
      - "남은 목적지들 사이 거리가 각각 얼마나 돼?"
      - "숙소에서 거기까지 거리 알려줘"
      - "해운대에서 광안리까지 몇 킬로야?"
      - "여기서 다음 코스 걸어갈 만해?"
      - "첫 번째 장소랑 두 번째 장소 얼마나 떨어져 있어?"
      - "공항에서 호텔까지 거리 어느 정도야"
  - intent: GET_POI_INFO
    utterances:
      - "성산일출봉 몇 시까지 열어?"
      - "그 식당은 뭐가 유명해?"
      - "국립중앙박물관 월요일에 쉬어?"
      - "이 미술관 들어가려면 돈 내야 해?"
      - "이 카페 주차 가능해?"
      - "광장시장 어떤 데야?"
  - intent: OUT_OF_SCOPE
    utterances:
      - "오늘 저녁 뭐 먹지"
      - "요즘 주식 시장 어때?"
      - "노래 하나 틀어줘"
      - "호텔 예약 취소해줘"
      - "환전은 어디서 하는 게 좋아?"
      - "내 비밀번호 바꿔줘"
      - "심심한데 농담 하나 해봐"
      - "오늘 몇 월 며칠이야?"
      - "결제 카드 등록하고 싶어"
      - "사진 보정 좀 해줘"
