# 도구 계획(DIALOGUE_PLAN) 측정셋(판본은 아래 version 칸) — `scripts/measure/measure_prompt_ab.py plan` 이 읽는다(CI 밖 수동 실측 전용).
# 정본: assistant-orchestrator FD BR-AO-28 · 사양 §11.3. 분류가 "정해진 의도 없음"으로 닫은 말에 계획기가 고를 도구를 잰다.
#
# 고정 스냅샷(러너가 만든다): 제주 2일 — 1일차 성산일출봉·올레국수, 2일차 우도·해녀의집·카페 모카. 지금 = 2일차 10:00, 이력 없음.
# 묶음: TOOL1 도구 1 · TOOL2 도구 2 · NO_TOOL 도구 없음(calls=[]) · INJECTION 주입·유해(0′ 거름을 통과하는 꼴만 — 실행 확인)
# 칸:
#   tools        기대 도구 이름(순서 무관, 같은 이름이 두 번이면 두 호출) — 완전 일치는 고른 도구 집합이 이것과 같을 때,
#                허용 일치는 이것이 고른 도구에 다 들어 있을 때(하나 더 고른 것은 허용)
#   keys         도구별 인자 키의 정답 — 키 정밀도는 고른 키 중 여기 있는 비율. 빈 목록 = 키를 정하지 않는다(카테고리와 주제 둘 다 맞다)
#   gap / alt_gaps   NO_TOOL 의 gap 정답과 허용값(일치는 기록만, 문턱 아님)
#   forbid       부르면 실패인 도구(v0.3 현재 해당 사례 없음 — 말한 지역 날씨는 #1475 부터 도구다)
#
# **누설 금지**: 평가셋(intent_eval_set.yaml)·질문뱅크·증강·`measure_prompt_ab.py` 사례·두 도우미 프롬프트 예시와 문장이 겹치지
# 않는다(테스트가 대조한다 — tests/llm_gateway/test_dialogue_plan_worker.py). 우산·환율·비밀번호·"몇 도"는 뱅크와 겹쳐 뺐다.
version: "0.6"  # 0.6 (2026-10-23): 여행 일반 지식을 도구로 대신하지 않는다(P3-11~16, gap KNOWLEDGE · forbid 는 0.1.6 이 고른 도구) · 0.5 (2026-10-22): 행사가 열리는지·언제인지는 탐색 도구로(P3-06, 종전 NO_TOOL EVENTS) · 0.2 (2026-10-20): 일정 밖 등록 장소 영업시간을 도구 1로(P1-13), PLACE_DETAIL 은 메뉴(P3-10) · 0.3 (2026-10-21): 말한 지역 날씨를 도구 1로(P1-14, 종전 P3-09 NO_TOOL) · 0.4 (2026-10-21): 몇 곳만 골라 달라는 말을 추천 도구로(P1-15·16)
cases:
  # ── TOOL1 ─────────────────────────────────────────────────────────────
  - {id: P1-01, group: TOOL1, utterance: "성수 쪽에 분위기 좋은 바 있어?", tools: [EXPLORE_PLACES], keys: {EXPLORE_PLACES: [region, theme]}}
  - {id: P1-02, group: TOOL1, utterance: "애월에 바다 보이는 카페 알려줄래", tools: [EXPLORE_PLACES], keys: {EXPLORE_PLACES: [region, category, theme]}}
  - {id: P1-03, group: TOOL1, utterance: "경주에서 반나절 보낼 만한 데", tools: [EXPLORE_PLACES], keys: {EXPLORE_PLACES: [region]}}
  - {id: P1-04, group: TOOL1, utterance: "아이랑 가기 좋은 곳 있을까", tools: [EXPLORE_PLACES], keys: {EXPLORE_PLACES: [theme]}}
  - {id: P1-05, group: TOOL1, utterance: "기념품 살 만한 데", tools: [EXPLORE_PLACES], keys: {EXPLORE_PLACES: []}}
  - {id: P1-06, group: TOOL1, utterance: "밤에 갈 만한 야경 명소", tools: [EXPLORE_PLACES], keys: {EXPLORE_PLACES: []}}
  - {id: P1-07, group: TOOL1, utterance: "둘째 날 일정 좀 정리해 줘", tools: [SHOW_SCHEDULE], keys: {SHOW_SCHEDULE: [day]}}
  - {id: P1-08, group: TOOL1, utterance: "이따 어디 가기로 했더라", tools: [GET_NEXT_SLOT], keys: {GET_NEXT_SLOT: []}}
  - {id: P1-09, group: TOOL1, utterance: "해녀의집 오늘 문 열어?", tools: [GET_POI_INFO], keys: {GET_POI_INFO: [place]}}
  - {id: P1-10, group: TOOL1, utterance: "우도에서 해녀의집까지 멀어?", tools: [GET_DISTANCE], keys: {GET_DISTANCE: [destination, origin]}}
  - {id: P1-11, group: TOOL1, utterance: "오늘 오후에 비 와?", tools: [GET_WEATHER], keys: {GET_WEATHER: [date]}}
  - {id: P1-12, group: TOOL1, utterance: "카페 모카 말고 비슷한 데", tools: [SUGGEST_ALTERNATIVE], keys: {SUGGEST_ALTERNATIVE: [target]}}
  # 일정 밖 등록 장소 — #1466 부터 장소 정보 도구가 정확한 이름으로 찾는다(v0.2: 종전 P3-10 "롯데월드…" NO_TOOL·forbid 를 대신한다.
  # 이름이 정확히 「롯데월드」인 등록 장소는 없다(뒤에 말이 붙은 이름만 있다) — 계획기가 별칭으로 보고 gap 을 골랐다, 등록 이름 그대로인 곳으로 잰다)
  - {id: P1-13, group: TOOL1, utterance: "창덕궁 몇 시에 닫아?", tools: [GET_POI_INFO], keys: {GET_POI_INFO: [place]}}
  # 말한 지역 날씨 — #1475 부터 날씨 도구가 region 을 받는다(v0.3: 종전 P3-09 NO_TOOL·forbid 를 대신한다). 여행지는 제주라 region 이 있어야 맞다
  - {id: P1-14, group: TOOL1, utterance: "서울 날씨는 어때", tools: [GET_WEATHER], keys: {GET_WEATHER: [region]}}
  # 몇 곳만 골라 달라 — 장소 추천 도구(v0.4). 개수·"제일"이 없는 "…추천" 은 위 탐색 사례처럼 EXPLORE_PLACES 로 남는다
  - {id: P1-15, group: TOOL1, utterance: "전주 한옥마을 근처 찻집 딱 한 군데만", tools: [RECOMMEND_PLACES], keys: {RECOMMEND_PLACES: [region, count]}}
  - {id: P1-16, group: TOOL1, utterance: "속초에서 제일 괜찮은 횟집 두 곳 골라 줄래", tools: [RECOMMEND_PLACES], keys: {RECOMMEND_PLACES: [region, count]}}
  # ── TOOL2 ─────────────────────────────────────────────────────────────
  - {id: P2-01, group: TOOL2, utterance: "오늘 오후에 비 오면 박물관 같은 데 가고 싶어", tools: [GET_WEATHER, EXPLORE_PLACES], keys: {GET_WEATHER: [date], EXPLORE_PLACES: []}}
  - {id: P2-02, group: TOOL2, utterance: "다음 일정 어디고 그 근처 맛집도", tools: [GET_NEXT_SLOT, EXPLORE_PLACES], keys: {GET_NEXT_SLOT: [], EXPLORE_PLACES: [category]}}
  - {id: P2-03, group: TOOL2, utterance: "카페 모카 대신 갈 데랑 오늘 날씨", tools: [SUGGEST_ALTERNATIVE, GET_WEATHER], keys: {SUGGEST_ALTERNATIVE: [target], GET_WEATHER: [date]}}
  - {id: P2-04, group: TOOL2, utterance: "오늘 남은 일정이랑 비 올 확률 같이", tools: [SHOW_SCHEDULE, GET_WEATHER], keys: {SHOW_SCHEDULE: [scope], GET_WEATHER: [date]}}
  - {id: P2-05, group: TOOL2, utterance: "해운대랑 광안리 야경 둘 다 보고 싶어", tools: [EXPLORE_PLACES, EXPLORE_PLACES], keys: {EXPLORE_PLACES: [region, theme, category]}}
  - {id: P2-06, group: TOOL2, utterance: "우도 몇 시까지 하는지랑 거기까지 거리", tools: [GET_POI_INFO, GET_DISTANCE], keys: {GET_POI_INFO: [place], GET_DISTANCE: [destination]}}
  - {id: P2-07, group: TOOL2, utterance: "날씨 안 좋으면 성산일출봉 대신 갈 곳", tools: [GET_WEATHER, SUGGEST_ALTERNATIVE], keys: {GET_WEATHER: [], SUGGEST_ALTERNATIVE: [target]}}
  - {id: P2-08, group: TOOL2, utterance: "저녁 먹을 데랑 그 다음 일정", tools: [EXPLORE_PLACES, GET_NEXT_SLOT], keys: {EXPLORE_PLACES: [category], GET_NEXT_SLOT: []}}
  # ── NO_TOOL ───────────────────────────────────────────────────────────
  - {id: P3-01, group: NO_TOOL, utterance: "KTX 표 좀 끊어 줘", gap: BOOKING, alt_gaps: [TRANSPORT]}
  - {id: P3-02, group: NO_TOOL, utterance: "엔화로 바꾸면 얼마쯤 돼?", gap: KNOWLEDGE}
  - {id: P3-03, group: NO_TOOL, utterance: "이 문장 일본어로 번역해 줘", gap: KNOWLEDGE}
  - {id: P3-04, group: NO_TOOL, utterance: "택시 불러 줘", gap: TRANSPORT}
  - {id: P3-05, group: NO_TOOL, utterance: "근처 약국 어디야", gap: AMENITY}
  - {id: P3-06, group: TOOL1, utterance: "이번 주말 불꽃축제 언제 해?", tools: [EXPLORE_PLACES], keys: {EXPLORE_PLACES: [theme]}}  # 0.5: 행사 저장소가 탐색에 붙었다(#1486) — gap EVENTS 에서 옮김
  - {id: P3-07, group: NO_TOOL, utterance: "알림 설정 끄는 법 알려줘", gap: ACCOUNT}
  - {id: P3-08, group: NO_TOOL, utterance: "숙소 더 싼 데 없나", gap: LODGING}
  - {id: P3-10, group: NO_TOOL, utterance: "올레국수 메뉴판 좀 보여줘", gap: PLACE_DETAIL}  # 장소 정보 도구에 메뉴가 없다(v0.2)
  # 여행 일반 지식(v0.6) — 0.1.6 까지 날씨·거리·장소 찾기 도구로 다른 질문에 답하거나 LODGING·BOOKING 범위 밖으로 닫았다(2026-10-23 측정)
  - {id: P3-11, group: NO_TOOL, utterance: "벚꽃 구경은 몇 월이 제일 예뻐?", gap: KNOWLEDGE, forbid: [GET_WEATHER]}
  - {id: P3-12, group: NO_TOOL, utterance: "내장산 단풍 보려면 언제쯤 가야 돼?", gap: KNOWLEDGE, forbid: [EXPLORE_PLACES]}
  - {id: P3-13, group: NO_TOOL, utterance: "울릉도는 차 빌려야 다닐 수 있어?", gap: KNOWLEDGE, forbid: [GET_DISTANCE]}
  - {id: P3-14, group: NO_TOOL, utterance: "눈 많이 올 때 강원도 가면 조심할 거 있어?", gap: KNOWLEDGE, forbid: [EXPLORE_PLACES]}
  - {id: P3-15, group: NO_TOOL, utterance: "속초 가면 숙소는 어느 쪽에 잡아?", gap: KNOWLEDGE}
  - {id: P3-16, group: NO_TOOL, utterance: "설악산 대청봉 오를 때 예약해야 해?", gap: KNOWLEDGE}
