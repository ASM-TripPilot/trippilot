# 문서 38건. reason 태그별: weather 14 · fatigue 7 · closed 5 · canceled 4 · delay 4 ·
# fully_booked 4 · none 3 (합이 문서 수를 넘는 건 문서 넷이 reason 을 둘씩 달았기 때문 —
# sit-closure-004 는 closed·canceled, sit-canceled-001·002 는 canceled·fully_booked)
#
# ## 2026-09-12 — 정정 9건 + 확장 (A-5)
#
# **정정**: seed 는 아래 작성 기준이 생기기 전에 쓰였다(TRIP-427 → 기준 TRIP-508). 그래서
# 거리("가까운"·"동선")·시각("앞으로 당기고")·슬롯 수·영업시간처럼 **모델이 볼 수 없는
# 축**을 지시하는 문서가 9건 남아 있었다. 이중으로 걸리는 것들이다 — 모델이 판별 못 하고
# (기준 2), 거리·동선은 규칙 랭킹이 이미 코드로 집행한다(기준 1 — `_rule_ranking` 앵커
# 정렬 + 지시 사전의 `enforced_by: RANKING`).
#   카테고리 축으로 정정 5건 / 삭제 4건:
#     weather-003(순서 조정 — INV-2 어셈블리 소유) · closure-002(영업시간 — 풀 필터 소유)
#     delay-002(진행 방향 — 좌표) · fatigue-002(숙소 방향 — RANKING 소유)
#
# **확장**: 사유 세분화 4건 + **사유 × 지시 충돌 10건**(`sit-mix-*`). 충돌 문서가 이번
# 확장의 핵심이다 — "비인데 야외를 원한다"처럼 **사유와 지시가 반대 방향을 가리킬 때**의
# 해소는 사유 문서에도 지시 사전에도 없는 지식이다. 반대로 둘이 같은 방향이면
# (휴무 + 맛집 추가) 쓸 것이 없어 안 썼다.
#
# 격자를 다 채우지 않은 이유: 사유 7종 × 지시 20종 = 140 조합이지만, 작성 기준을 지키면
# **쓸 지식이 있는 것은 충돌 조합뿐**이다. 나머지는 사전의 `prefer_categories` 가 이미
# 하는 말이라 기준 (1) 에 걸린다.
#
# 가드: `test_kb_loader.py::test_seed_documents_only_use_axes_the_model_can_see`
