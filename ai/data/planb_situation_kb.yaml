# 문서 24건. reason 태그별: weather 10 · closed 4 · fatigue 4 · canceled 3 · delay 2 · none 2
# (합이 24를 넘는 건 sit-closure-004 가 closed·canceled 두 reason 을 달았기 때문)
documents:
  - doc_id: sit-weather-001
    text: "비가 오는 우천 상황에서는 자연·야경 같은 실외 일정 대신 실내 대안을 우선한다 — 문화(박물관·미술관·전시), 카페, 쇼핑이 우천 대체의 기본 순서다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-002
    text: "우천 시 이동을 최소화한다 — 현재 위치나 숙소에서 가까운 대안을 우선하고, 도보 구간이 긴 후보는 피한다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-003
    text: "소나기처럼 짧은 강수는 전면 교체보다 순서 조정이 낫다 — 실내 일정을 앞으로 당기고 실외 일정을 강수 이후로 미루는 대안을 먼저 검토한다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-004
    text: "폭우·강풍·태풍 경보 상황에서 수상 액티비티·등산 같은 야외 활동은 대안 제시가 아니라 제외 대상이다 — 안전이 대안 선택보다 앞선다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-005
    text: "폭염 상황에서는 그늘 없는 명소·자연 대신 실내인 문화·쇼핑·카페를 우선한다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-006
    text: "한파·강추위 상황에서는 실내에 머무는 문화·쇼핑·카페를 우선하고, 자연·야경처럼 야외 체류가 긴 후보는 피한다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-007
    text: "미세먼지 나쁨 상황에서는 자연·액티비티처럼 야외 호흡량이 많은 일정을 실내 문화·쇼핑으로 대체한다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-008
    text: "적설·빙판 상황에서는 걷는 부담이 큰 자연·액티비티를 피하고, 실내인 문화·쇼핑·카페를 우선한다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-009
    text: "강풍 상황에서는 야경·자연처럼 개방된 장소를 문화·쇼핑 같은 실내 대안으로 바꾼다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-weather-010
    text: "실내 시설이 드문 외곽 지역의 기상 악화에서는 카테고리 유지를 고집하지 말고, 맛집·카페처럼 어디에나 있는 카테고리로 폭넓게 대체한다."
    metadata: { trigger_kinds: [WEATHER], reasons: [weather] }
  - doc_id: sit-closure-001
    text: "방문 예정지가 휴무·폐점으로 닫힌 상황에서는 같은 카테고리의 인접 대안을 우선한다 — 맛집이 닫혔으면 근처 맛집, 명소가 닫혔으면 근처 명소로 동선을 유지한다."
    metadata: { trigger_kinds: [CLOSURE], reasons: [closed] }
  - doc_id: sit-closure-002
    text: "소규모 맛집·카페는 임시 휴업이 잦다 — 휴무 대체 후보로는 영업시간 정보가 확인된 장소를 우선한다."
    metadata: { trigger_kinds: [CLOSURE], reasons: [closed] }
  - doc_id: sit-closure-003
    text: "명절 연휴에는 개인이 운영하는 맛집·카페가 넓은 범위로 함께 닫힌다 — 연휴 기간의 대체는 상시 운영하는 명소·자연·쇼핑을 우선한다."
    metadata: { trigger_kinds: [CLOSURE], reasons: [closed] }
  - doc_id: sit-closure-004
    text: "같은 카테고리에 쓸 만한 후보가 목록에 없으면 성격이 가까운 카테고리로 옮긴다 — 맛집은 카페, 문화는 명소, 액티비티는 자연 순으로 넓힌다."
    metadata: { trigger_kinds: [CLOSURE, MANUAL], reasons: [closed, canceled] }
  - doc_id: sit-delay-001
    text: "교통 지연으로 시간이 부족한 상황에서는 남은 슬롯 수를 줄이는 방향으로 대안을 잡는다 — 체류 가치가 높은 한 곳을 지키고, 경유 성격의 슬롯을 빼는 쪽을 우선한다."
    metadata: { trigger_kinds: [DELAY], reasons: [delay] }
  - doc_id: sit-delay-002
    text: "지연 이후의 대안은 다음 목적지와 같은 방향에 있는 장소를 우선한다 — 되돌아가는 역방향 이동을 만드는 대안은 피한다."
    metadata: { trigger_kinds: [DELAY], reasons: [delay] }
  - doc_id: sit-canceled-001
    text: "예약 취소·입장 불가 상황에서는 같은 카테고리 대안을 먼저 찾고, 마땅한 것이 없으면 그 시간대를 인접 일정의 여유 시간으로 돌리는 편이 낫다."
    metadata: { trigger_kinds: [MANUAL], reasons: [canceled] }
  - doc_id: sit-canceled-002
    text: "예약 취소로 그날의 하이라이트가 빠진 상황에서는 대표성 있는 명소나 야경으로 대체해 하루의 인상을 지킨다."
    metadata: { trigger_kinds: [MANUAL], reasons: [canceled] }
  - doc_id: sit-fatigue-001
    text: "피로 신호가 있는 상황에서는 활동 강도가 낮은 대안을 고른다 — 액티비티·등산형 자연 대신 카페·야경 같은 정적인 장소를 우선하고 도보를 최소화한다."
    metadata: { trigger_kinds: [MANUAL], reasons: [fatigue] }
  - doc_id: sit-fatigue-002
    text: "피로 상황의 대안은 숙소 방향 동선에 있는 장소를 우선한다 — 하루의 마지막이 숙소에서 멀어지지 않게 한다."
    metadata: { trigger_kinds: [MANUAL], reasons: [fatigue] }
  - doc_id: sit-fatigue-003
    text: "체력이 소진된 상황에서는 앉아서 쉴 수 있는 카페·문화를 우선하고, 서서 둘러보는 명소·쇼핑은 뒤로 미룬다."
    metadata: { trigger_kinds: [MANUAL], reasons: [fatigue] }
  - doc_id: sit-fatigue-004
    text: "체력 저하 상황에서는 한 자리에 머무는 카페·문화를 우선하고, 여러 지점을 옮겨 다니는 자연·쇼핑은 피한다."
    metadata: { trigger_kinds: [MANUAL], reasons: [fatigue] }
  - doc_id: sit-manual-001
    text: "사용자가 사유 없이 다른 곳을 원할 때는 같은 카테고리·같은 동선의 대안을 먼저 제시한다 — 일정의 성격을 바꾸지 않는 교체를 기본으로 한다."
    metadata: { trigger_kinds: [MANUAL], reasons: [none] }
  - doc_id: sit-manual-002
    text: "사용자 요청 교체에서는 저장·선호한 카테고리 비중이 높은 후보를 우선하고, 선호에 없는 카테고리는 뒤로 미룬다."
    metadata: { trigger_kinds: [MANUAL], reasons: [none] }
