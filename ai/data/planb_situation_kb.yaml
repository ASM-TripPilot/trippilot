# Plan-B 상황 KB(KB-3) — planb-rag-design.md §2 KB-3
#
# ## 문서 단위
# "상황 → 대안 선택 지침" 1건. `text` 가 임베딩 대상이고 LLM(ALTERNATIVE_SELECTION)
# 프롬프트의 `$situation_context` 로 들어간다 — 실행 지침 문장으로 쓴다.
#
# ## 어휘 정렬
# 검색 질의는 `rag._situation_query` = `"{TriggerKind} {한국어 reason} 상황"` 이다.
#   TriggerKind = WEATHER·CLOSURE·DELAY·MANUAL (domain/trigger.py)
#   reason      = weather·closed·delay·canceled·fully_booked·fatigue·none (agent-io-contracts §2.2)
#   **예약 마감(fully_booked)은 예약 취소(canceled)와 다른 사유다** (2026-09-12) —
#   "자리가 다 찼다" 이지 "잡아둔 예약이 없어졌다" 가 아니다.
# **reason 은 한국어로 치환해서 질의에 들어간다** — 매핑 정본은 `rag._REASON_KO`.
# 영문 enum 값을 그대로 쓰면 한국어 문서와 임베딩 공간에서 안 붙는다(특히 `none`).
# 카테고리 어휘는 경계 8종(SIGHT·FOOD·CAFE·NIGHT_VIEW·NATURE·CULTURE·ACTIVITY·SHOPPING)의
# 한글 표현을 쓴다. POI 개별 참조 없음(poi_ref: null) — 일반 지식만.
#
# ## 무엇을 싣지 않는가 — 두 기준 (2026-09-01, 초안 41건 중 28건을 이 기준으로 뺐다)
#
# (1) **코드가 구조로 보장하는 규칙은 싣지 않는다.** 후보 자격·제외 목록·개수 상한은
#     `closed_set_filter`·`excluded_poi_ids`·`max_alternatives`·풀 영업일 필터가 이미 판다.
#     예: "이미 가본 곳을 다시 추천하지 마라"(excluded_poi_ids 가 후보에서 아예 뺀다),
#         "폐업한 곳은 다른 날 가라"(풀에서 빠지고, Alternative 에 날짜 필드가 없다).
#
# (2) **프롬프트가 표현할 수 없는 구분은 싣지 않는다.** 모델이 받는 후보 줄은
#     `poi_id | 카테고리 | 상호명` 뿐이고, 그밖에 아는 것은 `trigger_kind`·`reason`·
#     `schedule_context`·`situation_context`·`persona_context` 가 전부다.
#     좌표·거리·영업시간·입장료·좌석·혼잡도·동행 구성·사용자 발화·요청 회차는 **없다.**
#     그런 축으로 고르라는 지시는 모델이 상호명에 대한 기억으로 **지어내게** 만들고,
#     그 창작이 게이트 없는 `rationale` 로 사용자에게 나간다.
#     같은 이유로 **배치·순서·시각을 지시하지 않는다** — 그건 어셈블리 소유다(INV-2).
#
# 조건절을 달 거면 그 조건이 위 다섯 입력으로 판별 가능해야 한다. 판별 불가한 조건은
# 문서를 무해하게 만드는 게 아니라, **같은 버킷의 다른 문서와 모순되게** 만든다
# (질의가 상수라 조건이 다른 문서들이 항상 함께 뽑힌다).

