[project]
name = "trippilot-embedding"
version = "1.0.0"
description = "TripPilot 임베딩 서비스 — KURE-v1 을 AI 컨테이너 밖으로 (TRIP-517)"
requires-python = ">=3.11"
# **의존성 목록이 ai/ 와 분리된 이유가 이 서비스의 존재 이유다.**
# torch + sentence-transformers 는 설치만 1GB 대다. ai/ 본체에 넣으면 FastAPI 경계
# 한 줄 고칠 때마다 그걸 다 끌고 다닌다. 그래서 별도 패키지로 둔다.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentence-transformers>=3.0",
]

# **패키지가 아니다** — app.py 하나짜리 서비스라 build-system 을 두지 않는다.
# 두면 `uv run` 이 프로젝트 모드로 들어가 src/ 레이아웃을 찾다 빌드가 깨진다.
# Dockerfile 은 venv 바이너리를 직접 호출한다.
