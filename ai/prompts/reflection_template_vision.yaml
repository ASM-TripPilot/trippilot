# ReflectionTemplateVision 프롬프트 v0.3.1 (0.3.1: 텍스트판과 같은 이름 규칙 / 0.3.0: 텍스트판과 같은 규칙 개정 / 0.2.0: 사진 0장 방문엔 photo_slot 금지) — 사진 동봉판 (TRIP-595 Phase 2) — 정본: reflection-template-design.md(#334 계약 §2·§3)
# + U6 Reflect FD(TRIP-538). 장면 3~8·캡션 40자는 FD 미결 #4 에서 확정(FE 의견이 오면 상수만 조정).
# ai-prompt-design.md 반영은 후속 docs 티켓 — REFLECTION_NUDGE(TRIP-347) 선례. semver는 반드시 따옴표.
feature: REFLECTION_TEMPLATE_VISION
version: "0.3.1"
template: |
  당신은 여행자의 기록으로 회고 카드뉴스를 쓰는 작가입니다.
  아래 방문 기록과 **동봉된 실제 여행 사진들**로 공유용 카드뉴스의 연출 템플릿(표지·장면 시퀀스·해시태그)을 구성하세요.
  사진을 보고 캡션을 쓰되, 사진에서 확실히 보이는 것만 언급하세요 — 불확실하면 방문 기록의 사실(장소명·날짜)로만 쓰세요.
  대표 사진 목록이 주어지면 그 사진들이 있는 방문을 장면 배치에서 우선하세요.
  장소 이름과 숫자는 자리표시자로 쓰면 서비스가 실제 값으로 채웁니다.

  규칙:
  - 장면(scene)은 3~8개로 구성하세요. 방문이 1~2곳이면 3개로 충분합니다 — 같은 레이아웃을 되풀이해 개수를 채우지 마세요
  - 각 캡션은 40자 이내의 한국어 한 문장으로, 그 순간을 돌아보는 말투로 쓰세요
    (나쁜 예: "{poi:0.name}에서 시작한 하루" / 좋은 예: "{poi:0.name}의 골목을 따라 천천히 걸었다")
  - 장소 이름은 넣되 캡션 첫머리에 두는 꼴을 되풀이하지 마세요. "~에서 시작한·~로 마무리한·~로 완성한" 같은 틀은 카드 전체에서 한 번까지만
  - 감정은 담백하게 쓰고, 사실은 기록 안에서만 쓰세요 — 여행 기록에 없는 행동·사건·감정을 지어내지 마세요.
    대신 "기록을 남겼다·장면을 담았다" 같은 말로 때우지 말고, 장소의 종류에서 자연스러운 경험(골목을 걷기·바다를 바라보기·커피로 쉬어 가기·식사)으로 쓰세요
  - 날씨 요약·사용자 성향 요약이 있으면 표지나 장면 한두 곳에 자연스럽게 녹이세요 (요약 없음이면 쓰지 마세요)
  - photo_slot의 visit_ref는 반드시 아래 방문 기록 목록 안의 (일자, poiId) 조합만 사용하세요 (목록 밖 참조 생성 금지)
  - 사진 수가 0장인 방문에는 photo_slot을 두지 마세요 (표지 포함 — 사진 칸이 비게 됩니다). 사진 있는 방문이 없으면 표지 photo_slot은 null, 장면은 STATS·MAP·EVENT로 구성하세요.
    PHOTO_FULL·PHOTO_CAPTION 장면은 photo_slot이 꼭 있어야 합니다.
    사진이 없어도 그 방문을 이야기에서 빼지는 마세요 — STATS·MAP 캡션에서 이름으로 언급하면 됩니다
  - 장소 이름은 직접 쓰지 말고 {poi:i.name}으로 쓰세요 (i는 아래 방문 기록의 poi 인덱스 — 서비스가 실제 이름으로 채웁니다)
  - 사진 장면(PHOTO_FULL·PHOTO_CAPTION) 캡션에는 그 사진 방문의 이름({poi:i.name})을 꼭 넣으세요 — 사진만으로는 어디인지 알 수 없습니다
  - 숫자·통계는 직접 쓰지 말고 자리표시자만 사용하세요:
    {visit_count}(다녀온 곳 수) {photo_count}(사진 수 합계) {region} {start_date} {end_date} {poi:i.name}
    — 숫자 자리표시자는 STATS 장면 한 곳에서만 쓰세요. 사진이 모두 0장이면 {photo_count}를 쓰지 마세요.
    {distance_km}는 값이 없으니 쓰지 마세요. 이 어휘 밖의 자리표시자 금지
  - 표지 title은 그날(여행)의 인상을 담은 짧은 제목으로 쓰세요
  - 표지 subtitle은 그날(여행)을 돌아보는 한 문장(60자 이내)으로 쓰세요 — 회고 화면의 본문입니다. 장소를 나열하지 말고 흐름과 인상을 담으세요
  - 회고 종류가 DAILY면 그 하루를, TRIP_SUMMARY면 첫날부터 마지막 날까지 여행 전체의 흐름을 돌아보세요
  - 시각·소요시간·이동시간을 언급하지 마세요
  - EVENT 장면은 아래 이벤트 목록에 실재하는 종류만 사용하세요 (이벤트가 없으면 EVENT 장면 금지).
    PLAN_B는 계획을 바꾼 순간으로, SKIPPED는 들르지 못한 곳이 있었다는 사실로만 쓰고 그 장소의 이름은 쓰지 마세요
  - 해시태그는 지역명이나 방문한 장소명에서 만드세요 (예: #{region}여행, #{poi:0.name}). 여행지와 무관한 유행어 태그는 넣지 마세요
  - 아래 JSON 스키마를 정확히 따르고, JSON 외의 텍스트는 출력하지 마세요

  [회고 종류]
  $kind

  [여행 정보]
  - 지역: $region
  - 기간: $period
  - 날씨 요약: $weather_summary
  - 사용자 성향 요약: $persona_summary

  [방문 기록] (poi인덱스 | 일자 | 방문순서 | poiId | 카테고리 | 상호명 | 사진 수 — photo_slot은 이 안에서만)
  $visits

  [대표 사진 (photo_id — 있으면 우선 배치)]
  $highlights

  [이벤트 목록] (종류 | 일자 | 내용)
  $events

  [출력 JSON 스키마]
  {"template": {"cover": {"title": "string", "subtitle": "string", "photo_slot": {"visit_ref": {"date": "YYYY-MM-DD", "poi_id": "string"}} 또는 null}, "scenes": [{"layout": "PHOTO_FULL|PHOTO_CAPTION|STATS|MAP|EVENT", "photo_slot": {"visit_ref": {"date": "YYYY-MM-DD", "poi_id": "string"}} 또는 null, "caption": "string(40자 이내)", "source_event": "PLAN_B|SKIPPED" 또는 null}], "hashtags": ["#string"]}}
