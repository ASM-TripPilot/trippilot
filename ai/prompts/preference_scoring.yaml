# PreferenceScoring 프롬프트 v0.3.0 — 정본: ai-prompt-design.md §2.1
# v0.2.0 (TRIP-374): reason 제거 — 실측 결과 reason은 게이트에서 파싱 후 폐기되던 필드로,
#   출력 토큰 대부분을 차지했다. 표시용 설명은 EXPLANATION(§2.2)이 배치분만 생성한다.
# v0.3.0: 활동·음식 선호 추가 — 7축이 못 담는 축이다(카페·야경은 styles 에 없고
#   PoiCategory 에는 있다). 후보 줄이 `FOOD·음식점·한식` 으로 나가므로 같은
#   한국어 어휘로 맞물리게 라벨 그대로 싣는다.
# semver는 반드시 따옴표 (yaml 암묵 타입 변환 방지).
# 점수 기준(앵커)·판단 순서(CoT)·few-shot(K-2)은 실측으로 **넣지 않았다** (2026-10-18, gpt-5.6-sol, 해운대 53곳 ×
#   페르소나 3 × 청크 구성 3, scripts/measure/measure_prompt_ab.py scoring). 묶음 효과는 있다 — 같은 구성을 되풀이하면
#   POI별 표준편차 0.017·순위상관 0.984, 구성을 바꾸면 0.028·0.958. 그런데 기준을 넣은 세 판본(앵커만 / 앵커+판단 순서+
#   코드 뜻 / 거기에 예시 2건)이 0.028~0.033·0.952~0.966 으로 그대로였고 명백한 상·하위 쌍은 기준 판본부터 16/16 이다.
#   비용만 늘었다 — 기준 판본은 거의 생각하지 않는데(출력 664 ≈ 18건 × 37) 기준을 넣으면 생각을 시작해 출력 p95
#   709~732 → 857~1048, 지연 p50 5.5 → 6.4~8.3s(시한 14s). 다시 시도하면 같은 러너로 기준 판본과 나란히 잰다.
feature: PREFERENCE_SCORING
version: "0.3.0"
template: |
  당신은 여행 일정 추천 시스템의 점수 산정 모듈입니다.
  아래 사용자 취향과 후보 장소 목록을 보고, 각 장소에 0.0~1.0 사이의 선호 점수를 부여하세요.

  규칙:
  - 반드시 제공된 poiId 목록 안에서만 점수를 부여하세요 (목록 밖 ID 생성 금지)
  - 모든 후보에 점수를 부여하세요 (누락 금지)
  - reason 필드는 출력하지 마세요 — 표시용 설명은 별도 단계가 담당합니다
  - 아래 JSON 스키마를 정확히 따르고, JSON 외의 텍스트는 출력하지 마세요

  [사용자 취향]
  - 취향 태그: $taste_tags
  - 동반자: $companion
  - 활동 선호: $activities
  - 음식 선호: $cuisines
  - 예산: $budget

  [후보 장소 목록] (poiId | 카테고리 | 상호명)
  $candidates

  [출력 JSON 스키마]
  {"scores": [{"poiId": "string", "score": 0.0}]}
