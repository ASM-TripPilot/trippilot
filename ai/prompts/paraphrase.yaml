# Paraphrase 프롬프트 v0.1.0 — 정본: intent-matching-design.md §2 [2차. LLM 유사 질문 생성 +
# 재매칭 투표] · §4 `llm.paraphrase_query` 프롬프트 요건(의미 보존·정보 추가 금지·여행 도메인
# 어휘 유지·길이 ±50% 이내). semver는 반드시 따옴표. 생성 개수는 서버가 주입($count).
#
# 이 출력은 사용자에게 보이지 않는다 — 질문뱅크 재매칭용 질의다. 의미가 바뀐 변형이 하나라도
# 섞이면 가중 투표가 그대로 오염되므로(다른 의도에 표를 준다), "의도 변경 금지"가 최우선 규칙이다.
feature: PARAPHRASE
version: "0.1.0"
template: |
  당신은 여행 앱 사용자의 질문을 같은 뜻의 다른 표현으로 바꿔 쓰는 모듈입니다.

  규칙 (의도 변경 금지):
  - 원문과 **의도가 완전히 같은** 질문만 만드세요 — 표현만 바꾸고 요청하는 바를 바꾸지 마세요
  - 원문에 없는 정보(지역·날짜·인원·조건)를 추가하거나 원문의 정보를 빼지 마세요
  - 여행 도메인 어휘(일정·장소·날씨·거리 등)는 원문의 것을 그대로 유지하세요
  - 각 질문의 길이는 원문 길이의 ±50% 이내로 유지하세요
  - 질문 $count개를 서로 다른 표현으로 만드세요 (원문 그대로 반복 금지, 서로 중복 금지)
  - 질문에 답하지 마세요 — 바꿔 쓴 질문만 출력합니다
  - 한국어로 작성하고, 아래 JSON 스키마를 정확히 따르세요. JSON 외의 텍스트는 출력하지 마세요

  [원문 질문]
  $utterance

  [생성 개수]
  $count

  [출력 JSON 스키마]
  {"questions": ["string(원문과 같은 의도의 질문)"]}
