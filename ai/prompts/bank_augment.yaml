# Bank augment 프롬프트 v0.1.0 — 정본: intent-matching-design.md §3.2 ② Augment
# ("LLM으로 seed당 변형 5~10개 생성 — 존댓말/반말, 축약, 오타형, 방언 톤"). semver는 따옴표.
#
# **PARAPHRASE 와 목적이 반대다.** PARAPHRASE 는 투표용 재질의라 "여행 도메인 어휘를 원문
# 그대로 유지"가 규칙이지만, 증강은 그 반대여야 값어치가 있다 — 1차 미달의 실제 원인이
# 어휘·구조 차이였다(TRIP-840 실측: "몇 시까지 열어" 가 뱅크 "영업시간 알려줘" 와 0.577).
# 그래서 여기서는 **다른 말로 같은 요청**을 만들게 한다.
#
# 산출은 사용자에게 보이지 않는다 — 뱅크에 적재될 검색용 문장이다. 의도가 바뀐 변형이 섞이면
# 그 의도로 가는 발화를 영구히 오분류시키므로(뱅크 오염), "의도 변경 금지"가 최우선 규칙이다.
# 기계 필터(중복·타 의도 근접·평가셋 leak)가 뒤를 받치지만, 의도 보존은 필터가 못 본다.
feature: BANK_AUGMENT
version: "0.1.0"
template: |
  당신은 여행 앱의 의도 분류용 예시 문장을 늘리는 모듈입니다.
  아래 원문과 **같은 것을 요청하는** 다른 문장 $count개를 만드세요.

  이 문장들은 "$intent" 의도의 예시로 저장됩니다. 그 의도의 뜻은 다음과 같습니다:
  $intent_desc

  규칙:
  - **요청하는 바가 같아야 합니다.** 표현은 마음껏 바꾸되, 사용자가 원하는 결과가 달라지면 안 됩니다
  - **어휘를 바꾸세요.** 원문과 같은 단어를 그대로 쓰기보다 같은 뜻의 다른 말을 고르세요
    (예: "영업시간" ↔ "몇 시까지 해", "알려줘" ↔ "궁금해")
  - **말투를 섞으세요.** 존댓말·반말·축약형·혼잣말투를 골고루 씁니다
  - 문장 길이도 섞으세요 — 아주 짧은 것과 조금 긴 것을 같이 만듭니다
  - `{장소}` `{지역}` `{날짜}` `{기간}` 같은 중괄호 자리표시자가 원문에 있으면 **그대로 두세요**.
    실제 지명·날짜로 바꾸지 마세요
  - 아래 "가까운 다른 의도"와 헷갈릴 문장은 만들지 마세요:
  $rivals
  - 질문에 답하지 마세요 — 문장만 출력합니다
  - 한국어로 작성하고, 아래 JSON 스키마를 정확히 따르세요. JSON 외의 텍스트는 출력하지 마세요

  [원문]
  $utterance

  [생성 개수]
  $count

  [출력 JSON 스키마]
  {"questions": ["string(원문과 같은 요청의 문장)"]}
