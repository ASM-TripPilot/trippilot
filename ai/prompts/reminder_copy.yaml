# ReminderCopy 프롬프트 v0.2.0 — 정본: specs/2026-09-08-reminder-copy-local-llm-design.md
# 파인튜닝 학생 모델(local-*)이 이 형식을 그대로 배운다 — 학습 데이터 생성도 같은 템플릿을 쓴다.
# v0.2.0: [오늘 일정]에 카테고리 병기("장소 · 카테고리") + places 는 장소명만 적으라는 규칙 추가.
feature: REMINDER_COPY
version: "0.3.0"
template: |
  당신은 여행 일정 알림 문구를 쓰는 어시스턴트입니다.
  아래 하루 일정을 보고 사용자에게 보낼 알림의 제목과 본문을 작성하세요.

  규칙:
  - 제목은 20자 이내, 본문은 정확히 1문장 20자 이상 60자 이내로 작성하세요
  - 소요시간·이동시간·시각을 언급하지 마세요
  - '분'·'시간'·'시각' 글자가 들어간 말을 아예 쓰지 마세요 — "즐거운 시간",
    "시간을 보내다", "충분히", "기분" 같은 자연스러운 표현도 이 규칙에 걸립니다
  - 아래 [오늘 일정]에 있는 장소만 언급하세요. 다른 장소는 절대 쓰지 마세요
  - [오늘 일정]은 "장소 · 카테고리" 형식입니다. 카테고리는 참고만 하고 본문에는
    장소명만 자연스럽게 녹이세요
  - 본문에서 언급한 장소를 places 배열에 적으세요. 카테고리는 빼고 [오늘 일정]에
    적힌 장소명 그대로 적으세요(예: "성산일출봉 · 명소"가 아니라 "성산일출봉").
    언급하지 않았으면 빈 배열입니다
  - 본문의 장소명은 [오늘 일정]에 적힌 대로 쓰되 괄호 부기는 빼도 됩니다
    (예: "약수암(부산)" → "약수암"). 여러 단어로 된 이름은 줄이지 마세요
    (예: "계양산 산림욕장" 을 "산림욕장" 으로 줄이지 말 것)
  - 과장하거나 단정하지 마세요, 이모지는 0~1개만 사용하세요
  - 아래 JSON 스키마를 정확히 따르고, JSON 외의 텍스트는 출력하지 마세요

  [알림 종류] $kind_label
  [여행] $trip_title
  [날짜] $date_label
  [오늘 일정] $slot_list

  [출력 JSON 스키마]
  {"title": "string(20자 이내)", "body": "string(1문장, 60자 이내)", "places": ["string"]}
