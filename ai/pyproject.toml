[project]
name = "trippilot-ai"
version = "0.1.0"
description = "TripPilot AI service — domain types, ports, and fakes (U1 walking skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.115",
    "openai>=2.53.0",
    "ortools>=9.15.6755",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trippilot"

[project.optional-dependencies]
# LangChain 부분 도입 (TRIP-522) — PlanB RAG 검색기 경유 MMR 에만 쓴다.
# **기본 설치에 넣지 않는다**: PlanBRagConfig.search_type 기본값이 "similarity" 라
# 이게 없어도 PlanB 는 그대로 돈다. 이미지에 25MB·30패키지를 상시로 얹을 이유가 없다
# (임베딩 가중치를 1.1GB 줄인 직후다 — TRIP-518).
langchain = [
    "langchain-core>=1.6",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.28",
    # mmr 경로 테스트용 — 런타임 필수는 아니다(위 optional-dependencies 참조)
    "langchain-core>=1.6",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
