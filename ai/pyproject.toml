[project]
name = "trippilot-ai"
version = "0.1.0"
description = "TripPilot AI service — domain types, ports, and fakes (U1 walking skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.115",
    "openai>=2.53.0",
    "ortools>=9.15.6755",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trippilot"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
