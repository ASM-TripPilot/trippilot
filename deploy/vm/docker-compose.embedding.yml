# 8GB 장비에서만 덧붙인다: .env 에 COMPOSE_FILE=docker-compose.yml:docker-compose.embedding.yml
# 운영 embedding Deployment(차트 templates/embedding.yaml)와 같은 실행값이고, ai 에 벡터 DB·임베딩 주소를 연결한다.
# ai_kb 의 kb_vectors 는 운영 덤프에 그대로 실려 와서 다시 적재할 필요가 없다(같은 모델·같은 벡터 공간).
services:
  embedding:
    image: ${EMBEDDING_IMAGE:-trippilot/embedding:current}
    restart: unless-stopped
    command: [/app/.venv/bin/uvicorn, "app:app", --host, 0.0.0.0, --port, "8100", --workers, "1"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /tmp/cache
      HF_HOME: /tmp/huggingface
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    healthcheck:
      # /health 는 모델을 안 기다린다 — 준비는 /ready 로 본다(차트 주석, 2026-10-03 DEV 실측).
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/ready')"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s
    mem_limit: 5g                      # 운영 파드 3.1GiB, 배치 인코딩 정점 4.4GiB(ai/docs/임베딩-사이징-근거.md)
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  ai:
    env_file: [secrets/ai.env, secrets/ai-vector.env]
    environment:
      TRIPPILOT_EMBEDDING_PROVIDER: http
      TRIPPILOT_EMBEDDING_BASE_URL: http://embedding:8100
