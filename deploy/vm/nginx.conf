# deploy/eks/chart/templates/gateway-config.yaml 의 운영 gateway 설정 사본. 바뀐 곳은 셋이다 — 앞단이 NLB 가 아니라
# caddy 컨테이너라 실제 클라이언트 IP 를 X-Forwarded-For 에서 되살리고(속도 제한이 IP 단위다), backend 주소를 Docker DNS 로
# 계속 다시 풀고(compose 는 재시작마다 컨테이너 IP 가 바뀐다 — ClusterIP 가 고정이던 운영과 다르다), keepalive 주석을 고쳤다.
# 운영 차트 쪽을 고치면 여기도 맞춘다.
worker_processes auto;
worker_shutdown_timeout 630s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Omit query strings and authorization headers from access logs.
  log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # 지속 속도 10r/s 는 그대로, 한꺼번에 몰리는 몫(burst)만 60 — 마이페이지·내 숙소가 여행마다 일정·숙소를
  # 같은 1초에 묻는다(여행 38개 → 38~39건, 2026-10-13 DEV 429 ×12, 다음 1초 재시도로 회복). 근본은 목록
  # 응답에 일정 상태를 싣는 것(계약 변경 — 결정 대기), 그 전까지의 완화다.
  # caddy 가 X-Forwarded-For 를 클라이언트 IP 하나로 덮어 보낸다(trusted_proxies 미설정). compose 네트워크 대역만 믿는다.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_status 429;
  # 기동 때 한 번만 풀면 backend·ai 를 멈췄다 다시 켤 때 IP 가 바뀌어 옛 IP(다른 컨테이너)로 보낸다 — 검수 재현(11-27).
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream backend {
    zone backend 64k;
    server backend:8080 resolve;
    keepalive 32;
  }
  server {
    # caddy → gateway 구간. TCP keepalive 는 느린 AI 요청 동안 연결을 지킨다(운영 설정 그대로).
    listen 8080 so_keepalive=60s:10s:3;
    server_name _;
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Service-Token "";
    proxy_connect_timeout 5s;
    # Schedule generation can take up to 610 seconds when deadlines are disabled.
    proxy_read_timeout 620s;
    proxy_send_timeout 620s;
    proxy_buffering off;
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
    location = /api {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend;
    }
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend;
    }
    # /internal and /actuator are available exclusively on the private backend Service.
    location / { return 404; }
  }
}
