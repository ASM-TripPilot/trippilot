# TripPilot 로컬 kind 클러스터.
#
# 노드 하나로 충분하다 — 로컬에서 검증하려는 건 스케줄링이 아니라
# "서비스들이 클러스터 안에서 서로를 찾고 붙는가" 이므로.
#
# 포트는 NodePort → hostPort 로 고정 매핑한다. port-forward 로 열면 터미널을
# 하나씩 붙잡고 있어야 하고, 끊기면 조용히 접속이 죽는다.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: trippilot

nodes:
  - role: control-plane
    extraPortMappings:
      # frontend (nginx)  → http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # backend (Spring)  → http://localhost:8081
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
      # ai (stub)         → http://localhost:8082
      - containerPort: 30082
        hostPort: 8082
        protocol: TCP
      # postgres          → localhost:15432 (psql·DBeaver 직접 접속용)
      - containerPort: 30432
        hostPort: 15432
        protocol: TCP
