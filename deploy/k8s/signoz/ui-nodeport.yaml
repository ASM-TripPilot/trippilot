apiVersion: v1
kind: Service
metadata:
  name: signoz-ui
  namespace: signoz
  labels:
    app.kubernetes.io/name: signoz-ui
    app.kubernetes.io/part-of: trippilot
spec:
  # SigNoz UI 를 고정 NodePort 로 연다 — `kubectl port-forward` 를 대신한다.
  #
  # port-forward 를 쓰지 않는 이유: kind 노드 컨테이너가 이미 호스트 8080 을 점유한다
  # (cluster.yaml 의 30080→8080 매핑). 거기에 port-forward 로 127.0.0.1:8080 을 또 열면
  # 두 리스너가 같은 포트에 겹쳐 어느 쪽이 응답할지 OS 바인딩 우선순위에 달리게 된다.
  # 이미 열려 있는 매핑을 쓰면 그 모호함이 사라지고, 터미널을 켜 둘 필요도 없다.
  #
  # Helm 이 만든 signoz Service 는 건드리지 않는다 — 업그레이드 때 되돌려지기 때문이다.
  # 대신 같은 파드를 가리키는 우리 소유의 Service 를 따로 둔다.
  type: NodePort
  selector:
    app.kubernetes.io/component: signoz
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/name: signoz
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
