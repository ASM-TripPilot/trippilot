apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: trippilot
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 개발자가 실제로 열어보는 주소: http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: trippilot
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
