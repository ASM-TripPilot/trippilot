apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: trippilot
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: trippilot/frontend:local
          # kind load 로 적재한 이미지. 레지스트리가 없으므로 Never.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              # localhost 는 컨테이너 안에서 ::1 로 풀려 nginx(IPv4)에 refused 된다.
              # httpGet 은 파드 IP 로 직접 붙으므로 그 함정이 없다.
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
