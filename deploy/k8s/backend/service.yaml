apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: trippilot
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# 호스트에서 http://localhost:8081 로 직접 때려보기 위한 통로
# (kind cluster.yaml 의 extraPortMappings 30081 → 8081).
apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: trippilot
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
