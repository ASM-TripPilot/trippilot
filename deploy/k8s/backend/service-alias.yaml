# frontend 컨테이너의 nginx 는 /api 를 `http://backend:8080` 으로 프록시한다
# (frontend/nginx.conf). 그 이름은 docker-compose 의 서비스명이라 클러스터에서는
# 풀리지 않는다.
#
# nginx.conf 를 고치는 대신 여기에 별칭 Service 를 둔다 — 같은 파일이 compose 와
# k8s 양쪽에서 쓰이므로, 한쪽에 맞춰 고치면 다른 쪽이 깨진다.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: trippilot
  labels:
    app.kubernetes.io/name: trippilot-backend
    app.kubernetes.io/part-of: trippilot
spec:
  selector:
    app.kubernetes.io/name: trippilot-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
