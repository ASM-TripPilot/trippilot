# 숙소·여행 조회 캐시. 원본은 PostgreSQL 이므로 영속화하지 않는다
# (compose 의 redis 설정과 동일 — --save "" --appendonly no).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trippilot
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
