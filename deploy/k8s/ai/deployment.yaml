apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: trippilot
  labels:
    app: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: trippilot/ai:local
          # kind load 로 노드에 직접 넣은 이미지를 쓴다. 레지스트리가 없으므로
          # Never 여야 한다 — IfNotPresent 면 이미지가 없을 때 레지스트리로 나가
          # ImagePullBackOff 가 된다.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
