apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: trippilot
  labels:
    app.kubernetes.io/name: trippilot-postgres
type: Opaque
# stringData 는 apply 시 base64 로 인코딩된다. 평문으로 커밋하는 이유는 **로컬 전용 값**이기 때문이다
# — docker-compose.yml 과 backend/docker/init/00-roles.sql 에 이미 같은 값이 있다.
#
# ⚠️ 오해 금지: k8s Secret 은 기본 설정에서 **암호화가 아니라 base64 인코딩**이다.
# etcd 암호화나 외부 스토어를 붙이지 않는 한 네임스페이스 조회 권한이 있으면 그대로 읽힌다.
# 그럼에도 ConfigMap 대신 Secret 을 쓰는 실익: (1) kubectl 기본 출력에 값이 안 찍히고
# (2) RBAC 을 따로 걸 수 있고 (3) 운영에서 Secrets Manager 로 갈아끼울 자리가 미리 잡힌다.
# 운영 자격증명은 절대 이 파일에 넣지 않는다(SECURITY-12).
stringData:
  POSTGRES_PASSWORD: postgres       # 슈퍼유저 — 롤·스키마 부트스트랩용
  DB_USER: app_user                 # 런타임 DML
  DB_PASSWORD: app_user
  DB_MIGRATE_USER: app_migrate      # Flyway 마이그레이션(스키마 소유자)
  DB_MIGRATE_PASSWORD: app_migrate
