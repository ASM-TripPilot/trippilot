# 로컬 전용 더미 자격증명. 운영 값은 여기에 절대 넣지 않는다
# (운영은 외부 시크릿 매니저 — 이 파일은 kind 클러스터 안에서만 산다).
# 값은 docker-compose.yml 및 backend/docker/init/00-roles.sql 과 맞춘 것이다.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: trippilot
type: Opaque
stringData:
  POSTGRES_DB: trippilot
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
