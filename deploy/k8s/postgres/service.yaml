# 클러스터 내부용 헤드리스 서비스 — backend 는 postgres:5432 로 붙는다.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trippilot
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# 호스트에서 psql·DBeaver 로 직접 붙기 위한 NodePort (localhost:15432).
# 5432 를 그대로 쓰지 않는 이유는 호스트에 이미 로컬 PostgreSQL 이 떠 있는
# 경우가 흔해서다 — 겹치면 어느 쪽에 붙었는지 모르는 채로 디버깅하게 된다.
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: trippilot
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
