# 개발 대상(네임스페이스 trippilot-dev · dev-api.) — 2026-10-15 개발·운영 분리.
# 운영(values-dev.yaml)과 같은 클러스터에 올라가므로 **작게** 둔다: 복제본 1 · HPA 꺼짐 · PDB 꺼짐(복제본 1 에 PDB 를 걸면
# 드레인이 영구히 막힌다 — values-dev.yaml 주석). 임베딩은 켜고 끄기를 배포 입력이 정한다(렌더 값이 이 파일을 덮는다) —
# 켜면 5Gi 노드가 한 대 더 뜨고 KB 는 개발 DB 에 따로 쌓인다(첫 적재 ≈37분).
# 자원 요청·상한은 values.yaml 기본값 그대로다 — 개발 파드가 운영 노드 자원을 무한정 먹지 않게 상한이 이미 걸려 있다.
environment: dev
config:
  # 운영과 같은 동작을 확인하는 자리라 데드라인도 운영과 같게 켠다.
  scheduleDeadlineEnforced: true
backend:
  replicas: 1
ai:
  replicas: 1
  autoscaling:
    enabled: false
  # **CPU 요청만 1코어**(2026-10-19) — 일정 조립(CP-SAT)이 생성 순간 1~2코어를 몰아 쓰는데, 기본 200m 면 붐비는 노드에서
  # 보장 몫이 0.2코어라 풀이가 진척 0 으로 멈춘다(10-18 개발 서버: "det 0.00/2.00" · 조립 76초 · 생성 4건 전부 504).
  # CFS 몫은 요청에 비례해 복제본을 늘려도 각 200m 라 안 풀린다. 운영은 복제본 2+HPA 로 정상이라 기본값(10-16 결정)은 그대로.
  # 메모리 요청·상한은 기본값을 그대로 물려받는다(helm 은 맵을 깊게 합친다 — 차트 테스트가 확인).
  resources:
    requests:
      cpu: "1"
gateway:
  replicas: 1
embedding:
  replicas: 1
  # 인젝션 그림자 분류기 — 개발 서버에서 먼저 울린 비율(= 오탐 상한)을 본다(2026-10-30, 운영은 그 뒤)
  injectionGuard: true
podDisruptionBudget:
  enabled: false
