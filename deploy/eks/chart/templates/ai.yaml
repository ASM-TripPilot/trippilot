apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels:
    {{- include "trippilot.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.ai.autoscaling .Values.ai.autoscaling.enabled) }}
  replicas: {{ .Values.ai.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "trippilot.selector" (dict "root" . "component" "ai") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trippilot.selector" (dict "root" . "component" "ai") | nindent 8 }}
      annotations:
        trippilot.io/rollout-nonce: {{ .Values.rolloutNonce | quote }}
    spec:
      # Named account so Terraform's Pod Identity association (namespace trippilot,
      # service account ai) binds the Bedrock role to these pods and nothing else.
      # The Pod Identity webhook mounts its own projected token, so the pod-level
      # automountServiceAccountToken: false stays.
      serviceAccountName: ai
      {{- include "trippilot.podSpec" (dict "root" . "component" "ai" "uid" 10001) | nindent 6 }}
      containers:
        - name: ai
          image: {{ include "trippilot.image" (dict "root" . "component" "ai") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Avoid uv's runtime cache/sync writes under a read-only filesystem.
          command: [/app/.venv/bin/uvicorn]
          # Two workers so one async process cannot pin more than a single core while the
          # limit allows two; memory stays within requests (each worker loads the app once).
          # --no-access-log: uvicorn's access line carries the query string, and the memory boundary
          # takes account_ref as a query parameter (DELETE|GET /ai/v1/dialogue/memory?account_ref=...).
          # TraceMiddleware already logs http_request with the path only (SEC-U8-06; same flag as the image CMD).
          # --timeout-worker-healthcheck 30: the multi-worker supervisor kills a worker that misses its ping for
          # 5s (default). On a CPU-starved node a worker still loading the app misses it, gets killed and respawned,
          # which burns more CPU — 12 restarts in 2 minutes on the dev rollout of 10-18, and the smoke turn's memory
          # DELETE timed out into a 500. A genuinely hung worker is still caught, 30s later. Single-process image CMD
          # has no supervisor, so the flag lives here only.
          args: ["main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--timeout-graceful-shutdown", "630", "--timeout-worker-healthcheck", "30", "--no-access-log"]
          ports:
            - { name: http, containerPort: 8000 }
          securityContext:
            {{- include "trippilot.containerSecurity" . | nindent 12 }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: TRIPPILOT_BACKEND_BASE_URL
              value: http://backend:8080
            {{- /* Two names, one secret value. The TRIPPILOT_-prefixed one is what the AI
                   SENDS when calling the backend; the unprefixed one is what the inbound
                   middleware CHECKS (ai/src/trippilot/api/middleware.py reads
                   SERVICE_AUTH_TOKEN). Injecting only the prefixed one left the AI
                   boundary unauthenticated inside the cluster while the backend was
                   already sending the header. /health and / are exempt, so container
                   probes and the deploy smoke are unaffected. */}}
            {{- include "trippilot.secretEnv" (dict "env" "TRIPPILOT_SERVICE_AUTH_TOKEN" "key" "SERVICE_AUTH_TOKEN" "secret" "trippilot-shared") | nindent 12 }}
            {{- include "trippilot.secretEnv" (dict "env" "SERVICE_AUTH_TOKEN" "secret" "trippilot-shared") | nindent 12 }}
            {{- /* Without this the app treats a missing token as "validation off" and
                   starts open. With it, a missing token fails startup instead. */}}
            - name: SERVICE_AUTH_REQUIRE_TOKEN
              value: "true"
            - name: TRIPPILOT_LLM_PRICE_FILE
              value: /app/config/llm-prices.json
            - name: EVENTS_STORE
              value: /app/data/collected_events.json
            {{- range list "TRIPPILOT_LLM_PROVIDER" "OPENAI_API_KEY" "OPENAI_BASE_URL" "OPENAI_MODEL" "OPENAI_API" "ANTHROPIC_API_KEY" "ANTHROPIC_MODEL" "TRIPPILOT_LLM_FEATURE_MODELS" "TRIPPILOT_LLM_RETRY_MODELS" "TRIPPILOT_LOCAL_LLM_BASE_URL" "TRIPPILOT_LOCAL_LLM_API_KEY" "TRIPPILOT_BEDROCK_MODEL_ARN" "TRIPPILOT_BEDROCK_REGION" "WEATHER_API" "WEATHER_API_BASE" "KAKAO_REST_API_KEY" "EXISTENCE_MAX_CALLS" "TRIPPILOT_SCORE_MAX_PARALLEL" "TMAP_API_KEY" "ODSAY_API_KEY" "TRIPPILOT_EMBEDDING_MODEL" "TRIPPILOT_EMBEDDING_TIMEOUT_SEC" "TRIPPILOT_DIALOGUE_ORCHESTRATOR" "TRIPPILOT_DIALOGUE_SHADOW_RATE" "PUBLIC_DATA_API_KEY" }}
            {{- include "trippilot.secretEnv" (dict "env" . "secret" "trippilot-ai" "optional" true) | nindent 12 }}
            {{- end }}
            {{- /* Always wired, not only with embedding: the assistant session memory
                   (dialogue_memory, assistant-orchestrator FD DE §4) lives in ai_kb too, and
                   runtime_secrets.runtime_manifests synthesizes the value unconditionally. */}}
            {{- include "trippilot.secretEnv" (dict "env" "TRIPPILOT_VECTOR_DB_URL" "secret" "trippilot-ai") | nindent 12 }}
            {{- if .Values.embedding.enabled }}
            - name: TRIPPILOT_EMBEDDING_PROVIDER
              value: http
            - name: TRIPPILOT_EMBEDDING_BASE_URL
              value: http://embedding:8100
            {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai
  labels:
    {{- include "trippilot.labels" . | nindent 4 }}
automountServiceAccountToken: false
