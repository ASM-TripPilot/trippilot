{{- if .Values.embedding.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding
  labels:
    {{- include "trippilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.embedding.replicas }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 1200
  strategy:
    type: RollingUpdate
    # **서지를 쓰지 않는다**(2026-10-05). `maxSurge: 1` 이면 5Gi 짜리 파드가 **둘** 떠야 하고,
    # 그건 거의 항상 Karpenter 신규 노드를 롤아웃의 임계 경로에 넣는다 — 콜드 노드의 2GB 이미지
    # 풀 + 모델 로드까지 합치면 helm `--timeout` 안에 못 끝날 수 있고, `--atomic` 이면 릴리스
    # **전체가 롤백**된다(인증서 주석까지 되돌아간다).
    # 공백을 받아들이는 근거: AI 는 임베딩 없이 규칙 랭킹으로 degraded 하는 계약이다(INV-4).
    # 가용성보다 **배포가 끝나는 것**이 먼저다 — 안 끝나면 보호 설정도 같이 롤백된다.
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels:
      {{- include "trippilot.selector" (dict "root" . "component" "embedding") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trippilot.selector" (dict "root" . "component" "embedding") | nindent 8 }}
      annotations:
        trippilot.io/rollout-nonce: {{ .Values.rolloutNonce | quote }}
    spec:
      {{- include "trippilot.podSpec" (dict "root" . "component" "embedding" "uid" 10001) | nindent 6 }}
      containers:
        - name: embedding
          image: {{ include "trippilot.image" (dict "root" . "component" "embedding") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/app/.venv/bin/uvicorn]
          args: ["app:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "1"]
          ports:
            - { name: http, containerPort: 8100 }
          securityContext:
            {{- include "trippilot.containerSecurity" . | nindent 12 }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: HF_HOME
              value: /tmp/huggingface
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
          # 기동·준비는 `/ready`(모델이 실제로 올라왔는지), 생존은 `/health`(프로세스)다.
          # 셋 다 `/health` 였을 때는 **모델 없는 파드가 정상으로 보였다** — `/health` 가
          # 설계상 모델을 기다리지 않아 첫 프로브에서 바로 200 이고, 아래 180(15분) 여유도
          # 사문이었다(2026-10-03 DEV 실측: `/embed` 전부 500 인데 배포는 success).
          # 생존만 `/health` 로 남기는 이유: 모델을 못 읽는 이미지는 재시작해도 안 고쳐진다.
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.embedding.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
{{- end }}
