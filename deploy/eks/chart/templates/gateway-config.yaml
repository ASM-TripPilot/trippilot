apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway
  labels:
    {{- include "trippilot.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    worker_shutdown_timeout 630s;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      # Omit query strings and authorization headers from access logs.
      log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
      access_log /dev/stdout safe;
      server_tokens off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
      limit_req_status 429;
      upstream backend {
        server backend:8080;
        keepalive 32;
      }
      server {
        # TLS NLB idle timeout is fixed at 350s; TCP keepalives protect slow AI requests.
        listen 8080 so_keepalive=60s:10s:3;
        server_name _;
        client_max_body_size 20m;
        client_body_timeout 30s;
        client_header_timeout 10s;
        keepalive_timeout 65s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Service-Token "";
        proxy_connect_timeout 5s;
        # Schedule generation can take up to 610 seconds when deadlines are disabled.
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        proxy_buffering off;
        location = /healthz {
          access_log off;
          default_type text/plain;
          return 200 "ok\n";
        }
        location = /api {
          limit_req zone=api burst=30 nodelay;
          proxy_pass http://backend;
        }
        location /api/ {
          limit_req zone=api burst=30 nodelay;
          proxy_pass http://backend;
        }
        # /internal and /actuator are available exclusively on the private backend Service.
        location / { return 404; }
      }
    }
