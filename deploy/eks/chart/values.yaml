# Endpoints and immutable image tags are supplied from Terraform outputs by deploy-eks.yml.
environment: dev
rolloutNonce: ""
images:
  backend:
    repository: ""
    tag: ""
  ai:
    repository: ""
    tag: ""
  embedding:
    repository: ""
    tag: ""
  gateway:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.5-alpine-slim
imagePullPolicy: IfNotPresent
config:
  databaseHost: ""
  databasePort: 5432
  databaseName: trippilot
  databaseUser: app_user
  databaseMigrateUser: app_migrate
  redisHost: ""
  redisPort: 6379
  scheduleDeadlineEnforced: false
  scheduleDeadlineDay1Ms: 5000
  scheduleDeadlineTotalMs: 20000
backend:
  replicas: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
ai:
  replicas: 1
  # When enabled the Deployment stops rendering replicas — the HPA owns the count.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
embedding:
  # Optional CPU KURE service. Requires the vector database bootstrap and vector data ingestion.
  enabled: false
  replicas: 1
  resources:
    requests: { cpu: "2", memory: 5Gi }
    limits: { cpu: "2", memory: 6Gi }
gateway:
  certificateArn: ""
  # Informational: create DNS to the LoadBalancer hostname after the first deployment.
  hostname: ""
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  loadBalancerSourceRanges: [0.0.0.0/0]
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
reminderLlm:
  # Fine-tuned REMINDER_COPY model on an in-cluster GPU. Off until the Modal
  # baseline exists and a GPU NodePool is approved — see templates/reminder-llm.yaml.
  enabled: false
  # This exact string is also the Triton model repository directory and the
  # TRIPPILOT_LLM_FEATURE_MODELS assignment. It must start with "local".
  servedModelName: local-reminder-qwen3-4b-v1
  # Which transport the app uses for the fine-tuned model: "" (unset, today's
  # behaviour — the Bedrock ARN wins when present), "bedrock", or "local".
  # Setting "local" lets the in-cluster path be exercised WITHOUT deleting the
  # ARN from Secrets Manager, which is what makes it an experiment rather than
  # a migration: rolling back is a value change, not a secret restore.
  transport: ""
  image:
    repository: nvcr.io/nvidia/tritonserver
    tag: 24.08-vllm-python-py3
  modelClaimName: reminder-llm-models
  maxReplicas: 1
  cooldownSeconds: 300
  prometheusAddress: http://prometheus-server.monitoring:80
  resources:
    requests: { cpu: "2", memory: 12Gi }
    limits: { memory: 16Gi }
podDisruptionBudget:
  enabled: false
