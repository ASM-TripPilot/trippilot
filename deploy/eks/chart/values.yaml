# Endpoints and immutable image tags are supplied from Terraform outputs by deploy-eks.yml.
environment: dev
rolloutNonce: ""
images:
  backend:
    repository: ""
    tag: ""
  ai:
    repository: ""
    tag: ""
  embedding:
    repository: ""
    tag: ""
  gateway:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.5-alpine-slim
imagePullPolicy: IfNotPresent
config:
  databaseHost: ""
  databasePort: 5432
  databaseName: trippilot
  databaseUser: app_user
  databaseMigrateUser: app_migrate
  redisHost: ""
  redisPort: 6379
  scheduleDeadlineEnforced: false
  # 예산은 백엔드 코드 기본(ScheduleDeadlineProperties: 15s/60s)과 같게 둔다 — 종전 5s/20s 는
  # 코드 기본과 어긋난 드리프트였고, 실측 생성(~15s)에서 day1 이 거의 매번 터질 값이었다.
  scheduleDeadlineDay1Ms: 15000
  scheduleDeadlineTotalMs: 60000
backend:
  replicas: 1
  # 요청값은 **스케줄러가 노드를 고르는 값**이다(EKS Auto 의 Karpenter 가 요청 합으로 장비를 산다). 실사용에 맞춘다 —
  # 2026-10-16 Container Insights 3일 실측(시간 최대): CPU 평균 15m·정점 1.4코어(기동 순간), 메모리 정점 1,076Mi.
  # 종전 500m/1Gi 는 CPU 는 30배 넘게 크고 메모리는 정점보다 작았다 → CPU 형 노드(c5a)가 골라지고 메모리는 빠듯했다.
  # 상한(2코어)은 그대로라 기동·급증 순간은 종전처럼 쓴다.
  resources:
    requests: { cpu: 200m, memory: 1280Mi }
    limits: { cpu: "2", memory: 2Gi }
ai:
  replicas: 1
  # When enabled the Deployment stops rendering replicas — the HPA owns the count.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # 실측(위와 같은 창): CPU 평균 7m·정점 1.8코어, 메모리 정점 481Mi.
  # **요청은 1코어** — 일정 조립(CP-SAT)은 한 번에 1~2코어를 몰아 쓰는데, 요청이 200m 이면 붐비는 노드에서 보장 몫이
  # 0.2코어라 풀이가 멈춘다. 2026-10-18 개발 서버(복제본 1): "결정론 한도 전에 벽시계 백스톱으로 끊김 det 0.00/2.00" —
  # 계산 진척 0 인 채 조립 76초, 생성 4건 전부 504(서울 1일·후보 1888). 평균이 낮아도 생성 순간의 몫을 보장해야 한다.
  # Auto Mode 라 요청을 올리면 노드가 따라 늘어난다(스케줄 실패 없음, 비용 증가). HPA 목표(요청의 70%)는 평균 700m 에서 반응한다.
  resources:
    requests: { cpu: "1", memory: 640Mi }
    limits: { cpu: "2", memory: 2Gi }
embedding:
  # Optional CPU KURE service. Requires the vector database bootstrap and vector data ingestion.
  enabled: false
  replicas: 1
  resources:
    # 메모리는 AI 팀 실측(모델 프로세스 4.2~4.4GiB, ai/docs/임베딩-사이징-근거.md)대로 둔다. CPU 는 평균 12m 이고
    # 2코어를 쓰는 것은 KB 적재·배치 인코딩 순간뿐이라 요청만 1코어로 — 상한 2코어는 그대로다.
    # 붐비는 노드에서 첫 전량 적재가 느려질 수 있어 적재 마감을 90분으로 늘렸다(runtime_kb.DEADLINE_SEC).
    # 이 값은 values-prd.yaml 도 그대로 받는다(override 없음).
    requests: { cpu: "1", memory: 5Gi }
    limits: { cpu: "2", memory: 6Gi }
gateway:
  certificateArn: ""
  # Informational: create DNS to the LoadBalancer hostname after the first deployment.
  hostname: ""
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  loadBalancerSourceRanges: [0.0.0.0/0]
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
podDisruptionBudget:
  enabled: false
