# NetworkPolicy 집행 스위치 — 이게 없으면 차트의 NetworkPolicy(network-policy.yaml)는 만들어지기만 하고 집행되지 않는다
# (EKS Auto Mode 의 VPC CNI 는 이 ConfigMap 을 보고 정책 컨트롤러를 켠다). 2026-11-08 손으로 적용한 것을 코드로 옮겼다 —
# 클러스터를 다시 만들어도 배포가 다시 켠다. 클러스터 전역이라 Helm 릴리스(네임스페이스 단위) 밖에서 aws-deploy 가 적용한다.
# 되돌리기: kubectl -n kube-system delete configmap amazon-vpc-cni
apiVersion: v1
kind: ConfigMap
metadata:
  name: amazon-vpc-cni
  namespace: kube-system
data:
  enable-network-policy-controller: "true"
