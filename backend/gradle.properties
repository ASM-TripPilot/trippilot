org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# ── 힙 (BUILD-OOM) ───────────────────────────────────────────────────────────
# **기본값이 `-Xmx512m` 이다.** 설정이 없으면 Gradle 이 그 값을 쓰는데, 이 리포는 모듈이
# 열댓 개이고 `org.gradle.parallel=true` 라 그 512MB 를 여럿이 동시에 다툰다. 32GB 머신에서
# 그러고 있었다 — 2026-09-25 하루에 로컬 4회·CI 2회가 이것으로 죽었다:
#
#   OutOfMemoryError (ByteString.java / EnumSet.java)          ← 테스트 JVM
#   CompilationException: Back-end (JVM) Internal error        ← Kotlin 컴파일 데몬
#
# **재실행하면 통과한다는 것이 이 결함의 진짜 해악이다** — 진짜 실패와 구별되지 않아
# "빨가면 일단 재실행"이 관행이 되고, 그 관행이 실제 회귀를 덮는다(같은 날 역검증이
# 두 번 무효였던 것과 같은 부류).
#
# 값은 **CI 러너 기준**으로 잡는다(ubuntu-latest ≈ 4코어 16GB). 로컬(10코어 32GB)은 여유가
# 있지만 여기를 로컬에 맞추면 CI 가 스왑으로 들어가 더 느려진다.
#   데몬 3g + Kotlin 데몬 2g + 테스트 워커(아래 maxHeapSize) 가 동시에 뜬다.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Kotlin 컴파일 데몬은 **별도 JVM 이라 위 값을 안 물려받는다.** 안 적으면 여기만 512m 으로
# 남아 `CompilationException` 이 계속 난다(위 두 증상 중 뒤엣것).
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
