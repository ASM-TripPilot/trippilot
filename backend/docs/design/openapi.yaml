        '404': { description: 없음/타 계정 }

  /trips:
    post:
      tags: [trips]
      summary: 여행 생성(다도시·국내강제·날짜/Σnights 검증 · 취향 동결)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTripRequest' } } }
      responses:
        '201': { description: 생성됨, content: { application/json: { schema: { $ref: '#/components/schemas/Trip' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [trips]
      summary: 내 여행 목록(삭제 제외)
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }

  /trips/{tripId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 여행 조회(소유자만 · 타 계정/삭제 404)
      responses:
        '200': { description: 여행, content: { application/json: { schema: { $ref: '#/components/schemas/Trip' } } } }
