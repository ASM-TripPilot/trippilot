openapi: 3.1.0
info:
  title: TripPilot U1 API (소셜 로그인 전용 MVP)
  version: 0.1.0-draft
  description: >
    U1 기반·계정·온보딩 (M1 Auth · M2 Profile · C3 Moderation).
    소셜 로그인 전용 — 이메일/비밀번호 로그인은 후속 이연.
    정본 대조: docs/design/U1-API-설계.md, U1-DB스키마-설계.md, U1-내부아키텍처-설계.md
servers:
  - url: https://api.trippilot.app/api/v1
    description: prod (가칭)
  - url: http://localhost:8080/api/v1
    description: local

security:
  - bearerAuth: []          # 전역 기본 = 인증 필요. 공개 엔드포인트는 security:[] 로 개별 해제.

tags:
  - name: auth
  - name: onboarding
  - name: location
  - name: profile
  - name: preferences
  - name: account
  - name: bootstrap

paths:
  /auth/social/{provider}:
    post:
      tags: [auth]
      summary: 소셜 로그인/가입 (서버 code 교환)
      description: 신규 (provider, sub)=가입(즉시 ACTIVE, 연령확인 필수)·기존=로그인.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple, kakao, naver] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialLoginRequest' }
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/SocialAuthFailed' }
        '409': { $ref: '#/components/responses/SocialEmailConflict' }
        '422': { $ref: '#/components/responses/AgeNotMet' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/social/{provider}/token:
    post:
      tags: [auth]
      summary: 소셜 로그인/가입 (네이티브 SDK access token)
      description: >
        카카오·네이버 등 네이티브 SDK가 발급한 access token 을 전달(서버 code 교환 없음, redirect 불필요).
        서버는 토큰으로 userinfo 만 호출. 이후 계정 upsert·토큰 발급은 code 흐름과 동일. (Apple 미지원.)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [kakao, naver, google] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialTokenLoginRequest' }
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/SocialAuthFailed' }
        '409': { $ref: '#/components/responses/SocialEmailConflict' }
        '422': { $ref: '#/components/responses/AgeNotMet' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token/refresh:
    post:
      tags: [auth]
      summary: 리프레시 토큰 회전
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 새 TokenPair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: 무효·만료 또는 회전 토큰 재사용(체인 무효화)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 현재 기기 체인 revoke
      responses:
        '204': { description: 로그아웃 완료 }

  /terms:
    get:
      tags: [onboarding]
      summary: 현행 약관/문서 목록
      security: []
      responses:
        '200':
          description: 현행 약관 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TermsVersion' }

  /terms/{termsType}:
    get:
      tags: [onboarding]
      summary: 특정 약관 현행 버전
      security: []
      parameters:
        - name: termsType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TermsType' }
      responses:
        '200':
          description: 약관 현행 버전
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bootstrap:
    get:
      tags: [bootstrap]
      summary: 앱 기동 분기 (강제 업데이트 > 재동의 > 세션)
      description: Bearer 선택 — 무토큰이면 session.state=GUEST.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: 기동 분기 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapResponse' }

  /me:
    get:
      tags: [account]
      summary: 계정 요약
      responses:
        '200':
          description: 계정 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummary' }

  /me/consents:
    get:
      tags: [onboarding]
      summary: 항목별 현재 동의 상태(증적 폴드)
      responses:
        '200':
          description: 동의 상태
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentState' }
    post:
      tags: [onboarding]
      summary: 온보딩 일괄 동의 제출(필수 3종 + 선택)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentSubmission' }
      responses:
        '200': { description: 반영 완료 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/consents/{termsType}:
    patch:
      tags: [onboarding]
      summary: 개별 동의 GRANT/REVOKE (설정·재동의)
      parameters:
        - name: termsType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TermsType' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, termsVersion]
              properties:
                action: { type: string, enum: [GRANT, REVOKE] }
                termsVersion: { type: string }
      responses:
        '200': { description: 반영 완료 }

  /me/marketing-consent:
    put:
      tags: [onboarding]
      summary: 마케팅 수신 동의 토글(수집만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optIn]
              properties:
                optIn: { type: boolean }
      responses:
        '200': { description: 반영 완료 }

  /me/location-consent:
    get:
      tags: [location]
      summary: 위치 동의 3층 상태 + 유효 능력
      responses:
        '200':
          description: 위치 동의 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationConsent' }
    put:
      tags: [location]
      summary: L2(법정)·L3(GPS 옵트인) 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legalConsent: { type: boolean }
                gpsRecordingOptIn: { type: boolean }
      responses:
        '200':
          description: 반영 완료(철회 시 파기 트리거)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationConsent' }

  /me/location-consent/os-permission:
    patch:
      tags: [location]
      summary: L1 OS 권한 미러 보고(단말→서버)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [osPermission]
              properties:
                osPermission: { type: string, enum: [GRANTED, DENIED, NOT_DETERMINED] }
      responses:
        '200': { description: 반영 완료 }

  /me/profile:
    get:
      tags: [profile]
      summary: 프로필 조회
      responses:
        '200':
          description: 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }

  /me/profile/nickname:
    patch:
      tags: [profile]
      summary: 닉네임 변경(길이·금칙어·유니크 검증)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, minLength: 2, maxLength: 20 }
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '409': { $ref: '#/components/responses/NicknameTaken' }
        '503': { $ref: '#/components/responses/ModerationUnavailable' }

  /nickname/suggestions:
    post:
      tags: [profile]
      summary: 자동 생성 닉네임 후보(사전 검증 통과값)
      responses:
        '200':
          description: 후보 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { type: string }

  /nickname/check:
    post:
      tags: [profile]
      summary: 닉네임 유효성 검사(매칭 원문 미노출)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        '200':
          description: 검사 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  reason:
                    type: string
                    enum: [OK, TOO_SHORT, TOO_LONG, BANNED_WORD, TAKEN]
        '503': { $ref: '#/components/responses/ModerationUnavailable' }

  /onboarding/complete:
    post:
      tags: [onboarding]
      summary: 온보딩 완료 처리(멱등 — 약관+닉네임 판정)
      responses:
        '200':
          description: 완료 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingCompletedAt: { type: string, format: date-time, nullable: true }

  /me/preferences:
    get:
      tags: [preferences]
      summary: 취향 7축 조회(항상 완전 — 미설정은 중립 기본값 파생)
      responses:
        '200':
          description: 취향 7축
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceView' }
    put:
      tags: [preferences]
      summary: 취향 7축 저장(부분 허용, 즉시 반영)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenceInput' }
      responses:
        '200': { description: 저장 완료 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/deletion:
    post:
      tags: [account]
      summary: 계정 삭제 요청(→ DELETION_PENDING, GPS 즉시 파기)
      responses:
        '200':
          description: 유예 시작
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResponse' }
    delete:
      tags: [account]
      summary: 유예 내 삭제 철회(→ ACTIVE)
      responses:
        '200': { description: 철회 완료 }
        '404': { $ref: '#/components/responses/NotFound' }

  /stays/search:
    get:
      tags: [stays]
      summary: 숙소 탐색(날짜·인원 없이 · 최저가순)
      description: >
        지역·편의시설·유형으로 탐색. 필터는 AND, 정렬은 최저가순 고정(BR-U1-15).
        가격은 최저가 스냅숏뿐(미확인은 null · BR-U1-14). 소요시간 미표시·거리만(INV-3).
        lat·lng 로 '내 주변' 좌표 스코프(US-STAY-01 · BR-U1-11) — region·필터와 AND 로 걸린다.
        좌표는 필터가 아니라 스코프라 filterZeroReasons(완화 제안)에 나타나지 않는다.
      parameters:
        - { name: region, in: query, required: false, schema: { type: string }, description: '여행지(예: 제주)' }
        - { name: amenity, in: query, required: false, schema: { type: array, items: { type: string } }, description: 편의시설 AND 필터 }
        - { name: stayType, in: query, required: false, schema: { type: array, items: { type: string } }, description: 숙소 유형 필터 }
        - { name: lat, in: query, required: false, schema: { type: number, format: double, minimum: -90, maximum: 90 }, description: "'내 주변' 중심 위도. lng 와 짝이다 — 한쪽만 보내면 400" }
        - { name: lng, in: query, required: false, schema: { type: number, format: double, minimum: -180, maximum: 180 }, description: "'내 주변' 중심 경도. lat 와 짝이다 — 한쪽만 보내면 400" }
        - { name: radiusKm, in: query, required: false, schema: { type: number, format: double, exclusiveMinimum: 0, default: 5 }, description: 검색 반경(km). 좌표가 있을 때만 의미가 있고 생략하면 5km. 중심 없이 단독으로 보내면 400 }
      responses:
        '200':
          description: 탐색 결과(최저가순)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaySearchResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /stays/geocode:
    get:
      tags: [stays]
      summary: 등록용 지오코딩(장소 검색 → 좌표 후보 multi-candidate)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 좌표 후보
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GeocodeCandidate' } }

  /places:
    get:
      tags: [places]
      summary: 장소(POI) 탐색 — ACTIVE만(INV-U1-01), 지역·카테고리 필터
      description: >
        수집 게이트(INV-1) 통과한 정본 POI. 소요시간 미표시(INV-3). 반경/취향 후보풀은 별도(C8 소비).
      parameters:
        - { name: region, in: query, required: false, schema: { type: string }, description: '지역(예: 제주)' }
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/PoiCategory' } }
      responses:
        '200':
          description: ACTIVE POI 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Place' } }

  /saved-places:
    post:
      tags: [places]
      summary: 장소 담기(POI 북마크) — (계정,POI) 유일(INV-U1-04), ACTIVE POI만
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavePlaceRequest' } } }
      responses:
        '201': { description: 담김, content: { application/json: { schema: { $ref: '#/components/schemas/SavedPlace' } } } }
        '404': { description: POI 없음/비-ACTIVE }
        '409': { description: 이미 담은 장소 }
    get:
      tags: [places]
      summary: 내 담은 장소 목록(POI 정보 포함)
      responses:
        '200':
          description: 담은 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedPlace' } }
  /saved-places/{savedPlaceId}:
    parameters:
      - { name: savedPlaceId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [places]
      summary: 담기 해제(소유자만 · 타 계정 404)
      responses:
        '204': { description: 해제됨 }
        '404': { description: 없음/타 계정 }

  /saved-stays:
    post:
      tags: [saved-stays]
      summary: 숙소 등록(3경로 · 좌표/날짜 선택)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterSavedStayRequest' }
      responses:
        '201': { description: 등록됨, content: { application/json: { schema: { $ref: '#/components/schemas/SavedStay' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [saved-stays]
      summary: 내 저장 숙소 목록
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedStay' } }

  /saved-stays/{savedStayId}:
    parameters:
      - { name: savedStayId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [saved-stays]
      summary: 저장 숙소 조회(소유자만 · 타 계정 404)
      responses:
        '200': { description: 숙소, content: { application/json: { schema: { $ref: '#/components/schemas/SavedStay' } } } }
        '404': { description: 없음/타 계정 }
    patch:
      tags: [saved-stays]
      summary: 저장 숙소 편집(가변 필드 대체 · 좌표 확정)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditSavedStayRequest' }
      responses:
        '200': { description: 수정됨, content: { application/json: { schema: { $ref: '#/components/schemas/SavedStay' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없음/타 계정 }
    delete:
      tags: [saved-stays]
      summary: 저장 숙소 삭제(소유자만)
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 없음/타 계정 }

  /trips:
    post:
      tags: [trips]
      summary: 여행 생성(다도시·국내강제·날짜/Σnights 검증 · 취향 동결)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTripRequest' } } }
      responses:
        '201': { description: 생성됨, content: { application/json: { schema: { $ref: '#/components/schemas/Trip' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [trips]
      summary: 내 여행 목록(삭제 제외)
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }

  /trips/{tripId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 여행 조회(소유자만 · 타 계정/삭제 404)
      responses:
        '200': { description: 여행, content: { application/json: { schema: { $ref: '#/components/schemas/Trip' } } } }
        '404': { description: 없음/타 계정 }
    patch:
      tags: [trips]
      summary: 여행 편집(가변 필드 대체 · 종료·삭제 후 불가)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EditTripRequest' } } }
      responses:
        '200': { description: 수정됨, content: { application/json: { schema: { $ref: '#/components/schemas/Trip' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없음/타 계정 }
    delete:
      tags: [trips]
      summary: 여행 삭제(소프트)
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 없음/타 계정 }

  /trips/{tripId}/bases:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 구간 거점 배정(등록 숙소를 [dateFrom, dateTo) 거점으로 · 여행 기간 내 INV-U1-15)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssignBaseRequest' } } }
      responses:
        '201': { description: 배정됨, content: { application/json: { schema: { $ref: '#/components/schemas/BaseAssignment' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없음/타 계정(여행 또는 숙소) }
    get:
      tags: [trips]
      summary: 여행 거점 목록
      responses:
        '200': { description: 거점 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BaseAssignment' } } } } }
        '404': { description: 없음/타 계정 }
  /trips/{tripId}/bases/{baseAssignmentId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: baseAssignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [trips]
      summary: 거점 배정 삭제
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 없음/타 계정 }
  /trips/{tripId}/coverage:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 커버리지 상태(숙박일별 auto/gap/overlap · blocked면 일정 생성 진입 차단 INV-U1-16)
      responses:
        '200': { description: 커버리지, content: { application/json: { schema: { $ref: '#/components/schemas/Coverage' } } } }
        '404': { description: 없음/타 계정 }

  /trips/{tripId}/must-visits:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 필수 방문지 추가 — POI 동결 스냅숏 참조(INV-U1-03) · FIXED 날짜·시각(INV-U1-17)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddMustVisitRequest' } } }
      responses:
        '201': { description: 추가됨, content: { application/json: { schema: { $ref: '#/components/schemas/MustVisit' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 여행/POI 없음·비-ACTIVE·타 계정 }
        '409': { description: 이미 추가된 필수 방문지(INV-U1-18) }
    get:
      tags: [trips]
      summary: 여행 필수 방문지 목록
      responses:
        '200': { description: 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MustVisit' } } } } }
        '404': { description: 없음/타 계정 }
  /trips/{tripId}/must-visits/{mustVisitId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: mustVisitId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [trips]
      summary: 필수 방문지 삭제
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 없음/타 계정 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PoiCategory:
      type: string
      enum: [명소, 맛집, 카페, 야경, 자연, 쇼핑, 문화]

    Place:
      type: object
      required: [poiId, nameKo, category, lat, lng, savedCount, dataStatus]
      properties:
        poiId: { type: string, format: uuid }
        nameKo: { type: string }
        category: { $ref: '#/components/schemas/PoiCategory' }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        region: { type: string, nullable: true }
        openingHours: { type: string, nullable: true, description: NULL=미확인 }
        savedCount: { type: integer, format: int64 }
        dataStatus:
          type: string
          enum: [ACTIVE, UNVERIFIED, LOST, CLOSED]
          description: 탐색은 항상 ACTIVE, 담기 목록은 폐업(CLOSED)·미검증(UNVERIFIED)도 포함 — 클라 뱃지

    SavePlaceRequest:
      type: object
      required: [poiId]
      properties:
        poiId: { type: string, format: uuid, description: 담을 ACTIVE POI }

    SavedPlace:
      type: object
      required: [savedPlaceId, savedAt, place]
      properties:
        savedPlaceId: { type: string, format: uuid }
        savedAt: { type: string, format: date-time }
        place: { $ref: '#/components/schemas/Place' }

    StaySearchResponse:
      type: object
      required: [items, degraded, filterZeroReasons]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StayItem' } }
        degraded: { type: boolean, description: 일부 공급자 실패 시 true(부분 결과·재시도 안내) }
        filterZeroReasons: { type: array, items: { type: string }, description: '필터로 0건일 때 완화 후보(예: stayType, amenity:오션뷰)' }

    StayItem:
      type: object
      required: [externalSource, externalId, name, lat, lng, region, amenities, stayType]
      properties:
        externalSource: { type: string }
        externalId: { type: string }
        name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        region: { type: string }
        amenities: { type: array, items: { type: string } }
        stayType: { type: string }
        price:
          allOf: [{ $ref: '#/components/schemas/StayPrice' }]
          nullable: true
          description: 최저가 스냅숏('부터 가격'). null=가격 미확인(BR-U1-14)

    StayPrice:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64 }
        currency: { type: string, example: KRW }

    RegisterRoute:
      type: string
      enum: [MAP_SEARCH, LINK_PASTE, PIN]

    SavedStay:
      type: object
      required: [savedStayId, name, coordConfirmed, registerRoute, createdAt, updatedAt]
      properties:
        savedStayId: { type: string, format: uuid }
        name: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        coordConfirmed: { type: boolean, description: false면 거점 배정 불가(INV-U1-08) }
        checkIn: { type: string, format: date, nullable: true }
        checkOut: { type: string, format: date, nullable: true }
        externalSource: { type: string, nullable: true }
        externalId: { type: string, nullable: true }
        registerRoute: { $ref: '#/components/schemas/RegisterRoute' }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterSavedStayRequest:
      type: object
      required: [name, registerRoute]
      properties:
        name: { type: string }
        registerRoute: { $ref: '#/components/schemas/RegisterRoute' }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        coordConfirmed: { type: boolean, default: false }
        checkIn: { type: string, format: date, nullable: true }
        checkOut: { type: string, format: date, nullable: true }
        externalSource: { type: string, nullable: true }
        externalId: { type: string, nullable: true }
        memo: { type: string, nullable: true }

    EditSavedStayRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        coordConfirmed: { type: boolean, default: false }
        checkIn: { type: string, format: date, nullable: true }
        checkOut: { type: string, format: date, nullable: true }
        memo: { type: string, nullable: true }

    GeocodeCandidate:
      type: object
      required: [name, address, lat, lng]
      properties:
        name: { type: string }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    TripStatus:
      type: string
      enum: [PLANNED, CONFIRMED, ACTIVE, ENDED]

    CompanionType:
      type: string
      enum: [혼자, 친구, 연인, 가족]

    TripDestination:
      type: object
      required: [seq, region, nights]
      properties:
        seq: { type: integer }
        region: { type: string }
        nights: { type: integer }

    Trip:
      type: object
      required: [tripId, title, startDate, endDate, party, preferenceSnapshot, destinations, status, createdAt, updatedAt]
      properties:
        tripId: { type: string, format: uuid }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        party: { type: integer }
        companionType: { allOf: [{ $ref: '#/components/schemas/CompanionType' }], nullable: true }
        budgetTotal: { type: integer, format: int64, nullable: true }
        preferenceSnapshot: { type: object, additionalProperties: true, description: 생성 시점 취향 동결(jsonb) }
        destinations: { type: array, items: { $ref: '#/components/schemas/TripDestination' } }
        status: { $ref: '#/components/schemas/TripStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTripRequest:
      type: object
      required: [startDate, endDate, destinations]
      properties:
        title: { type: string, nullable: true, description: 미입력 시 목적지 기반 자동생성 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        party: { type: integer, default: 1 }
        companionType: { allOf: [{ $ref: '#/components/schemas/CompanionType' }], nullable: true }
        budgetTotal: { type: integer, format: int64, nullable: true }
        preferenceSnapshot: { type: object, additionalProperties: true }
        destinations: { type: array, items: { $ref: '#/components/schemas/TripDestination' } }

    EditTripRequest:
      type: object
      required: [startDate, endDate, destinations]
      properties:
        title: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        party: { type: integer, default: 1 }
        companionType: { allOf: [{ $ref: '#/components/schemas/CompanionType' }], nullable: true }
        budgetTotal: { type: integer, format: int64, nullable: true }
        destinations: { type: array, items: { $ref: '#/components/schemas/TripDestination' } }

    AssignBaseRequest:
      type: object
      required: [savedStayId, dateFrom, dateTo]
      properties:
        savedStayId: { type: string, format: uuid, description: 소유 등록 숙소 }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date, description: dateTo > dateFrom · 여행 기간 내(INV-U1-15) }

    BaseAssignment:
      type: object
      required: [baseAssignmentId, savedStayId, dateFrom, dateTo]
      properties:
        baseAssignmentId: { type: string, format: uuid }
        savedStayId: { type: string, format: uuid }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }

    Coverage:
      type: object
      required: [blocked, days]
      properties:
        blocked: { type: boolean, description: 미해결(gap/overlap)이 하나라도 있으면 true — 일정 생성 진입 차단(INV-U1-16) }
        days: { type: array, items: { $ref: '#/components/schemas/DayCoverage' } }

    DayCoverage:
      type: object
      required: [date, status]
      properties:
        date: { type: string, format: date }
        status: { type: string, enum: [AUTO, GAP, OVERLAP], description: AUTO=후보1(확정) · GAP=후보0(공백) · OVERLAP=후보≥2(겹침) }
        savedStayId: { type: string, format: uuid, nullable: true, description: AUTO일 때만 확정 거점 }

    MustVisitType:
      type: string
      enum: [ANYTIME, FIXED]

    AddMustVisitRequest:
      type: object
      required: [poiId, type]
      properties:
        poiId: { type: string, format: uuid, description: 담을 ACTIVE POI(동결 스냅숏으로 참조) }
        type: { $ref: '#/components/schemas/MustVisitType' }
        fixedDate: { type: string, format: date, nullable: true, description: FIXED면 필수(INV-U1-17) }
        fixedStart: { type: string, format: partial-time, nullable: true, description: 'FIXED면 필수 · HH:mm[:ss]' }
        dwellMin: { type: integer, nullable: true, description: 체류 희망 분(솔버 입력) }

    MustVisit:
      type: object
      required: [mustVisitId, poiSnapshotId, sourcePoiId, type]
      properties:
        mustVisitId: { type: string, format: uuid }
        poiSnapshotId: { type: string, format: uuid, description: 동결 스냅숏 참조(INV-U1-03) }
        sourcePoiId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MustVisitType' }
        fixedDate: { type: string, format: date, nullable: true }
        fixedStart: { type: string, nullable: true }
        dwellMin: { type: integer, nullable: true }

    TermsType:
      type: string
      enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, LOCATION_TERMS, MARKETING, GPS_RECORDING, PERSONALIZATION]

    AgeConfirmation:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [BIRTH_DATE, SELF_DECLARED] }
        birthDate: { type: string, format: date, nullable: true }

    SocialLoginRequest:
      type: object
      required: [authorizationCode, codeVerifier, redirectUri]
      properties:
        authorizationCode: { type: string }
        codeVerifier: { type: string }
        redirectUri: { type: string }
        ageConfirmation:
          allOf: [{ $ref: '#/components/schemas/AgeConfirmation' }]
          description: 신규 가입 시 필수, 기존 로그인 시 무시

    SocialTokenLoginRequest:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string, description: 네이티브 SDK가 발급한 제공자 access token }
        ageConfirmation:
          allOf: [{ $ref: '#/components/schemas/AgeConfirmation' }]
          description: 신규 가입 시 필수, 기존 로그인 시 무시
        deviceId: { type: string, nullable: true, description: 미제공 시 서버가 임의 부여(기기별 세션) }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer, example: 7776000 }
        isNewUser: { type: boolean }
        account: { $ref: '#/components/schemas/AccountSummary' }

    AccountSummary:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, DELETION_PENDING] }
        email: { type: string, nullable: true }
        socialProviders:
          type: array
          items: { type: string, enum: [GOOGLE, APPLE, KAKAO, NAVER] }
        onboardingCompleted: { type: boolean }

    TermsVersion:
      type: object
      properties:
        termsType: { $ref: '#/components/schemas/TermsType' }
        version: { type: string }
        body: { type: string }
        effectiveAt: { type: string, format: date-time }
        reconsentRequired: { type: boolean }

    ConsentState:
      type: object
      properties:
        termsType: { $ref: '#/components/schemas/TermsType' }
        granted: { type: boolean }
        termsVersion: { type: string }

    ConsentSubmission:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items:
            type: object
            required: [termsType, termsVersion, action]
            properties:
              termsType: { $ref: '#/components/schemas/TermsType' }
              termsVersion: { type: string }
              action: { type: string, enum: [GRANT, REVOKE] }

    LocationConsent:
      type: object
      properties:
        osPermissionMirror: { type: string, enum: [GRANTED, DENIED, NOT_DETERMINED] }
        legalConsent: { type: boolean }
        gpsRecordingOptIn: { type: boolean }
        capabilities:
          type: object
          properties:
            localLocationUse: { type: boolean }
            serverLocationService: { type: boolean }
            gpsTrackRetention: { type: boolean }

    Profile:
      type: object
      properties:
        nickname: { type: string }
        nicknameUpdatedAt: { type: string, format: date-time }
        onboardingCompletedAt: { type: string, format: date-time, nullable: true }

    PreferenceView:
      description: 각 축은 value + isNeutralDefault(중립 기본값 파생 여부)
      type: object
      properties:
        styles: { $ref: '#/components/schemas/PrefArrayAxis' }
        activities: { $ref: '#/components/schemas/PrefArrayAxis' }
        transportModes: { $ref: '#/components/schemas/PrefArrayAxis' }
        foodTastes: { $ref: '#/components/schemas/PrefArrayAxis' }
        pace: { $ref: '#/components/schemas/PrefScalarAxis' }
        companion:
          type: object
          properties:
            companionTypes: { type: array, items: { type: string } }
            petFlag: { type: boolean }
            isNeutralDefault: { type: boolean }
        budget:
          type: object
          properties:
            tier: { type: string, nullable: true }
            rawAmount: { type: integer, nullable: true }
            isNeutralDefault: { type: boolean }

    PrefArrayAxis:
      type: object
      properties:
        value: { type: array, items: { type: string } }
        isNeutralDefault: { type: boolean }

    PrefScalarAxis:
      type: object
      properties:
        value: { type: string, nullable: true }
        isNeutralDefault: { type: boolean }

    PreferenceInput:
      description: 축별 생략 = 미변경, null 전송 = 미설정으로 초기화. 배열 축은 다중 선택.
      type: object
      properties:
        styles: { type: array, items: { type: string, enum: [휴양, 관광, 액티비티, 미식, 쇼핑, 자연, 문화예술] }, nullable: true }
        activities: { type: array, items: { type: string, enum: [자연, 역사문화, 테마파크, 맛집투어, 카페, 전시, 야경, 쇼핑] }, nullable: true }
        transportModes: { type: array, items: { type: string, enum: [도보, 대중교통, 렌터카, 택시, 자전거] }, nullable: true }
        foodTastes: { type: array, items: { type: string, enum: [한식, 양식, 일식, 중식, 아시안] }, nullable: true }
        companionTypes: { type: array, items: { type: string, enum: [혼자, 커플, 친구, 가족, 부모님] }, nullable: true }
        petFlag: { type: boolean }
        pace: { type: string, enum: [느긋하게, 균형있게, 알차게], nullable: true }
        budgetTier: { type: string, enum: [저가, 중간, 고급, 럭셔리], nullable: true }
        budgetRawAmount: { type: integer, nullable: true }

    BootstrapResponse:
      type: object
      properties:
        appUpdate:
          type: object
          properties:
            status: { type: string, enum: [FORCED, RECOMMENDED, NONE] }
            minSupportedVersion: { type: string }
        reconsent:
          type: object
          properties:
            required: { type: boolean }
            termsTypes:
              type: array
              items: { $ref: '#/components/schemas/TermsType' }
        session:
          type: object
          properties:
            state: { type: string, enum: [AUTHENTICATED, GUEST, ONBOARDING_INCOMPLETE] }
            onboardingCompleted: { type: boolean }

    DeletionResponse:
      type: object
      properties:
        purgeAt: { type: string, format: date-time }
        cascadeSummary:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            traceId: { type: string }
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }

  responses:
    ValidationError:
      description: 입력 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NicknameTaken:
      description: 닉네임 유니크 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SocialAuthFailed:
      description: 소셜 code 교환·토큰 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SocialEmailConflict:
      description: 소셜 이메일이 타 계정과 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AgeNotMet:
      description: 만 14세 미만(생성 차단)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: 요청 한도 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ModerationUnavailable:
      description: 모더레이션 서비스 일시 불가
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
