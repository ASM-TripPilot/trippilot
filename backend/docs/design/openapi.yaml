openapi: 3.1.0
info:
  title: TripPilot U1 API (소셜 로그인 전용 MVP)
  version: 0.1.0-draft
  description: >
    U1 기반·계정·온보딩 (M1 Auth · M2 Profile · C3 Moderation).
    소셜 로그인 전용 — 이메일/비밀번호 로그인은 후속 이연.
    정본 대조: docs/design/U1-API-설계.md, U1-DB스키마-설계.md, U1-내부아키텍처-설계.md
servers:
  - url: https://api.trippilot.app/api/v1
    description: prod (가칭)
  - url: http://localhost:8080/api/v1
    description: local

security:
  - bearerAuth: []          # 전역 기본 = 인증 필요. 공개 엔드포인트는 security:[] 로 개별 해제.

tags:
  - name: reflection
  - name: auth
  - name: onboarding
  - name: location
  - name: profile
  - name: preferences
  - name: account
  - name: bootstrap
  - name: notification

paths:
  /auth/social/{provider}:
    post:
      tags: [auth]
      summary: 소셜 로그인/가입 (서버 code 교환)
      description: 신규 (provider, sub)=가입(즉시 ACTIVE, 연령확인 필수)·기존=로그인.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple, kakao, naver] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialLoginRequest' }
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          description: >
            입력 검증 실패 — 지원하지 않는 `provider`, 필수 필드 누락, 신규 가입 시 연령확인 누락.
            **연령확인은 400 과 422 로 갈린다**: 값이 아예 없으면 400(입력 문제),
            값은 있는데 만 14세 미만이면 422(규칙 위반)다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/SocialAuthFailed' }
        '409': { $ref: '#/components/responses/SocialEmailConflict' }
        '422': { $ref: '#/components/responses/AgeNotMet' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/social/{provider}/token:
    post:
      tags: [auth]
      summary: 소셜 로그인/가입 (네이티브 SDK access token)
      description: >
        카카오·네이버 등 네이티브 SDK가 발급한 access token 을 전달(서버 code 교환 없음, redirect 불필요).
        서버는 토큰으로 userinfo 만 호출. 이후 계정 upsert·토큰 발급은 code 흐름과 동일. (Apple 미지원.)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [kakao, naver, google] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialTokenLoginRequest' }
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          description: >
            입력 검증 실패 — 지원하지 않는 `provider`, `accessToken` 누락, 신규 가입 시 연령확인 누락.
            연령은 **없으면 400 · 만 14세 미만이면 422** 로 갈린다(BR-U0-05).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/SocialAuthFailed' }
        '409': { $ref: '#/components/responses/SocialEmailConflict' }
        '422': { $ref: '#/components/responses/AgeNotMet' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token/refresh:
    post:
      tags: [auth]
      summary: 리프레시 토큰 회전
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 새 TokenPair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: 무효·만료 또는 회전 토큰 재사용(체인 무효화)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 현재 기기 체인 revoke
      responses:
        '204': { description: 로그아웃 완료 }

  /terms:
    get:
      tags: [onboarding]
      summary: 현행 약관/문서 목록
      security: []
      responses:
        '200':
          description: 현행 약관 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TermsVersion' }

  /terms/{termsType}:
    get:
      tags: [onboarding]
      summary: 특정 약관 현행 버전
      security: []
      parameters:
        - name: termsType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TermsType' }
      responses:
        '200':
          description: 약관 현행 버전
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bootstrap:
    get:
      tags: [bootstrap]
      summary: 앱 기동 분기 (강제 업데이트 > 재동의 > 세션)
      description: Bearer 선택 — 무토큰이면 session.state=GUEST.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: 기동 분기 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapResponse' }

  /me:
    get:
      tags: [account]
      summary: 계정 요약
      responses:
        '200':
          description: 계정 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummary' }

  /me/consents:
    get:
      tags: [onboarding]
      summary: 항목별 현재 동의 상태(증적 폴드)
      responses:
        '200':
          description: 동의 상태
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentState' }
    post:
      tags: [onboarding]
      summary: 온보딩 일괄 동의 제출(필수 3종 + 선택)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentSubmission' }
      responses:
        '200': { description: 반영 완료 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/consents/{termsType}:
    patch:
      tags: [onboarding]
      summary: 개별 동의 GRANT/REVOKE (설정·재동의)
      parameters:
        - name: termsType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TermsType' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, termsVersion]
              properties:
                action: { type: string, enum: [GRANT, REVOKE] }
                termsVersion: { type: string }
      responses:
        '200': { description: 반영 완료 }

  /me/marketing-consent:
    put:
      tags: [onboarding]
      summary: 마케팅 수신 동의 토글(수집만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optIn]
              properties:
                optIn: { type: boolean }
      responses:
        '200': { description: 반영 완료 }

  /me/location-consent:
    get:
      tags: [location]
      summary: 위치 동의 3층 상태 + 유효 능력
      responses:
        '200':
          description: 위치 동의 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationConsent' }
    put:
      tags: [location]
      summary: L2(법정)·L3(GPS 옵트인) 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legalConsent: { type: boolean }
                gpsRecordingOptIn: { type: boolean }
      responses:
        '200':
          description: 반영 완료(철회 시 파기 트리거)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationConsent' }

  /me/location-consent/os-permission:
    patch:
      tags: [location]
      summary: L1 OS 권한 미러 보고(단말→서버)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [osPermission]
              properties:
                osPermission: { type: string, enum: [GRANTED, DENIED, NOT_DETERMINED] }
      responses:
        '200': { description: 반영 완료 }

  /me/profile:
    get:
      tags: [profile]
      summary: 프로필 조회
      responses:
        '200':
          description: 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }

  /me/profile/nickname:
    patch:
      tags: [profile]
      summary: 닉네임 변경(길이·금칙어·유니크 검증)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, minLength: 2, maxLength: 20 }
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '409': { $ref: '#/components/responses/NicknameTaken' }
        '503': { $ref: '#/components/responses/ModerationUnavailable' }

  /nickname/suggestions:
    post:
      tags: [profile]
      summary: 자동 생성 닉네임 후보(사전 검증 통과값)
      responses:
        '200':
          description: 후보 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { type: string }

  /nickname/check:
    post:
      tags: [profile]
      summary: 닉네임 유효성 검사(매칭 원문 미노출)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        '200':
          description: 검사 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  reason:
                    type: string
                    enum: [OK, TOO_SHORT, TOO_LONG, BANNED_WORD, TAKEN]
        '503': { $ref: '#/components/responses/ModerationUnavailable' }

  /onboarding/complete:
    post:
      tags: [onboarding]
      summary: 온보딩 완료 처리(멱등 — 약관+닉네임 판정)
      responses:
        '200':
          description: 완료 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingCompletedAt: { type: string, format: date-time, nullable: true }

  /me/preferences:
    get:
      tags: [preferences]
      summary: 취향 7축 조회(항상 완전 — 미설정은 중립 기본값 파생)
      responses:
        '200':
          description: 취향 7축
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceView' }
    put:
      tags: [preferences]
      summary: 취향 7축 저장(부분 허용, 즉시 반영)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenceInput' }
      responses:
        '200': { description: 저장 완료 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/deletion:
    post:
      tags: [account]
      summary: 계정 삭제 요청(→ DELETION_PENDING, GPS 즉시 파기)
      responses:
        '200':
          description: 유예 시작
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResponse' }
    delete:
      tags: [account]
      summary: 유예 내 삭제 철회(→ ACTIVE)
      responses:
        '200': { description: 철회 완료 }
        '404': { $ref: '#/components/responses/NotFound' }

  /stays/search:
    get:
      tags: [stays]
      summary: 숙소 탐색(날짜·인원 없이 · 최저가순)
      description: >
        지역·편의시설·유형으로 탐색. 필터는 AND, 정렬은 최저가순 고정(BR-U1-15).
        가격은 최저가 스냅숏뿐(미확인은 null · BR-U1-14). 소요시간 미표시·거리만(INV-3).
        lat·lng 로 '내 주변' 좌표 스코프(US-STAY-01 · BR-U1-11) — region·필터와 AND 로 걸린다.
        좌표는 필터가 아니라 스코프라 filterZeroReasons(완화 제안)에 나타나지 않는다.
      parameters:
        - { name: region, in: query, required: false, schema: { type: string }, description: '여행지(예: 제주)' }
        - { name: amenity, in: query, required: false, schema: { type: array, items: { type: string } }, description: 편의시설 AND 필터 }
        - { name: stayType, in: query, required: false, schema: { type: array, items: { type: string } }, description: 숙소 유형 필터 }
        - { name: lat, in: query, required: false, schema: { type: number, format: double, minimum: -90, maximum: 90 }, description: "'내 주변' 중심 위도. lng 와 짝이다 — 한쪽만 보내면 400" }
        - { name: lng, in: query, required: false, schema: { type: number, format: double, minimum: -180, maximum: 180 }, description: "'내 주변' 중심 경도. lat 와 짝이다 — 한쪽만 보내면 400" }
        - { name: radiusKm, in: query, required: false, schema: { type: number, format: double, exclusiveMinimum: 0, default: 5 }, description: 검색 반경(km). 좌표가 있을 때만 의미가 있고 생략하면 5km. 중심 없이 단독으로 보내면 400 }
      responses:
        '200':
          description: 탐색 결과(최저가순)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaySearchResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /stays/geocode:
    get:
      tags: [stays]
      summary: 등록용 지오코딩(장소 검색 → 좌표 후보 multi-candidate)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: >
            좌표 후보. **빈 배열 = 검색은 됐으나 결과 없음** — 벤더 장애(503)와 구분된다(BR-U1-23).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GeocodeCandidate' } }
        '503': { $ref: '#/components/responses/PlaceSearchUnavailable' }

  /stays/reverse-geocode:
    get:
      tags: [stays]
      summary: 핀 지정 역지오코딩(좌표 → 주소)
      description: >
        지도 롱프레스로 찍은 좌표의 주소를 얻는다(e05 핀 지정 탭 · BR-U1-21).

        **주소를 못 얻어도 등록을 막지 마라.** 등록에 필요한 것은 확정된 좌표이고(BR-U1-22),
        이 탭 자체가 지도 검색이 죽었을 때의 폴백이라(BR-U1-23) 같은 벤더가 여기서도 죽어 있을 수 있다.
        503 이면 "주소 미확인"으로 표시하고 숙소 이름을 직접 받아 등록을 계속한다.

        응답의 `lat`·`lng` 는 **요청값 그대로**다 — 벤더 대표 좌표로 갈아끼우지 않는다(핀이 정본).
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: >
            **`address: null` = 그 좌표에 주소가 없다**(바다·산·비주소 구역) — 벤더 장애(503)와 구분된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReverseGeocodeResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/PlaceSearchUnavailable' }

  /regions:
    get:
      tags: [places]
      summary: 행정구역 카탈로그 — 새 여행의 목적지 선택(US-TRIP-01)
      description: >
        국내 행정구역만 담는다(INV-U1-12) — 어떤 질의로도 해외 지역이 나오지 않는다.
        `selectable=false` 인 행(도·일반시의 행정구)은 목적지가 아니지만 묶음 표시를 위해 함께 온다.
        `poiCount` 는 커버리지 — 0이면 후보풀이 비어 일정이 조용히 빈다(INV-1·INV-4). 화면이 "준비 중"을 그릴 근거다.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: '이름·별칭 부분일치(예: 광주 → 전남광주통합특별시)' }
        - { name: level, in: query, required: false, schema: { $ref: '#/components/schemas/RegionLevel' } }
      responses:
        '200':
          description: 시도 → 층 → 이름 순 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Region' } }

  /places:
    get:
      tags: [places]
      summary: 장소(POI) 탐색 — ACTIVE만(INV-U1-01), 지역·카테고리 필터
      description: >
        수집 게이트(INV-1) 통과한 정본 POI. 소요시간 미표시(INV-3). 반경/취향 후보풀은 별도(C8 소비).
        정렬은 **이름순**이며 동명은 `poiId` 로 갈린다 — 같은 조회가 매번 같은 순서를 준다.
      parameters:
        - name: region
          in: query
          required: false
          schema: { type: string }
          description: >
            지역 **이름**(표준명·별칭 모두 — `부산`·`부산광역시` 둘 다 통한다). 서버가 행정구역 코드로
            해석해 **접두사**로 조회하므로 시도를 고르면 그 안 시군구가 전부 잡힌다.
            동명이지역(`동구` 는 대전·대구·광주·부산에 있다)은 **그 이름을 가진 지역 전부**가 대상이다 —
            하나를 고르면 거짓이 된다. 카탈로그에 없는 이름은 **빈 목록**이다(전국으로 넓히지 않는다).
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/PoiCategory' } }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: >
            이름 부분일치(대소문자 무시). **서버가 검색한다** — 클라가 받은 장 안에서만 거르면
            뒷장에 있는 것이 "없다"로 보인다. LIKE 메타문자(`%`·`_`)는 글자 그대로 취급한다.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
          description: 한 장의 최대 건수. **미지정·초과도 200 으로 맞춘다** — 지역을 안 골라도 전량이 나가지 않는다.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: >
            이전 응답의 `nextCursor`. 불투명 문자열이라 값의 모양에 기대지 않는다.
            offset 이 아닌 **지점 기준**이라, 이어 받는 사이에 장소가 추가돼도 행이 중복·누락되지 않는다.
            형식이 깨진 값은 400 이다(조용히 처음으로 되돌리면 목록이 리셋된 이유를 알 수 없다).
      responses:
        '200':
          description: ACTIVE POI 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceList' }

  /saved-places:
    post:
      tags: [places]
      summary: 장소 담기(POI 북마크) — (계정,POI) 유일(INV-U1-04), ACTIVE POI만
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavePlaceRequest' } } }
      responses:
        '201': { description: 담김, content: { application/json: { schema: { $ref: '#/components/schemas/SavedPlace' } } } }
