openapi: 3.1.0
info:
  title: TripPilot U1 API (소셜 로그인 전용 MVP)
  version: 0.1.0-draft
  description: >
    U1 기반·계정·온보딩 (M1 Auth · M2 Profile · C3 Moderation).
    소셜 로그인 전용 — 이메일/비밀번호 로그인은 후속 이연.
    정본 대조: docs/design/U1-API-설계.md, U1-DB스키마-설계.md, U1-내부아키텍처-설계.md


    **횡단 규약 — 입력 형식 오류는 어느 엔드포인트에서든 400이다.**
    경로변수·쿼리의 타입 변환 실패(UUID·숫자·enum)와 필수 쿼리 누락은 표준 에러 봉투
    (`ErrorResponse`, code=`VALIDATION_ERROR`, `fields[].field`=문제 파라미터 이름)로 나간다.
    경로별 `'400'` 선언은 **업무 검증**이 있는 곳에만 적는다 — 형식 오류까지 경로마다 중복
    선언하면 무엇이 그 엔드포인트 고유의 검증인지 안 보인다.
    (2026-09-01 이전에는 이 갈래가 500 `INTERNAL` 로 나갔다 — UUID-PATH-400)
servers:
  - url: https://api.trippilot.app/api/v1
    description: prod (가칭)
  - url: http://localhost:8080/api/v1
    description: local

security:
  - bearerAuth: []          # 전역 기본 = 인증 필요. 공개 엔드포인트는 security:[] 로 개별 해제.

tags:
  - name: reflection
  - name: auth
  - name: onboarding
  - name: location
  - name: profile
  - name: preferences
  - name: account
  - name: bootstrap
  - name: assistant
  - name: notification

paths:
  /auth/social/{provider}:
    post:
      tags: [auth]
      summary: 소셜 로그인/가입 (서버 code 교환)
      description: >
        신규 (provider, sub)=가입(즉시 ACTIVE, 연령확인 필수)·기존=로그인.
        **네이버는 이 경로로 받지 않는다(501)** — 네이버는 PKCE 를 지원하지 않아 가로챈 code 를
        막을 수단이 없다(TRIP-1317). 네이버는 `/auth/social/naver/token`(SDK 토큰)으로 보낸다.
        **구글은 `redirectUri` 로 클라이언트를 고른다**(TRIP-1656) — 앱 커스텀 스킴이면 iOS 클라이언트,
        http(s) 면 서버 허용 웹 출처 + `/oauth/google` 과 정확히 같을 때만 웹 클라이언트로 교환한다.
        목록 밖 http(s) redirect 와 웹 클라이언트 미설정은 교환 없이 401 이다(요청 스키마는 그대로).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple, kakao, naver] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialLoginRequest' }
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          description: >
            입력 검증 실패 — 지원하지 않는 `provider`, 필수 필드 누락, 신규 가입 시 연령확인 누락.
            **연령확인은 400 과 422 로 갈린다**: 값이 아예 없으면 400(입력 문제),
            값은 있는데 만 14세 미만이면 422(규칙 위반)다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/SocialAuthFailed' }
        '409': { $ref: '#/components/responses/SocialEmailConflict' }
        '422': { $ref: '#/components/responses/AgeNotMet' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '501':
          description: "그 제공자를 이 방식으로 지원하지 않는다(PROVIDER_NOT_SUPPORTED) — 키가 아직 없거나, 네이버처럼 이 경로로는 받지 않는다. 401 과 갈린다 — 재시도로 풀리지 않는다"

  /auth/social/{provider}/token:
    post:
      tags: [auth]
      summary: 소셜 로그인/가입 (네이티브 SDK 토큰)
      description: >
        네이티브 SDK가 발급한 토큰을 전달(서버 code 교환 없음, redirect 불필요).
        이후 계정 upsert·토큰 발급은 code 흐름과 동일.


        **제공자별로 싣는 토큰이 다르다.** 카카오·네이버는 access token 이고 서버가 그것으로
        userinfo 를 호출한다. **구글은 이 경로로 받지 않는다(501)** — 서버가 토큰의 발급 대상을 확인하지
        않는데 구글 `sub` 는 계정 전역 값이라 남의 앱에 발급된 토큰이 통하게 된다. 구글은 code 경로
        (`/auth/social/google`)를 쓴다(TRIP-1316). **애플은 `identityToken`(id_token)** 이다 — Apple 은 userinfo 엔드포인트가
        없어 되물을 곳이 없고, 서버가 Apple JWKS 로 **서명·aud·iss·exp 를 직접 검증**한다.
        필드명이 `accessToken` 인 것은 계약이 3사 기준으로 먼저 굳었기 때문이며, 와이어를 바꾸면
        얻는 것이 이름뿐이라 유지한다(TRIP-858).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [kakao, naver, google, apple] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialTokenLoginRequest' }
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          description: >
            입력 검증 실패 — 지원하지 않는 `provider`, `accessToken` 누락, 신규 가입 시 연령확인 누락.
            연령은 **없으면 400 · 만 14세 미만이면 422** 로 갈린다(BR-U0-05).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/SocialAuthFailed' }
        '409': { $ref: '#/components/responses/SocialEmailConflict' }
        '422': { $ref: '#/components/responses/AgeNotMet' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '501':
          description: "그 제공자를 이 경로로 지원하지 않는다(PROVIDER_NOT_SUPPORTED) — 키 미발급이거나, 구글처럼 이 경로를 닫아 둔 경우. 401 과 갈린다 — 재시도로 풀리지 않는다"

  /auth/token/refresh:
    post:
      tags: [auth]
      summary: 리프레시 토큰 회전
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '200':
          description: 회전된 토큰 쌍(isNewUser·account 없음 — 계정 요약은 GET /me 소관)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshedTokenPair' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: 무효·만료 또는 회전 토큰 재사용(체인 무효화)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 현재 기기 체인 revoke
      description: 공개 경로다(서버 permitAll) — Authorization 을 **싣지 않는다**. 만료된 액세스 토큰을 실으면 리소스 서버가 401 을 내 세션이 끊기지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '204': { description: 로그아웃 완료 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /terms:
    get:
      tags: [onboarding]
      summary: 현행 약관/문서 목록
      security: []
      responses:
        '200':
          description: 현행 약관 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TermsVersion' }

  /terms/{termsType}:
    get:
      tags: [onboarding]
      summary: 특정 약관 현행 버전
      security: []
      parameters:
        - name: termsType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TermsType' }
      responses:
        '200':
          description: 약관 현행 버전
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bootstrap:
    get:
      tags: [bootstrap]
      summary: 앱 기동 분기 (강제 업데이트 > 재동의 > 세션)
      description: Bearer 선택 — 무토큰이면 session.state=GUEST.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: 기동 분기 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapResponse' }

  /me:
    get:
      tags: [account]
      summary: 계정 요약
      responses:
        '200':
          description: 계정 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummary' }

  /me/consents:
    get:
      tags: [onboarding]
      summary: 항목별 현재 동의 상태(증적 폴드)
      responses:
        '200':
          description: 동의 상태
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentState' }
    post:
      tags: [onboarding]
      summary: 온보딩 일괄 동의 제출(필수 3종 + 선택)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentSubmission' }
      responses:
        '200': { description: 반영 완료 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/consents/{termsType}:
    patch:
      tags: [onboarding]
      summary: 개별 동의 GRANT/REVOKE (설정·재동의)
      parameters:
        - name: termsType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TermsType' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, termsVersion]
              properties:
                action: { type: string, enum: [GRANT, REVOKE] }
                termsVersion: { type: string }
      responses:
        '200': { description: 반영 완료 }

  /me/marketing-consent:
    put:
      tags: [onboarding]
      summary: 마케팅 수신 동의 토글(수집만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optIn]
              properties:
                optIn: { type: boolean }
      responses:
        '200': { description: 반영 완료 }

  /me/location-consent:
    get:
      tags: [location]
      summary: 위치 동의 3층 상태 + 유효 능력
      responses:
        '200':
          description: 위치 동의 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationConsent' }
    put:
      tags: [location]
      summary: L2(법정)·L3(GPS 옵트인) 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legalConsent: { type: boolean }
                gpsRecordingOptIn: { type: boolean }
      responses:
        '200':
          description: 반영 완료(철회 시 파기 트리거)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationConsent' }

  /me/location-consent/os-permission:
    patch:
      tags: [location]
      summary: L1 OS 권한 미러 보고(단말→서버)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [osPermission]
              properties:
                osPermission: { type: string, enum: [GRANTED, DENIED, NOT_DETERMINED] }
      responses:
        '200': { description: 반영 완료 }

  /me/profile:
    get:
      tags: [profile]
      summary: 프로필 조회
      responses:
        '200':
          description: 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }

  /me/profile/nickname:
    patch:
      tags: [profile]
      summary: 닉네임 변경(길이·금칙어·유니크 검증)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, minLength: 2, maxLength: 20 }
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '409': { $ref: '#/components/responses/NicknameTaken' }
        '503': { $ref: '#/components/responses/ModerationUnavailable' }

  /nickname/suggestions:
    post:
      tags: [profile]
      summary: 자동 생성 닉네임 후보(사전 검증 통과값)
      responses:
        '200':
          description: 후보 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { type: string }

  /nickname/check:
    post:
      tags: [profile]
      summary: 닉네임 유효성 검사(매칭 원문 미노출)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        '200':
          description: 검사 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  reason:
                    type: string
                    enum: [OK, TOO_SHORT, TOO_LONG, BANNED_WORD, TAKEN]
        '503': { $ref: '#/components/responses/ModerationUnavailable' }

  /onboarding/complete:
    post:
      tags: [onboarding]
      summary: 온보딩 완료 처리(멱등 — 약관+닉네임 판정)
      responses:
        '200':
          description: 완료 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingCompletedAt: { type: string, format: date-time, nullable: true }

  /me/preferences:
    get:
      tags: [preferences]
      summary: 취향 7축 조회(항상 완전 — 미설정은 중립 기본값 파생)
      responses:
        '200':
          description: 취향 7축
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceView' }
    put:
      tags: [preferences]
      summary: 취향 7축 저장(부분 허용, 즉시 반영)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenceInput' }
      responses:
        '200':
          description: 저장 완료 — 반영된 취향 7축(GET 과 같은 모양)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceView' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/settings:
    get:
      tags: [profile]
      summary: 계정 단위 앱 설정 조회 (l05)
      description: >
        저장한 적 없으면 **기본값**으로 온다 — 404 가 아니다. 첫 진입에서 화면이 설정을 그려야 한다.


        취향(`/me/preferences`)과 **자리를 나눈다** — 취향은 여행 생성 시 `preferenceSnapshot` 으로
        동결되므로, 앱 설정을 섞으면 "제휴 안내 다시 안 보기"가 여행 이력에 박힌다(O-U6-5).
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/AccountSettings' } } } }
        '401': { description: 인증 필요 }
    patch:
      tags: [profile]
      summary: 계정 단위 앱 설정 변경 (l05)
      description: >
        **준 것만** 바꾼다. 생략한 필드는 그대로다 — null 을 "끄기"로 읽으면 화면이 한 토글을 만질 때
        다른 토글이 조용히 꺼진다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountSettingsRequest' }
      responses:
        '200': { description: 변경됨, content: { application/json: { schema: { $ref: '#/components/schemas/AccountSettings' } } } }
        '401': { description: 인증 필요 }
  /me/planb-sensitivity:
    get:
      tags: [planb]
      summary: Plan-B 알림 민감도 조회 (l02)
      description: >
        설정한 적 없으면 `NORMAL` 이 온다 — 404 가 아니다. 설정이 없다고 알림이 멈추면 안 된다.


        ⚠ **상한 수치를 내보내지 않는다**(BR-U4-03). 클라가 임계를 알면 자체 판단으로 배너를 띄우게
        되고 판정이 두 곳에 흩어진다. 사용자에게 필요한 것은 "적게/보통/많이"이지 숫자가 아니다.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/PlanBSensitivity' } } } }
        '401': { description: 인증 필요 }
    put:
      tags: [planb]
      summary: Plan-B 알림 민감도 변경 (l02)
      description: >
        값이 하나뿐이라 **PUT** 이다 — 부분 갱신 규약을 흉내 내면 빈 본문이 무엇을 뜻하는지 애매해진다.


        빈도 상한은 이 민감도에서 **파생**된다(감지 단계 적용 · BR-U4-08). 티켓(TRIP-616)은 별도
        `hourlyCap` 을 요구했으나 실장을 유지했다 — 시간당 상한은 하루 총량보다 약한 보장이고
        (매시 1건이면 하루 24건), 노브가 둘이면 `HIGH` 인데 상한 1 같은 모순 조합이 생긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlanBSensitivityRequest' }
      responses:
        '200': { description: 변경됨, content: { application/json: { schema: { $ref: '#/components/schemas/PlanBSensitivity' } } } }
        '400': { description: 어휘 밖 값 — 조용히 NORMAL 로 떨어뜨리지 않는다 }
        '401': { description: 인증 필요 }
  /me/deletion:
    post:
      tags: [account]
      summary: 계정 삭제 요청(→ DELETION_PENDING, GPS 즉시 파기)
      responses:
        '200':
          description: 유예 시작
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResponse' }
    delete:
      tags: [account]
      summary: 유예 내 삭제 철회(→ ACTIVE)
      responses:
        '200': { description: 철회 완료 }
        '404': { $ref: '#/components/responses/NotFound' }

  /stays/search:
    get:
      tags: [stays]
      summary: 숙소 탐색(날짜·인원 없이 · 최저가순)
      description: >
        지역·편의시설·유형으로 탐색. 필터는 AND, 정렬은 최저가순 고정(BR-U1-15).
        가격은 최저가 스냅숏뿐(미확인은 null · BR-U1-14). 소요시간 미표시·거리만(INV-3).
        lat·lng 로 '내 주변' 좌표 스코프(US-STAY-01 · BR-U1-11) — region·필터와 AND 로 걸린다.
        좌표는 필터가 아니라 스코프라 filterZeroReasons(완화 제안)에 나타나지 않는다.
      parameters:
        - { name: region, in: query, required: false, schema: { type: string }, description: '여행지(예: 제주)' }
        - { name: amenity, in: query, required: false, schema: { type: array, items: { type: string } }, description: 편의시설 AND 필터 }
        - { name: stayType, in: query, required: false, schema: { type: array, items: { type: string } }, description: 숙소 유형 필터 }
        - { name: lat, in: query, required: false, schema: { type: number, format: double, minimum: -90, maximum: 90 }, description: "'내 주변' 중심 위도. lng 와 짝이다 — 한쪽만 보내면 400" }
        - { name: lng, in: query, required: false, schema: { type: number, format: double, minimum: -180, maximum: 180 }, description: "'내 주변' 중심 경도. lat 와 짝이다 — 한쪽만 보내면 400" }
        - { name: radiusKm, in: query, required: false, schema: { type: number, format: double, exclusiveMinimum: 0, default: 5 }, description: 검색 반경(km). 좌표가 있을 때만 의미가 있고 생략하면 5km. 중심 없이 단독으로 보내면 400 }
      responses:
        '200':
          description: 탐색 결과(최저가순)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaySearchResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /stays/{stayId}:
    get:
      tags: [stays]
      summary: 숙소 상세(US-STAY-03)
      description: >
        정적 콘텐츠 + 최저가 스냅숏. **리뷰·평점은 담지 않는다** — 외부 OTA 딥링크로 위임한다
        (US-STAY-03 · BR-U1-18). **정확 1박가도 여기 없다**(INV-U1-05 — 캐싱 금지라 표시 시점에
        따로 부른다). 소요시간 미표시(INV-3).


        누락 항목은 빈칸이 아니라 화면이 "미확인"으로 그린다(US-STAY-03 예외). 특히 가격은
        정본(LOCALDATA) 전량에 스냅숏이 없어 **null 이 기본값**이다 — 상세를 막는 사유가 아니다
        (BR-U1-14).


        `stayId` 는 `"{출처}:{식별자}"` 합성 문자열이다. `stay` 의 PK 가 복합키라 경로에 그대로
        싣지 못해서이고, 목록 응답이 `externalSource`·`externalId` 를 따로 실으므로 클라이언트가
        조립할 수 있다(상세 응답은 조립된 값을 `stayId` 로 되돌려 준다).
      parameters:
        - name: stayId
          in: path
          required: true
          schema: { type: string }
          example: 'LOCALDATA:3000000-201-1965-00264'
          description: '"{출처}:{식별자}" — 첫 콜론으로만 가른다'
      responses:
        '200':
          description: 숙소 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StayDetail' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: >
            그런 숙소가 없다. **형식 오류(400)와 구분한다** — 둘을 같은 응답으로 접으면
            클라이언트가 식별자를 잘못 조립하고 있어도 드러나지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /stays/curated:
    get:
      tags: [stays]
      summary: 도시별 큐레이션 숙소(트립닷컴 Promotion Center 인기 목록)
      description: >
        트립닷컴 제휴 Promotion Center 의 도시별 인기 목록(Hot Sellers, 모자라면 Top Deals)을 순위대로 돌려준다.
        행은 반복 시드가 채운다 — 도시는 '서울'·'부산'·'제주'·'강릉'·'경주'·'인천'·'대구'·'전주'·'속초', 도시당 최대 15곳.
        `address` 는 서울만 채워져 있고 나머지는 null 이다. 각 항목의 `stayId`(`"TRIPCOM:{트립닷컴 hotelId}"`)를 그대로
        `/stays/{stayId}/outbound` 에 넘기면 트립닷컴 호텔 상세로 간다. 상세(`/stays/{stayId}`)는 이 출처를
        모른다(404) — 목록 항목이 곧 카드다.


        **평점·가격이 없는 것은 의도다** — 평점은 앱 안에 두지 않고(BR-U1-18), Promotion Center 가격은 실시간
        값이 아니다(INV-U1-05). 모르는 도시는 빈 목록 200 이다.


        ⚠ 트립닷컴 제휴 계약 3.2.2·3.2.4 는 이미지·홍보 콘텐츠 노출에 **사전 서면 승인**을 요구한다. 회신을
        기다리지 않고 노출하기로 했다(2026-10-21 제품 결정). 트립닷컴이 막으면 목록이 빈 배열로 바뀐다 —
        화면은 빈 목록이면 섹션을 숨겨야 한다(요구 사항 — 이 목록을 부르는 화면은 아직 없다).
      parameters:
        - { name: regionCode, in: query, required: false, schema: { type: string, pattern: '^([0-9]{2}|[0-9]{5})$' }, example: '26', description: '지역 카탈로그 코드 — 화면은 이것을 쓴다. 시군구·행정구 코드도 그 도시로 잡힌다(50130 서귀포 → 제주). 도 코드처럼 한 도시로 좁혀지지 않으면 빈 목록' }
        - { name: city, in: query, required: false, schema: { type: string }, example: '부산', description: '짧은 도시명(서울·부산…). regionCode 와 둘 중 하나만 — 둘 다 오거나 둘 다 없으면 400' }
      responses:
        '200':
          description: 큐레이션 목록(순위 오름차순)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuratedStayList' }
        '400':
          $ref: '#/components/responses/ValidationError'

  /stays/browse/outbound:
    get:
      tags: [stays]
      summary: 지역 숙소 전체 보기 302(OTA 지역 목록으로 이동)
      description: >
        앱은 숙소 목록을 갖지 않고 OTA 의 지역 숙소 목록으로 보낸다 — 사진·가격·평점은 OTA 가 보여준다.
        `region`·`regionCode` 는 지역 카탈로그에 있어야 한다(코드는 선택 가능 지역이거나 `region` 이름이 가리키는 코드, 코드가 없으면 이름 일치) — 아니면 400.
        숙소 아웃바운드와 같은 규약이다: 클릭을 남기고(stay_id 자리에 `REGION:{regionCode 또는 region}`) 302,
        본문 없음, Bearer 선택.


        트립닷컴 모드에서 `regionCode` 가 도시 매핑(주요 여행지 — 정본은 `TripcomDeeplinkAdapter.CITY_IDS`, 가장 긴 접두사 일치)에 걸리면
        날짜·인원이 채워진 트립닷컴 도시 목록으로, 아니면 `region` 이름 키워드 검색으로 간다.
        날짜는 checkin·checkout 이 둘 다 있고 순서가 맞을 때만, 인원은 양수일 때만 싣는다.
        폴백 모드는 웹검색(`"{region} 숙소 예약"`)이다.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: region, in: query, required: true, schema: { type: string, maxLength: 40 }, example: '포항', description: 표시·키워드용 지역 이름 }
        - { name: regionCode, in: query, required: false, schema: { type: string, pattern: '^[0-9]{2,10}$' }, example: '47110', description: 지역 카탈로그 코드(시도 2자리·시군구 5자리) }
        - { name: checkin, in: query, required: false, schema: { type: string, format: date } }
        - { name: checkout, in: query, required: false, schema: { type: string, format: date } }
        - { name: adults, in: query, required: false, schema: { type: integer } }
      responses:
        '302':
          description: 지역 숙소 목록으로 이동. 본문 없음.
          headers:
            Location:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationError'

  /stays/{stayId}/outbound:
    get:
      tags: [stays]
      summary: 예약 아웃바운드 302(C5 칸 1 · BR-U1-29~32)
      description: >
        클릭을 기록하고 예약 목적지로 302 리다이렉트한다. 클라이언트가 OTA URL 을 직접 조립하지
        않는다 — 목적지 교체(웹검색 폴백 → OTA 딥링크)가 앱 배포 없이 서버 변경만으로 된다.


        OTA 계약 전에는 웹검색 폴백(`"{숙소명} 예약"`, BR-U1-31 이 명시 허용하는 우회)으로 보낸다.
        날짜·인원은 지금 목적지에 실리지 않지만 클릭에 남는다 — 계약 협상 근거 데이터다.


        예외: 큐레이션 숙소(`TRIPCOM:{hotelId}`, `/stays/curated`)는 트립닷컴 모드에서 **호텔 상세로 직행**하고,
        checkin·checkout 이 둘 다 있고 순서가 맞으면 날짜를, adults 가 양수면 인원을 싣는다.


        응답 본문은 없다. 클릭·전환 지표는 내부 전용이라 사용자 대면 응답에 싣지 않는다(BR-U1-32).


        Bearer 선택(bootstrap 선례) — 브라우저·커스텀탭이 열어 Authorization 을 실을 수 없다.
        토큰이 오면 계정이 클릭에 남고, 없으면 익명 클릭이다.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: stayId
          in: path
          required: true
          schema: { type: string }
          example: 'LOCALDATA:3000000-201-1965-00264'
          description: '"{출처}:{식별자}" — 상세와 같은 합성 규약'
        - { name: checkin, in: query, required: false, schema: { type: string, format: date } }
        - { name: checkout, in: query, required: false, schema: { type: string, format: date } }
        - { name: adults, in: query, required: false, schema: { type: integer } }
      responses:
        '302':
          description: 목적지로 이동. 본문 없음 — Location 이 전부다.
          headers:
            Location:
              schema: { type: string }
              description: 예약 목적지 URL(현재 웹검색 폴백, 계약 후 OTA 딥링크)
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: 그런 숙소가 없다 — 이름 없이는 폴백 URL 조차 만들 수 없다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /stays/geocode:
    get:
      tags: [stays]
      summary: 등록용 지오코딩(장소 검색 → 좌표 후보 multi-candidate)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: >
            좌표 후보. **빈 배열 = 검색은 됐으나 결과 없음** — 벤더 장애(503)와 구분된다(BR-U1-23).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GeocodeCandidate' } }
        '503': { $ref: '#/components/responses/PlaceSearchUnavailable' }

  /stays/reverse-geocode:
    get:
      tags: [stays]
      summary: 핀 지정 역지오코딩(좌표 → 주소)
      description: >
        지도 롱프레스로 찍은 좌표의 주소를 얻는다(e05 핀 지정 탭 · BR-U1-21).

        **주소를 못 얻어도 등록을 막지 마라.** 등록에 필요한 것은 확정된 좌표이고(BR-U1-22),
        이 탭 자체가 지도 검색이 죽었을 때의 폴백이라(BR-U1-23) 같은 벤더가 여기서도 죽어 있을 수 있다.
        503 이면 "주소 미확인"으로 표시하고 숙소 이름을 직접 받아 등록을 계속한다.

        응답의 `lat`·`lng` 는 **요청값 그대로**다 — 벤더 대표 좌표로 갈아끼우지 않는다(핀이 정본).
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: >
            **`address: null` = 그 좌표에 주소가 없다**(바다·산·비주소 구역) — 벤더 장애(503)와 구분된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReverseGeocodeResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/PlaceSearchUnavailable' }

  /regions:
    get:
      tags: [places]
      summary: 행정구역 카탈로그 — 새 여행의 목적지 선택(US-TRIP-01)
      description: >
        국내 행정구역만 담는다(INV-U1-12) — 어떤 질의로도 해외 지역이 나오지 않는다.
        `selectable=false` 인 행(도·일반시의 행정구)은 목적지가 아니지만 묶음 표시를 위해 함께 온다.
        `poiCount` 는 커버리지 — 0이면 후보풀이 비어 일정이 조용히 빈다(INV-1·INV-4). 화면이 "준비 중"을 그릴 근거다.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: '이름·별칭 부분일치(예: 광주 → 전남광주통합특별시)' }
        - { name: level, in: query, required: false, schema: { $ref: '#/components/schemas/RegionLevel' } }
      responses:
        '200':
          description: 시도 → 층 → 이름 순 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Region' } }

  /places:
    get:
      tags: [places]
      summary: 장소(POI) 탐색 — ACTIVE만(INV-U1-01), 지역·카테고리 필터
      description: >
        수집 게이트(INV-1) 통과한 정본 POI. 소요시간 미표시(INV-3). 반경/취향 후보풀은 별도(C8 소비).
        정렬은 기본 **이름순**이며 동명은 `poiId` 로 갈린다 — 같은 조회가 매번 같은 순서를 준다.
        `order=random&seed=…` 이면 **시드 기반 무작위**다(TRIP-1570) — 같은 seed 면 같은 순서라 커서로 이어 받아도
        중복·누락이 없다. 화면은 한 진입 동안 seed 를 고정하고, 다시 들어오면 새 seed 를 쓴다.
      parameters:
        - name: region
          in: query
          required: false
          schema: { type: string }
          description: >
            지역 **이름**(표준명·별칭 모두 — `부산`·`부산광역시` 둘 다 통한다). 서버가 행정구역 코드로
            해석해 **접두사**로 조회하므로 시도를 고르면 그 안 시군구가 전부 잡힌다.
            동명이지역(`동구` 는 대전·대구·광주·부산에 있다)은 **그 이름을 가진 지역 전부**가 대상이다 —
            하나를 고르면 거짓이 된다. 카탈로그에 없는 이름은 **빈 목록**이다(전국으로 넓히지 않는다).
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/PoiCategory' } }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: >
            이름 부분일치(대소문자 무시). **서버가 검색한다** — 클라가 받은 장 안에서만 거르면
            뒷장에 있는 것이 "없다"로 보인다. LIKE 메타문자(`%`·`_`)는 글자 그대로 취급한다.
            결과는 **관련도순**이다(TRIP-1003): 정확 일치 > 접두 일치 > 부분 일치, 동률은
            법인 접두("(주)"·"(사)" 등)를 뗀 이름의 가나다순. q 가 없으면 그 가나다순만 적용된다.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
          description: 한 장의 최대 건수. **미지정·초과도 200 으로 맞춘다** — 지역을 안 골라도 전량이 나가지 않는다.
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [name, random], default: name }
          description: >
            정렬 방식(TRIP-1570). `name`(기본) = 위 이름순·관련도순 그대로. `random` = 시드 기반 무작위 —
            둘째 정렬 축이 이름 대신 `md5(seed || poiId)` 가 된다. q 가 있으면 관련도 축(정확 > 접두 > 부분)은
            여전히 첫 축이라 무작위는 같은 관련도 안에서만 섞인다. 모르는 값은 400.
        - name: seed
          in: query
          required: false
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
          description: >
            `order=random` 의 시드 — **그때는 필수다**(없거나 형식이 깨지면 400. 이름순으로 조용히 떨어뜨리면 화면이
            그것을 "섞었다"고 그린다). 같은 seed 로 받은 `nextCursor` 만 이어 쓴다 — seed 를 바꾸면 처음부터 받는다.
            `order=name` 이면 무시한다.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: >
            이전 응답의 `nextCursor`. 불투명 문자열이라 값의 모양에 기대지 않는다.
            offset 이 아닌 **지점 기준**이라, 이어 받는 사이에 장소가 추가돼도 행이 중복·누락되지 않는다.
            형식이 깨진 값은 400 이다(조용히 처음으로 되돌리면 목록이 리셋된 이유를 알 수 없다).
      responses:
        '200':
          description: ACTIVE POI 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceList' }

  /places/{poiId}:
    get:
      tags: [places]
      summary: 장소(POI) 단건 — 상세 화면이 목록을 거치지 않고 여는 길
      description: >
        목록(`/places`)과 **같은 `Place` 모양**이다. 상세 화면이 앞 화면의 캐시에서 장소를 골라 쓰던 것을
        대신한다 — 캐시가 없으면(딥링크·콜드 스타트) 열 길이 없었다(TRIP-824).


        **ACTIVE 만으로 거르지 않는다.** 목록은 ACTIVE 만 내지만, 상세는 이미 알고 있는 장소를 다시 여는
        화면이다 — 담아 둔 곳이 폐업(`CLOSED`)하거나 원본에서 빠져도(`LOST`) 404 가 아니라 그 상태를 실어
        돌려준다. 화면이 상태를 말한다. 수집 게이트를 통과한 적 없는 `UNVERIFIED` 는 **404** 다(INV-1).


        갤러리(`imageUrls`)·입장료·소개는 아직 없다 — 값이 수집돼야 붙일 수 있다(컬럼만 만들면 전부 null).
      parameters:
        - { name: poiId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
        '400': { description: poiId 가 UUID 형식이 아님 }
        '401': { description: 인증 필요 }
        '404': { description: 그런 장소 없음(게이트 미통과 `UNVERIFIED` 포함) }

  /saved-places:
    post:
      tags: [places]
      summary: 장소 담기(POI 북마크) — (계정,POI) 유일(INV-U1-04), ACTIVE POI만
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavePlaceRequest' } } }
      responses:
        '201': { description: 담김, content: { application/json: { schema: { $ref: '#/components/schemas/SavedPlace' } } } }
        '404': { description: POI 없음/비-ACTIVE }
        '409': { description: 이미 담은 장소 }
    get:
      tags: [places]
      summary: 내 담은 장소 목록(POI 정보 포함)
      responses:
        '200':
          description: 담은 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedPlace' } }
  /saved-places/{savedPlaceId}:
    parameters:
      - { name: savedPlaceId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [places]
      summary: 담기 해제(소유자만 · 타 계정 404)
      responses:
        '204': { description: 해제됨 }
        '404': { description: 없음/타 계정 }

  /saved-stays:
    post:
      tags: [saved-stays]
      summary: 숙소 등록(3경로 · 좌표/날짜 선택)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterSavedStayRequest' }
      responses:
        '201': { description: 등록됨, content: { application/json: { schema: { $ref: '#/components/schemas/SavedStay' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: >
            같은 외부 숙소(externalSource·externalId)를 이미 저장함(TRIP-1059 — 계정당 1건).
            연타·재시도는 이 응답을 '이미 저장됨 = 성공'으로 읽으면 된다. 외부 키 없는 등록(핀 지정)은
            자연 키가 없어 이 제한에 걸리지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [saved-stays]
      summary: 내 저장 숙소 목록
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedStay' } }

  /saved-stays/{savedStayId}:
    parameters:
      - { name: savedStayId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [saved-stays]
      summary: 저장 숙소 조회(소유자만 · 타 계정 404)
      responses:
        '200': { description: 숙소, content: { application/json: { schema: { $ref: '#/components/schemas/SavedStay' } } } }
        '404': { description: 없음/타 계정 }
    patch:
      tags: [saved-stays]
