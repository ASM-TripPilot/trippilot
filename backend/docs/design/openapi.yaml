    patch:
      tags: [trips]
      summary: 여행 편집(가변 필드 대체 · 종료·삭제 후 불가)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EditTripRequest' } } }
      responses:
        '200': { description: 수정됨, content: { application/json: { schema: { $ref: '#/components/schemas/Trip' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없음/타 계정 }
    delete:
      tags: [trips]
      summary: 여행 삭제(소프트)
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 없음/타 계정 }

  /trips/{tripId}/bases:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 구간 거점 배정(등록 숙소를 [dateFrom, dateTo) 거점으로 · 여행 기간 내 INV-U1-15)
      description: >
        여행 기간을 벗어나는 구간은 **거부한다**(400) — 서버가 여행 기간을 늘려 주지 않는다.
        기간이 바뀌면 일정·커버리지·필수 방문지가 모두 영향을 받으므로, 늘릴지는 사용자가 정한다.
        US-TRIP-03 의 "여행 기간 자동 확장 여부를 묻는다"는 **클라이언트 2단계**로 만족한다 —
        400 을 받아 확인을 띄우고, `PATCH /trips/{tripId}` 로 기간을 고친 뒤 다시 배정한다.

        그래서 400 의 `error.fields` 는 **어느 칸이 왜 틀렸는지**를 담는다:
        시작일이 앞서면 `dateFrom`, 종료일이 넘으면 `dateTo` 이며 reason 에 여행 시작일·종료일이 들어간다
        (화면이 "여행은 8/4까지예요, 늘릴까요?"를 그릴 근거). 양쪽 다 벗어나면 둘 다 담는다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssignBaseRequest' } } }
      responses:
        '201': { description: 배정됨, content: { application/json: { schema: { $ref: '#/components/schemas/BaseAssignment' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없음/타 계정(여행 또는 숙소) }
    get:
      tags: [trips]
      summary: 여행 거점 목록
      responses:
        '200': { description: 거점 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BaseAssignment' } } } } }
        '404': { description: 없음/타 계정 }
  /trips/{tripId}/bases/{baseAssignmentId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: baseAssignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [trips]
      summary: 거점 배정 삭제
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 없음/타 계정 }
  /trips/{tripId}/coverage:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 커버리지 상태(숙박일별 auto/gap/overlap · blocked면 일정 생성 진입 차단 INV-U1-16)
      responses:
        '200': { description: 커버리지, content: { application/json: { schema: { $ref: '#/components/schemas/Coverage' } } } }
        '404': { description: 없음/타 계정 }

  /trips/{tripId}/coverage/days/{dayDate}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: dayDate, in: path, required: true, schema: { type: string, format: date }, description: 숙박일(체크아웃 당일 제외) }
    put:
      tags: [trips]
      summary: 커버리지 해소 — 그 날 거점으로 쓸 숙소 선택(BR-U1-45 · resolution=user_pick)
      description: >
        겹침일(OVERLAP)·공백일(GAP)을 사용자가 풀어 일정 생성 게이트를 연다(INV-U1-16).
        **자동 확정된 날(AUTO)은 409** — 후보가 하나뿐이라 고를 것이 없고, 바꾸려면 배정 자체를 고쳐야 한다.
        고를 수 있는 숙소는 겹침일이면 그 날 `candidates`, 공백일이면 이 여행에 배정된 숙소다.
        날짜가 곧 리소스 키(하루 1행)라 PUT 이며 같은 선택을 반복해도 결과가 같다.
        응답은 **커버리지 전체** — 한 날을 풀면 `blocked` 가 바뀌므로 그 한 줄만 갱신하면 화면이 계속 막힌 것처럼 보인다.
        전 숙박일이 확정되는 순간 `TripBaseResolved` 로 게이트가 열린다(BR-U1-46).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResolveCoverageDayRequest' } } }
      responses:
        '200': { description: 해소됨(커버리지 전체), content: { application/json: { schema: { $ref: '#/components/schemas/Coverage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없음/타 계정 }
        '409': { description: 자동 확정된 날짜(배정을 수정해야 함) }
  /trips/{tripId}/must-visits:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 필수 방문지 추가 — POI 동결 스냅숏 참조(INV-U1-03) · FIXED 날짜·시각(INV-U1-17)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddMustVisitRequest' } } }
      responses:
        '201': { description: 추가됨, content: { application/json: { schema: { $ref: '#/components/schemas/MustVisit' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 여행/POI 없음·비-ACTIVE·타 계정 }
        '409': { description: 이미 추가된 필수 방문지(INV-U1-18) }
    get:
      tags: [trips]
      summary: 여행 필수 방문지 목록
      responses:
        '200': { description: 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MustVisit' } } } } }
        '404': { description: 없음/타 계정 }
  /trips/{tripId}/itinerary:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 일정 조회 — 소유 여행의 현행 일정. 시각·순서는 솔버 검증값(INV-2)·소요시간 미노출(INV-3)
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } } }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음 }
    post:
      tags: [trips]
      summary: AI 일정 생성 — day1 먼저 반환(2단계). 시각·순서는 솔버 검증값(INV-2)·소요시간 미노출(INV-3)
      description: >
        첫날(day1)만 담긴 `generationState=PARTIAL` 응답을 먼저 돌려주고, 나머지 일자는 백그라운드로 채운다.
        클라이언트는 GET 으로 `COMPLETE`(전 일자 완료) 또는 `FAILED`(2차 중단) 까지 폴링한다.


        ⏱ **응답까지, 그리고 폴링이 끝나기까지 수 분이 걸릴 수 있다.** 2026-08-21 팀 결정으로 생성
        시간제약을 해제했다(TRIP-474) — AI 에 시한을 싣지 않으므로 후보 풀이 클수록 오래 걸린다.
        **짧은 폴링 상한을 두면 화면이 반쪽 일정에 머문 채 조용히 멈춘다.** 정말 멈춘 생성은 서버가
        판정해 `FAILED` 로 내리므로(약 11분), 그보다 길게 버티면 반드시 종착 상태를 본다.
        9월에 시간제약이 재도입되면 다시 수십 초대로 돌아온다(TRIP-475).
        여행이 하루면 2차 없이 즉시 `COMPLETE`. PARTIAL 인 동안 확정·편집은 409.
        재생성(이 POST)에는 상태 제한이 없다 — 중단된 생성(PARTIAL)에서 벗어나는 탈출구이자,
        **확정된 일정을 다시 짜는 유일한 경로**다(확정 해제 API 없음). 확정 일정에 호출하면
        확정이 풀리고 PLANNED 새 일정으로 대체되며, 동결됐던 poi_snapshot 참조는 사라진다.


        **같은 여행**의 재생성에는 상태 제한이 없다(위 탈출구). 다만 **다른 여행의 생성이 진행 중이면 409** —
        생성은 LLM·솔버를 쓰는 무거운 작업이라 동시 실행을 열어두면 비용·지연이 사용자 수가 아니라
        연타 횟수에 비례한다(TRIP-403). 거절 응답의 `error.activeTripId` 에 진행 중인 여행이 실린다.
        멈춘 생성(백그라운드 비정상 종료)은 일정 시간 뒤 제한에서 풀린다 — 규칙이 사용자를 가두지 않는다.


        **계정당 하루 AI 생성 횟수에 상한이 있다(429 · TRIP-1314).** 같은 여행의 재생성도 센다 — 위 탈출구가
        연타를 그대로 LLM 비용에 곱하던 자리다. **실패한 생성과 폴백으로 끝난 생성(`isFallback`)은 세지 않아**
        탈출구는 그대로 열려 있다 — AI 가 **실패로 답한** 동안의 재시도는 횟수를 태우지 않는다.
        **새 요청으로 갈아치운(취소·대체된) 생성은 센다** — 결과를 못 봤어도 AI 는 이미 불렸고, 막으려는 것이
        바로 그 연타다. 그래서 AI 가 실패하지 않고 늘어지는 동안의 연타는 횟수를 쓴다.
        직접 만들기(`MANUAL`)는 AI 를 부르지 않아 세지 않고, 슬롯 후보·여행 중 재계획도 이 상한 밖이다.
        하루는 여행지 기준(KST) 자정에 바뀐다.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerateItineraryRequest' } } }
      responses:
        '201': { description: 생성됨(day1 만 담긴 PARTIAL · 하루 여행이면 COMPLETE), content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } } }
        '404': { description: 여행 없음/타 계정 }
        '409':
          description: >
            둘 중 하나. (1) 다른 여행의 생성이 진행 중(TRIP-403) — `error.code` = `GENERATION_IN_PROGRESS`,
            `error.activeTripId` = 지금 생성 중인 여행. 어느 여행을 기다려야 하는지 화면이 안내할 수 있어야 한다.
            같은 여행의 재생성은 이 제한에 걸리지 않는다.
            (2) 이 요청의 세션이 1일차 도착 전에 취소·대체됨(TRIP-1058 — 재생성 연타·cancel API) —
            `error.code` = `GENERATION_SUPERSEDED`, `error.activeSessionId` = 진행 중인 새 세션(새 요청이
            있을 때만). 이 요청의 1일차는 반영되지 않았다(낡은 결과가 새 요청의 일정을 덮지 않는다).
            화면은 실패가 아니라 "새 요청이 이어받았다"로 읽고 그 세션을 폴링한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: >
            오늘의 AI 일정 생성 횟수를 모두 썼다(TRIP-1314) — `error.code` = `GENERATION_DAILY_LIMIT`.
            **재시도로 풀리지 않는다**: 화면은 [다시 시도]를 보이지 않고 직접 만들기로 안내한다.
            `Retry-After` 헤더에 풀리는 시각(KST 자정)까지 남은 초가 실린다. 진행 중이던 생성과 이미
            만들어진 일정은 건드리지 않는다. 일반 요청 한도(`RATE_LIMITED`)와 코드로 구분한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [trips]
      summary: 일정 편집(전체 교체) + 재검증 — 비차단(위반은 hasViolation 표시, 저장 허용). 여행 시작 전 확정·생성 중 일정은 409
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EditItineraryRequest' } } }
      responses:
        '200': { description: 편집됨, content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } } }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음 }
        '409': { description: 여행 시작 전 확정 일정은 수정 불가(여행 중에는 허용 — TRIP-999) · 생성 진행 중에는 아직 없는 일자를 싣는 편집만 불가(이미 만들어진 일자는 허용 — TRIP-1000) }
  /trips/{tripId}/generation-sessions/{sessionId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 생성 진행 상태 조회 — 단계 텍스트의 원천(h09·h10)
      description: >
        **진행률(퍼센트)은 없다** — 계약에 그 값이 없고, 지어내면 사용자가 남은 시간을 오판한다.
        화면은 `startedAt`·`day1ReadyAt` 으로 단계를 판단한다. 세션 id 는 일정 응답의
        `generationSessionId` 로 받는다. `[백그라운드로]` 에 대응하는 오퍼레이션은 **없다** —
        세션을 살린 채 화면만 이탈하는 것이라 서버가 할 일이 없다(BR-U3-05).
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationSession' } } } }
        '404': { description: 여행 없음/타 계정/세션 없음/다른 여행의 세션 }
  /trips/{tripId}/generation-sessions/{sessionId}/cancel:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 생성 취소(h09 [취소]) — 뒤이어 도착하는 2차 결과를 반영하지 않는다
      description: >
        세션을 `CANCELED` 로 닫는다(BR-U3-05). "부분 결과를 버린다"는 것은 **2차 결과를 반영하지 않는다**는
        뜻이며, 이미 보여 준 day1 일정을 지우지 않는다 — 사용자가 보던 화면이 비어 버리기 때문이다.
        일정은 `generationState=PARTIAL` 로 남고, 재생성(POST 일정)이 그 탈출구다.
      responses:
        '200': { description: 취소됨, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationSession' } } } }
        '404': { description: 여행 없음/타 계정/세션 없음/다른 여행의 세션 }
        '409': { description: 이미 끝난 생성(완료·실패·취소됨) }
  /trips/{tripId}/itinerary/slot-candidates:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 슬롯 교체 후보 — 완전 AI·같이 고르기 공통 경계
      description: >
        "다른 후보 N"(완전 AI)과 옵션 교체(같이 고르기)가 **같은 오퍼레이션**을 쓴다(BR-U3-23).
        후보는 closed-set(INV-1) — 백엔드가 임의 POI 를 섞지 않는다.
        **제외할 장소는 받지 않는다** — 이미 일정에 있는 POI 를 서버가 유도해 제외한다(BR-U3-24).
        후보 0건이면 빈 목록이며, 클라이언트가 반경 확대·컨셉 변경을 제안한다(BR-U3-25).
        조회지만 POST 인 이유는 입력이 복합(이웃 슬롯·컨셉·반경)이기 때문이다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SlotCandidatesRequest' } } }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/SlotCandidates' } } } }
        '400': { description: '슬롯 키 형식 오류 · 반경 상한 초과 · `center.mode=POINT` 인데 lat·lng 없음/범위 밖 · 모르는 `center.mode`' }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음/해당 슬롯 없음/장소 좌표 없음 }
        '409': { description: '여행 시작 전의 확정 일정(시작 뒤에는 허용 — 편집과 같은 잠금, TRIP-999) · 아직 생성 중인 일자(이미 만들어진 일자는 허용 — TRIP-1000) · 같은 날 같은 장소가 둘이라 슬롯 특정 불가 · 고른 중심의 재료 없음(`REGION` 구 중심을 모름 · `STAY` 그 날 숙소 없음 — 다른 중심으로 바꾸지 않는다)' }
  /trips/{tripId}/visits:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 도착 체크 — 계획에 없던 곳이면 즉석 방문(US-ONTRIP-01 · US-REC-01)
      description: >
        계획(`visit_slot`)을 덮어쓰지 않고 **실적(actual) 계층**에 남긴다 —
        계획은 "가기로 한 것", 여기는 "실제로 간 것"이라 둘이 달라도 그 자체가 사실이다.
        `slotKey` 를 비우면 **즉석 방문**이다. 같은 슬롯을 두 번 체크하면 409 —
        지오펜스가 한 번 이동에 두 리전을 깨워도 하나만 확정된다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ArriveRequest' } } }
      responses:
        '201': { description: 체크됨, content: { application/json: { schema: { $ref: '#/components/schemas/VisitCheck' } } } }
        '400': { description: '장소·체크 방식 누락 · 자동 도착(AUTO_GEOFENCE)인데 slotKey 가 없음 — 자동 도착은 계획 슬롯에만 있다(INV-U10-5)' }
        '404': { description: 여행 없음/타 계정 }
        '409': { description: '이미 체크된 방문지 — `VISIT_ALREADY_RECORDED`(같은 장소, 수렴 가능) · `VISIT_CONFLICT`(다른 장소, 해소 필요) · `VISIT_AUTO_SUPPRESSED`(그날 자동 기록을 되돌린 슬롯의 자동 도착 — 기기는 버린다)' }
  /trips/{tripId}/routes:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 실제 경로 — 날짜별 하루치 경로 목록(U10 · TRIP-1405)
      description: >
        기기가 올린 다운샘플 인코딩 폴리라인을 그대로 준다 — 지도는 추가 다운샘플 없이 그린다(PERF-U10-07). 세그먼트는 기록이
        끊긴 곳에서 나뉘며 서로 잇지 않는다(INV-U10-9). **소요시간·속도·기록 구간은 싣지 않는다**(INV-3 · INV-U10-7).
      responses:
        '200': { description: 날짜순, content: { application/json: { schema: { $ref: '#/components/schemas/RouteDayList' } } } }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/routes/{date}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: date, in: path, required: true, schema: { type: string, format: date }, description: 여행지 기준 날짜 }
    put:
      tags: [trips]
      summary: 실제 경로 — 하루치 경로 저장(전체 교체 · 멱등, U10 · TRIP-1405)
      description: >
        **원시 좌표는 받지 않는다** — 기기가 다운샘플한 인코딩 폴리라인(정밀도 1e-5)뿐이다(INV-U10-2). 위치 이용 동의(L2)와
        GPS 기록 동의(L3)가 모두 있어야 저장한다. 저장할 때마다 위치 법정 로그 `COLLECTION(phase=STORE)` 1건이 남는다.
        거리는 서버가 **폴리라인 길이 이상 · 기록 구간 × 시속 300km 이하**로 깎고 깎았으면 `distanceClamped` 다(BR-U10-38).
        L2 또는 L3 를 철회하면(계정 삭제 포함) 그 계정의 경로는 전부 즉시 지워진다(DEC-U10-7 · D4).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteDayUpload' } } }
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { $ref: '#/components/schemas/RouteDay' } } } }
        '400':
          description: >
            필수 값 누락 · 여행 기간 밖의 날짜(정본은 422 `OUT_OF_WINDOW` — 이 API 의 입력 오류는 400 으로 모았다) ·
            세그먼트가 없거나 원소가 null · 세그먼트 200 개 초과 · 인코딩 총 64,000 자 초과 · 디코드 후 점 2,000 개 초과(푸는 도중
            멈춘다, SEC-U10-07) · 인코딩 형식 오류 · `rawPointCount` < 저장 점 수 · `recordedTo` < `recordedFrom` ·
            폴리라인 길이가 기록 구간 × 시속 300km 보다 김(물리적으로 불가능 — 기록 구간이 없으면 하루로 본다)
        '404': { description: 여행 없음/타 계정 }
        '409': { description: '`LOCATION_CONSENT_REQUIRED` — L2 또는 L3 동의 없음. 기기는 그날 원시 표본·큐를 지우고 강등한다(BR-U10-45)' }
  /trips/{tripId}/location-automation/intervals:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 자동화 구간 보고 — 지오펜스 무장·경로 기록의 시작과 끝(U10 · TRIP-1404)
      description: >
        기기가 지오펜스 자동 기록을 무장하거나 경로 기록을 시작·종료할 때 알린다. **좌표는 받지 않는다** — 서버는 구간을 열고
        닫으며 구간 단위 위치 법정 로그(무장 = `USE`, 경로 기록 = `COLLECTION`)를 남긴다(BR-U10-47).
        **멱등**(`intervalId` + `phase`) — 오프라인 큐가 같은 보고를 다시 보내도 한 번만 반영되고 204 다.
        START 는 위치 이용 동의(L2)가 있어야 하고, 경로 기록은 GPS 기록 동의(L3)도 있어야 한다. 서버 킬 스위치가 꺼져 있으면
        START 는 409 다 — 기기는 강등한다. END 는 언제나 받는다. END 가 오지 않은 구간은 여행 종료 + 1일에 서버가
        `SERVER_TIMEOUT` 으로 닫는다(여행을 지웠으면 다음 훑기에). 동의를 철회하면(계정 삭제 포함) 서버가 열린 구간을 철회 시각으로
        `CONSENT_REVOKED` 닫는다 — L3 철회는 경로 기록만, L2 철회·계정 삭제는 전부.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntervalReportRequest' } } }
      responses:
        '204': { description: 반영됨(재전송 포함) }
        '400': { description: '필수 값 누락 · END 에 endReason 없음 · endReason=SERVER_TIMEOUT(서버 전용) · 보고 시각이 서버 시각 + 5분보다 뒤 · START 시각이 여행 기간 ± 1일(서울 날짜) 밖' }
        '404': { description: 여행 없음/타 계정 }
        '409':
          description: >
            `error.code` 로 가른다. **`AUTOMATION_DISABLED`**(서버 킬 스위치 꺼짐) · **`LOCATION_CONSENT_REQUIRED`**(무장은 L2, 경로 기록은
            L2·L3 가 없음) — 둘 다 START 에서만 나고, 기기는 **무장을 풀고 강등한다**(안 풀면 서버엔 구간도 법정 로그도 없는데 기기는
            무장한 채다). `CONFLICT` — 시작 보고가 없는 END · 그 구간 id 가 다른 여행·종류에 쓰였음(기기 결함, 강등 신호 아님).
  /trips/{tripId}/visits/auto-events:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 자동 방문 결과 배치 — 기기가 판정한 도착·완료(U10 · TRIP-1403)
      description: >
        **좌표가 없다**(INV-U10-2) — 기기가 지오펜스로 판정한 결과(슬롯·장소·발생 시각)만 온다. 발생 시각(`occurredAt`)을 그대로
        기록한다(G-U10-1 — 서버 시각이 아니다). 순서대로 적용하고 **항목마다 결과**를 준다 — 409 로 배치 전체를 깨지 않는다(BR-U10-20).
        멱등: 같은 배치를 몇 번 보내도 최종 상태가 같다 — 재전송은 `ALREADY_RECORDED` 로 수렴한다(PBT-U10-3).
        **서버 우선**: 이미 있는 기록은 바뀌지 않는다. 예외는 수동 도착 + 미완료에 자동 완료를 더하는 것 하나(§5.2).
        `outcome`: `APPLIED` · `ALREADY_RECORDED`(이미 그 상태 — 버린다) · `CONFLICT`(일정에 없는 슬롯 · 건너뛴 슬롯 · 도착 없는 완료 ·
        자동 출처 없는 완료) · `SUPPRESSED`(그날 자동 기록을 되돌린 슬롯) · `REJECTED_CONSENT`(위치 이용 동의 L2 없음 — 전 항목) ·
        `OUT_OF_WINDOW`(여행 기간 밖 · 슬롯 날짜와 다른 날 · 서버 시각 + 5분보다 미래 · 도착보다 앞선 완료).
        `automationEnabled` 가 `false` 면 서버 킬 스위치가 꺼진 것이다 — 기기는 강등한다. 꺼져 있어도 온 항목은 정상 처리한다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AutoVisitBatch' } } }
      responses:
        '200': { description: 항목별 결과, content: { application/json: { schema: { $ref: '#/components/schemas/AutoVisitBatchResult' } } } }
        '400': { description: 필수 값 누락 · 한 번에 50 건 초과 }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/visits/{visitCheckId}/revert-auto:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: expectedUpdatedAt
        in: query
        required: false
        schema: { type: string, format: date-time }
        description: >
          화면이 본 기록의 `updatedAt`. 무엇을 되돌릴지가 **지금 상태**로 정해지므로, 두 번 누르거나 응답을 못 받고 다시 보내면 완료에 이어
          도착까지 지워진다 — 이 값을 주면 그 사이 바뀐 것을 409 `VISIT_CONFLICT` 로 가른다(BR-U5-22 와 같은 판정). 안 주면 보지 않는다.
    post:
      tags: [trips]
      summary: 자동 기록 되돌리기(U10 · TRIP-1403)
      description: >
        **자동 출처 부분만** 되돌린다(BR-U10-31). 자동 완료면 완료만 비우고(도착은 남는다 — 그 슬롯의 재계획 잠금도 풀린다), 완료 없는
        자동 도착이면 도착을 비우고 **그날 그 슬롯의 자동 기록을 막는다**(이후 자동 결과는 `SUPPRESSED`). 그 자리에 사람이 도착·건너뛰기를
        남기면 같은 행을 쓴다(BR-U10-32).
      responses:
        '200': { description: 되돌린 뒤의 방문 기록, content: { application/json: { schema: { $ref: '#/components/schemas/VisitCheck' } } } }
        '404': { description: 여행·방문 없음/타 계정 }
        '409': { description: '`VISIT_HAS_MEDIA` — 사진·메모가 붙은 방문의 자동 도착(먼저 지우라고 안내) · `VISIT_NOT_AUTO` — 되돌릴 자동 기록이 없다(수동 기록, 출처가 빈 완료 포함) · `VISIT_CONFLICT` — `expectedUpdatedAt` 이후 바뀜' }
  /trips/{tripId}/visits/days/{day}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: day, in: path, required: true, schema: { type: string, format: date } }
    get:
      tags: [trips]
      summary: 그 날의 방문 기록
      description: >
        즉석 방문은 슬롯 키가 없어 **도착 시각(여행지 기준 날짜)** 으로 묶인다.


        **배열 순서가 곧 방문 순서다** — 도착 시각 오름차순이고, 도착한 적 없는 건너뛰기는 기록된 시각으로
        끼어든다. 기록(`/trips/{tripId}/records` 의 `actual`)과 **같은 순서**라 화면은 `index + 1` 로
        "몇 번째 방문"을 매기면 된다(TRIP-1315). 종전에는 최신이 먼저 나와 두 화면의 번호가 어긋났다.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/VisitCheckList' } } } }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/visits/{visitCheckId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [trips]
      summary: 실제 시각 보정 — 자동 기록하되 수정 가능(US-REC-01)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdjustTimesRequest' } } }
      responses:
        '200': { description: 보정됨, content: { application/json: { schema: { $ref: '#/components/schemas/VisitCheck' } } } }
        '404': { description: 여행 없음/타 계정/기록 없음 }
        '409': { description: '도착 없이 완료만 남기거나 순서가 뒤집힘 · `expectedUpdatedAt` 이 낡았으면 `VISIT_CONFLICT`(BR-U5-22)' }
  /trips/{tripId}/visits/{visitCheckId}/complete:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 방문 완료 — 이 시점부터 그 슬롯은 재계획에서 불변(INV-U4-04)
      responses:
        '200': { description: 완료됨, content: { application/json: { schema: { $ref: '#/components/schemas/VisitCheck' } } } }
        '404': { description: 여행 없음/타 계정/기록 없음 }
        '409': { description: '도착 없이 완료 · 이미 결과가 있다(같은 결과면 `VISIT_ALREADY_RECORDED`, 다른 결과면 `VISIT_CONFLICT`)' }
  /trips/{tripId}/visits/skip-planned:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: skipPlannedVisit
      summary: 도착 전 건너뛰기 — 실적이 없는 계획 슬롯을 접는다(TRIP-1029). 좌표를 받지 않는다(위치 법정 로그 무관)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotKey, poiId]
              properties:
                slotKey: { type: string, maxLength: 100, description: "계획 슬롯 키 {date}#{poiId} — 즉석 방문에는 '안 간 계획'이 없어 필수" }
                poiId: { type: string, format: uuid }
      responses:
        '201':
          description: SKIPPED 실적 생성 — 허브·기록은 skippedAt 로 건너뜀을 판정한다(상태는 timestamp 파생, INV-U5-01)
          content: { application/json: { schema: { $ref: '#/components/schemas/VisitCheck' } } }
        '409': { description: '그 슬롯에 이미 실적이 있음 — 같은 건너뜀 재전송은 VISIT_ALREADY_RECORDED, 다른 기록은 VISIT_CONFLICT(도착분은 기존 skip 경로로)' }
  /trips/{tripId}/visits/{visitCheckId}/skip:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 건너뜀(취소) — 안 갔으므로 재계획에서 잠그지 않는다
      responses:
        '200': { description: 건너뜀, content: { application/json: { schema: { $ref: '#/components/schemas/VisitCheck' } } } }
        '404': { description: 여행 없음/타 계정/기록 없음 }
        '409': { description: '이미 결과가 있다 — 같은 결과면 `VISIT_ALREADY_RECORDED`, 다른 결과면 `VISIT_CONFLICT`' }
  /trips/{tripId}/visits/{visitCheckId}/photos:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 방문 사진 **메타** 등록 — 업로드가 아니다
      description: >
        **서버는 사진 바이너리를 저장하지 않는다**(INV-U5-03 · DEC-U5-9). 여기서 받는 것은 기기 로컬
        자산 식별자·기기 id·촬영 시각·EXIF 좌표(동의 시)뿐이고, 화면은 그 식별자로 기기 자산을 직접 연다.
        업로드 경로는 없고 만들지도 않는다 — `storage_key` 류를 한 번 만들면 다음 사이클이 채운다.


        `exifLat`·`exifLng` 는 **위치 동의(L3 `gpsRecordingOptIn`)가 없으면 저장되지 않는다**(INV-U5-04).
        거부가 아니라 **무시**다 — 거부로 만들면 클라이언트가 동의 상태 사본을 들고 있어야 하고,
        그 사본이 어긋나는 순간 등록 자체가 막힌다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddPhotoRequest' } } }
      responses:
        '201': { description: 등록됨, content: { application/json: { schema: { $ref: '#/components/schemas/VisitPhoto' } } } }
        '400': { description: 입력 검증 실패 · 방문당 상한 초과 }
        '404': { description: 여행 없음/타 계정/방문 기록 없음 }
        '409': { description: 같은 기기의 같은 자산이 이미 붙어 있음 }
    get:
      tags: [trips]
      summary: 방문 사진 메타 목록 + 개수
      description: >
        정렬 순서대로. `count` 를 함께 주는 이유는 **개수만 쓰는 소비자**가 있기 때문이다 —
        AI 컨텍스트 조립이 필요로 하는 것은 사진 자체가 아니라 "몇 장 찍었나"다.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/VisitPhotoList' } } } }
        '404': { description: 여행 없음/타 계정/방문 기록 없음 }
  /trips/{tripId}/visits/{visitCheckId}/photos/order:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [trips]
      summary: 사진 정렬 변경
      description: >
        그 방문의 사진 **전부**를 한 번씩 담아야 한다. 부분 목록을 받아 그것만 다시 매기면 나머지와
        순서가 겹쳐 "어느 것이 먼저인가"가 사라진다 — 그래서 400 으로 거부한다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReorderPhotosRequest' } } }
      responses:
        '204': { description: 변경됨 }
        '400': { description: 목록이 그 방문의 사진 전부가 아님 }
        '404': { description: 여행 없음/타 계정/방문 기록 없음 }
  /trips/{tripId}/visits/{visitCheckId}/photos/{visitPhotoMetaId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitPhotoMetaId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [trips]
      summary: 사진 메타 삭제 — 기기의 원본 사진은 건드리지 않는다
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 여행 없음/타 계정/방문·사진 없음 }
  /me/export:
    get:
      tags: [account]
      summary: 내 데이터 내려받기(l05)
      description: >
        계정이 소유한 것 전부 — 프로필·취향·여행·저장 숙소·방문 기록·동의 이력·도우미 대화. **내보내기만**이고
        계정 삭제는 별개다(U0 유예 삭제).


        도우미 대화(`assistantMessages`)는 **메시지 한 건이 한 줄**이다 — 사용자가 한 말과 도우미의 답(`sessionId`·`tripId`·
        `role`·`kind`·`text`·`redacted`·`createdAt`·`feedback`·`feedbackReason`·`feedbackComment`). 정책 위반으로 가려진 입력은
        원문이 서버에 없어 `redacted: true` 표지만 나간다. `feedback` 은 그 답에 남긴 평가(`UP`|`DOWN`, 없으면 null)이고,
        `feedbackReason`·`feedbackComment` 는 싫어요에 함께 남긴 이유 칩(`WRONG`|`NOT_HELPFUL`|`NOT_WHAT_I_WANTED`)과
        자유 의견이다(없으면 null). 보존 기간이 지난 대화는 싣지 않는다.


        ⚠ **사진 바이너리는 없다**(INV-U5-03) — 서버가 갖고 있지 않으므로 메타(기기 자산 식별자·
        촬영 시각)만 나간다. append-only 로그(`consent_record`)는 **읽기만** 한다.


        몫마다 `sectionLimit` 을 넘으면 잘라 내고 `truncatedSections` 에 이름을 싣는다 —
        조용히 자르면 받은 파일이 전부인 줄 안다.
      parameters:
        - name: sectionLimit
          in: query
          schema: { type: integer, default: 500, minimum: 1, maximum: 2000 }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/AccountExport' } } } }
  /me/records:
    get:
      tags: [trips]
      summary: 지난 여행 기록 목록(j07)
      description: >
        재열람은 **여행 단위**로 들어간다(BR-U5-56) — 목록에서 여행을 고르고 거기서
        계획｜실제｜변경 3종으로 갈린다(`GET /trips/{tripId}/records`).


        **빈 상태를 값으로 알린다.** 조용히 빈 배열만 주면 화면이 "오류인가, 상한에 걸렸나,
        정말 없나"를 구분하지 못하고 그 셋은 보여 줄 것이 전부 다르다.
        `emptyState=NO_TRIPS` 면 새 여행 생성 진입을, `NO_RECORDS` 면 기다리라고 그린다.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 100 }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/TripRecordList' } } } }
  /me/personalization:
    get:
      tags: [reflection]
      summary: 개인화 활용 안내(l05)
      description: >
        **무엇을 넘겼는가**를 계약으로 낸다(BR-U5-45) — 화면은 U6 소관이고 여기는 그 목록의 원천이다.
        목록은 **실제로 넘긴 것만** 담는다: "이런 걸 쓸 수 있습니다"를 미리 적어 두면 안내가
        거짓말이 된다.


        `reason` 이 따로 있는 이유는 **동의가 없어 빠진 것과 기록이 모자라 빠진 것이 다르기**
        때문이다(BR-U5-44). 그 구분이 없으면 화면은 이미 동의한 사용자에게도 "동의하면 더
        맞춰드려요"를 보인다.


        동의(`PERSONALIZATION` 약관)가 없으면 과거 기록은 **읽히지도 않는다** — 추천은 온보딩
        취향만으로 만들어진다.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalizationInfo' } } } }
  /me/style:
    get:
      tags: [reflection]
      summary: 여행 스타일 분석(j05)
      description: >
        **계정 단위**다(INV-U5-08) — 여행이 지워져도 남는다. 조회 시점에 실적을 다시 훑어 계산하고,
        정식이면 저장한다.


        응답이 두 모양인 이유는 **그 둘이 다른 것이기 때문이다**(BR-U5-40). 누적 방문 10곳 미만이면
        정식 분석을 만들지 않고(`official=false`) 온보딩 취향 기반 **임시 미리보기**를 낸다 —
        화면은 "정식 아님"을 명시해야 하고, 그 근거가 `progress`(현재 N곳 / 필요 10곳)다.
        미리보기는 **저장하지 않는다**(BR-U5-41) — 저장하면 정식과 구분이 사라진다.


        `categoryBreakdown[].category` 는 **`poi.category` 코드**다(`맛집`·`카페`…) — 화면 라벨이
        아니다. 화면의 `미식` 은 `맛집` 의 표시 라벨이고 그 매핑표는 디자인 확인이 남았다(O-U5-7).
        서버가 라벨로 저장하면 라벨이 바뀔 때 저장된 과거 분석이 전부 틀린 말이 된다.
        상위 3 + `기타` 로 접는 것은 서버가 한다(비율 합이 1이 되는 산술).


        `traitGauges` 3축의 **산출식은 잠정이다**(O-U5-9 미결) — 축은 화면 정본을 따르고,
        식은 U6 마이페이지 설계와 함께 확정한다.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/StyleAnalysisEnvelope' } } } }
  /trips/{tripId}/summary:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [reflection]
      summary: 여행 요약(j04)
      description: >
        요약은 **여행이 끝나야 생긴다**(BR-U5-39) — `trip.TripEnded` 를 아웃박스 릴레이로 받아 만든다.
        아직 없으면 404 가 아니라 `ready=false` 로 알린다: 화면이 **공유 진입점을 비활성화**해야 하는데
        (BR-U5-48) 404 는 "없다"와 "타 계정"을 구분하지 못해 그 판단의 근거가 되지 못한다.


        방문 0곳 여행도 **비어 있지 않다**(PBT-U5-1) — `stats` 를 채운 기본 요약이 나온다.


        ⚠ 릴레이는 **구독자를 붙인 시점 이후** 이벤트만 준다 — 그 전에 끝난 여행은 요약이 없다.
        소급 배치는 이 티켓 밖이다(`trip.ended_at` 이 남아 나중에 훑을 근거는 있다).
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/TripSummaryEnvelope' } } } }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/share-card/copy:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [reflection]
      summary: 공유 카드 문구(j06) — 캡션·해시태그
      description: >
        카드 **이미지는 기기가 그린다**(BR-U5-46) — 이 경로는 그 아래 붙는 캡션 한 문단과 해시태그만 준다(TRIP-1411).
        부를 때마다 새로 짓고 저장하지 않는다(AI 호출). 요청 본문은 없다 — 재료(방문·취향·기간·지역)는 서버가 모은다.


        AI 를 못 부르거나, 상대가 자기 폴백으로 답하거나, 계약(캡션 1~150자)을 넘거나, 건너뛴 장소를 말하면 규칙 조립이
        `isFallback=true` 로 나간다 — **캡션은 빈 문자열**(앱이 문장 시드를 걷어냈다, TRIP-766)이고 해시태그는 목적지마다
        `#{지역}여행` 이다. 캡션 길이는 앱 `validateCaption` 과 같은 단위(UTF-16 코드 유닛)로 재고, 넘는 AI 캡션은 자르지 않고
        규칙 조립으로 간다 — 잘린 문장이 내려오지 않는다.


        **계정당 하루 상한**이 있다(기본 30회, KST 자정에 풀린다). AI 까지 가는 호출만 센다 — AI 가 꺼져 있거나 간 곳이 없어
        규칙 조립으로 바로 가는 호출, 404·409, 아래 동시 요청 거절은 세지 않는다. AI 가 실패해도 센다(호출은 나갔다).
        한 계정의 문구는 **한 번에 하나**만 짓는다 — 짓는 동안 온 같은 계정의 요청은 429 `RATE_LIMITED` 다.
      responses:
        '200': { description: 문구, content: { application/json: { schema: { $ref: '#/components/schemas/ShareCardCopy' } } } }
        '404': { description: 여행 없음/타 계정 }
        '409': { description: 여행이 끝나 요약이 생기기 전(BR-U5-48) }
        '429':
          description: >
            둘 중 하나다(TRIP-1411). (1) 오늘의 AI 공유 문구 횟수를 모두 썼다 — `error.code` = `SHARE_CARD_DAILY_LIMIT`.
            **재시도로 풀리지 않는다**. `Retry-After` 헤더에 풀리는 시각(KST 자정)까지 남은 초가 실린다. 화면은 문구 없이
            (사용자가 직접 써서) 공유를 이어 갈 수 있다. (2) 같은 계정의 문구를 **이미 짓고 있다**(한 계정에 한 번에 하나) —
            `error.code` = `RATE_LIMITED`, `Retry-After` = 앞 요청의 정상 경로 상한(AI 연결 + 읽기, 기본 24초)을 올림한 초.
            앞 요청이 끝나면 그보다 일찍 풀리고, 드물게 그보다 오래 걸리면 다시 온 요청이 또 거절될 뿐이다. 이 거절은 하루
            횟수를 쓰지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /trips/{tripId}/reflections:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [reflection]
      summary: 여행의 하루 회고 목록(j03)
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/ReflectionList' } } } }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/reflections/{dayDate}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: dayDate, in: path, required: true, schema: { type: string, format: date } }
    post:
      tags: [reflection]
      summary: 하루 회고 생성·재생성
      description: >
        **입력이 무엇이든 결과가 비어 있지 않다**(PBT-U5-1 · 블로킹 게이트). 방문 0곳·사진 0장이어도
        `stats` 를 채운 기본 카드가 나온다 — 폴백 3단(AI → 규칙 → 기본) 중 어느 단에서 멈춰도
        빈 화면을 그리지 않는다(BR-U5-32).


        하루 한 장이라 다시 부르면 **덮어쓴다**(BR-U5-35). 사용자가 고친 카드(`editedCard`)는
        재생성해도 남는다 — 초안만 갈린다.


        `source` 는 `AI`·`RULE`·`BASIC` 중 하나다. 배포(개발·운영)는 AI 단을 부른다(`POST /ai/v1/reflection/generate`,
        O-U5-6 = `http`) — AI 가 실패하거나 안 간 곳을 말하면 규칙 카드로 내려간다(BR-U5-32·33).
      responses:
        '200': { description: 생성됨, content: { application/json: { schema: { $ref: '#/components/schemas/Reflection' } } } }
        '400': { description: 여행 기간 밖 날짜 }
        '404': { description: 여행 없음/타 계정 }
        '409': { description: '`REFLECTION_UNREADABLE` — 그 하루에 저장된 수정본(`editedCard`)을 서버가 읽지 못해 덮지 않았다(행은 그대로다). 재시도로는 풀리지 않는다' }
    put:
      tags: [reflection]
      summary: 회고 카드 수정 — 초안은 남는다
      description: >
        생성된 초안을 덮지 않고 `editedCard` 에 따로 쌓는다(INV-U5-06). 화면이 "생성된 것"과
        "내가 고친 것"을 2열로 그리기 때문이다 — 하나로 합치면 그 비교가 사라진다.


        수정 단위는 **카드 통째**다(BR-U5-35). 장면·캡션 단위 편집은 화면이 정해진 뒤에 정한다.


        **회고가 아직 없어도 쓸 수 있다**(BR-U5-36) — 근거 수치만으로 된 기본 카드를 만들어 그 위에
        얹는다. 404 로 막으면 화면은 "쓰려면 먼저 생성 버튼을 누르세요"가 되는데, 생성이 실패해서
        여기 온 사용자에게 그건 답이 아니다.


        여행 기간 밖 날짜는 400 이다 — 그 날에는 근거 데이터가 없다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EditReflectionRequest' } } }
      responses:
        '200': { description: 수정됨, content: { application/json: { schema: { $ref: '#/components/schemas/Reflection' } } } }
        '400': { description: 입력 검증 실패 · 여행 기간 밖 날짜 }
        '404': { description: 여행 없음/타 계정 }
        '409': { description: '`REFLECTION_UNREADABLE` — 위 POST 와 같다' }
  /trips/{tripId}/records:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 계획｜실제｜변경 3종 비교(j02)
      description: >
        **아무것도 저장하지 않는다.** 미방문(`unvisitedSlotKeys`)도 숙소 귀속(`baseStayName`)도
        조회 시점에 갈라낸 **파생값**이다 — 저장하면 계획이 바뀌거나 숙소를 바꿀 때 옛 기록이
        따라오지 않는다(BR-U5-25·26·28).


        계획은 실적에 덮이지 않는다(BR-U5-01) — 계획과 실제가 달라도 그 자체가 사실이라,
        둘을 나란히 두는 것이 이 화면의 전부다.


        ⚠ **체류 시간은 싣지 않는다**(BR-U5-08). 산출은 되지만 개별 방문의 체류로 화면에 보이지 않는다.
      parameters:
        - name: changeLimit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/TripRecord' } } } }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/visits/{visitCheckId}/memo:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: visitCheckId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [trips]
      summary: 방문 메모 저장(upsert) — 한 방문에 한 개
      description: >
        한 방문에 메모는 하나뿐이라(BR-U5-13) "만들기"와 "고치기"를 나누지 않는다.
        메모는 **사진과 무관하게 남는다**(INV-U5-05) — 자산을 못 열어도 감상은 남아야 한다.
        조회 표면은 이 티켓에 없다(`j02` 3종 비교가 소유).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutMemoRequest' } } }
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { $ref: '#/components/schemas/VisitMemo' } } } }
        '400': { description: 입력 검증 실패 }
        '404': { description: 여행 없음/타 계정/방문 기록 없음 }
  /trips/{tripId}/triggers:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 감지된 변화 — 발화 중이고 지금 유효한 것만 + 감시 상태(i08·i09)
      description: >
        **발화 중인 트리거만 나간다**(INV-U4-01). 억제·무영향으로 남긴 판정은 "왜 알림이 안 왔나"를
        답하기 위한 관측 기록이며 사용자에게 어떤 형태로도 노출되지 않는다.
        트리거는 **제안까지만** 한다 — 어떤 트리거도 일정을 자동으로 바꾸지 않는다(BR-U4-09).

        지난 날 · 지금 일정에서 빠진 슬롯 · 꺼진 감시 출처(스윕을 끄거나 그 출처를 빼면 즉시 숨는다)의 트리거는 내지 않는다.
        정렬은 서버가 정한다 — 위험 → 영향 날짜 오름차순 → 감지 시각 내림차순. 화면은 받은 순서 그대로 쓴다.
        `watch` 는 출처 묶음별 감시 상태다 — 꺼짐·확인 불가를 정상으로 말하지 않는다(INV-U4-09).
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/TriggerList' } } } }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/triggers/weather-check:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 날씨 확인 — 서버가 강수확률을 읽어 임계 초과면 트리거를 만든다
      operationId: weatherCheck
      description: >
        **본문이 없다.** 다른 신호원과 달리 날씨는 신호원이 서버 쪽(기상청)이라 클라이언트가 보낼 것이 없고,
        강수확률 임계도 서버가 소유한다(G-U4-2 · BR-U4-03) — 클라이언트는 임계를 알지 못하며 알 필요도 없다.

        **조회 실패·임계 미만·억제는 모두 `204`** 다. 셋 다 화면이 할 일이 같기 때문이다(배너 없음).
        특히 조회 실패를 "비 안 옴"으로 접지 않는다 — 확인하지 못한 것은 무발화이고,
        만료된 예보로는 발화하지 않는다(BR-U4-05 · INV-U4-09 허위 알림 금지).

        `GET` 이 아니라 `POST` 인 이유는 판정 결과를 행으로 남기기 때문이다(조회가 아니다).
        트리거는 **제안까지만** 한다 — 일정을 자동으로 바꾸지 않는다(BR-U4-09).
      responses:
        '200':
          description: 발화됨 — 배너를 띄운다
          content: { application/json: { schema: { $ref: '#/components/schemas/Trigger' } } }
        '204': { description: 발화 없음(비 안 옴 · 확인 불가 · 억제 — 화면은 동일하게 배너 없음) }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/triggers/{triggerId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: triggerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 트리거 하나 — 지금 상태와 같은 대상의 현재 트리거
      description: >
        알림·푸시를 늦게 탭해도 앱이 이 트리거가 아직 유효한지, 해제 뒤 같은 대상에 새 트리거가 섰는지
        (`currentTriggerId`) 안다. 목록에서 숨는 ACTIVE(지난 날 · 빠진 슬롯 · 꺼진 출처)는 `state` 가 EXPIRED 다.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/TriggerDetail' } } } }
        '404': { description: 여행 없음/타 계정/트리거 없음(다른 여행 소속 포함) }
  /trips/{tripId}/triggers/{triggerId}/dismiss:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: triggerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 알림 끄기 — 억제 레코드를 만든다(BR-U4-15)
      description: >
        화면에서 배너만 감추는 동작이 아니다. 억제 레코드가 생겨 **다음 감지 때 같은 조합이 발화하지 않는다**.
        슬롯을 특정한 신호면 그 슬롯만, 날짜 전체 신호면 그 날 전체를 끈다.
      responses:
        '200': { description: 꺼짐, content: { application/json: { schema: { $ref: '#/components/schemas/Trigger' } } } }
        '404': { description: 여행 없음/타 계정/트리거 없음(다른 여행 소속 포함) }
        '409': { description: 이미 닫혔거나 지난 알림 }
  /trips/{tripId}/opportunities:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 그 날짜의 기회 — 남은 동선 근처의 행사·요즘 인기 최대 3개(situation-awareness BR-SA-22)
      description: >
        허브가 보는 날짜의 **남은 동선 1km 안 등록 장소**를 AI 가 고른다(LLM 0회) — 기간이 겹치는 행사의 행사장 ·
        행사장 가까이 · 태그 '요즘 인기'. 서버가 그 날 끝나지 않은 슬롯과 일정의 장소를 채워 묻는다(앱은 날짜만 보낸다).
        **트리거도 알림도 아니다**(DEC-U4-4 · LEGAL-SA-01) — 상태가 없고 푸시·알림함에 오지 않는다.
        카드의 장소는 등록 POI 뿐이고(INV-1) 시각 필드가 없으며(INV-2 — 행사 원천이 일 단위) 거리는 표시 문자열뿐이다(INV-3).
        문장은 앱의 고정 템플릿이 만든다 — 서버는 재료만 준다.

        여행 중(오늘 ≥ 시작)이고 날짜가 [오늘, 종료]일 때만 묻는다. 꺼짐 · 여행 전 · 범위 밖 · 남은 슬롯 없음 · AI 실패 ·
        계약 위반은 전부 200 빈 목록이다 — 앱은 빈 목록이면 아무것도 그리지 않는다. 404 는 소유 아님뿐이다.
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: '허브가 보고 있는 날짜(yyyy-MM-dd)' }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/OpportunityList' } } } }
        '400': { description: date 누락·형식 오류 }
        '404': { description: 여행 없음/타 계정(존재 은닉) }
  /trips/{tripId}/stay-recommendations:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 숙소 나중 등록 온램프 — 동선 기준 권역·후보 평가(US-SCHED-11 · h27·h28)
      description: >
        숙소 없이 만든 일정의 **방문지 무게중심**으로 권역을 추천하고, 넘겨받은 후보를
        **평균 이동 거리 순**으로 매긴다(before/after 함께). 거리는 전부 **추정(직선)** 이며 소요시간은 없다(INV-3).

        후보 목록은 클라이언트가 `GET /stays/search` 로 얻어 넘긴다 — 숙소 검색은 C3 소유라 여기서 중개하지 않는다.
        비워 보내면 권역만 돌려준다.

        **등록 후 재정렬 API 는 없다** — 정본이 "숙소 등록 후 재정렬 = generate"로 못박았다(DEC-U3-2·4).
        숙소를 등록한 뒤 `POST /trips/{tripId}/itinerary` 를 다시 부르면 그 숙소가 앵커로 들어간다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StayRecommendationRequest' } } }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/StayRecommendation' } } } }
        '400': { description: 후보 수 초과 }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음 }
        '409': { description: 좌표를 아는 방문지가 없어 권역을 낼 수 없음 }
  /trips/{tripId}/replan-sessions:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 재계획 진입 — 세션을 연다(i10)
      description: >
        여행 **기간 안**에서만(예외: 지평 pre-trip 의 여행 전날 — 알림으로 받은 첫날 하루 전체, BR-SA-20),
        **다시 짤 일정이 있을 때만** 연다.
        이미 열린 세션이 있으면 **그것을 CANCELED 로 닫고 새로 시작**한다(INV-U4-06) — 막지 않는다.
        사용자가 앱을 닫았다 다시 들어오는 것이 정상 흐름이라, 거부하면 영영 못 들어간다.
        확정(APPLIED) 전에는 원 일정에 **어떤 쓰기도 발생하지 않는다**(INV-U4-05).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartReplanRequest' } } }
      responses:
        '201': { description: 세션 생성됨, content: { application/json: { schema: { $ref: '#/components/schemas/ReplanSession' } } } }
        '400': { description: 범위 누락 · GPS/MANUAL 인데 좌표 없음 · 자유 입력 초과 }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음 }
        '409':
          description: >
            여행 기간 밖 · 지난 날·기간 밖·일정 없는 날 · triggerId 의 트리거가 없거나 다른 여행 것 ·
            여행 전날 창(지평 pre-trip)에서 알림으로 받은 첫날 하루 전체가 아닌 진입
            (`여행 전날에는 알림으로 받은 첫날 일정만 다시 짤 수 있어요.`) ·
            같은 순간 다른 진입이 먼저 열림(`다른 재계획이 막 시작됐어요. 다시 시도해 주세요.`)
  /trips/{tripId}/replan-sessions/prepared:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 그 날짜의 준비된 대안 — 서버가 위험 알림으로 미리 짠 재계획(situation-awareness BR-SA-18·23)
      description: >
        일정을 막는 위험이 감지되면 서버가 재계획 초안을 미리 짠다(SYSTEM 세션). 이것은 그 날짜의 **가장 최근** 선계산 세션이다 —
        대체돼 닫힌 것(`CANCELED`)·대안 없음·실패도 그대로 준다. 갈 곳은 앱 진입 게이트가 상태·`stale`·트리거 상태로 정한다 —
        판정표의 정본은 situation-awareness BR-SA-23 이다(여기에 옮겨 적지 않는다).
        트리거에 세션을 매달지 않고 **날짜**로 묻는다 — 해제 뒤 다시 선 트리거도 같은 대안으로 이어진다.
        일정은 여전히 사용자의 apply 로만 바뀐다(INV-SA-1).
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: '알림의 날짜(yyyy-MM-dd)' }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/ReplanSession' } } } }
        '400': { description: date 누락·형식 오류 }
        '404': { description: 준비된 대안 없음 · 여행 없음/타 계정(존재 은닉) }
  /trips/{tripId}/replan-sessions/{sessionId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 재계획 세션 조회 — 진행 상태와 재계획안
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/ReplanSession' } } } }
        '404': { description: 여행 없음/타 계정/세션 없음(다른 여행 소속 포함) }
  /trips/{tripId}/replan-sessions/{sessionId}/apply:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 재계획 확정(i18) — 초안을 일정에 반영한다
      description: >
        **일정이 바뀌는 유일한 지점**이다(INV-U4-05) — 그 전까지 `itinerary`·`visit_slot` 은 진입 전과 같다.
        대상 일자만 교체하고 나머지 일자는 손대지 않으며, 되돌릴 지점을 먼저 남긴다(BR-U3-19).
        완료·시각 고정 슬롯은 산출 단계에서 이미 잠겨 있어 그대로 남는다(INV-U4-04).
        반영 후 세션은 `APPLIED` 로 닫히고 `ItineraryRecalculated` 가 나간다. 반영 순간 그 날의 직전 모습을 세션에 떠 둔다 —
        반영 뒤 비교(`…/diff`)와 되돌리기(`…/revert`)가 그것을 쓴다(TRIP-1412).
      responses:
        '200': { description: 반영됨, content: { application/json: { schema: { $ref: '#/components/schemas/ReplanSession' } } } }
        '404': { description: 여행 없음/타 계정/세션 없음 }
        '409':
          description: >
            초안 없음(산출 중·대안 없음·이미 끝남) · 그 사이 일정이 교체됨 — 확정 일정은 막지 않는다(여행 중 반영 허용, TRIP-999).
            미리 짠 대안(SYSTEM)이 낡았으면 오류 코드 `EXPIRED`(대상 날이 지남 · 초안이 바꾸는 첫 슬롯의 계획 시작이 지남) 또는
            `STALE`(그 날 다녀온 곳이 초안에 없음 · 새 선계산·사용자 진입에 대체돼 닫힘)이다 — 시각을 다시 추정해 옮기지 않는다
            (BR-SA-19). 같은 입력으로 새로 계산한다. 여행 시작 전에는 전날 창의 진입(알림으로 받은 첫날 하루 전체)만 반영한다.
  /trips/{tripId}/replan-sessions/{sessionId}/diff:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [replan]
      summary: 전후 비교(i18) — 확정 전, 그리고 반영 뒤 빠진 곳(TRIP-1412)
      description: >
        **읽기만** 한다 — 확정 전까지 원 일정에는 어떤 쓰기도 없다(INV-U4-05).


        비교를 **서버가 계산해** 내리는 이유는 판정이 업무 규칙이기 때문이다(BR-U4-29) —
        무엇이 `MOVED` 이고 무엇이 `FIXED` 인가, 거리를 하나라도 모를 때 총합을 어떻게 다루는가.
        화면이 그 규칙을 다시 구현하면 두 곳에 흩어지고, 한쪽만 고쳐도 아무도 모른 채
        **사용자가 틀린 근거로 확정한다.**


        빠진 항목은 `REMOVED` 로 반드시 실린다(BR-U4-25 제외·이월 명시) — 조용히 사라지지 않는다.


        아직 초안이 없으면(`COLLECTING`·`SOLVING`·대안 없음) **404 가 아니라 `ready=false`** 다.
        404 로 두면 "세션이 없다"와 "산출 중"이 같은 응답이 되어 화면이 로딩(`i12`)을 그릴지
        오류를 그릴지 정하지 못한다.


        **반영된(`APPLIED`) 세션도 비교를 준다**(TRIP-1412) — 원탭 [다시 짜기]는 초안을 보자마자 반영하므로
        "무엇이 빠졌나"를 볼 수 있는 때가 반영 뒤뿐이다. `before` 는 반영 순간 떠 둔 그 날의 원 일정이고,
        `after` 는 반영된 초안이다 — 반영 직전 화면이 보였을 비교와 같다. 되돌린 뒤에도 같은 비교를 준다(무엇을 되돌렸는지).
        이 기능 이전에 반영된 세션은 기준이 남지 않아 `ready=false` 다. 취소·실패·대안 없음도 `ready=false`.


        ⚠ **소요시간 필드가 없다**(INV-3) — 전후 스냅숏은 시각과 순서만 다룬다.
        `returnTimeDeltaMinutes` 는 이동 소요가 아니라 **복귀 시각이 밀린 정도**다.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/ReplanDiff' } } } }
        '404': { description: 여행/세션 없음 · 타 계정 }
  /trips/{tripId}/replan-sessions/{sessionId}/revert:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 반영한 재계획 되돌리기 — 그 날을 반영 직전으로(TRIP-1412)
      description: >
        원탭 [다시 짜기]가 반영한 그 날을 **반영 직전 모습으로** 돌린다. **확정(`CONFIRMED`) 일정에서도** 된다 —
        상태는 그대로이고 확정 동결(poi_snapshot)은 반영 직전 참조를 다시 단다. 범용 되돌리기
        (`/itinerary/revisions/{revisionId}/restore`)는 확정 일정을 409 로 막는다 — 그 대신 이 재계획 하나만 되돌리는 경로다.
        다른 날은 손대지 않는다. 한 번만 된다 — 세션은 `APPLIED` 그대로이고 `revertedAt` 이 찍힌다.
        변경 이력 1행(`MANUAL`, 사유 `재계획 되돌림 · …`)과 일정 리비전이 남는다.
      responses:
        '200': { description: 되돌림, content: { application/json: { schema: { $ref: '#/components/schemas/ReplanSession' } } } }
        '404': { description: 여행 없음/타 계정/세션 없음 }
        '409':
          description: >
            반영 세션이 아님(`되돌릴 재계획이 없습니다.`) · 이미 되돌림 · 되돌리기 지점 없음(이 기능 이전에 반영된 세션) ·
            지난 날 · 되돌리면 빠지는 곳(재계획이 넣었고 반영 전엔 없던 곳)에 다녀온 기록(도착·완료, 건너뜀 제외)이 있음(INV-U4-04 —
            반영 전에도 있던 곳·계획에 없던 곳·다른 날의 실적은 막지 않는다) ·
            그 사이 그 날이 바뀜(편집·다른 재계획 — 오류 코드 `STALE`, 덮으면 그 변경이 사라진다). 같은 여행의 다른 교체와 겹치면
            일정 쓰기 잠금(여행 단위)을 기다렸다가 잠금 뒤의 일정으로 판정한다
  /trips/{tripId}/replan-sessions/{sessionId}/cancel:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 재계획 취소(i18) — 세션만 닫는다
      description: 원 일정은 건드리지 않는다(INV-U4-05). 세션은 지우지 않고 CANCELED 로 남는다.
      responses:
        '200': { description: 취소됨, content: { application/json: { schema: { $ref: '#/components/schemas/ReplanSession' } } } }
        '404': { description: 여행 없음/타 계정/세션 없음 }
        '409': { description: 이미 끝난 재계획 }
  /trips/{tripId}/itinerary/revisions:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 일정 편집 이력 — 되돌리기 지점 목록(최신순)
      parameters:
        - name: limit
          in: query
          required: false
          description: 반환 상한(기본 100 · 최대 500). 이력은 append-only 로 쌓이고 절대 줄지 않는다.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      description: >
        U3 가 소유하는 이력은 **사용자 편집 + AI 생성 기준 버전**뿐이다(DEC-U3-1).
        Plan-B 재계획 이력은 U4, 여행 후 아카이브 change-log 는 U5 소유 — 한 화면에 섞여 보여도 데이터 소유는 다르다.
        스냅숏 본문은 싣지 않는다(되돌리기는 서버가 수행).
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionList' } } } }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음 }
  /trips/{tripId}/itinerary/revisions/{revisionId}/restore:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 되돌리기 — 과거 버전으로 복원(새 리비전을 쌓는다)
      description: >
        과거 리비전을 **삭제하지 않고** 새 RESTORE 리비전을 쌓는다(BR-U3-32) — 되돌리기의 되돌리기가 가능하다.
        고정 블록(숙소·시각 고정 필수 방문지)의 시각은 복원 스냅숏보다 **현행이 이긴다**(BR-U3-33 · INV-U3-03).
      responses:
        '200': { description: 복원됨, content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } } }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음/해당 버전 없음 }
        '409': { description: 확정된 일정은 되돌릴 수 없음 · 생성 진행 중(generationState=PARTIAL) · 해당 버전을 읽을 수 없어 복원 불가 }
  /trips/{tripId}/itinerary/confirm:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [trips]
      summary: 일정 확정 — PLANNED→CONFIRMED(재확정 409). 재생성 POST 는 확정을 되돌린다
      responses:
        '200': { description: 확정됨, content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } } }
        '404': { description: 여행 없음/타 계정/생성된 일정 없음 }
        '409': { description: 이미 확정됨 · 생성 진행 중(generationState=PARTIAL) · 포함 장소가 더 이상 유효하지 않음 }
  /trips/{tripId}/change-log:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 변경 이력 타임라인 — "이날 무엇을 왜 바꿨는지"(최신순)
      parameters:
        - name: limit
          in: query
          required: false
          description: 반환 상한(기본 100 · 최대 500). 이력은 append-only 로 쌓이고 한 건이 전후 스냅숏 둘을 담는다.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      description: >
        확정된 변경을 사유·전후 스냅숏·시각·출처와 함께 남긴 append-only 이력(US-PLANB-09).
        ⚠ **현재 생산자가 없어 항상 빈 목록이다.** 사용자 편집 이력은 DEC-U3-1 로 U3 소유가 되어
        `GET /trips/{tripId}/itinerary/revisions` 로 옮겨갔고(TRIP-310), 이 엔드포인트는
        Plan-B(U4)·아카이브(U5) 원천을 기다린다. 그때까지 화면에 붙이지 말 것.
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeLog' } } } }
        '404': { description: 여행 없음/타 계정 }
  /trips/{tripId}/must-visits/{mustVisitId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: mustVisitId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [trips]
      summary: 필수 방문지 삭제
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 없음/타 계정 }
  /me/push-tokens:
    post:
      tags: [notifications]
      summary: 푸시 토큰 등록(l02)
      description: >
        **멱등이라 POST 다** — 같은 토큰을 다시 보내면 새 행이 아니라 갱신이고, 클라이언트는 자기
        토큰의 서버 id 를 모른다(토큰 자체가 키다). 앱은 포그라운드 복귀마다 다시 보내도 된다.


        `osPermission` 을 함께 받는 이유는 **서버가 OS 권한을 알 방법이 없기** 때문이다
        (`location_consent_state.os_permission_mirror` 와 같은 꼴의 미러). 이 값이 채널 판정에
        들어간다 — `GRANTED` 가 아니면 쏘지 않는다. 쏴도 닿지 않고 레이트리밋만 먹는다.


        같은 토큰이 **다른 계정**에 있으면 그 기기를 새 계정으로 옮긴다. 기기 교체·계정 전환의
        실제 모습이고, 옮기지 않으면 남의 알림이 그 기기로 간다.


        한 계정에 토큰이 **여러 개일 수 있다**(INV-U6-06 다기기) — 발송은 유효 토큰 전부에 한다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterPushTokenRequest' } } }
      responses:
        '200': { description: 등록됨, content: { application/json: { schema: { $ref: '#/components/schemas/PushTokenResponse' } } } }
        '400': { description: 검증 실패 }
  /me/push-tokens/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    delete:
      tags: [notifications]
      summary: 푸시 토큰 해제(로그아웃·기기 해제)
      description: 없거나 남의 것이면 404 — 존재를 알려 주지 않는다.
      responses:
        '204': { description: 해제됨 }
        '404': { description: 없음/타 계정 }
  /me/notification-settings:
    get:
      tags: [notification]
      summary: 알림 수신 설정 목록(l02)
      description: >
        **항상 7종이 다 온다** — 설정한 적 없는 종류는 기본값으로 채워진다(행이 없다 ≠ 꺼짐).
        기본값은 `SLOT_PRE` 만 **푸시 OFF · 인앱 ON**이고, 나머지 6종은 둘 다 ON이다 — `PLAN_B` 는
        위험만 푸시하므로 기본 ON 이다(BR-SA-21). 저장된 설정은 기본값보다 우선한다.


        **`SYSTEM` 은 나타나지 않는다**(INV-U6-03·04) — 보안·계정 알림은 끌 수 있는 것이 아니라서
        화면에 두면 "왜 안 꺼지지"가 된다. `COMMUNITY` 는 오지만 U7 개통 전까지 화면이 숨긴다(DEC-U6-8).
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationToggleList' } } } }
  /me/notification-settings/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [STAY, TRIP_PRE, TRIP_DAY, SLOT_PRE, PLAN_B, REFLECTION, COMMUNITY] }
    patch:
      tags: [notification]
      summary: 알림 수신 설정 변경
      description: >
        `null` 은 **변경 없음**이다(끄는 뜻이 아니다) — 한쪽만 바꾸는 요청이 다른 쪽을 덮지 않는다.
        푸시와 인앱은 따로 간다(INV-U6-02): 푸시를 꺼도 인앱은 쌓여 앱을 열면 놓친 것을 볼 수 있다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateToggleRequest' } } }
      responses:
        '200': { description: 변경됨, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationToggle' } } } }
        '400': { description: '`SYSTEM` 은 끌 수 없다(INV-U6-04)' }
  /assistant/sessions:
    post:
      tags: [assistant]
      summary: 도우미 대화 열기
      description: >
        그 여행(또는 여행 없는 일반)의 대화를 연다(`b01`·`b07`). **멱등하다** — 진행 중인 대화가 있으면 이어 열고
        없으면 만든다. 여행 하나에 대화는 하나다(INV-U8-01).
        앱이 보내는 문맥은 `tripId` 뿐이고, 여행·숙소·일정은 서버가 권한을 확인한 뒤 직접 읽는다(BR-U8-02).
        `contextChip` 은 도우미가 실제로 쓰는 컨텍스트와 같은 원천의 문구다(BR-U8-03).
        `quickReplies` 는 서버가 발급한 것만 쓴다 — 앱이 id 를 지어내면 ACTION 턴이 거부된다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssistantOpenSessionRequest' } } }
      responses:
        '200': { description: 열림(이어 열기 포함), content: { application/json: { schema: { $ref: '#/components/schemas/AssistantOpenSessionResponse' } } } }
        '404': { description: 없는 여행이거나 타 계정 여행 }
    get:
      tags: [assistant]
      summary: 내 도우미 대화 목록
      description: >
        이전 여행의 대화로 돌아가기(`b06`). 최근 대화순이고 보존 기간이 지난 대화와 지워진 여행의 대화는 나오지 않는다.
        **감싸는 객체 없이 배열이다** — 앱이 먼저 만든 계약의 모양을 따랐다.
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AssistantSessionSummary' } }
  /assistant/sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [assistant]
      summary: 도우미 대화 지우기
      description: >
        대화와 그 메시지·제안을 지운다(되돌릴 수 없다). 이미 적용한 일정 변경과 그 이력은 남는다(BR-U8-20).
        **멱등하다** — 없거나 남의 대화여도 204 다.
      responses:
        '204': { description: 지워짐(이미 없는 경우 포함) }
  /assistant/sessions/{sessionId}/messages:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [assistant]
      summary: 도우미 대화 메시지
      description: >
        대화 순서(오래된 것 먼저)로 한 페이지. 위로 더 읽으려면 응답의 `nextBefore` 를 `before` 로 그대로 돌려보낸다 —
        커서는 불투명한 값이라 앱이 해석하거나 만들지 않는다.
      parameters:
        - name: before
          in: query
          schema: { type: string }
          description: 앞 응답의 nextBefore. 없으면 가장 최근 메시지부터.
        - name: limit
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 100 }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessagesPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없는 대화이거나 타 계정 대화 }
  /assistant/sessions/{sessionId}/messages/{messageId}/feedback:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [assistant]
      summary: 도우미 답 평가 남기기·바꾸기
      description: >
        도우미의 답 하나에 좋아요(`UP`)·싫어요(`DOWN`)를 남긴다(US-ASSIST-09). 답마다 평가는 하나다 — 이미 있으면 바꾼다
        (같은 값을 다시 보내도 200). 취소는 같은 경로의 DELETE 다 — "같은 버튼을 다시 누르면 취소"는 앱이 고른다.
        싫어요에는 이유 칩 하나(`reason`)와 자유 의견(`comment`, 300자 이하)을 함께 남길 수 있다 — 좋아요에 실리면 400 이다.
        **본문이 통째로 덮어쓴다** — 다시 보내면 이유·의견도 보낸 값으로 바뀌고(빠진 것은 null), 좋아요로 바꾸면 둘 다 지워진다.
        이유·의견은 이 응답과 내보내기에만 나온다 — 메시지 읽기의 `feedback` 은 평가(`UP`|`DOWN`)만 싣는다.
        **턴이 아니다** — 분당 20턴 상한에 세지 않고, AI 를 부르지 않으며, 메시지를 새로 만들지 않는다.
        평가는 대화와 함께 지워지고(이력 지우기·여행 삭제·계정 삭제·보존 만료) 내보내기의 메시지 줄에 함께 나간다.
        평가·지표 용도로만 쓰며(이유·의견도 같다) 모델 학습에 쓰지 않는다. 의견은 사용자가 쓴 글이라 대화 원문과 같이
        다룬다 — 로그에 싣지 않고 AI 로 보내지 않는다.
        평가할 수 있는 것은 도우미의 답뿐이다 — 사용자 메시지와 적용 기록(`kind: ACTION_LOG`)은 400 이다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssistantFeedbackRequest' } } }
      responses:
        '200': { description: 남김(바꿈 포함), content: { application/json: { schema: { $ref: '#/components/schemas/AssistantFeedbackResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없는 대화·타 계정 대화·보존 기간이 지난 대화이거나 그 대화에 없는 메시지 }
    delete:
      tags: [assistant]
      summary: 도우미 답 평가 취소
      description: >
        남긴 평가를 지운다. **멱등하다** — 남긴 평가가 없어도 204 다. 대상 검사는 PUT 과 같다
        (평가할 수 없는 메시지는 400, 없는·남의·보존 기간이 지난 대화는 404).
      responses:
        '204': { description: 지워짐(평가가 없던 경우 포함) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없는 대화·타 계정 대화·보존 기간이 지난 대화이거나 그 대화에 없는 메시지 }
  /assistant/sessions/{sessionId}/turns:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      summary: 도우미에게 한 턴 보내기
      description: >
        발화(`TEXT`) 또는 서버가 발급한 빠른 답(`ACTION`)을 보낸다. 응답은 사용자 메시지 1건과 도우미 메시지 1건 이상이고,
        도우미 메시지는 다음 행동을 하나 이상 싣는다(BR-U8-06).
        `clientTurnId` 가 멱등 키다 — 같은 값으로 다시 보내면 처음 응답을 그대로 받는다.
        일정 변경은 **제안**으로만 온다. 저장은 제안의 [적용]이 한다(BR-U8-30).
        해석이 실패해도 200 이다 — 그 턴은 폴백 메시지(`kind: FALLBACK`) 한 건으로 끝난다(BR-U8-40).
        계정당 분당 20턴을 넘으면 429 이고 그 턴은 기록되지 않는다(`Retry-After` 초 뒤 다시).
        **429 이지만 `error.code` = `TURN_IN_PROGRESS` 이면 반대다** — 그 턴은 이미 기록돼 처리 중이고, 같은 `clientTurnId` 를
        겹쳐 보낸 요청이 턴마다 둘을 넘었다(TRIP-1401). 새 턴 id 로 다시 보내지 말고 **같은 id 로** `Retry-After` 초 뒤 다시
        보내면 처음 응답을 받는다(새 id 로 보내면 같은 말이 두 번 기록되고 두 번 해석된다).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssistantSendTurnRequest' } } }
      responses:
        '200': { description: 처리됨, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantSendTurnResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없는 대화이거나 타 계정 대화 }
        '429': { $ref: '#/components/responses/RateLimited' }
  /assistant/proposals/{proposalId}/apply:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      summary: 도우미 제안 적용
      description: >
        제안을 일정에 저장한다(`b02`). 제안을 만든 뒤 일정이 바뀌었으면 저장하지 않는다(`STALE`).
        409 의 `error.code` 는 `STALE`(일정이 바뀜)·`EXPIRED`(제안 만료)·`NOT_APPLICABLE`(위반이 있거나, 취소·실패로 끝났거나,
        다른 적용이 저장 중인 제안) 중 하나다. `STALE`·`EXPIRED` 는 서버가 제안을 이미 그 상태로 옮긴 것이다.

        **이미 적용된 제안을 다시 적용하면 200 `APPLIED` 다**(다시 저장하지 않고, `messages` 는 빈 배열). 저장은 몇 초가 갈 수 있어
        응답을 못 받고 다시 누르는 일이 있다 — 그때 일정은 이미 바뀌어 있다.

        **200 이어도 `proposal.status` 를 본다.** 저장에 실패하면 `FAILED` 로 오고(일정은 그대로) `messages` 에 그 안내가 실린다.
        `messages` 가 빈 배열일 수 있다(다시 적용했거나, 저장하는 사이 대화가 지워져 기록을 남길 곳이 없을 때) — 그래도 `status` 는 사실이다.
        성공이면 `APPLIED` 와 `ACTION_LOG` 메시지가 온다 — 저장할 때의 재검증이 제안 때와 다르게 위반을 판정했으면 그 메시지가
        그렇게 말한다(저장된 값이 이긴다, BR-U8-34).
      responses:
        '200': { description: 처리됨(`APPLIED` 또는 `FAILED`), content: { application/json: { schema: { $ref: '#/components/schemas/AssistantApplyProposalResponse' } } } }
        '404': { description: 없는 제안이거나 타 계정 제안 }
        '409': { description: 적용할 수 없음, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /assistant/proposals/{proposalId}/dismiss:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      summary: 도우미 제안 취소
      description: >
        제안을 닫는다. 일정은 그대로다. 이미 끝난 제안이면 오류가 아니라 **그 상태를 그대로** 돌려준다
        (`DISMISSED` 가 아닐 수 있다 — 적용됐으면 `APPLIED`). 적용이 저장 중인 제안은 닫지 않고 `PROPOSED` 로 답한다.
      responses:
        '200': { description: 닫힘(또는 이미 끝난 상태), content: { application/json: { schema: { $ref: '#/components/schemas/AssistantDismissProposalResponse' } } } }
        '404': { description: 없는 제안이거나 타 계정 제안 }
  /me/notifications:
    get:
      tags: [notification]
      summary: 알림함 목록
      description: >
        인앱 알림함(`l01`). 최신순. **푸시 성공 여부와 무관하게** 여기 다 있다(INV-U6-02) —
        푸시를 껐거나 실패했거나 며칠 만에 앱을 켜도 이 목록이 catch-up 이 된다.
        시각은 절대 시각(`occurredAt`)만 준다. `10분 전`·`어제` 같은 상대 표기는 기기 로케일의 몫이다.
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
          description: 미읽음만. 뱃지 카운트용.
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200': { description: 조회됨, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationList' } } } }
  /me/notifications/{notificationId}/read:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [notification]
      summary: 알림 읽음 표시
      description: >
        **멱등하다** — 이미 읽은 알림을 다시 눌러도 204 다. 목록을 열 때마다 클라이언트가 재시도할 수 있고,
        그때 409 를 내면 붉어질 이유가 없는 곳에서 화면이 붉어진다. 처음 읽은 시각은 덮이지 않는다.
      responses:
        '204': { description: 표시됨(이미 읽은 경우 포함) }
        '404': { description: 없음/타 계정 }

  /me/notifications/read-all:
    post:
      tags: [notification]
      summary: 알림 모두 읽음
      description: >
        알림함 '모두 읽음'. 계정의 **미읽음 전부**를 한 번에 읽음 처리한다(TRIP-829) —
        건별 순회는 왕복이 알림 수만큼 늘고, 그 사이 새 알림이 끼어들어 "눌렀는데 하나 남았다"가 된다.

        **멱등하다** — 대상이 0건이어도 204 다(이미 다 읽었거나 알림이 없다). 건별 읽음과 같이
        **처음 읽은 시각은 덮지 않는다**.

        **종류로 거르지 않는다.** 대상 집합이 `unreadOnly` 목록과 같아야 뱃지가 0 이 된다 —
        SYSTEM 을 빼면 눌러도 숫자가 남아 버튼이 고장난 것처럼 보인다(수신설정에서 SYSTEM 을
        못 끄는 것과는 별개 축이다).

        처리 건수는 돌려주지 않는다 — 화면이 그 수로 하는 일이 없다(뱃지는 어차피 0 이 된다).

        인앱 읽음 상태만 건드린다. 푸시와는 별개다(INV-U6-02).
      responses:
        '204': { description: 처리됨(대상 0건 포함) }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PlanBSensitivity:
      type: object
      required: [sensitivity]
      properties:
        sensitivity:
          type: string
          enum: [LOW, NORMAL, HIGH]
          description: >
            감지 발화의 세기. 하루 발화 총량이 여기서 파생된다(BR-U4-08) — **수치는 서버만 안다**(BR-U4-03).

    UpdatePlanBSensitivityRequest:
      type: object
      required: [sensitivity]
      properties:
        sensitivity: { type: string, enum: [LOW, NORMAL, HIGH] }

    AccountSettings:
      type: object
      required: [affiliateNoticeDismissed]
      properties:
        affiliateNoticeDismissed:
          type: boolean
          description: >
            true 면 외부 이동 시 제휴 안내를 띄우지 않는다(BR-U6-33). **계정 단위**라 기기가 달라도
            같은 값이다 — 설정에 있는 값이 기기마다 다르면 사용자 모델이 깨진다(DEC-U6-7a).
            `l05` 의 `외부 이동 시 제휴 안내 다시 보기` 토글로 되돌린다.

    UpdateAccountSettingsRequest:
      type: object
      description: 생략한 필드는 **변경하지 않는다**.
      properties:
        affiliateNoticeDismissed: { type: boolean, nullable: true, description: 생략 = 변경 없음 }

    PoiCategory:
      type: string
      description: 정본은 DB CHECK(poi_category_check) — 미술·술집은 V2.79(TRIP-1545)에서 추가
      enum: [명소, 맛집, 카페, 야경, 자연, 쇼핑, 문화, 액티비티, 미술, 술집]

    RegionLevel:
      type: string
      description: 카탈로그의 층. 코드는 시도 2자리·시군구 5자리(법정동코드 앞자리)
      enum: [SIDO, SIGUNGU]

    Region:
      type: object
      required: [regionCode, name, sidoName, level, selectable, poiCount]
      properties:
        regionCode: { type: string, description: '법정동코드 앞자리 — 시도 2자리·시군구 5자리', example: '51720' }
        name: { type: string, example: 홍천군 }
        sidoName: { type: string, description: '묶음 표시용 상위 시도명', example: 강원특별자치도 }
        level: { $ref: '#/components/schemas/RegionLevel' }
        selectable:
          type: boolean
          description: >
            목적지로 고를 수 있는가. 도(道)는 범위가 넓어 POI 후보가 흩어지고,
            일반시의 행정구(수원시 장안구)는 여행지로 범위가 어긋나 false 다
        poiCount:
          type: integer
          description: >
            이 지역의 ACTIVE POI 수. 0이면 후보풀이 비어 일정이 조용히 빈다.
            시도 행은 그 안 시군구를 모두 합한 값이다 — 시도를 고르면 그 안이 전부 후보풀이 되기 때문이다.
            조회 시점에 세므로 저장된 값과 어긋나지 않는다.
          example: 0

    PlaceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Place' } }
        nextCursor:
          type: string
          nullable: true
          description: >
            다음 장의 지점. **null 이 아니면 이것이 전부가 아니다** — 뒤따르는 클라 필터가
            부분집합 위에서 도는 것을 숨기지 않는다. 숙소(`StaySearchResponse.truncated`)와 같은 목적이되,
            잘렸다는 사실만 알리는 대신 **이어 받을 방법까지** 준다(TRIP-503).

    Place:
      type: object
      required: [poiId, nameKo, category, lat, lng, savedCount, dataStatus, tags]
      properties:
        poiId: { type: string, format: uuid }
        nameKo: { type: string }
        category: { $ref: '#/components/schemas/PoiCategory' }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        region: { type: string, nullable: true }
        regionCode:
          type: string
          nullable: true
          description: >
            행정구역 코드(법정동코드 앞자리, TRIP-1042). 시군구를 알면 5자리(`28200`), 시도까지만 알면 2자리(`50`),
            모르면 null — 서버가 지어내지 않는다. 표시용 `region`(`동구`)과 달리 **맞춰 볼 수 있는 키**라,
            여행 목적지 `regionCode` 의 접두사 비교로 "이 여행 지역의 장소인가"를 가른다. 앞 2자리가 시도 코드다.
          example: '28200'
        address:
          type: string
          nullable: true
          description: >
            지번·도로명 주소(TRIP-1062 · TRIP-824 의 address 몫). null = 미확보 — 기존 수집분은
            다음 수집 배치가 채울 때까지 비어 있고 화면은 자리만 비운다(지어내지 않는다).
            표기 규칙은 StayItem.address 와 동일(도로명 우선).
          example: 서울특별시 종로구 사직로 161
        openingHours: { type: string, nullable: true, description: NULL=미확인 }
        imageUrl:
          type: string
          nullable: true
          description: 대표 사진. NULL=미확보 — 서버가 기본 이미지를 지어내지 않는다. 클라는 NULL·빈 문자열·공백·로드 실패면 카테고리 일러스트(번들 에셋 — 실사진이 아님)로 칸을 채운다
        tags:
          type: array
          items: { type: string }
          description: 표시용 태그(감성 골목·야경·카페 등). 열린 집합이며 미확보 시 빈 배열
        savedCount: { type: integer, format: int64 }
        dataStatus:
          type: string
          enum: [ACTIVE, UNVERIFIED, LOST, CLOSED]
          description: 탐색 목록은 항상 ACTIVE. 단건은 폐업(CLOSED)·유실(LOST)도, 담기 목록은 미검증(UNVERIFIED)까지 포함 — 클라 뱃지

    SavePlaceRequest:
      type: object
      required: [poiId]
      properties:
        poiId: { type: string, format: uuid, description: 담을 ACTIVE POI }

    SavedPlace:
      type: object
      required: [savedPlaceId, savedAt, place]
      properties:
        savedPlaceId: { type: string, format: uuid }
        savedAt: { type: string, format: date-time }
        place: { $ref: '#/components/schemas/Place' }

    StaySearchResponse:
      type: object
      required: [items, degraded, filterZeroReasons, amenitiesKnown, truncated]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StayItem' } }
        degraded: { type: boolean, description: 일부 공급자 실패 시 true(부분 결과·재시도 안내) }
        filterZeroReasons: { type: array, items: { type: string }, description: '필터로 0건일 때 완화 후보(예: stayType, amenity:오션뷰)' }
        amenitiesKnown: { type: boolean, description: 'false = 편의시설 정보를 **아직 모른다**(없는 것이 아니다). 편의시설 필터 비활성화 또는 "정보 준비 중" 안내 — 안 그러면 0건이 "그런 숙소가 없다"로 읽힌다' }
        truncated: { type: boolean, description: 'true = 지역 미선택이라 전국 중 **일부만** 본 결과. "조건에 맞는 숙소가 없다"고 단정하지 말고 지역 선택을 권한다' }

    CuratedStayList:
      type: object
      required: [city, items]
      properties:
        city: { type: string, nullable: true, description: 잡힌 도시명 — regionCode 가 어느 도시에도 안 걸리면 null }
        items:
          type: array
          items: { $ref: '#/components/schemas/CuratedStay' }
    CuratedStay:
      type: object
      required: [rank, stayId, name, imageUrl]
      description: 큐레이션 숙소 한 칸. 평점·가격 필드는 의도적으로 없다(BR-U1-18 · INV-U1-05).
      properties:
        rank: { type: integer, minimum: 1 }
        stayId: { type: string, example: 'TRIPCOM:4645968', description: '"TRIPCOM:{트립닷컴 hotelId}" — 아웃바운드에 그대로 쓴다' }
        name: { type: string, example: 호텔 베뉴지 }
        address: { type: string, nullable: true, description: null = 모름 }
        imageUrl: { type: string, description: 트립닷컴 CDN https URL(앱은 저장하지 않는다) }
    StayDetail:
      type: object
      required: [stayId, externalSource, externalId, name, lat, lng, region, amenities, stayType]
      description: >
        숙소 상세. StayItem 에 `stayId`(합성 식별자) 하나를 더한 모양이다 — 상세가 목록보다
        풍부해지는 것은 사진·편의시설이 채워진 뒤이고(숙소콘텐츠-수집-설계.md), 지금 없는 값의
        자리만 만들어 두면 화면이 "준비 중"을 그릴 근거를 잃는다.
      properties:
        stayId: { type: string, description: '"{출처}:{식별자}" — 경로에 그대로 쓴다', example: 'STUB:jeju-001' }
        externalSource: { type: string }
        externalId: { type: string }
        name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        region: { type: string, description: 표시용 지역명 }
        amenities:
          type: array
          items: { type: string }
          description: >
            **빈 배열이 "없음"이 아닐 수 있다.** 정본(LOCALDATA)은 편의시설을 주지 않아 전량이
            비어 있다 — 목록 응답의 `amenitiesKnown` 이 그 사실을 알린다.
        stayType: { type: string }
        price:
          allOf: [{ $ref: '#/components/schemas/StayPrice' }]
          nullable: true
          description: 최저가 스냅숏. **null = 가격 미확인**(BR-U1-14) — 정본 전량이 현재 null 이다
        address:
          type: string
          nullable: true
          description: 도로명 우선, 없으면 지번. **null = 모름**(정본 채움률 100%)
          example: 서울특별시 종로구 수표로 89-8 (관수동)
        phone:
          type: string
          nullable: true
          description: >
            표시형 전화번호 — 그대로 `tel:` 에 실을 수 있다. **null = 모름이지 "전화 없는 숙소"가
            아니다**(정본 채움률 54.8%). 화면은 null 이면 그 줄을 비운다.
          example: 02-2267-7474
        rooms:
          type: integer
          nullable: true
          description: 객실 수(양실+한실). **null = 모름**(정본 채움률 99.5%). 0 은 내려가지 않는다
          example: 81

    StayItem:
      type: object
      required: [externalSource, externalId, name, lat, lng, region, amenities, stayType]
      properties:
        externalSource: { type: string }
        externalId: { type: string }
        name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        region: { type: string }
        amenities: { type: array, items: { type: string } }
        stayType: { type: string }
        price:
          allOf: [{ $ref: '#/components/schemas/StayPrice' }]
          nullable: true
          description: 최저가 스냅숏('부터 가격'). null=가격 미확인(BR-U1-14)
        address:
          type: string
          nullable: true
          description: 도로명 우선, 없으면 지번. **null = 모름**(정본 채움률 100%)
        phone:
          type: string
          nullable: true
          description: >
            표시형 전화번호 — 그대로 `tel:` 에 실을 수 있다. **null = 모름이지 "전화 없는 숙소"가
            아니다**(정본 채움률 54.8%).
        rooms:
          type: integer
          nullable: true
          description: 객실 수(양실+한실). **null = 모름**(정본 채움률 99.5%). 0 은 내려가지 않는다

    StayPrice:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64 }
        currency: { type: string, example: KRW }

    RegisterRoute:
      type: string
      enum: [MAP_SEARCH, LINK_PASTE, PIN]

    SavedStay:
      type: object
      required: [savedStayId, name, coordConfirmed, registerRoute, createdAt, updatedAt, linkedTripIds]
      properties:
        savedStayId: { type: string, format: uuid }
        name: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        coordConfirmed: { type: boolean, description: false면 거점 배정 불가(INV-U1-08) }
        linkedTripIds:
          type: array
          items: { type: string, format: uuid }
          description: >
            이 숙소가 **거점인 여행**들(BR-U6-20). 비어 있으면 화면이 `연결된 여행 없음` 을 그린다.


            삭제된 여행은 빠진다 — 배정 행은 소프트 삭제 뒤에도 남으므로 거르지 않으면
            열 수 없는 여행이 숙소 행에 붙어 사용자가 막다른 길로 간다.
            한 여행에 구간이 여럿이어도 여행 id 는 한 번만 나온다.
        checkIn: { type: string, format: date, nullable: true }
        checkOut: { type: string, format: date, nullable: true }
        externalSource: { type: string, nullable: true }
        externalId: { type: string, nullable: true }
        registerRoute: { $ref: '#/components/schemas/RegisterRoute' }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterSavedStayRequest:
      type: object
      required: [name, registerRoute]
      properties:
        name: { type: string, maxLength: 200 }
        registerRoute: { $ref: '#/components/schemas/RegisterRoute' }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        coordConfirmed: { type: boolean, default: false }
        checkIn: { type: string, format: date, nullable: true }
        checkOut: { type: string, format: date, nullable: true }
        externalSource: { type: string, nullable: true, maxLength: 40 }
        externalId: { type: string, nullable: true, maxLength: 120 }
        memo: { type: string, nullable: true, maxLength: 500 }

    EditSavedStayRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        coordConfirmed: { type: boolean, default: false }
        checkIn: { type: string, format: date, nullable: true }
        checkOut: { type: string, format: date, nullable: true }
        memo: { type: string, nullable: true, maxLength: 500 }

    GeocodeCandidate:
      type: object
      required: [name, address, lat, lng]
      properties:
        name: { type: string }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    ReverseGeocodeResult:
      type: object
      required: [address, lat, lng]
      properties:
        address:
          type: string
          nullable: true
          description: 도로명 우선·없으면 지번. **null 은 그 좌표에 주소가 없다는 사실**이며 조회 실패(503)와 다르다
        lat: { type: number, format: double, description: 요청한 좌표 그대로(핀이 정본) }
        lng: { type: number, format: double, description: 요청한 좌표 그대로(핀이 정본) }

    TripStatus:
      type: string
      enum: [PLANNED, CONFIRMED, ACTIVE, ENDED]

    CompanionType:
      type: string
      enum: [혼자, 친구, 연인, 가족]

    TripDestination:
      type: object
      required: [seq, region, nights]
      properties:
        seq: { type: integer }
        region: { type: string, maxLength: 60 }
        nights: { type: integer }
        regionCode:
          type: string
          nullable: true
          description: >
            행정구역 표준코드(`GET /regions` 의 `regionCode`). **주면 이름 조회를 건너뛴다** —
            동명이지역(고성군: 강원·경남 / 중구 5곳)은 이름만으로 어느 쪽인지 정할 수 없어 서버가
            비워 두는데, 코드가 오면 그 애매함이 생기지 않는다.
            생략하면 종전대로 이름으로 찾는다(기존 클라이언트 동작 불변).
            **목적지로 쓸 수 없는 코드(`selectable=false`)나 없는 코드는 400** — 명시한 값을 조용히
            무시하면 사용자가 고른 곳과 다른 지역으로 여행이 만들어진다.
          example: '51720'

    Trip:
      type: object
      # 일정 상태 네 칸은 required 에 넣지 않는다 — 서버는 늘 싣지만(일정 없으면 null/false), 앱 픽스처가 아직 모르는 칸이라 required 면
      # codegen 이 필수 속성으로 만들어 앱 테스트 픽스처 수십 곳이 깨진다. 앱 전환(frontend 하네스) 때 required 로 올린다.
      required: [tripId, title, startDate, endDate, party, preferenceSnapshot, destinations, status, createdAt, updatedAt, baseCount, itineraryDayCount]
      properties:
        tripId: { type: string, format: uuid }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        party: { type: integer }
        companionType: { allOf: [{ $ref: '#/components/schemas/CompanionType' }], nullable: true }
        budgetTotal: { type: integer, format: int64, nullable: true }
        preferenceSnapshot: { allOf: [{ $ref: '#/components/schemas/TripPreferenceSnapshot' }], description: 생성 시점 취향 동결(jsonb) }
        destinations: { type: array, items: { $ref: '#/components/schemas/TripDestination' } }
        status: { $ref: '#/components/schemas/TripStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        baseCount:
          type: integer
          description: >
            등록 숙소 **수**(BR-U6-22). 배정 구간 수가 아니라 서로 다른 숙소의 수라 한 숙소가
            사흘을 덮어도 1이다. 0 이면 화면이 `숙소 미등록` 칩을 그린다.


            조회 시 집계하는 **파생값**이다 — 저장하지 않는다. 숙소를 지우면 그 순간 줄어야 한다.
        itineraryDayCount:
          type: integer
          description: >
            일정이 **있는 일수**. 0 = 아직 생성되지 않음. ⚠ 개수이지 시간이 아니다 —
            소요시간은 어디에도 싣지 않는다(INV-3).
        itineraryStatus:
          type: string
          enum: [PLANNED, CONFIRMED]
          nullable: true
          description: >
            현재 일정의 확정 상태 — `GET /trips/{tripId}/itinerary` 의 `status` 와 같은 값. 일정이 없으면 null.
            목록 화면이 이 값을 알려고 여행마다 일정을 따로 부르지 않게 싣는다(10-14 개발 서버 429).
            아래 세 칸도 같은 이유로 일정 조회 응답과 같은 값이다.
        itineraryGenerationState:
          type: string
          enum: [PARTIAL, COMPLETE, FAILED]
          nullable: true
          description: 일정 조회의 `generationState` 와 같은 값. 일정이 없으면 null.
        itineraryGenerationMode:
          type: string
          enum: [FULLY_AI, CO_PLAN, MANUAL]
          nullable: true
          description: 일정 조회의 `generationMode` 와 같은 값. 일정이 없으면 null.
        itineraryGenerating:
          type: boolean
          description: >
            진행 중 생성 세션이 있는가 — 일정 조회의 `generationSessionId != null` 과 같다. 다시 만들기 중에는
            `itineraryGenerationState` 가 옛 일정의 COMPLETE 로 남아 있으니 폴링 판정은 이 값과 함께 본다.
            일정이 아직 없는 첫 생성 중에는 false 다(일정 조회도 그때 404 다).
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            여행이 끝난 **시점**(TRIP-826). 안 끝났으면 null.

            **분기는 `status` 로, 표시는 이 값으로.** 둘은 만들어지는 방식이 다르다 —
            `status` 의 `ENDED` 는 날짜에서 **즉시 파생**되고, 이 값은 종료 스윕이
            **10분 주기로** 채운다. 여행이 막 끝난 직후에는 `status=ENDED` 인데 이 값이
            아직 null 인 창이 있다.

            이 값의 null 로 "안 끝났다"를 판정하면 **그 창에서 끝난 여행을 진행 중으로 본다.**
            끝났는지는 `status`, 언제 끝났는지(상대 표기·정렬)는 이 값이다.
        dayStartAt:
          type: string
          format: time
          nullable: true
          description: >
            일과 창(V2.62) — 미설정이면 null 이고 서버가 기본 창(09:00~21:00)을 쓴다.

            **편집 전에 반드시 읽어라.** 편집 요청은 가변 필드를 **대체**하므로(`budgetTotal` 과 같은
            규칙) 생략하면 지워진다 — 다른 칸만 고치려면 이 값을 그대로 돌려보내야 한다.
        firstDayStartAt: { type: string, format: time, nullable: true, description: 첫날만 다른 시작(도착 후) }
        lastDayEndAt: { type: string, format: time, nullable: true, description: 마지막날만 다른 종료(출발 전) }

    CreateTripRequest:
      type: object
      required: [startDate, endDate, destinations]
      properties:
        title: { type: string, nullable: true, maxLength: 120, description: 미입력 시 목적지 기반 자동생성 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        party: { type: integer, default: 1 }
        companionType: { allOf: [{ $ref: '#/components/schemas/CompanionType' }], nullable: true }
        budgetTotal: { type: integer, format: int64, nullable: true }
        preferenceSnapshot: { $ref: '#/components/schemas/TripPreferenceSnapshot' }
        destinations: { type: array, items: { $ref: '#/components/schemas/TripDestination' } }
        dayStartAt:
          type: string
          format: time
          nullable: true
          description: >
            하루 일과 시작 시각(전 일자 공통). 생략하면 서버 기본 09:00.
            "9시는 이르다"는 **취향** 축이다 — 날짜별로 받지 않는다(대부분 기본값을 쓴다).
        firstDayStartAt:
          type: string
          format: time
          nullable: true
          description: >
            **첫날만** 다른 시작 시각(비행기·KTX 도착 후). 생략하면 첫날도 `dayStartAt` 을 따른다.
            이게 없으면 도착 전 시간에 일정이 깔리는데 화면상으로는 정상으로 보인다 — 취향이 아니라 **사실 오류**다.
        lastDayEndAt:
          type: string
          format: time
          nullable: true
          description: >
            **마지막날만** 다른 종료 시각(출발·귀가 전). 생략하면 기본 21:00.
            당일치기는 첫날이자 마지막날이라 둘 다 걸리고, 그때는 시작 < 종료여야 한다(아니면 400).

    # 여행 생성 때 고른 취향(BR-U1-38). 서버가 **의미 있게 읽는 축**을 적는다 —
    # 해석은 `PreferenceProfiles.overriddenBy` 한 곳이고, 키 어휘는 계정 취향 필드명(camelCase)과 같다.
    #
    # **키가 있으면 그 값이 최종이다(빈 배열 포함), 없는 축만 계정 취향으로 보충한다.**
    # 자유 맵으로 두면 클라이언트가 키를 바꿔도 타입체크·테스트가 전부 통과하면서 취향만 조용히
    # 사라진다 — 2026-10-05 에 실제로 그 증상으로 올라왔다(#995 로 수정). 서버는 모르는 키·모양이
    # 틀린 값을 빈 값으로 읽으므로 additionalProperties 를 막지는 않는다.
    TripPreferenceSnapshot:
      type: object
      properties:
        styles: { type: array, items: { type: string } }
        activities: { type: array, items: { type: string } }
        foodTastes: { type: array, items: { type: string } }
        transportModes: { type: array, items: { type: string } }
        companionTypes: { type: array, items: { type: string } }
        pace: { type: string }
        budgetTier: { type: string }
        petFriendly: { type: boolean }

    EditTripRequest:
      type: object
      required: [startDate, endDate, destinations]
      properties:
        title: { type: string, nullable: true, maxLength: 120 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        party: { type: integer, default: 1 }
        companionType: { allOf: [{ $ref: '#/components/schemas/CompanionType' }], nullable: true }
        budgetTotal: { type: integer, format: int64, nullable: true }
        destinations: { type: array, items: { $ref: '#/components/schemas/TripDestination' } }
        dayStartAt:
          type: string
          format: time
          nullable: true
          description: >
            하루 일과 시작 시각(전 일자 공통). 생략하면 서버 기본 09:00.
            "9시는 이르다"는 **취향** 축이다 — 날짜별로 받지 않는다(대부분 기본값을 쓴다).
        firstDayStartAt:
          type: string
          format: time
          nullable: true
          description: >
            **첫날만** 다른 시작 시각(비행기·KTX 도착 후). 생략하면 첫날도 `dayStartAt` 을 따른다.
            이게 없으면 도착 전 시간에 일정이 깔리는데 화면상으로는 정상으로 보인다 — 취향이 아니라 **사실 오류**다.
        lastDayEndAt:
          type: string
          format: time
          nullable: true
          description: >
            **마지막날만** 다른 종료 시각(출발·귀가 전). 생략하면 기본 21:00.
            당일치기는 첫날이자 마지막날이라 둘 다 걸리고, 그때는 시작 < 종료여야 한다(아니면 400).


    AssignBaseRequest:
      type: object
      required: [savedStayId, dateFrom, dateTo]
      properties:
        savedStayId: { type: string, format: uuid, description: 소유 등록 숙소 }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date, description: dateTo > dateFrom · 여행 기간 내(INV-U1-15) }

    BaseAssignment:
      type: object
      required: [baseAssignmentId, savedStayId, dateFrom, dateTo]
      properties:
        baseAssignmentId: { type: string, format: uuid }
        savedStayId: { type: string, format: uuid }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }

    Coverage:
      type: object
      required: [blocked, days]
      properties:
        blocked: { type: boolean, description: 미해결(gap/overlap)이 하나라도 있으면 true — 일정 생성 진입 차단(INV-U1-16) }
        days: { type: array, items: { $ref: '#/components/schemas/DayCoverage' } }

    ResolveCoverageDayRequest:
      type: object
      required: [savedStayId]
      properties:
        savedStayId:
          type: string
          format: uuid
          description: >
            그 날 거점으로 쓸 숙소. 겹침일은 그 날 `candidates` 중에서, 공백일은 이 여행에 배정된 숙소 중에서만
            고를 수 있다 — 밖의 숙소를 허용하면 그 여행과 무관한 곳에서 일정이 시작된다.

    DayCoverage:
      type: object
      required: [date, status, candidates]
      properties:
        date: { type: string, format: date }
        status:
          type: string
          enum: [AUTO, GAP, OVERLAP]
          description: >
            **배정이 말하는 판정**(왜 손이 필요한가) — AUTO=후보1(자동 확정) · GAP=후보0(공백) · OVERLAP=후보≥2(겹침).
            `resolution` 과 **다른 축**이다: 겹침을 사용자가 풀어도 배정이 겹친 사실은 그대로라 OVERLAP 으로 남는다.
        savedStayId: { type: string, format: uuid, nullable: true, description: 확정된 거점(미해결이면 null) }
        resolution:
          type: string
          enum: [AUTO, PREV_STAY, DESTINATION_CENTER, USER_PICK]
          nullable: true
          description: >
            **확정 여부**(null = 미해결). AUTO=후보1 자동 확정 · USER_PICK=사용자가 해소 시트에서 선택(BR-U1-45).
            PREV_STAY·DESTINATION_CENTER 는 공백일 선택지로 **아직 미구현**이다(값만 예약).
            `blocked` 는 이 값이 null 인 날이 하나라도 있는지와 같다.
        candidates:
          type: array
          items: { type: string, format: uuid }
          description: >
            겹침일에 고를 수 있는 숙소. 그 외 날짜는 **빈 배열**이다. 이걸 안 실으면 화면이 배정 목록을 따로 받아
            날짜 겹침을 다시 계산해야 한다.

    MustVisitType:
      type: string
      enum: [ANYTIME, FIXED]

    AddMustVisitRequest:
      type: object
      required: [poiId, type]
      properties:
        poiId: { type: string, format: uuid, description: 담을 ACTIVE POI(동결 스냅숏으로 참조) }
        type: { $ref: '#/components/schemas/MustVisitType' }
        fixedDate: { type: string, format: date, nullable: true, description: FIXED면 필수(INV-U1-17) }
        fixedStart: { type: string, format: partial-time, nullable: true, description: 'FIXED면 필수 · HH:mm[:ss]' }
        dwellMin: { type: integer, nullable: true, description: 체류 희망 분(솔버 입력) }

    MustVisit:
      type: object
      required: [mustVisitId, poiSnapshotId, sourcePoiId, type]
      properties:
        mustVisitId: { type: string, format: uuid }
        poiSnapshotId: { type: string, format: uuid, description: 동결 스냅숏 참조(INV-U1-03) }
        sourcePoiId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MustVisitType' }
        fixedDate: { type: string, format: date, nullable: true }
        fixedStart: { type: string, nullable: true }
        dwellMin: { type: integer, nullable: true }

    GenerateItineraryRequest:
      type: object
      properties:
        generationMode: { type: string, enum: [FULLY_AI, CO_PLAN, MANUAL], description: 미지정 시 FULLY_AI }

    EditItineraryRequest:
      type: object
      required: [days]
      description: 편집(전체 교체) — 수정된 일자·슬롯 배열. 슬롯 순서 = 배열 순서
      properties:
        reason: { type: string, nullable: true, maxLength: 500, description: 선택 — 변경 이력에 남는다 }
        days:
          type: array
          items:
            type: object
            required: [date, slots]
            properties:
              date: { type: string, format: date }
              slots:
                type: array
                items:
                  type: object
                  required: [poiId, startAt, endAt, isFixed]
                  properties:
                    poiId: { type: string, format: uuid }
                    startAt: { type: string, description: "HH:mm:ss" }
                    endAt: { type: string }
                    isFixed: { type: boolean }
                    endsNextDay:
                      type: boolean
                      default: false
                      description: 자정 넘김(HC4) — 전체 교체 편집이라 조회 응답의 현행 값을 그대로 실어야 플래그가 소실되지 않음

    ChangeLog:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/ChangeLogEntry' }
    ChangeLogEntry:
      type: object
      required: [actor, sourceType, at, before, after]
      properties:
        actor: { type: string, description: 변경 주체 — 수동 편집이면 계정 id }
        sourceType: { type: string, enum: [PLAN_B, MANUAL, COEDIT, ASSISTANT] }
        reason: { type: string, nullable: true, description: 선택 — Plan-B 는 트리거 사유를 싣는다 }
        at: { type: string, format: date-time }
        before: { $ref: '#/components/schemas/ItinerarySnapshot' }
        after: { $ref: '#/components/schemas/ItinerarySnapshot' }
    ItinerarySnapshot:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, slots]
            properties:
              date: { type: string, format: date }
              slots:
                type: array
                items:
                  type: object
                  required: [poiId, startAt, endAt, isFixed, endsNextDay]
                  properties:
                    poiId: { type: string, format: uuid }
                    startAt: { type: string, example: "10:00:00" }
                    endAt: { type: string, example: "11:00:00" }
                    isFixed: { type: boolean }
                    endsNextDay: { type: boolean }
    ArriveRequest:
      type: object
      required: [poiId, source]
      properties:
        slotKey:
          type: string
          nullable: true
          maxLength: 100
          description: '슬롯 경계 키 "{date}#{poiId}". **비우면 즉석 방문**(계획에 없던 곳)'
        poiId: { type: string, format: uuid }
        source:
          type: string
          enum: [AUTO_GEOFENCE, MANUAL]
          description: 권한이 없거나 정확도가 낮으면 수동으로 대체된다(BR-U4-36)
    AdjustTimesRequest:
      type: object
      properties:
        arrivedAt: { type: string, format: date-time, nullable: true, description: 보내지 않으면 그대로 둔다(지우는 뜻이 아니다) }
        completedAt: { type: string, format: date-time, nullable: true, description: 보내지 않으면 그대로 둔다. 도착 없이 완료만 남길 수 없다 }
        expectedUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            이 편집이 딛고 선 서버 버전(BR-U5-22 · TRIP-546). 오프라인 큐를 재생할 때 실어 보내면,
            그 사이 서버가 앞서 나간 경우 **조용히 덮어쓰는 대신** `VISIT_CONFLICT`(409)로 갈린다.
            보내지 않으면 검사하지 않는다 — 온라인 단일 기기 편집 경로를 막지 않는다.
    RouteDayUpload:
      type: object
      required: [segments, distanceM, rawPointCount]
      properties:
        segments: { type: array, minItems: 1, maxItems: 200, items: { type: string }, description: '인코딩 폴리라인(1e-5) — 다운샘플 후, 공백에서 나뉜다' }
        distanceM: { type: integer, minimum: 0, description: 기기가 원시 표본으로 잰 거리(공백 구간 제외) }
        rawPointCount: { type: integer, minimum: 0, description: 다운샘플 전 점 수 }
        storedPointCount: { type: integer, minimum: 0, nullable: true, description: 기기가 센 저장 점 수 — 서버는 디코드한 수를 쓴다 }
        recordedFrom: { type: string, format: date-time, nullable: true, description: '기록 구간 시작 — 거리 상한 계산 전용, 저장만 하고 내보내지 않는다. 없으면 하루로 본다' }
        recordedTo: { type: string, format: date-time, nullable: true }
    RouteDay:
      type: object
      required: [date, segments, distanceM, distanceClamped, updatedAt]
      properties:
        date: { type: string, format: date }
        segments: { type: array, items: { type: string } }
        distanceM: { type: integer, minimum: 0, description: 클램프 후 거리 }
        distanceClamped: { type: boolean, description: 기기 값을 서버가 고쳤는가 }
        updatedAt: { type: string, format: date-time }
    RouteDayList:
      type: object
      required: [routes]
      properties:
        routes: { type: array, items: { $ref: '#/components/schemas/RouteDay' } }
    AutoVisitBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 50
          items:
            type: object
            required: [eventId, kind, slotKey, poiId, occurredAt]
            properties:
              eventId: { type: string, format: uuid, description: 기기가 짓는다 — 항목 식별용 }
              kind: { type: string, enum: [ARRIVE, COMPLETE] }
              slotKey: { type: string, maxLength: 100, description: '필수 — 자동 결과는 즉석 방문을 만들지 않는다(INV-U10-5)' }
              poiId: { type: string, format: uuid }
              occurredAt: { type: string, format: date-time, description: 'ARRIVE = 진입 시각 · COMPLETE = 이탈 시각 또는 다음 장소 진입 시각' }
              completionSource: { type: string, nullable: true, enum: [AUTO_GEOFENCE_EXIT, AUTO_NEXT_ARRIVAL], description: COMPLETE 일 때만 }
    AutoVisitBatchResult:
      type: object
      required: [results, automationEnabled]
      properties:
        results:
          type: array
          items:
            type: object
            required: [eventId, outcome]
            properties:
              eventId: { type: string, format: uuid }
              outcome: { type: string, enum: [APPLIED, ALREADY_RECORDED, CONFLICT, SUPPRESSED, REJECTED_CONSENT, OUT_OF_WINDOW] }
              visitCheck: { allOf: [{ $ref: '#/components/schemas/VisitCheck' }], nullable: true }
        automationEnabled: { type: boolean, description: 서버 킬 스위치 — false 면 기기는 강등한다(REL-U10-06) }
    IntervalReportRequest:
      type: object
      required: [intervalId, kind, phase, at]
      properties:
        intervalId: { type: string, format: uuid, description: '기기가 짓는다 — START·END 의 멱등 키' }
        kind: { type: string, enum: [GEOFENCE_ARMED, ROUTE_RECORDING] }
        phase: { type: string, enum: [START, END] }
        at: { type: string, format: date-time }
        endReason:
          type: string
          nullable: true
          enum: [CLIENT_STOP, PERMISSION_DOWNGRADE, ACCURACY_REDUCED, CONSENT_REVOKED, TRIP_ENDED]
          description: 'END 에서만, 필수. SERVER_TIMEOUT 은 서버만 쓴다'
        pointCount: { type: integer, minimum: 0, nullable: true, description: 'ROUTE_RECORDING END 의 표본 수' }
        regionCount: { type: integer, minimum: 0, nullable: true, description: 'GEOFENCE_ARMED END 의 리전 수' }
    VisitCheckList:
      type: object
      required: [visits]
      properties:
        visits: { type: array, items: { $ref: '#/components/schemas/VisitCheck' } }
    VisitCheck:
      type: object
      required: [visitCheckId, poiId, source, spontaneous, updatedAt]
      properties:
        visitCheckId: { type: string, format: uuid }
        slotKey: { type: string, nullable: true, description: null = 즉석 방문 }
        poiId: { type: string, format: uuid }
        arrivedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        skippedAt: { type: string, format: date-time, nullable: true, description: 건너뜀(취소). 완료와 동시에 참일 수 없다 }
        source: { type: string, enum: [AUTO_GEOFENCE, MANUAL], description: 도착 출처(DEC-U10-6). 완료 출처는 completionSource }
        completionSource:
          type: string
          nullable: true
          enum: [AUTO_GEOFENCE_EXIT, AUTO_NEXT_ARRIVAL, MANUAL]
          description: 완료 출처 — 완료가 있을 때만 있다(INV-U10-3). 화면이 완료에도 "자동 기록"을 붙이는 근거
        spontaneous: { type: boolean, description: 계획에 없던 곳인가 — 화면의 '즉석 방문' 배지 근거 }
        updatedAt:
          type: string
          format: date-time
          description: >
            오프라인 충돌 판정의 기준(BR-U5-22 · TRIP-546). 클라이언트는 이 값을 로컬 편집의 기준
            버전으로 들고 있다가 재생 시 `expectedUpdatedAt` 으로 돌려보낸다.
    TriggerList:
      type: object
      required: [triggers]
      properties:
        triggers: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
        watch: { $ref: '#/components/schemas/TriggerWatch' }
    Trigger:
      type: object
      required: [triggerId, kind, affectedDate, reason, detectedAt]
      properties:
        triggerId: { type: string, format: uuid }
        kind:
          type: string
          enum: [WEATHER, CLOSURE, DELAY, MANUAL]
          description: >
            4종뿐이다(BR-U4-01). ai TriggerKind 가 정본이며 백엔드가 종류를 늘리지 않는다 —
            '체류 초과'는 DELAY 의 payload 변형이고 '교통'은 존재하지 않는다
        affectedDate: { type: string, format: date }
        slotKey:
          type: string
          nullable: true
          description: '영향 슬롯의 경계 키 "{date}#{poiId}"(BR-U2-04). null = 날짜 전체 영향'
        reason: { type: string, description: '사용자 노출 문구의 근거(예: "비 예보 70%")' }
        scope:
          type: string
          nullable: true
          enum: [FULL_DAY, PARTIAL_SLOTS, NONE]
          description: 발화 시 재계획 범위 — [대안 보기] 가 이 값으로 세션을 연다
        detectedAt: { type: string, format: date-time }
        severity:
          type: string
          enum: [RISK, CAUTION]
          description: >
            위험(RISK)은 일정을 막는다 — 푸시 대상. 주의(CAUTION)는 앱 안에만 보인다.
            required 밖이다(옛 픽스처 · 프리뷰 보호) — 없으면 위험으로 읽는다.
        variant:
          type: string
          nullable: true
          enum: [RAIN, SNOW, WIND, HEAT, COLD, CLOUD, DUST, CLOSED_DAY, OUT_OF_HOURS, HOURS_MISMATCH, HOLIDAY, PERMANENTLY_CLOSED]
          description: >
            변형(닫힌 12종). 저장된 값을 모르면 null 이다 — 화면은 kind 라벨을 쓴다.
            특보는 기존 변형으로 사상한다(호우 RAIN · 대설 SNOW · 강풍·태풍 WIND · 한파 COLD · 폭염 HEAT · 황사 DUST).
        attribution:
          type: string
          nullable: true
          description: >
            출처 표기(공공누리) — 기상청 단기예보 · 기상청 기상특보 · 에어코리아. 표시 의무가 없는 원천이면 null.
    TriggerWatch:
      type: object
      description: >
        감시 상태 — 출처 묶음별(weather = 단기예보 · closure = 장소 · delay = 이동 지연).
        스윕이 꺼져 있거나 그 출처를 감시하지 않으면 OFF 다 — 화면은 그 행을 숨긴다.
      required: [weather, closure, delay]
      properties:
        weather: { $ref: '#/components/schemas/WatchState' }
        closure: { $ref: '#/components/schemas/WatchState' }
        delay: { $ref: '#/components/schemas/WatchState' }
    WatchState:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CHECKED, UNKNOWN, OFF]
          description: >
            CHECKED = 마지막 확인이 창 안(날씨 2시간 · 장소 14시간). UNKNOWN = 확인 불가(모름 · 오래됨 · 아직 안 봄).
            OFF = 감시하지 않음. delay 는 감지기가 아직 없어 늘 OFF 다.
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막으로 확인한 시각 — 확인한 적 없거나 마지막 관측이 모름이면 null
    TriggerDetail:
      description: >
        트리거 하나 — Trigger 와 같은 필드에 지금 상태와 같은 대상의 현재 트리거를 더한다.
      allOf:
        - $ref: '#/components/schemas/Trigger'
        - type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [ACTIVE, SUPPRESSED, CONSUMED, EXPIRED]
              description: 지금 상태 — 목록에서 숨는 ACTIVE 는 EXPIRED 로 말한다
            currentTriggerId:
              type: string
              format: uuid
              nullable: true
              description: 같은 대상(종류·날짜·슬롯)의 지금 보이는 ACTIVE — 자기 자신일 수 있다
    OpportunityList:
      type: object
      required: [items]
      description: >
        그 날짜의 기회 — 서버 순위 그대로(행사장 → 행사장 가까이 → 요즘 인기 → 짧은 기간 → 거리) 최대 3개이고,
        행사만으로 3개가 차면 마지막 자리는 요즘 인기다(있으면). 그 날 날씨 위험 트리거가 떠 있거나 [적용]으로 소비됐으면
        서버가 축제와 유형을 모르는 행사를 뺀다 — 공연·전시·팝업과 요즘 인기는 남는다(G-SA-17).
        앱은 날짜당 1장만 그리고 같은 날짜에 날씨 위험 트리거가 ACTIVE 면 축제·유형 모름 행사를 뺀다(BR-SA-22 규칙 4 — 앱이 고른다).
      properties:
        items:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Opportunity' }
    Opportunity:
      type: object
      required: [key, kind, poiId, poiName, nearSlotKey, distanceLabel]
      description: >
        기회 한 건. 시각 필드가 없다(INV-2) — 행사는 일 단위 기간만 싣는다(주말만 여는 축제가 실재한다).
        거리는 표시 문자열뿐이고 소요시간은 어떤 이유로도 없다(INV-3).
      properties:
        key: { type: string, description: '순위·기기 숨김의 키(event:{행사} · trending:{장소}) — 숨긴 key 는 그 날 다시 그리지 않는다' }
        kind:
          type: string
          enum: [EVENT_VENUE, EVENT_NEARBY, TRENDING]
          description: >
            EVENT_VENUE = 기간이 겹치는 행사의 행사장 · EVENT_NEARBY = 행사장 가까이 · TRENDING = 태그 '요즘 인기'.
            앱이 이 값으로 고정 템플릿을 고른다.
        eventName: { type: string, nullable: true, description: '행사 이름 — 행사 카드만(TRENDING 은 null)' }
        eventType:
          type: string
          nullable: true
          enum: [FESTIVAL, PERFORMANCE, EXHIBITION, POPUP]
          description: >
            행사 유형(축제·공연·전시·팝업) — 행사 카드만이고 TRENDING 은 null 이다. 행사 카드인데 null 이면 유형을 모른다(옛 AI·모르는 값).
            날씨 위험 날에 뺄 행사를 가르는 재료다 — 축제와 모름은 빼고 공연·전시·팝업은 남긴다. 앱 문장은 이 값으로 바뀌지 않는다.
        start: { type: string, format: date, nullable: true, description: '행사 시작일(일 단위) — 행사 카드만' }
        end: { type: string, format: date, nullable: true, description: '행사 마지막 날(일 단위) — 행사 카드만. 앱의 "M월 d일까지"' }
        poiId: { type: string, format: uuid, description: '등록 POI(INV-1) — 행사 자체는 후보가 아니다. 넣어서 다시 짜기가 이 장소를 넣는다' }
        poiName: { type: string }
        nearSlotKey: { type: string, description: '가장 가까운 남은 슬롯의 경계 키 "{date}#{poiId}"(BR-U2-04)' }
        distanceLabel: { type: string, description: '동선(가장 가까운 남은 슬롯)에서의 직선거리 표시(예: "약 400m")' }
    StayRecommendationRequest:
      type: object
      properties:
        candidates:
          type: array
          maxItems: 50
          description: '`GET /stays/search` 결과에서 고른 후보. 비우면 권역만 돌려준다'
          items:
            type: object
            required: [stayId, lat, lng]
            properties:
              stayId: { type: string }
              lat: { type: number }
              lng: { type: number }
    StayRecommendation:
      type: object
      required: [centroidLat, centroidLng, avgDistanceM, candidates]
      properties:
        centroidLat: { type: number, description: 방문지 무게중심 — 지도에서 "이 근처"를 가리키는 점 }
        centroidLng: { type: number }
        avgDistanceM: { type: integer, description: 무게중심에서 각 방문지까지의 평균 거리 — 권역 반경의 근거 }
        candidates:
          type: array
          description: 평균 이동 거리가 짧은 순
          items:
            type: object
            required: [stayId, beforeAvgDistanceM, afterAvgDistanceM, deltaM]
            properties:
              stayId: { type: string }
              beforeAvgDistanceM: { type: integer, description: 숙소 없이 방문지끼리 이어 다닐 때의 평균 구간 거리 }
              afterAvgDistanceM: { type: integer, description: 그 숙소에서 출발·복귀할 때의 평균 구간 거리 }
              deltaM: { type: integer, description: '음수면 줄어든다 — 화면이 "평균 N m 줄어요"로 쓴다' }
    StartReplanRequest:
      type: object
      required: [scope, originKind]
      properties:
        scope:
          type: string
          enum: [PARTIAL_SLOTS, FULL_DAY]
          description: 재계획 범위(DEC-U4-3). ai ReplanScope 어휘를 그대로 쓴다
        targetDate:
          type: string
          format: date
          nullable: true
          description: >
            다시 짤 일자(TRIP-1182). **생략하면 오늘** — 종전 클라이언트는 그대로 돈다.
            오늘이 아닌 날은 scope=FULL_DAY 만 받는다(400) — '그 날의 지금'은 없다.
            지난 날·여행 기간 밖·일정이 아직 없는 날(부분 생성)은 409.
            한 세션은 여전히 **하루만** 바꾼다(DEC-U4-3 의 다일 금지 유지)
        originKind:
          type: string
          nullable: true
          enum: [GPS, MANUAL, LAST_VISIT, STAY_ANCHOR]
          description: >
            출발 기준점. **생략하면 서버가 사다리로 정한다**(BR-U4-19) —
            실측 → 수동 핀 → 마지막 완료 방문지 → 등록 숙소 앵커.
            위치를 못 잡았다고 재계획을 막지 않으며, 어떤 가정을 썼는지는 응답의 originKind·originEstimated 로 밝힌다
        originLat: { type: number, nullable: true, description: GPS·MANUAL 이면 필수 }
        originLng: { type: number, nullable: true, description: GPS·MANUAL 이면 필수 }
        reasons:
          type: array
          maxItems: 10
          items: { type: string }
          description: "i10 의 '왜'(다중). 서버가 어휘를 강제하지 않는다 — 해석은 재계획 경계가 한다"
        directives:
          type: array
          maxItems: 10
          items: { type: string }
          description: "i10 의 '어떻게'(다중)"
        freeText: { type: string, nullable: true, maxLength: 500 }
        excludedPoiIds:
          type: array
          items: { type: string, format: uuid }
          description: "'건너뛰기'가 채운다 — 재계획 시 후보에서 뺀다"
        triggerId:
          type: string
          format: uuid
          nullable: true
          description: >
            자동 진입이면 근거 트리거. 수동이면 null. 있으면 대상 날짜는 **그 트리거의 날짜로 강제**되고(targetDate 무시)
            미래일이면 scope 는 FULL_DAY 다(BR-SA-20) — 내일 알림으로 오늘을 다시 짜지 않게. 트리거가 없거나 다른 여행 것이면 409
    ReplanDiff:
      type: object
      required: [ready, status, before, after, entries]
      properties:
        ready:
          type: boolean
          description: 초안이 나왔는가. false 면 나머지는 비어 있고 화면은 진행 상태를 그린다.
        status: { type: string, enum: [COLLECTING, SOLVING, DRAFT, APPLIED, CANCELED, FAILED, NO_SOLUTION] }
        date: { type: string, format: date, nullable: true, description: 재계획 대상 날짜. 비교는 이 하루만 본다 }
        before:
          type: array
          description: 원 일정(그 날짜분). `APPLIED` 면 반영 순간 떠 둔 반영 직전 모습이다(TRIP-1412).
          items: { $ref: '#/components/schemas/ReplanDiffSlot' }
        after:
          type: array
          description: >
            초안. `DRAFT` 면 **확정 전까지 원 일정에 반영되지 않는다**(INV-U4-05). `APPLIED` 면 반영된 그 초안이다 —
            되돌렸으면(`ReplanSession.revertedAt`) 지금 일정에는 없다.
          items: { $ref: '#/components/schemas/ReplanDiffSlot' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ReplanDiffEntry' }
        impact:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ReplanImpact' }]

    ReplanDiffSlot:
      type: object
      required: [slotKey, startAt, endAt, isFixed, endsNextDay]
      description: '**소요시간이 없다**(INV-3) — 시각과 순서만.'
      properties:
        slotKey: { type: string, description: '경계 키 `{date}#{poiId}`(BR-U2-04) — 행이 갈려도 짝이 유지된다' }
        startAt: { type: string, example: '10:00' }
        endAt: { type: string, example: '11:00' }
        isFixed: { type: boolean, description: 고정이라 손대지 않은 슬롯(BR-U4-18) }
        # POI 표면(TRIP-1060 · QA #045) — 재계획이 새로 넣은 장소는 현재 일정 캐시에 없어
        # FE lookup 이 원리적으로 실패한다. 일정 슬롯(BR-U3-09)·슬롯 후보(TRIP-851)와 같은 모양으로
        # 응답이 직접 싣는다. before 는 일정 조회와 같은 합성(확정 슬롯 동결값 우선, INV-U1-03) —
        # 두 응답의 이름이 갈리지 않는다. 정본에 없으면 전부 null(지어내지 않는다).
        nameKo: { type: string, nullable: true }
        category: { type: string, nullable: true, description: 한글 정본(맛집·카페 …) — 일정 슬롯과 같은 값 }
        imageUrl: { type: string, nullable: true, description: NULL = 미확보. 대표 1장 }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        endsNextDay:
          type: boolean
          description: >
            자정 넘김(HC4). true 면 `endAt` 이 `startAt` 보다 이르다 — 익일 시각이라는 뜻이고,
            복귀 시각 비교도 이 값을 반영해 계산한다.

    ReplanDiffEntry:
      type: object
      required: [slotKey, change]
      properties:
        slotKey: { type: string }
        change:
          type: string
          enum: [ADDED, REMOVED, MOVED, FIXED, UNCHANGED]
          description: '`REMOVED` 는 확정 전에 반드시 보여야 한다(BR-U4-25).'
        beforeStart: { type: string, nullable: true, example: '10:00' }
        afterStart: { type: string, nullable: true, example: '13:00' }

    ReplanImpact:
      type: object
      required: [visitCountDelta]
      description: 영향 지표 3종(BR-U4-29).
      properties:
        visitCountDelta: { type: integer, description: 방문 수 변화 }
        returnTimeDeltaMinutes:
          type: integer
          format: int64
          nullable: true
          description: >
            복귀(마지막 일정 종료) 시각이 밀린 정도(분). **이동 소요시간이 아니다**(INV-3).
            비교할 슬롯이 한쪽이라도 없으면 null.
        totalDistanceDeltaM:
          type: integer
          nullable: true
          description: >
            총 이동 거리 변화(m). **어느 한쪽이라도 거리를 모르면 null** 이다 —
            0 으로 채우면 "거리가 줄었다"는 거짓 요약이 된다.
            원 일정에는 미터 값이 없어(표시 문자열뿐) **현재 항상 null** 이다.
        totalDistanceKm:
          type: number
          format: double
          nullable: true
          description: >
            재계획안의 이동 총거리(km). **변화량이 아니라 절대값**이다 — 위 델타가 나올 수 없는
            동안 화면이 쓸 수 있는 유일한 이동 지표다. AI 가 푼 값을 그대로 나른다(INV-2).
            소요시간은 주지 않는다(INV-3). 옛 초안에는 없어 null 일 수 있다.

    ReplanSession:
      type: object
      required: [sessionId, tripId, itineraryId, scope, targetDate, fromInstant, originKind, originEstimated, status, createdAt]
      properties:
        sessionId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        itineraryId: { type: string, format: uuid, description: 어느 일정을 다시 짜는가 }
        triggerId: { type: string, format: uuid, nullable: true }
        scope: { type: string, enum: [PARTIAL_SLOTS, FULL_DAY] }
        targetDate: { type: string, format: date, description: 어느 날을 다시 짰는가 — 요청이 생략했으면 서버가 정한 '오늘'이다(TRIP-1182) }
        fromInstant: { type: string, format: date-time, description: "'지금 이후'의 기준점 — 이 시각 이전 슬롯은 대상이 아니다" }
        originKind: { type: string, enum: [GPS, MANUAL, LAST_VISIT, STAY_ANCHOR] }
        originLat: { type: number, nullable: true }
        originLng: { type: number, nullable: true }
        originEstimated:
          type: boolean
          description: GPS 가 아니면 추정 출발지다 — 화면이 그 사실을 밝혀야 한다(US-PLANB-10)
        reasons: { type: array, items: { type: string } }
        directives: { type: array, items: { type: string } }
        freeText: { type: string, nullable: true }
        excludedPoiIds: { type: array, items: { type: string, format: uuid } }
        status:
          type: string
          enum: [COLLECTING, SOLVING, DRAFT, APPLIED, CANCELED, FAILED, NO_SOLUTION]
          description: >
            COLLECTING→SOLVING→DRAFT→APPLIED|CANCELED. 실패는 FAILED(오류)·NO_SOLUTION(해 없음)로 갈린다 —
            사용자가 할 일이 다르다(재시도 vs 조건 완화)
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        initiatedBy:
          type: string
          enum: [USER, SYSTEM]
          description: >
            USER = 사용자 진입 · SYSTEM = 일정을 막는 위험 알림으로 서버가 미리 짠 대안(화면이 `미리 준비한 대안` 표식을 단다).
            적용은 어느 쪽이든 사용자만 한다(INV-SA-1)
        stale:
          type: boolean
          description: >
            미리 짠 대안이 낡았는가(BR-SA-19) — 적용하면 409 EXPIRED·STALE 인 초안 · 대체돼 닫힌 선계산 · 2분 넘게 산출 중인
            선계산. 사용자 세션은 늘 false. APPLIED 가 아니면 상태와 무관하게 '준비된 대안 없음'으로 읽는다 — 갈 곳은 BR-SA-23
        revertedAt:
          type: string
          format: date-time
          nullable: true
          description: 반영한 재계획을 되돌린 시각(TRIP-1412). 되돌려도 status 는 APPLIED 그대로다
        revertible:
          type: boolean
          description: >
            [되돌리기]를 그릴 수 있는가 — 반영됐고, 아직 안 되돌렸고, 되돌리기 지점이 있다(이 기능 이전 반영분은 false).
            true 여도 누르면 409 일 수 있다 — 지난 날·되돌리면 빠지는 곳의 방문 기록·그 사이 바뀐 일정은 누르는 순간에만 판정한다
    SlotCandidatesRequest:
      type: object
      required: [slotKey]
      properties:
        slotKey: { type: string, description: '교체할 슬롯 "{date}#{poiId}"(BR-U2-04 규약)', maxLength: 100 }
        radiusM:
          type: integer
          nullable: true
          minimum: 1
          maximum: 50000
          description: >
            미지정이면 AI 기본 반경. h15 "반경 넓힘"이 이 값을 올려 재요청한다.
            상한 50km — 넘기면 400. 상한이 없으면 탐색 범위가 전 지구를 덮어 DB 전체를 훑는다.
        concept: { type: string, nullable: true, maxLength: 40, description: h13 테마 }
        reason:
          type: string
          nullable: true
          maxLength: 40
          description: >
            i14 재계획 사유 코드(FE 카탈로그 키 — `WEATHER`·`TEMP_CLOSED`·`SLOW_MOVE`·`LOW_ENERGY`·
            `FULLY_BOOKED`·`JUST_CHANGE`). 주면 AI 가 사유 기반 랭킹을 슬롯 교체에도 쓴다(비 오는 날
            야외 후보를 뒤로). 사유 없는 편집 흐름(h12·h18)은 생략한다.
            **모르는 코드도 400 이 아니다** — 서버가 사유 없음으로 눕히고 로그를 남긴다(랭킹 힌트지
            요청 성립 조건이 아니다).
        coPick:
          type: boolean
          default: false
          description: >
            같이 고르기(h10 순차 채우기)에서 온 요청인가. **탐색 중심을 어디로 둘지만 가른다**(TRIP-1252).

            두 경로가 같은 경계를 쓰지만(BR-U3-23) 맥락이 다르다 — 완전 AI '다른 후보'는 "이 자리 대체"라
            교체 대상이 중심이고(생략 = 종전 그대로), 같이 고르기는 **방금 고른 곳에서 다음 발걸음**이라
            직전 슬롯이 중심이다. 켜지 않으면 칸을 고를수록 동선이 도시 전체로 튄다(2026-10-05 재현).

            **직전 poiId 를 보내지 않는다** — 경로만 선언하면 서버가 일정에서 직전 슬롯을 읽는다
            (`excludePoiIds` 를 받지 않는 것과 같은 이유: 클라가 준 식별자를 믿으면 그쪽 누락이 그대로 샌다).
        center:
          type: object
          nullable: true
          required: [mode]
          description: >
            찾는 중심 — 같이 짜기에서 사용자가 고른다(2026-10-23). 생략하면 `coPick` 규칙 그대로다.
            `PREVIOUS` 방금 고른 곳(첫 칸이면 교체 대상) · `REGION` 그 날 목적지(구) 중심 · `STAY` 그 날 숙소
            (체크아웃일은 전날 숙소) · `POINT` 지도에서 찍은 점(`lat`·`lng` 필수, 없거나 범위 밖이면 400).
            `REGION`·`STAY` 의 재료가 없으면(숙소 없는 날 등) 다른 중심으로 바꾸지 않고 409 다.

            **구 안 우선** — 여행 목적지가 구·시군이면(시도 아님) 결과를 같은 반경 안에서 그 구 안 장소부터
            채우고, 모자랄 때만 구 밖이 뒤에 남는다(바꿔 넣으면 `degraded=true`). `STAY`·`POINT` 는 사용자가
            그 자리를 고른 것이라 구 안 우선을 걸지 않는다.
          properties:
            mode: { type: string, enum: [PREVIOUS, REGION, STAY, POINT] }
            lat: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
            lng: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
    SlotCandidates:
      type: object
      required: [candidates, radiusMUsed, degraded]
      properties:
        candidates:
          type: array
          description: 빈 목록 = 후보 0건 → 반경 확대·컨셉 변경 제안(BR-U3-25)
          items:
            type: object
            required: [poiId, distanceRange, rationale]
            properties:
              poiId: { type: string, format: uuid }
              distanceRange: { type: string, description: 거리만(INV-3) }
              rationale: { type: string, description: closed-set 근거 — 시각·소요시간 언급 없음(BR-U2-09) }
              # POI 표면(TRIP-851) — 후보 카드를 **추가 왕복 없이** 그린다. 후보마다 `GET /places/{id}`
              # 를 부르면 N+1 이라 응답에 싣는다. 정본에 없으면 전부 null 이고, 그때 화면은
              # "이름 준비 중"·카테고리 일러스트 썸네일(클라가 채운다 — category 가 있으면 그 카테고리 그림,
              # 없으면 중립 그림)로 떨어진다(서버는 값을 지어내지 않는다).
              nameKo: { type: string, nullable: true }
              category: { type: string, nullable: true, description: 한글 정본(명소·맛집·카페·야경·자연·쇼핑·문화·액티비티·미술·술집) — 일정 슬롯과 같은 값. 클라가 이 값으로 사진 없는 칸의 카테고리 일러스트를 고른다 }
              tags: { type: array, items: { type: string }, description: 미확보 시 빈 배열 }
              imageUrl: { type: string, nullable: true, description: NULL = 미확보. 대표 1장 }
              # 후보 핀 좌표(TRIP-1063 · QA #044) — '후보 고르기' 지도에 A/B/C 핀을 찍는 값.
              # 표면과 같은 정본 조회에서 온다. 표면이 없으면 null — 지어내지 않는다(BR-U1-06).
              lat: { type: number, format: double, nullable: true }
              lng: { type: number, format: double, nullable: true }
        radiusMUsed:
          type: integer
          description: 실제 사용 반경. 후보가 0건이면 서버가 한 번 넓혀 다시 보므로 그대로 표시한다
        degraded:
          type: boolean
          description: >
            **AI 가 LLM 랭킹을 못 냈을 때 true**(AI 폴백 응답 또는 미도달 폴백). 후보 집합은 정본
            그대로지만 정렬이 거리순이고 근거 문구가 템플릿이며 앞뒤 슬롯과의 동선을 따지지 않았다.
            화면은 "AI 추천 준비 중, 가까운 순" 을 안내한다 — 이 값이 없으면 사용자는 취향이
            반영된 줄 안다(INV-4).
        emptyReason:
          type: string
          nullable: true
          enum: [NO_NEARBY, ALL_IN_ITINERARY]
          description: >
            후보가 **0건인 이유**. 후보가 있으면 null 이다.


            `NO_NEARBY` — 넓힌 반경 안에 후보 자체가 없다. 반경 확대·컨셉 변경이 통한다(BR-U3-25).


            `ALL_IN_ITINERARY` — 주변에 있으나 **전부 이미 이 일정에 들어 있다**(BR-U3-24).
            넓혀도 같은 결과이고, 사용자가 할 일은 다른 슬롯을 빼는 것이다.


            둘을 뭉뚱그리면 화면이 "근처에서 바꿀 만한 후보를 찾지 못했어요" 하나로 말하고
            사용자는 반경만 계속 넓히며 헛돈다.
    RevisionList:
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items: { $ref: '#/components/schemas/Revision' }
    Revision:
      type: object
      required: [revisionId, seq, actor, kind, summary, createdAt]
      properties:
        revisionId: { type: string, format: uuid }
        seq: { type: integer, description: "**여행 안에서** 유일·단조(INV-U3-06). 클수록 최근" }
        actor: { type: string, enum: [USER, AI], description: 화면의 `나`/`AI` 배지 }
        kind:
          type: string
          enum: [BASELINE, GENERATE, EDIT, RESTORE]
          description: BASELINE = "AI가 처음 짠 일정 · 기준 버전"(BR-U3-31)
        summary: { type: string, description: 표시 문구 }
        detail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, description: "\"18분 전\" 상대 표기의 원천" }
    GenerationSession:
      type: object
      required: [sessionId, status, mode, isFallback, startedAt]
      properties:
        sessionId: { type: string, format: uuid }
        itineraryId:
          type: string
          format: uuid
          nullable: true
          description: day1 확정 전에는 null — 일정 행이 생기기 전에도 세션은 존재한다.
        status:
          type: string
          enum: [RUNNING, DAY1_READY, COMPLETED, FAILED, CANCELED]
          description: >
            RUNNING=1차 진행 중 · DAY1_READY=day1 노출됨(2차 진행 중) · COMPLETED=전 일자 완료 ·
            FAILED=2차 실패(day1 분은 일정에 유효하게 남는다) · CANCELED=사용자가 취소.
        mode: { type: string, enum: [FULLY_AI, CO_PLAN, MANUAL] }
        isFallback:
          type: boolean
          description: 폴백 배너의 근거(INV-4 침묵 금지). day1 시점에 실려 배너가 첫 노출부터 사실을 말한다.
        candidatesLevel: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        day1ReadyAt: { type: string, format: date-time, nullable: true }
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: 끝난 세션에만 있다 — 진행 중이면 null(DB CHECK 로도 강제).
    Itinerary:
      type: object
      required: [itineraryId, tripId, status, solveMode, generationMode, isFallback, generationState, scoringMode, degradations, days]
      properties:
        itineraryId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        status: { type: string, enum: [PLANNED, CONFIRMED] }
        solveMode: { type: string, enum: [FULL_AI, DETERMINISTIC, MINIMAL], description: AI 가 **어떻게 풀었나** }
        generationMode:
          type: string
          enum: [FULLY_AI, CO_PLAN, MANUAL]
          description: >
            사용자가 **무엇을 골랐나**(US-SCHED-09). solveMode 와 다른 축이다.
            MANUAL(직접 만들기)은 AI 를 아예 부르지 않고 빈 일자만 만든다 — 이때 solveMode=MINIMAL 이지만
            **isFallback 은 false** 다(실패가 아니라 선택이다).
        isFallback: { type: boolean }
        generationState:
          type: string
          enum: [PARTIAL, COMPLETE, FAILED]
          description: >
            생성 진행 상태(확정 상태와 다른 축) — PARTIAL=day1만 채워짐(2단계 생성 중) · COMPLETE=전 일자 완료 ·
            FAILED=2차 실패(1차분은 유효). **PARTIAL 인 동안 확정·편집은 409**
            (day1만 동결된 채 잠기거나, 뒤이어 도착하는 2차 결과가 편집을 덮어쓰는 것 방지).
            생성 POST 는 day1 만 담은 PARTIAL 을 즉시 반환하므로, 클라이언트는 GET 으로 COMPLETE/FAILED 까지
            폴링해 나머지 일자를 받는다(여행이 하루면 즉시 COMPLETE).
        generationSessionId:
          type: string
          format: uuid
          nullable: true
          description: >
            진행 중 생성 세션(h09·h10). 폴링·[취소]의 대상이며 **진행 중이 아니면 null** 이다.
            별도 조회 엔드포인트를 두지 않은 이유 — 화면은 어차피 이 응답을 폴링하고,
            따로 두면 생성이 빨리 끝났을 때 이미 없는 세션을 조회하는 경합이 생긴다.
        unplacedMustVisits:
          type: array
          description: >
            넣지 못한 필수 방문지. **빈 배열 = 전부 배치됨**(계약 M2).
            판정은 AI 소유이고 백엔드는 보관·전달만 한다 — 사용자 문구(message)는 백엔드가 만든다.
          items:
            type: object
            required: [poiId, reasonCode, message]
            properties:
              poiId: { type: string, format: uuid }
              reasonCode:
                type: string
                enum: [OUT_OF_RANGE, WINDOW_CONFLICT, NO_FEASIBLE_SLOT, UNKNOWN]
                description: 분기용 닫힌 집합. UNKNOWN = 계약에 없는 새 사유가 온 경우(보고 자체는 잃지 않는다)
              message: { type: string, description: 표시용 문구 — 클라이언트가 지어내지 않게 서버가 준다 }
        candidatesSummary:
          nullable: true
          description: >
            후보 충분성(BR-U2-05). **판정은 AI 소유** — 백엔드는 값을 그대로 전달하고 재계산·검증하지 않는다.
            AI 가 값을 주지 않거나 형태가 다르면 null. `level` 은 **열거로 고정하지 않는다** —
            백엔드가 통과시키는 값이므로 AI 어휘(예: OK · LOW · NO_CANDIDATES)가 그대로 나갈 수 있다.
            `poolSize` 는 AI 가 주지 않으면 없다(0 으로 채우지 않는다 — 0 은 "후보 0건"이라는 판정이다).
          type: object
          required: [level]
          properties:
            level: { type: string }
            poolSize: { type: integer, nullable: true }
            shortfallCategories: { type: array, items: { type: string } }
        scoringMode:
          type: string
          enum: [LLM, MIXED, RULE]
          nullable: true
          description: >
            취향 점수를 누가 매겼나(TRIP-1173) — LLM(전 후보 LLM 점수) · MIXED(LLM + 규칙 보충, 또는 2단계 생성의
            두 호출이 갈림) · RULE(규칙 점수만 — LLM 실패 포함). **null = 모름**(직접 만들기 · 최소 폴백 ·
            2단계 중 한 호출이 폴백 · 이 필드 이전에 만든 일정). solveMode 는 조립 축이라 LLM 실패를 말하지 않는다.
            호출 하나의 판정은 AI 소유 — 백엔드는 2단계 생성을 합칠 때만 같으면 그대로·갈리면 MIXED·모름이 섞이면
            null 로 접고, 강등 코드는 코드 모양만 통과시킨다. **생성 시점 판정** — 편집·되돌리기·재계획 반영으로 바뀌지 않는다.
            키는 늘 있다(required) — 모르면 값이 null 이다.
        degradations:
          type: array
          items: { type: string }
          description: >
            밟은 강등 계단 기계 코드 `"{stage}:{reason}"`(예 `llm:c1_fallback`, `explanation:explanation_fallback`).
            **LLM 점수 실패는 `llm:` 접두로 거른다** — 설명·차선책 단계 강등도 섞여 있다. 빈 배열 = 강등 없음(또는 모름).
            코드 모양(소문자·숫자·밑줄, 64자 이내)이 아닌 항목은 서버가 버린다 — 문장·시각은 나가지 않는다.
            최대 16개(2단계 생성을 합쳐도). **생성 시점 판정** — 편집·되돌리기·재계획 반영으로 바뀌지 않는다.
        days:
          type: array
          items:
            type: object
            required: [date, slots]
            properties:
              date: { type: string, format: date }
              slots:
                type: array
                items:
                  type: object
                  required: [poiId, startAt, endAt, isFixed, endsNextDay, hasViolation, tags, alternatives]
                  properties:
                    poiId: { type: string, format: uuid }
                    startAt: { type: string, description: "HH:mm:ss (솔버 검증값 INV-2)" }
                    endAt: { type: string }
                    isFixed: { type: boolean }
                    endsNextDay: { type: boolean, description: "자정 넘김(HC4) — true 면 endAt 은 익일 시각(시작일 귀속)" }
                    hasViolation: { type: boolean, description: "편집 재검증(HC1-4) 위반 표시(비차단)" }
                    violationReason:
                      type: string
                      nullable: true
                      description: >
                        위반 사유(BR-U3-13). 저장 후 재조회에도 남아 위반 블록을 **지속 가시화**한다.
                        여러 건이면 " · " 로 이어 붙인다. hasViolation=false 면 항상 null.
                    placementReason:
                      type: string
                      nullable: true
                      description: >
                        이 장소를 고른 이유(BR-U2-04). 문구는 시각·소요시간을 언급하지 않는다(BR-U2-09) —
                        집행은 AI 프롬프트·후처리 책임이고 경계에서 문자열 검사는 하지 않는다.
                    distanceRange:
                      type: string
                      nullable: true
                      description: >
                        직전 지점에서의 이동 **거리 표시 문자열**(BR-U2-08) — 예 "약 1.2km · 도보 추정".
                        직선거리 폴백이면 "추정" 표기가 포함된다. 소요시간은 어떤 이유로도 싣지 않는다(INV-3).
                        편집 직후에는 순서가 바뀌어 값이 무효라 null 이다(재산출은 TRIP-309).
                    # --- POI 표면(BR-U3-09) — 추가 왕복 없이 지도·카드를 그릴 수 있게 합성해 싣는다.
                    #     확정 슬롯은 동결값(INV-U1-03)이 이긴다. 정본·동결본 모두 없으면 전부 null.
                    nameKo: { type: string, nullable: true }
                    lat: { type: number, format: double, nullable: true }
                    lng: { type: number, format: double, nullable: true }
                    category: { type: string, nullable: true }
                    openingHours:
                      type: string
                      nullable: true
                      description: >
                        영업시간 **원문 문자열**(자유형) — 기계 판정에 쓰지 말 것. structured 스키마는 U6.
                        NULL = 미확인.
                    openingHoursKnown:
                      type: boolean
                      nullable: true
                      description: >
                        영업시간 확인 여부. false 면 확정 배치가 아니라 **사용자 확인 후보**로 분리한다
                        (US-SCHED-03 예외). 현재는 값 유무 판정까지만 신뢰할 수 있다.
                        **확정된 일정(status=CONFIRMED)에서는 null** — 확정 전 분류 신호라 확정 뒤에는
                        판정 대상이 아니다(정본을 따라가면 확정 슬롯이 사후에 재분류된다).
                    imageUrl:
                      type: string
                      nullable: true
                      description: NULL = 미확보. 기본 이미지를 지어내지 않는다(TRIP-219)
                    tags: { type: array, items: { type: string }, description: 미확보 시 빈 배열 }
                    alternatives:
                      type: array
                      description: >
                        생성 시점에 AI 가 같이 준 **다른 선택지**(TRIP-873) — 슬롯당 **최대 2건**,
                        없으면 빈 배열. 있으면 화면이 추가 왕복 없이 "다른 선택지"를 그린다.

                        **제안일 뿐이다** — 시각도 순서도 없다(INV-2). 교체 확정은 기존 편집 경로
                        (edit → validate) 그대로다. 정본에 없는 장소는 서버가 이미 걸러 냈다(INV-1).

                        **편집하면 사라진다**(빈 배열). 편집 응답에 차선책이 없고, 옛 값을 들고 가면
                        바뀐 슬롯에 옛 대안이 붙어 distanceRange 가 틀려진다.

                        반경·컨셉을 바꿔 다시 묻고 싶으면 온디맨드 후보 조회를 쓴다(목적이 다르다).
                      items:
                        type: object
                        required: [poiId, rationale]
                        properties:
                          poiId: { type: string, format: uuid }
                          rationale:
                            type: string
                            description: >
                              사용자 표시용 한 문장. 시각·소요시간을 언급하지 않는다(BR-U2-09).
                          distanceRange:
                            type: string
                            nullable: true
                            description: >
                              **이 슬롯 POI ↔ 이 후보** 사이 거리 표시 문자열(INV-3: 소요시간 없음).
                              좌표를 모르면 null — 0 이나 빈 문자열로 채우지 않는다("모른다"가
                              "가깝다"로 바뀐다). 온디맨드 후보(SlotCandidate)는 우리가 계산해 항상
                              채우므로 그쪽과 달리 nullable 이다.
                          # POI 표면(TRIP-851) — **온디맨드 후보와 같은 이름**이다. 화면이 두 곳에서
                          # 같은 카드를 재사용한다. 동결본은 안 본다(차선책은 확정 시점에 동결된 적이 없다).
                          nameKo: { type: string, nullable: true }
                          category: { type: string, nullable: true }
                          tags: { type: array, items: { type: string } }
                          imageUrl: { type: string, nullable: true }
                          # 후보 핀 좌표 — SlotCandidate.lat/lng 와 같은 뜻이다. TRIP-1063 이 온디맨드
                          # 후보에만 더해 두 응답의 모양이 갈려 있었다(같은 카드를 재사용하는데).
                          # 표면이 없으면 null — 반경 중심 등으로 지어내지 않는다(BR-U1-06).
                          lat: { type: number, format: double, nullable: true }
                          lng: { type: number, format: double, nullable: true }
                    # INV-3: 소요시간(duration) 필드 없음 — 거리만(후속)

    TermsType:
      type: string
      enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, LOCATION_TERMS, MARKETING, GPS_RECORDING, PERSONALIZATION]

    AgeConfirmation:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [BIRTH_DATE, SELF_DECLARED] }
        birthDate: { type: string, format: date, nullable: true }

    SocialLoginRequest:
      type: object
      required: [authorizationCode, codeVerifier, redirectUri]
      properties:
        authorizationCode: { type: string }
        codeVerifier: { type: string }
        redirectUri: { type: string }
        ageConfirmation:
          allOf: [{ $ref: '#/components/schemas/AgeConfirmation' }]
          description: 신규 가입 시 필수, 기존 로그인 시 무시
        deviceId: { type: string, nullable: true, maxLength: 128, description: '미제공 시 서버가 임의 부여(기기별 세션). 길이는 UTF-16 단위(서버 @Size) — maxLength(코드 포인트)와 BMP 밖 문자에서 다르다' }

    SocialTokenLoginRequest:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: >
            네이티브 SDK가 발급한 제공자 토큰. 카카오·네이버·구글은 access token,
            **애플은 `identityToken`(id_token)** 이다 — 경로 설명 참고(TRIP-858).
        ageConfirmation:
          allOf: [{ $ref: '#/components/schemas/AgeConfirmation' }]
          description: 신규 가입 시 필수, 기존 로그인 시 무시
        deviceId: { type: string, nullable: true, maxLength: 128, description: '미제공 시 서버가 임의 부여(기기별 세션). 길이는 UTF-16 단위(서버 @Size) — maxLength(코드 포인트)와 BMP 밖 문자에서 다르다' }
        authorizationCode:
          type: string
          nullable: true
          description: >
            선택. **애플만 쓴다**(TRIP-933) — `expo-apple-authentication` 이 identityToken 과 함께 주는
            `authorizationCode`. 로그인은 `accessToken`(identityToken)으로 끝나고, 이 값은 계정 파기 때
            Apple 토큰을 revoke 하기 위한 refresh_token 교환에만 쓴다(App Store 5.1.1(v)).
            교환이 실패해도 로그인은 성공한다(응답 무변화). 다른 제공자는 무시한다.

    RefreshTokenBody:
      type: object
      description: 리프레시 토큰 하나를 실어 보내는 본문 — 회전(/auth/token/refresh)·로그아웃(/auth/logout) 공용
      required: [refreshToken]
      properties:
        refreshToken: { type: string, pattern: '\S', description: '비거나 공백뿐이면 400(VALIDATION_ERROR) — 서버 @NotBlank. 공백 판정은 서버(Java isBlank) 기준이며 pattern 의 \S 와 공백 문자 집합이 다를 수 있다' }

    RefreshedTokenPair:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer, example: 7776000 }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer, example: 7776000 }
        isNewUser: { type: boolean }
        account: { $ref: '#/components/schemas/AccountSummary' }

    AccountSummary:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, DELETION_PENDING] }
        email: { type: string, nullable: true }
        socialProviders:
          type: array
          items: { type: string, enum: [GOOGLE, APPLE, KAKAO, NAVER] }

    TermsVersion:
      type: object
      properties:
        termsType: { $ref: '#/components/schemas/TermsType' }
        version: { type: string }
        body: { type: string }
        effectiveAt: { type: string, format: date-time }
        reconsentRequired: { type: boolean }

    ConsentState:
      type: object
      properties:
        termsType: { $ref: '#/components/schemas/TermsType' }
        granted: { type: boolean }
        termsVersion: { type: string }

    ConsentSubmission:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items:
            type: object
            required: [termsType, termsVersion, action]
            properties:
              termsType: { $ref: '#/components/schemas/TermsType' }
              termsVersion: { type: string }
              action: { type: string, enum: [GRANT, REVOKE] }

    LocationConsent:
      type: object
      properties:
        osPermissionMirror: { type: string, enum: [GRANTED, DENIED, NOT_DETERMINED] }
        legalConsent: { type: boolean }
        gpsRecordingOptIn: { type: boolean }
        capabilities:
          type: object
          properties:
            serverLocationService: { type: boolean }
            gpsTrackRetention: { type: boolean }

    Profile:
      type: object
      properties:
        nickname: { type: string }
        nicknameUpdatedAt: { type: string, format: date-time }
        onboardingCompletedAt: { type: string, format: date-time, nullable: true }

    PreferenceView:
      description: 각 축은 value + isNeutralDefault(중립 기본값 파생 여부)
      type: object
      properties:
        styles: { $ref: '#/components/schemas/PrefArrayAxis' }
        activities: { $ref: '#/components/schemas/PrefArrayAxis' }
        transportModes: { $ref: '#/components/schemas/PrefArrayAxis' }
        foodTastes: { $ref: '#/components/schemas/PrefArrayAxis' }
        pace: { $ref: '#/components/schemas/PrefScalarAxis' }
        companion:
          type: object
          properties:
            companionTypes: { type: array, items: { type: string } }
            petFlag: { type: boolean }
            isNeutralDefault: { type: boolean }
        budget:
          type: object
          properties:
            tier: { type: string, nullable: true }
            rawAmount: { type: integer, nullable: true }
            isNeutralDefault: { type: boolean }

    PrefArrayAxis:
      type: object
      properties:
        value: { type: array, items: { type: string } }
        isNeutralDefault: { type: boolean }

    PrefScalarAxis:
      type: object
      properties:
        value: { type: string, nullable: true }
        isNeutralDefault: { type: boolean }

    PreferenceInput:
      description: 축별 생략 = 미변경, null 전송 = 미설정으로 초기화. 배열 축은 다중 선택.
      type: object
      properties:
        styles: { type: array, items: { type: string, enum: [휴양, 관광, 액티비티, 미식, 쇼핑, 자연, 문화예술] }, nullable: true }
        activities: { type: array, items: { type: string, enum: [자연, 역사문화, 테마파크, 맛집투어, 카페, 전시, 야경, 쇼핑] }, nullable: true }
        transportModes: { type: array, items: { type: string, enum: [도보, 대중교통, 렌터카, 택시, 자전거] }, nullable: true }
        foodTastes: { type: array, items: { type: string, enum: [한식, 양식, 일식, 중식, 아시안] }, nullable: true }
        companionTypes: { type: array, items: { type: string, enum: [혼자, 커플, 친구, 가족, 부모님] }, nullable: true }
        petFlag: { type: boolean }
        pace: { type: string, enum: [느긋하게, 균형있게, 알차게], nullable: true }
        budgetTier: { type: string, enum: [저가, 중간, 고급, 럭셔리], nullable: true }
        budgetRawAmount: { type: integer, nullable: true }

    BootstrapResponse:
      type: object
      properties:
        appUpdate:
          type: object
          properties:
            status: { type: string, enum: [FORCED, RECOMMENDED, NONE] }
            minSupportedVersion: { type: string }
        reconsent:
          type: object
          properties:
            required: { type: boolean }
            termsTypes:
              type: array
              items: { $ref: '#/components/schemas/TermsType' }
        session:
          type: object
          properties:
            state: { type: string, enum: [AUTHENTICATED, GUEST, ONBOARDING_INCOMPLETE] }
            onboardingCompleted: { type: boolean }

    DeletionResponse:
      type: object
      properties:
        purgeAt: { type: string, format: date-time }
        cascadeSummary:
          type: object
          required: [purgeScheduled, legallyRetained]
          properties:
            purgeScheduled: { type: array, items: { type: string }, description: 유예 후 파기될 데이터 범주 }
            legallyRetained: { type: array, items: { type: string }, description: 법정 보존으로 남는 범주 }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            traceId: { type: string }
            fields:
              type: array
              description: VALIDATION_ERROR 에만 존재.
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }
            existingProvider:
              type: string
              enum: [google, apple, kakao, naver]
              description: >
                SOCIAL_EMAIL_CONFLICT 에만 존재(BR-U0-04 · INV-A3). 같은 이메일로 이미 가입된
                기존 제공자의 소문자 코드. 한 계정에 제공자가 둘 이상이면 대표 1개(가장 먼저
                연결된 것)를 준다 — 전체 나열은 message 가 담는다. 다른 에러 코드의 응답에는
                이 필드가 나타나지 않는다(직렬화 자체가 생략된다).
            activeTripId:
              type: string
              format: uuid
              description: >
                GENERATION_IN_PROGRESS 에만 존재(TRIP-403). 지금 일정을 생성 중인 여행.
                거절 사유만 주면 사용자는 무엇이 끝나기를 기다려야 하는지 모른다 — 화면이 이 값으로
                그 여행으로 이동시킨다. `existingProvider` 와 같은 방식으로 다른 에러 코드의 응답에는
                나타나지 않는다(직렬화 생략).
            activeSessionId:
              type: string
              format: uuid
              description: >
                GENERATION_SUPERSEDED 에만 존재(TRIP-1058). 취소·대체된 생성 요청이 거절될 때
                지금 진행 중인 **새 세션** — 화면이 이 값으로 폴링을 갈아탄다. 취소만 되고
                새 요청이 없으면(cancel API 경로) 싣지 않는다. 다른 에러 코드의 응답에는
                나타나지 않는다(직렬화 생략).
            visitCheckId:
              type: string
              format: uuid
              description: >
                VISIT_ALREADY_RECORDED · VISIT_CONFLICT 에만 존재(TRIP-546 · BR-U5-20·21).
                서버에 이미 있는 방문 기록. 오프라인 큐 재생에서 **409 는 실패가 아니다** —
                `VISIT_ALREADY_RECORDED` 면 원하던 상태가 이미 있다는 뜻이라 클라이언트는 그 항목을
                `SYNCED` 로 수렴시키고, `VISIT_CONFLICT` 면 방문 단위 해소 화면으로 간다.
                2열 비교에 필요한 나머지(시각·상태·메모·사진 수)는 이 id 로 3종 비교 표면에서 읽는다 —
                오류 봉투를 자료 전달 통로로 쓰지 않는다.
            serverUpdatedAt:
              type: string
              format: date-time
              description: >
                VISIT_ALREADY_RECORDED · VISIT_CONFLICT 에만 존재. 서버 기록의 `updatedAt`(BR-U5-22) —
                충돌 판정의 기준값이라, 클라이언트가 이것을 받아 다음 재생의 `expectedUpdatedAt` 으로 쓴다.

    AddPhotoRequest:
      type: object
      required: [localAssetId, deviceId]
      properties:
        localAssetId:
          type: string
          maxLength: 200
          description: '기기 로컬 자산 식별자(iOS PHAsset localIdentifier · Android MediaStore id). 기기 안에서만 뜻이 있다. 길이는 UTF-16 단위(서버 @Size) — maxLength(코드 포인트)와 BMP 밖 문자에서 다르다'
        deviceId: { type: string, maxLength: 64, description: '길이는 UTF-16 단위(서버 @Size) — maxLength(코드 포인트)와 BMP 밖 문자에서 다르다' }
        takenAt: { type: string, format: date-time, nullable: true }
        exifLat:
          type: number
          format: double
          nullable: true
          description: 위치 동의가 없으면 **저장되지 않는다**(INV-U5-04). 보내는 것 자체는 오류가 아니다.
        exifLng: { type: number, format: double, nullable: true }
        sortOrder:
          type: integer
          nullable: true
          description: 생략하면 맨 뒤에 붙는다.

    ReorderPhotosRequest:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          description: 그 방문의 사진 **전부**를 한 번씩. 부분 목록은 400.
          items: { type: string, format: uuid }

    PutMemoRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000, description: '길이는 UTF-16 단위(서버 @Size) — maxLength(코드 포인트)와 BMP 밖 문자에서 다르다' }

    VisitPhotoList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VisitPhoto' }
        count:
          type: integer
          description: 개수만 쓰는 소비자(AI 컨텍스트)를 위해 함께 준다.

    VisitPhoto:
      type: object
      required: [visitPhotoMetaId, localAssetId, deviceId, sortOrder]
      properties:
        visitPhotoMetaId: { type: string, format: uuid }
        localAssetId: { type: string }
        deviceId:
          type: string
          description: >
            화면이 **다른 기기에서 찍은 사진**을 구분하는 근거(BR-U5-15) — 기기가 바뀌면 자산은
            이관되지 않고 메타만 남는다.
        takenAt: { type: string, format: date-time, nullable: true }
        exifLat:
          type: number
          format: double
          nullable: true
          description: 위치 동의가 없으면 null — 등록 요청이 좌표를 실어 보냈어도 그렇다.
        exifLng: { type: number, format: double, nullable: true }
        sortOrder: { type: integer }

    AccountExport:
      type: object
      required: [accountId, exportedAt, sectionLimit, truncatedSections, sections]
      properties:
        accountId: { type: string, format: uuid }
        exportedAt: { type: string, format: date-time }
        sectionLimit: { type: integer }
        truncatedSections:
          type: array
          description: 상한에 걸려 잘린 몫들. 비어 있으면 전부 다 실렸다는 뜻이다.
          items: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/ExportSection' }

    ExportSection:
      type: object
      required: [section, items, truncated]
      properties:
        section:
          type: string
          description: 몫 이름. 모듈이 늘면 여기도 는다 — 고정 목록이 아니다.
          example: trips
        items:
          type: array
          description: >
            **자유 형태다.** 내보내기는 자료 덤프지 클라이언트가 프로그래밍하는 계약이 아니라,
            여기에 타입을 박으면 모듈이 필드를 하나 늘릴 때마다 공용 계약이 흔들린다.
          items: { type: object, additionalProperties: true }
        truncated: { type: boolean }

    PersonalizationInfo:
      type: object
      required: [applied, reason, sharedItems]
      properties:
        applied: { type: boolean, description: 과거 기록이 실제로 추천에 반영됐는가 }
        reason:
          type: string
          enum: [APPLIED, CONSENT_MISSING, NOT_ENOUGH_RECORDS]
          description: >
            `CONSENT_MISSING` = 개인화 활용 미동의(철회 포함) · `NOT_ENOUGH_RECORDS` = 동의는 있으나
            정식 스타일 분석이 아직 없음(누적 방문 10곳 미만, INV-U5-09).
        sharedItems:
          type: array
          description: 넘긴 항목과 그 목적. 미적용이면 **빈 배열**이다.
          items: { $ref: '#/components/schemas/PersonalizationItem' }

    PersonalizationItem:
      type: object
      required: [item, purpose]
      properties:
        item: { type: string, example: 자주 방문한 장소 유형 }
        purpose: { type: string, example: 추천 장소의 종류를 취향에 맞춥니다 }

    StyleAnalysisEnvelope:
      type: object
      required: [official, progress]
      properties:
        official:
          type: boolean
          description: 정식 분석인가. false 면 `preview` 가 차 있고 화면은 **"정식 아님"을 명시**한다(BR-U5-40).
        progress: { $ref: '#/components/schemas/StyleProgress' }
        analysis:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/StyleAnalysisBody' }]
        preview:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/StylePreview' }]

    StyleProgress:
      type: object
      required: [current, required]
      description: '`현재 N곳 / 필요 10곳`. 정식이어도 싣는다 — `분석에 사용된 방문 N곳`의 근거(BR-U5-42).'
      properties:
        current: { type: integer }
        required: { type: integer, example: 10 }

    StylePreview:
      type: object
      required: [descriptors]
      description: 임계 미만의 임시 미리보기. **온보딩 취향**에서 왔다 — 실적이 아니고 저장되지도 않는다.
      properties:
        descriptors: { type: array, items: { type: string }, example: ['#바다', '#미식'] }

    StyleAnalysisBody:
      type: object
      required: [descriptors, traitGauges, categoryBreakdown, avgPlacesPerDay, avgRadiusKm, sampleTripCount, updatedAt]
      properties:
        descriptors: { type: array, items: { type: string } }
        traitGauges: { $ref: '#/components/schemas/TraitGauges' }
        categoryBreakdown:
          type: array
          items: { $ref: '#/components/schemas/CategoryShare' }
        avgPlacesPerDay: { type: number, format: double }
        avgRadiusKm: { type: number, format: double }
        avgDwellMinutes:
          type: integer
          nullable: true
          description: >
            **소요시간 노출의 유일한 예외**(BR-U5-08a · DEC-U5-13 · PBT-U5-5). 사후 실적 통계라
            INV-3(솔버 미검증 예측 소요시간 금지)에 걸리지 않는다. 개별 방문의 체류는 계속 미노출이다.
            잴 수 없으면 null — 0 으로 채우지 않는다.
        sampleTripCount: { type: integer }
        updatedAt: { type: string, format: date-time }

    TraitGauges:
      type: object
      required: [easygoing, foodAffinity, activeness]
      description: 'dot 게이지 3축(각 0~5). **산출식은 잠정**(O-U5-9).'
      properties:
        easygoing: { type: integer, minimum: 0, maximum: 5, description: 여유로움 — 하루에 적게 다닐수록 높다 }
        foodAffinity: { type: integer, minimum: 0, maximum: 5, description: 미식취향 — 맛집·카페 비중이 높을수록 높다 }
        activeness: { type: integer, minimum: 0, maximum: 5, description: 활동성 — 하루 이동 반경이 넓을수록 높다 }

    CategoryShare:
      type: object
      required: [category, ratio, isOther]
      properties:
        category:
          type: string
          description: '**`poi.category` 코드**(`맛집`·`카페`·`자연`…). 표시 라벨 매핑은 화면 몫(O-U5-7).'
        ratio: { type: number, format: double, minimum: 0, maximum: 1 }
        isOther:
          type: boolean
          description: 상위 3 밖을 묶은 줄. 이 줄의 `category` 는 코드가 아니라 예약 라벨(`기타`)이다.

    TripSummaryEnvelope:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
          description: 요약이 만들어졌는가. false 면 화면은 **공유 진입점을 비활성화**한다(BR-U5-48).
        summary:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TripSummary' }]

    ShareCardCopy:
      type: object
      required: [caption, hashtags, isFallback]
      properties:
        caption:
          type: string
          maxLength: 150
          description: >
            캡션 한 문단. AI 문구(`isFallback=false`)면 1자 이상이다. 규칙 조립(`isFallback=true`)이면 **빈 문자열**이다 —
            앱이 문장 시드를 걷어냈고(TRIP-766) 캡션은 사용자가 쓴다. 길이는 UTF-16 코드 유닛으로 잰다.
        hashtags:
          type: array
          maxItems: 10
          items: { type: string, pattern: '^#\S+$', description: '`#` 로 시작하고 공백이 없다.' }
          description: 목적지를 모르는 규칙 조립이면 비어 있을 수 있다.
        isFallback:
          type: boolean
          description: AI 문구가 아니라 규칙 조립이다.

    TripSummary:
      type: object
      required: [narrative, highlights, stats, source, generatedAt]
      properties:
        narrative: { type: string, description: '**비어 있을 수 없다**(PBT-U5-1)' }
        highlights:
          type: array
          items: { $ref: '#/components/schemas/DayHighlight' }
        stats: { $ref: '#/components/schemas/TripSummaryStats' }
        source: { type: string, enum: [AI, RULE, BASIC], description: 회고와 같은 규약(BR-U5-33) }
        generatedAt: { type: string, format: date-time }

    DayHighlight:
      type: object
      required: [date, dayOrder, visitCount, places]
      description: '하루 한 칸. 실적이 없어도 실제 경로가 있는 날은 한 칸이다(U10 FD §12.5). **소요시간 없음**(INV-3)'
      properties:
        date: { type: string, format: date }
        dayOrder: { type: integer }
        visitCount: { type: integer }
        places: { type: array, items: { type: string } }
        distanceKm: { type: number, format: double, nullable: true, description: '그날 거리 — 실제 경로가 있으면 그것, 없으면 방문점 연결선. **선택 필드** — U10 전에 만든 요약에는 없다(null)' }
        distanceSource: { type: string, nullable: true, enum: [ROUTE, VISIT_LINE], description: 'distanceKm 와 함께 있거나 함께 없다' }

    TripSummaryStats:
      type: object
      required: [totalVisits, totalDistanceKm, distanceSource, totalPhotos, hasLocationData]
      description: '**소요시간 필드가 없다**(INV-3 · PBT-U5-5) — 거리만.'
      properties:
        totalVisits: { type: integer }
        totalDistanceKm: { type: number, format: double }
        distanceSource:
          type: string
          enum: [ROUTE, VISIT_LINE]
          description: '**모든 날이 실제 경로일 때만** `ROUTE` 다 — 한 날이라도 근사면 합계도 근사다(BR-U10-39). 경로가 나중에 오면 통계만 다시 센다'
        totalPhotos: { type: integer }
        hasLocationData:
          type: boolean
          description: >
            false 면 좌표를 하나도 못 찾았다는 뜻이다 — 화면은 **지도 대신 방문 목록**을 그린다(BR-U5-39).
            빈 지도를 띄우면 사용자는 기록이 없는 줄 안다.

    ReflectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reflection' }

    EditReflectionRequest:
      type: object
      description: >
        수정 단위는 **카드 통째**다(BR-U5-35). 장면·캡션 단위 편집은 화면이 정해진 뒤에 정한다.


        **세 필드 모두 선택이고 하나는 있어야 한다**(셋 다 없으면 400 · TRIP-828). `mood`·`shortMemo` 는
        카드와 별개의 입력이라, 그것만 보내는 요청은 카드를 건드리지 않는다.
      properties:
        card:
          type: string
          nullable: true
          minLength: 1
          maxLength: 20000
          description: >
            카드 원문(JSON 문자열). `cover.title` 이 비면 400 이다(PBT-U5-F1) — 통과시키면 목록에
            빈 줄이 그려지고 어디서 비었는지 추적할 근거가 사라진다. 보내지 않으면 카드는 그대로다.
        mood:
          type: string
          nullable: true
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]*$'
          description: >
            그날의 기분 **코드**. 값 집합은 화면이 정한다 — 서버는 코드 모양(영문·숫자·밑줄·하이픈)만
            검사하고 문장은 받지 않는다. 보내지 않거나 null 이면 그대로, **빈 문자열이면 지운다.**
        shortMemo:
          type: string
          nullable: true
          maxLength: 60
          description: >
            한 줄 메모. 앞뒤 공백을 뗀 뒤 60자(문자 수)를 넘거나 줄바꿈·제어 문자가 있으면 400.
            보내지 않거나 null 이면 그대로, **빈 문자열(공백뿐 포함)이면 지운다.**

    ReflectionCard:
      type: object
      required: [templateId, format, title, subtitle, payload]
      description: >
        회고 카드 한 장. 서버는 `cover` 밖을 **해석하지 않는다**(DEC-U5-14) — 재검증하면 AI 가
        템플릿을 하나 늘릴 때마다 서버 마이그레이션이 된다. 화면은 `templateId` 로 그리는 법을 고른다.
      properties:
        templateId: { type: string, description: '카드를 만든 주체·판(예: backend.rule.daily.v1)' }
        format: { type: string }
        title: { type: string, description: '`cover.title`. **목록이 쓰는 짧은 문구**라 따로 낸다 — 클라가 매번 payload 를 파싱하지 않게' }
        subtitle: { type: string }
        payload: { type: string, description: '카드 원문(JSON 문자열). 서버가 재조립하지 않고 그대로 낸다' }

    Reflection:
      type: object
      required: [dayDate, card, draftCard, source, stats, generatedAt, updatedAt]
      properties:
        dayDate: { type: string, format: date }
        card:
          allOf: [{ $ref: '#/components/schemas/ReflectionCard' }]
          description: >
            화면이 그대로 그리는 카드(`editedCard ?? draftCard`). **표시본 선택은 업무 규칙이라
            서버가 정한다**(BR-U5-35) — 클라이언트가 매번 다시 고르면 조회 화면과 목록 화면이
            서로 다르게 고르는 날이 온다.
        draftCard:
          allOf: [{ $ref: '#/components/schemas/ReflectionCard' }]
          description: 생성된 원본 카드. **비어 있을 수 없다**(INV-U5-07)
        editedCard:
          allOf: [{ $ref: '#/components/schemas/ReflectionCard' }]
          nullable: true
          description: 사용자가 고친 카드. null 이면 아직 손대지 않았다 — 화면은 둘을 2열로 그린다(INV-U5-06).
        source:
          type: string
          description: >
            카드가 어느 단에서 나왔나(BR-U5-33). **항상 실린다** — 화면이 구분해 그리지 않더라도
            규칙 카드가 몇 %인지 모르면 AI 경로의 값을 잴 근거가 없다. `AI` 는 칸 2·3 에서 개통한다.
          enum: [AI, RULE, BASIC]
        stats: { $ref: '#/components/schemas/ReflectionStats' }
        generatedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        mood:
          type: string
          nullable: true
          description: 그날의 기분 코드. 남기지 않았으면 null. **재생성해도 남는다** — 사용자가 쓴 값이다(TRIP-828).
        shortMemo:
          type: string
          nullable: true
          maxLength: 60
          description: 한 줄 메모. 남기지 않았으면 null. 재생성해도 남는다.

    ReflectionStats:
      type: object
      required: [visitCount, distanceKm, distanceSource, photoCount]
      description: >
        근거 수치 — **비어 있을 수 없다**(INV-U5-07). 방문 0곳이어도 0으로 채운다.
        **이동 소요시간 필드가 없다**(INV-3 · PBT-U5-5) — 거리만 낸다.
        개별·일별 체류 시간도 없다(BR-U5-08); 누적 평균만 예외이고 그건 스타일 분석 소관이다.
      properties:
        visitCount: { type: integer }
        distanceKm: { type: number, format: double }
        distanceSource:
          type: string
          description: >
            `ROUTE` 는 그날 기기가 올린 **실제 경로 거리**(서버가 클램프한 값)다(U10 FD §7.2). 경로가 없는 날은
            `VISIT_LINE` — **방문점을 이은 직선 합**이지 도로 거리가 아니다(BR-U5-43). 밝히지 않으면 사용자가 근사값을 실측으로 읽는다.
            경로가 나중에 올라오면 이미 만든 회고의 이 값만 바뀐다(본문은 그대로, BR-U10-39).
          enum: [ROUTE, VISIT_LINE]
        photoCount: { type: integer }

    TripRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TripRecordSummary' }
        emptyState:
          type: string
          nullable: true
          description: >
            **`items` 가 비었을 때만** 채워진다. `NO_TRIPS` = 여행 자체가 없다(새 여행 생성 진입) ·
            `NO_RECORDS` = 여행은 있는데 기록이 아직 없다. 둘을 뭉치면 사용자가 무엇을 해야 할지 모른다.
          enum: [NO_TRIPS, NO_RECORDS]

    TripRecordSummary:
      type: object
      required: [tripId, title, startDate, endDate, regions, visitCount, photoCount]
      properties:
        tripId: { type: string, format: uuid }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        regions: { type: array, items: { type: string }, description: 목적지(구간 순서) }
        visitCount: { type: integer }
        photoCount: { type: integer, description: 사진 **메타** 개수 — 서버에 바이너리는 없다(INV-U5-03) }

    TripRecord:
      type: object
      required: [tripId, days, changes]
      properties:
        tripId: { type: string, format: uuid }
        days:
          type: array
          items: { $ref: '#/components/schemas/TripRecordDay' }
        changes:
          type: array
          description: 변경 이력(최신순). U5 는 이 테이블을 **읽기만** 한다(BR-U5-29).
          items: { $ref: '#/components/schemas/ChangeLogEntry' }

    TripRecordDay:
      type: object
      required: [date, planned, actual, unvisitedSlotKeys]
      properties:
        date: { type: string, format: date }
        baseStayId: { type: string, format: uuid, nullable: true }
        baseStayName:
          type: string
          nullable: true
          description: >
            그날의 기준 숙소. **파생값이라 저장돼 있지 않다** — 숙소를 바꾸면 같은 기록의 귀속이 따라
            바뀐다. 등록 숙소가 없거나 겹침이 미해결이면 null 이고, 그 날은 날짜만으로 묶인다(BR-U5-27).
        planned:
          type: array
          items: { $ref: '#/components/schemas/PlannedSlot' }
        actual:
          type: array
          description: >
            그 날의 실적. **배열 순서가 곧 방문 순서다**(도착 시각 오름차순, 도착한 적 없는 건너뛰기는 기록된
            시각) — 건너뛴 곳·즉석 방문도 번호를 받는다. `/trips/{tripId}/visits/days/{day}` 와 같은 순서다(TRIP-1315).
          items: { $ref: '#/components/schemas/ActualVisit' }
        unvisitedSlotKeys:
          type: array
          description: 계획엔 있는데 실적이 없는 슬롯(BR-U5-28). **저장되지 않는 판정**이다.
          items: { type: string }

    PlannedSlot:
      type: object
      required: [slotKey, date, poiId, orderIndex, startAt, endAt, endsNextDay, isFixed, hasViolation]
      properties:
        slotKey: { type: string, description: '경계 키 "{date}#{poiId}" — 실적과 견주는 연결 고리' }
        date: { type: string, format: date }
        poiId: { type: string, format: uuid }
        orderIndex: { type: integer }
        startAt: { type: string, example: '10:00' }
        endAt: { type: string, example: '11:30' }
        endsNextDay: { type: boolean, description: 자정 넘김(HC4). true 면 endAt < startAt }
        # 아래는 응답에 실제로 실려 나가는 값이다 — 이 타입이 일정 모듈의 공개 뷰를 그대로 직렬화한다(TRIP-1375 에서 문서화).
        isFixed: { type: boolean, description: 사용자가 시각을 못 박은 슬롯 }
        hasViolation: { type: boolean, description: '일정 화면의 슬롯 위반 표시와 같은 값' }
        nameKo: { type: string, nullable: true }
        category: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        violationReason: { type: string, nullable: true, description: '위반 사유 문구. 없으면 null' }
        distanceRange: { type: string, nullable: true, description: '직전 지점에서 이 슬롯까지의 거리 표시 문자열. 모르면 null (소요시간 없음 — INV-3)' }

    ActualVisit:
      type: object
      required: [visitCheckId, poiId, spontaneous, photoCount, hasMemo, updatedAt]
      properties:
        visitCheckId: { type: string, format: uuid }
        slotKey: { type: string, nullable: true, description: null = 즉석 방문(계획에 없던 곳) }
        poiId: { type: string, format: uuid }
        arrivedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        skippedAt: { type: string, format: date-time, nullable: true }
        spontaneous: { type: boolean }
        photoCount: { type: integer, description: 사진 **개수**만 — 메타 목록은 방문별 표면이 낸다 }
        memo:
          type: string
          nullable: true
          maxLength: 2000
          description: >
            메모 **본문**(BR-U5-13 — 한 방문에 한 개). 없으면 null.

            종전에는 `hasMemo` 만 나갔고 *"본문은 별도 표면"* 이라 적었는데 **그 표면이 없었다** —
            쓰기(`PUT .../memo`) 응답만 본문을 돌려줘서, 앱을 껐다 켜면 그 세션에 쓴 메모만 남고
            나머지는 사라진 것처럼 보였다(TRIP-1236). 저장은 처음부터 되고 있었다(V2.34).
        hasMemo:
          type: boolean
          description: >
            `memo != null` 과 같다 — 기존 클라이언트 호환으로 남긴다. 새로 쓰는 쪽은 `memo` 를 본다.
        updatedAt: { type: string, format: date-time, description: 오프라인 충돌 판정 기준(BR-U5-22) }

    VisitMemo:
      type: object
      required: [text, updatedAt]
      properties:
        text: { type: string, maxLength: 2000 }
        updatedAt: { type: string, format: date-time }

    # ── AI 도우미(U8) — 어떤 스키마에도 소요시간(duration) 필드가 없다(INV-3) ──
    AssistantOpenSessionRequest:
      type: object
      properties:
        tripId: { type: string, format: uuid, nullable: true, description: 'null 이면 여행 없이 연다(일반 도움 모드)' }
    AssistantSession:
      type: object
      required: [id, tripId, contextChip]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid, nullable: true }
        contextChip: { type: string, nullable: true, description: '사용한 컨텍스트 한 줄. 여행 없는 대화는 null' }
    AssistantOpenSessionResponse:
      type: object
      required: [session, messages, nextBefore, quickReplies]
      properties:
        session: { $ref: '#/components/schemas/AssistantSession' }
        messages: { type: array, items: { $ref: '#/components/schemas/AssistantMessage' }, description: '가장 최근 한 쪽(오래된 것 먼저)' }
        nextBefore: { type: string, nullable: true, description: '이어 연 대화에 더 오래된 메시지가 있으면 그 커서 — 메시지 조회의 before 로 쓴다' }
        quickReplies: { type: array, items: { $ref: '#/components/schemas/AssistantQuickReply' } }
    AssistantSessionSummary:
      type: object
      required: [id, tripId, tripTitle, lastTurnAt]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid, nullable: true }
        tripTitle: { type: string, nullable: true }
        lastTurnAt: { type: string, format: date-time }
    AssistantMessagesPage:
      type: object
      required: [messages, nextBefore]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/AssistantMessage' } }
        nextBefore: { type: string, nullable: true, description: '더 오래된 메시지가 있으면 그 커서. 없으면 null' }
    AssistantNextAction:
      type: object
      required: [type, label, params]
      properties:
        type:
          type: string
          description: >
            closed-set 이지만 문자열로 연다 — 앱은 모르는 값을 그리지 않고 "내가 할 수 있는 것 보기"로 바꾼다(BR-U8-06).
            OPEN_ITINERARY · OPEN_ITINERARY_EDIT · OPEN_ITINERARY_METHOD · OPEN_REGENERATE · OPEN_REPLAN · OPEN_LIVE ·
            OPEN_PLACE · OPEN_STAY_SEARCH · OPEN_OTA · OPEN_REFLECTION · OPEN_TRIP_SUMMARY · OPEN_STYLE · CREATE_TRIP ·
            RETRY_TURN · CONTINUE_WITHOUT_ASSISTANT · SHOW_CAPABILITIES · RESTORE_REVISION
        label: { type: string }
        params: { type: object, additionalProperties: { type: string } }
    AssistantQuickReply:
      type: object
      required: [id, label, action, params]
      properties:
        id: { type: string, description: '서버가 발급한 값. ACTION 턴의 quickReplyId 로 그대로 돌려보낸다' }
        label: { type: string }
        action:
          type: string
          description: >
            closed-set 이지만 문자열로 연다(다음 행동의 type 과 같은 이유 — 앱은 모르는 값을 그리지 않는다).
            SEND_TEXT · REVIEW · PICK_CANDIDATE · PICK_OPTION · SHOW_CAPABILITIES · RETRY
        params:
          type: object
          additionalProperties: { type: string }
          description: >
            빠른 답에 딸린 값. 후보 고르기는 `poiId` 를 싣는다. `intent`·`open` 은 서버가 자기 처리를 고르는 데 쓰는
            값이라 앱은 읽지 않는다 — 앱은 `id` 만 돌려보낸다.
    AssistantProposal:
      type: object
      required: [id, status, diff, violations, applyHint]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssistantProposalState' }
        diff:
          type: array
          description: '전후 비교. **위반만 있는 제안은 빈 배열이다** — 상대는 위반인 안의 일정을 주지 않는다'
          items:
            type: object
            required: [change, slotKey]
            properties:
              change: { type: string, enum: [ADDED, REMOVED, REPLACED, MOVED, RETIMED] }
              slotKey: { type: string }
              before: { nullable: true, allOf: [{ $ref: '#/components/schemas/AssistantProposalSlotFace' }] }
              after: { nullable: true, allOf: [{ $ref: '#/components/schemas/AssistantProposalSlotFace' }] }
              dayLabel: { type: string, nullable: true, example: '1일차 · 10월 24일', description: '그 줄이 놓인 날 — 여러 날을 고친 안을 날로 묶어 그린다. 이 칸 전에 저장된 제안은 null' }
        violations: { type: array, items: { type: string }, description: '비어 있지 않으면 적용할 수 없다(BR-U8-31)' }
        applyHint: { type: string, nullable: true, enum: [AUTO_APPLY, CONFIRM_REQUIRED, null], description: '표시 힌트일 뿐이다' }
    AssistantProposalSlotFace:
      type: object
      required: [name, startAt]
      properties:
        name: { type: string }
        startAt: { type: string, example: '14:00' }
        distanceRange: { type: string, nullable: true, description: '직전 구간 거리 문자열. 없으면 그리지 않는다' }
    AssistantMessage:
      type: object
      required: [id, role, kind, nextActions, quickReplies, proposal, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        kind: { type: string, enum: [TEXT, CLARIFY, REVIEW, CANDIDATES, PROPOSAL, INFO, SCOPE, REFUSAL, FALLBACK, ACTION_LOG] }
        text: { type: string, nullable: true, description: '정책 위반으로 저장하지 않은 입력은 null' }
        payload:
          nullable: true
          description: >
            카드 데이터 — 모양은 `kind` 가 정한다. PROPOSAL 은 payload 가 아니라 `proposal` 에 실린다.
          oneOf:
            - $ref: '#/components/schemas/AssistantCandidatesPayload'
            - $ref: '#/components/schemas/AssistantActionLogPayload'
            - $ref: '#/components/schemas/AssistantReviewPayload'
            - $ref: '#/components/schemas/AssistantInfoPayload'
            - $ref: '#/components/schemas/AssistantClarifyPayload'
            - $ref: '#/components/schemas/AssistantScopePayload'
            - $ref: '#/components/schemas/AssistantRefusalPayload'
            - $ref: '#/components/schemas/AssistantFallbackPayload'
        nextActions: { type: array, items: { $ref: '#/components/schemas/AssistantNextAction' }, description: '도우미 메시지는 1개 이상' }
        quickReplies:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/AssistantQuickReply' }
          description: >
            **null 과 빈 배열은 뜻이 다르다.** null 이면 이 메시지가 빠른 답을 정하지 않은 것이라 앱이 대화의 시작 빠른 답을
            보이고, 빈 배열이면 "보일 것이 없다"다. 사용자 메시지는 늘 null 이다.
        proposal: { $ref: '#/components/schemas/AssistantProposalOrNull' }
        footnote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        feedback:
          type: string
          nullable: true
          enum: [UP, DOWN, null]
          description: >
            사용자가 이 답에 남긴 평가(US-ASSIST-09). 없으면 null — 사용자 메시지와 적용 기록(`ACTION_LOG`)은 늘 null 이다.
            싫어요에 함께 남긴 이유·의견은 여기 싣지 않는다(평가 PUT 응답과 내보내기에만 있다).
            서버는 늘 싣지만 required 에는 넣지 않았다 — 이 칸이 생기기 전의 앱 빌드·목이 그대로 계약을 만족한다.
    AssistantLabeledValue:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string, description: '서버가 지은 문자열 그대로 — 저장·검증된 값이다. 소요시간은 없다(INV-3)' }
    AssistantReviewPayload:
      type: object
      description: 진행 검토(`b01 review`). 문제 행은 솔버가 이미 표기한 위반과 구조적 사실뿐이다(BR-U8-14).
      required: [title, summary, problems]
      properties:
        title: { type: string }
        summary: { type: array, items: { $ref: '#/components/schemas/AssistantLabeledValue' } }
        problems:
          type: array
          items:
            type: object
            required: [slotKey, reason, fixAction]
            properties:
              slotKey: { type: string, nullable: true, description: '슬롯에 붙지 않는 문제(숙소 미등록·일정 없음·빈 일자·날짜 밖 일정·다 못 보인 위반의 수)는 null' }
              reason: { type: string }
              fixAction: { $ref: '#/components/schemas/AssistantNextAction' }
    AssistantInfoPayload:
      type: object
      description: 조회 카드 — 다음 장소·거리·장소·날씨. 모르는 값은 행을 빼거나 "미확인"이라고 한다.
      required: [infoKind, title, rows]
      properties:
        infoKind: { type: string, enum: [NEXT_SLOT, DISTANCE, PLACE, WEATHER] }
        title: { type: string }
        rows: { type: array, items: { $ref: '#/components/schemas/AssistantLabeledValue' } }
    AssistantClarifyPayload:
      type: object
      required: [argument, question, options]
      properties:
        argument: { type: string }
        question: { type: string }
        options: { type: array, nullable: true, items: { type: string }, description: '보기가 없으면 null — 자유 입력을 기다린다' }
    AssistantScopePayload:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    AssistantRefusalPayload:
      type: object
      required: [category, capabilities]
      properties:
        category: { type: string, description: '위반 범주. 원문도 걸린 말도 싣지 않는다' }
        capabilities: { type: string }
    AssistantFallbackPayload:
      type: object
      required: [cause]
      properties:
        cause:
          type: string
          description: >
            문자열로 연다(앱은 모르는 값을 일반 폴백으로 그린다). 지금 오는 값은 AI_UNAVAILABLE · SOURCE_UNAVAILABLE.
    AssistantCandidatesPayload:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          description: >
            대체 후보(최대 5). 고르는 버튼은 같은 메시지의 `quickReplies` 에 있다 — `action = PICK_CANDIDATE`,
            `params.poiId` 가 이 `poiId` 다. 누르면 그 슬롯을 그 장소로 바꾼 **제안**(`PROPOSAL`)이 온다(저장은 [적용]).
          items:
            type: object
            required: [poiId, name, reason]
            properties:
              poiId: { type: string, format: uuid }
              name: { type: string }
              distanceRange: { type: string, nullable: true, description: '바꿀 자리에서 이 후보까지의 거리 문자열. 소요시간은 없다(INV-3)' }
              reason: { type: string }
    AssistantActionLogPayload:
      type: object
      required: [what]
      properties:
        what: { type: string, description: "무엇을 바꿨는가 — 예 '카페 모카 → 책방카페'" }
        tag: { type: string, nullable: true, description: '지금 오는 값은 CHANGE' }
        detail: { type: string, nullable: true }
        revisionId: { type: string, format: uuid, nullable: true, description: '지금은 늘 null — 편집 경로가 리비전 id 를 돌려주지 않는다' }
        changeLogEntryId: { type: string, format: uuid, nullable: true, description: '지금은 늘 null' }
    AssistantProposalOrNull:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/AssistantProposal'
    AssistantSendTurnRequest:
      type: object
      required: [clientTurnId, input, screen]
      properties:
        clientTurnId: { type: string, format: uuid, description: '멱등 키 — 재시도는 같은 값으로' }
        input:
          oneOf:
            - type: object
              required: [type, text]
              properties:
                type: { type: string, enum: [TEXT] }
                text: { type: string, minLength: 1, maxLength: 500 }
            - type: object
              required: [type, quickReplyId]
              properties:
                type: { type: string, enum: [ACTION] }
                quickReplyId: { type: string }
        screen:
          type: object
          required: [surface]
          properties:
            surface: { type: string, enum: [HOME, STAY_SEARCH, ITINERARY, LIVE, STAY_DETAIL] }
    AssistantSendTurnResponse:
      type: object
      required: [messages, quickReplies]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/AssistantMessage' }, description: '사용자 1건 + 도우미 1건 이상' }
        quickReplies: { type: array, items: { $ref: '#/components/schemas/AssistantQuickReply' } }
    AssistantProposalState:
      type: string
      enum: [PROPOSED, APPLIED, STALE, DISMISSED, EXPIRED, FAILED]
    AssistantProposalStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssistantProposalState' }
    AssistantApplyProposalResponse:
      type: object
      required: [proposal, messages]
      properties:
        proposal: { $ref: '#/components/schemas/AssistantProposalStatus' }
        messages: { type: array, items: { $ref: '#/components/schemas/AssistantMessage' } }
    AssistantDismissProposalResponse:
      type: object
      required: [proposal]
      properties:
        proposal: { $ref: '#/components/schemas/AssistantProposalStatus' }
    AssistantFeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: string, enum: [UP, DOWN] }
        reason:
          type: string
          nullable: true
          enum: [WRONG, NOT_HELPFUL, NOT_WHAT_I_WANTED, null]
          description: >
            싫어요 이유 칩 — 앱 문구는 `WRONG` "틀렸어요" · `NOT_HELPFUL` "도움이 안 돼요" · `NOT_WHAT_I_WANTED` "원한 답이 아니에요".
            `DOWN` 에만 실을 수 있다(`UP` 에 실리면 400). 없어도 된다 — 이유 없는 싫어요, "직접 적기"로 의견만 쓴 싫어요.
        comment:
          type: string
          nullable: true
          maxLength: 300
          description: >
            자유 의견("직접 적기"). `DOWN` 에만 실을 수 있다(`UP` 에 실리면 400). 서버가 앞뒤 공백을 지워 저장하고 비면 null 로
            둔다 — 공백뿐인 값은 없는 것과 같다. 지운 뒤 300자(유니코드 코드 포인트 — 이모지 하나가 1자)를 넘거나 NUL 문자가
            있으면 400. 사용자가 쓴 글이라 대화 원문과 같이 다룬다 — 로그에 싣지 않고 AI 로 보내지 않으며, 대화와 함께 지워지고
            내보내기에 실린다.
    AssistantFeedbackResponse:
      type: object
      required: [messageId, rating, reason, comment]
      properties:
        messageId: { type: string, format: uuid }
        rating: { type: string, enum: [UP, DOWN] }
        reason: { type: string, nullable: true, enum: [WRONG, NOT_HELPFUL, NOT_WHAT_I_WANTED, null] }
        comment: { type: string, nullable: true, description: '저장된 의견 — 앞뒤 공백을 지운 값이다. 없으면 null' }

    NotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }

    Notification:
      type: object
      required: [notificationId, kind, title, body, occurredAt]
      properties:
        notificationId: { type: string, format: uuid }
        kind:
          type: string
          description: >
            알림 종류 8종. **DB CHECK 로 고정하지 않는다** — 커뮤니티(U7) 개통 때 어휘를 넓히자고
            마이그레이션이 붙는 것을 피한다. 어휘의 주인은 서버의 `NotificationKind` 하나다.
          enum: [STAY, TRIP_PRE, TRIP_DAY, SLOT_PRE, PLAN_B, REFLECTION, COMMUNITY, SYSTEM]
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 400 }
        actionType:
          type: string
          nullable: true
          description: >
            알림에서 들어갈 화면. 진입이 없으면 `actionPayload` 와 함께 **둘 다 null** 이다 —
            액션 없는 알림을 "액션 있는 척" 그리지 않는다(INV-4). 회고에 쓸 데이터가 없어
            만들지 못한 알림이 그 경우다(BR-U6-12).


            `PLANB_REPLAN` 은 일정 화면이 아니라 **재계획 진입**이다(BR-U6-08 '대안 일정 보기').
          enum: [TRIP_ITINERARY, PLANB_REPLAN, REFLECTION_DAILY, TRIP_SUMMARY, STAY_DETAIL]
        actionPayload:
          nullable: true
          description: >
            `actionType` 별로 모양이 다르다. 네 갈래는 **필수 필드가 서로 달라** 하나만 맞는다.


            ⚠ `TRIP_ITINERARY` 와 `TRIP_SUMMARY` 는 같은 모양(`tripId` 하나)이라 스키마를 나누지
            않았다 — 나누면 두 갈래가 동시에 맞아 `oneOf` 가 성립하지 않는다.
          oneOf:
            - $ref: '#/components/schemas/NotificationTripAction'
            - $ref: '#/components/schemas/NotificationPlanBAction'
            - $ref: '#/components/schemas/NotificationReflectionAction'
            - $ref: '#/components/schemas/NotificationStayAction'
        occurredAt: { type: string, format: date-time }
        readAt:
          type: string
          format: date-time
          nullable: true
          description: null = 미읽음 — 목록 좌측 빨간 dot 의 근거.

    NotificationTripAction:
      type: object
      required: [tripId]
      additionalProperties: false
      description: '`TRIP_ITINERARY`(일정 리마인드) · `TRIP_SUMMARY`(여행 요약) — 여행 하나만 있으면 화면을 연다.'
      properties:
        tripId: { type: string, format: uuid }

    NotificationPlanBAction:
      type: object
      required: [tripId, triggerId]
      additionalProperties: false
      description: >
        `PLANB_REPLAN`. `triggerId` 를 실어야 화면이 "왜 다시 짜라는지"를 다시 묻지 않는다.
        `replanSessionId` 는 오지 않는다(아래).
      properties:
        tripId: { type: string, format: uuid }
        triggerId: { type: string, format: uuid }
        replanSessionId:
          type: string
          format: uuid
          description: 알림 경로에서는 싣지 않는다 — 앱은 탭 시점에 트리거 상세와 준비된 대안을 조회한다(BR-SA-21).

    NotificationReflectionAction:
      type: object
      required: [tripId, dayDate]
      additionalProperties: false
      description: '`REFLECTION_DAILY`. 여행 하나에 하루 회고가 여러 장이라 날짜가 있어야 고를 수 있다.'
      properties:
        tripId: { type: string, format: uuid }
        dayDate: { type: string, format: date }

    NotificationStayAction:
      type: object
      required: [savedStayId]
      additionalProperties: false
      description: '`STAY_DETAIL`. 등록된 숙소 상세로 들어간다.'
      properties:
        savedStayId: { type: string, format: uuid }

    NotificationToggleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationToggle' }

    NotificationToggle:
      type: object
      required: [kind, pushEnabled, inAppEnabled]
      properties:
        kind: { type: string, enum: [STAY, TRIP_PRE, TRIP_DAY, SLOT_PRE, PLAN_B, REFLECTION, COMMUNITY] }
        pushEnabled: { type: boolean }
        inAppEnabled: { type: boolean, description: 끄면 알림함에도 쌓이지 않는다. `SYSTEM` 은 이 설정과 무관하게 항상 적재된다 }

    UpdateToggleRequest:
      type: object
      properties:
        pushEnabled: { type: boolean, nullable: true, description: 보내지 않으면 그대로 둔다 }
        inAppEnabled: { type: boolean, nullable: true, description: 보내지 않으면 그대로 둔다 }

    RegisterPushTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, maxLength: 255, description: 'Expo push token(DEC-U6-3). 길이는 UTF-16 단위(서버 @Size) — maxLength(코드 포인트)와 BMP 밖 문자에서 다르다' }
        deviceId: { type: string, maxLength: 64, nullable: true, description: '길이는 UTF-16 단위(서버 @Size) — maxLength(코드 포인트)와 BMP 밖 문자에서 다르다' }
        platform: { type: string, enum: [IOS, ANDROID] }
        osPermission:
          type: string
          enum: [GRANTED, DENIED, NOT_DETERMINED]
          default: NOT_DETERMINED
          description: 안 주면 `NOT_DETERMINED` — **모른다는 뜻이라 쏘지 않는다**.

    PushTokenResponse:
      type: object
      required: [platform, osPermission, deliverable]
      description: 토큰 자체는 돌려주지 않는다 — 클라이언트가 이미 갖고 있고 응답·로그에 흘릴 이유가 없다.
      properties:
        deviceId: { type: string, nullable: true }
        platform: { type: string, enum: [IOS, ANDROID] }
        osPermission: { type: string, enum: [GRANTED, DENIED, NOT_DETERMINED] }
        deliverable:
          type: boolean
          description: >
            이 기기에 **실제로 쏠 수 있는가**. 화면이 `권한 필요` 안내를 그릴 근거다 —
            등록에 성공했다는 것과 알림이 간다는 것은 다른 말이다.

  responses:
    ValidationError:
      description: 입력 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NicknameTaken:
      description: 닉네임 유니크 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SocialAuthFailed:
      description: 소셜 code 교환·토큰 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SocialEmailConflict:
      description: >
        소셜 이메일이 타 계정과 충돌. 계정을 만들지 않고 거부하며(BR-U0-04),
        본문 `error.existingProvider` 에 기존 가입 수단을 담아 안내한다(INV-A3).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AgeNotMet:
      description: >
        만 14세 미만 — 계정을 만들지 않는다(BR-U0-05). 입력·인증은 정상이고 **업무 규칙**에 걸린 것이라
        422 다. 연령확인 값 자체가 없으면 그건 입력 문제라 400 으로 갈린다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: 요청 한도 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PlaceSearchUnavailable:
      description: >
        장소 검색 벤더를 호출하지 못함(`error.code=UPSTREAM_UNAVAILABLE`). 빈 결과와 달리 재입력으로 풀리지
        않으므로 화면은 **핀 직접 지정 폴백**을 제시한다(BR-U1-23 · ADR-0011 침묵 실패 금지).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ModerationUnavailable:
      description: 모더레이션 서비스 일시 불가
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

