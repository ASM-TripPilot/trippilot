            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }

  /trips/{tripId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trips]
      summary: 여행 조회(소유자만 · 타 계정/삭제 404)
      responses:
