          application/json:
            schema: { $ref: '#/components/schemas/EditSavedStayRequest' }
      responses:
        '200': { description: 수정됨, content: { application/json: { schema: { $ref: '#/components/schemas/SavedStay' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 없음/타 계정 }
    delete:
      tags: [saved-stays]
      summary: 저장 숙소 삭제(소유자만)
      responses:
