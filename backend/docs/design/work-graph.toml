[[nodes]]
id = "BACKEND-AI-AUTH"
ticket = "TRIP-856"
title = "백엔드→AI 호출에 서비스 토큰 붙이기 (역방향 TRIP-393)"
status = "done"
migration = false
touches = [
  "backend/modules/itinerary-generation",
  "backend/modules/reflection",
  "docker-compose.yml",
]
note = """
잠긴 것은 AI→백엔드(`/internal/**`, fail-closed)뿐이고 **백엔드→AI 는 무인증**이다 —
`ScheduleAgentConfiguration.client()` 는 Authorization 헤더를 달지 않는다(회고 클라이언트도 동일).
`ai-backend-alternatives-연동-설계.md` §5 전제 2 가 범위 밖으로 명시하며 별건으로 끊자고 제안한 것.
붙일 때 fail-closed 로 가면 토큰 미설정 환경에서 generate 까지 죽는다 — 전환 순서 설계가 본체다.
SECURITY 계열. 2026-09-14 TRIP-856 으로 티켓화 — 기본안은 로컬 경고+진행, 배포 프로파일만 강제.

**우리 쪽 절반은 했다(2026-09-15, PR #533). 노드는 열어 둔다 — 채널이 아직 무인증이라서다.**
일정·회고 클라이언트가 `X-Service-Token` 을 싣는다(재계획·검증·수리·근거도 같은 클라이언트를
탄다). 시크릿은 `SERVICE_AUTH_TOKEN` 하나를 양방향 공용으로 썼다 — 갈라 두면 한 방향만 세팅된
절반 설정이 생긴다. 토큰이 비면 헤더를 **안 싣고 호출은 그대로 나간다**(fail-open); 잠그면
토큰 없는 로컬·CI 에서 generate 가 통째로 죽는다.

**남은 것은 상대의 수신 검증뿐이다** — `ai/src/trippilot/api/` 에 401·Bearer·헤더 검사가 하나도
없다(실측). 순서가 한 방향이라 클라이언트가 먼저 싣기 시작해야 상대가 켤 수 있고, 그래서
우리 쪽을 먼저 했다. AI 팀이 켜면 이 노드가 닫힌다.

**안 붙인 곳 하나**: `IntegrationController` 의 `{ai.url}/health` 핑. 헬스는 관례상 무인증이라
뺐지만, 상대가 전 경로에 일괄로 걸면 이 핑이 먼저 깨진다(증상 = `/integration` 이 degrade).


**우리 절반 닫힘(2026-09-16, PR #533).** 세 모듈(itinerary-generation·notification·reflection)이
`X-Service-Token` 을 싣는다. **AI 수신 검증은 [[AI-INBOUND-AUTH]](TRIP-878)로 쪼갰다** —
제목이 `[BE]` 라 이 티켓이 우리 절반만 가리키는데, 그대로 두면 남의 작업 때문에 영원히 안 닫힌다.
"""

