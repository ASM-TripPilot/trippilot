[[nodes]]
id = "TRIP-849"
ticket = "TRIP-849"
title = "날씨 실어댑터(KmaWeatherAdapter) — Plan-B 트리거가 가짜 날씨로 돌고 있다"
status = "done"
migration = false
touches = [
  "backend/modules/weather-context",
  "backend/app/src/main/resources/application.yml",
]
note = """
**정정(2026-09-16) — 키는 멀쩡하다. 아래 '22자' 진단은 틀렸다.**

실제로 호출해서 확인했다: `.env` 의 값(98자)을 **그대로** 보내면 403, **한 번 디코딩해서** 보내면
`HTTP 200 · resultCode=00 · NORMAL_SERVICE` 다. 즉 발급된 키는 유효하고, 들어 있는 것이
**Encoding 표기**(`%2B`·`%3D` 포함)인데 코드는 **Decoding 키**를 요구한다
(`kma_weather.py` — "service_key는 **디코딩 키** (urlencode는 HTTP 클라이언트 1회)").
Encoding 키를 넣으면 클라이언트가 한 번 더 인코딩해 `%2B` → `%252B` 가 되고 서버가 거절한다.
**재발급이 아니라 같은 키의 다른 표기를 넣으면 된다.**

**AI 조립도 이미 돼 있다** — `ai/main.py` 의 `_kma_weather()` 가 `WEATHER_API` 가 있으면
`KmaWeatherAdapter` 를 조립한다. 앞서 "조립이 안 돼 있다"고 적었던 것도 틀렸다(`ai/src/` 아래만
찾고 `ai/main.py` 를 안 봤다).

**그래서 이 노드의 실체는 키가 아니라 코드다** — 백엔드 `weather-context` 에는 Kotlin 실어댑터가
없고 `FakeWeatherAdapter` 뿐이며, Plan-B 트리거(`WeatherTriggerService`)가 그것을 본다.
`trippilot.weather.mode` 스위치는 application.yml·compose·.env.example 어디에도 없다.
AI 쪽은 키 표기만 고치면 켜지지만, 백엔드 Plan-B 는 그것과 별개다.

**착수 전 결정**: 같은 공공 API 를 Kotlin·Python 두 벌로 둘 것인가. 루트 CLAUDE.md 의
"one external API = one owning module = one adapter port" 와 부딪힌다. 대안은 백엔드가 AI 에
날씨를 묻는 것인데, 그러면 **배경 감지가 AI 가용성에 묶인다** — "조회 실패는 무발화"(BR-U4-05)와
맞물려 비 오는 날 아무 일도 안 일어나는 결과가 된다.

---

**아래는 2026-09-15 시점의 기록이며 키 관련 부분은 위에서 정정됐다.**

**차단(2026-09-15 실측) — 키가 없다.** `.env` 의 `WEATHER_API` 로 기상청 단기예보를 호출하면 **403** 이다.
키가 22자 평문인데 공공데이터포털 인증키는 보통 40자 이상이라 **다른 서비스 키**로 보인다.
티켓도 키 발급을 선행 1번으로 잡았다. 공공데이터포털에서 *기상청_단기예보 조회서비스* 활용신청 후
일반 인증키(Decoding)를 `.env` 에 넣으면 재개한다. 격자 변환식만 먼저 넣는 것도 가능하나
**쓰는 데가 없으면 죽은 코드**라 함께 미뤘다.

어댑터가 Fake 하나뿐이고 matchIfMissing=true 라 실사용 기본도 가짜다 — 날씨 트리거의 근거가
격자 키 해시값이다. 모드 스위치 6종 중 유일하게 **켤 실물이 없는** 항목. 공공데이터포털 키 발급
(외부·시간 소요)을 먼저 걸어 둘 것. 선례는 KakaoRegionGeocodeAdapter(모드 조건+Announcer+기동 차단).
850 과 application.yml 을 다툰다.


**닫힘(2026-09-16, PR #554).** `KmaWeatherAdapter` + `KmaGrid`(LCC 변환) 신설, `WEATHER_MODE` 스위치 개통.
실 왕복 확인 — 제주 격자(53,38) 강수확률 20%. 실측으로 둘을 잡았다: 인증키의 `+` 를 `queryParam` 에
맡기면 서버가 공백으로 읽어 403, 그리고 **발표 날짜가 아니라 묻는 날짜로 골라야 한다**(자정 직후엔 전날
23시 발표분이 와서 발표 날짜로 거르면 오늘 값이 하나도 안 잡힌다).
"""

