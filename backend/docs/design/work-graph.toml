# 백엔드 남은 작업 그래프 — 노드·간선 정본
#
# ## 왜 파일로 두나
#
# 착수 순서를 표로 적어 두면 **다시 계산이 안 되고, 검증했는지가 기록되지 않고, 파일 충돌을
# 사람 기억에 의존한다.** 티켓 하나가 늘 때마다 표 전체를 손으로 다시 짜야 한다.
# 여기 적어 두면 `backend/scripts/work_graph.py` 가 층·충돌·mermaid 를 계산해 낸다.
#
# ## 노드는 티켓이 아니라 **머지 가능한 최소 단위(PR 하나)** 다
#
# 이 리포에서 실측으로 둘 다 나왔다 — 코드는 다 됐는데 열려 있는 티켓, 티켓 없이 코드 주석에만
# 있는 구멍. 그래서 `ticket` 은 비어 있을 수 있고, 그것이 정상이다(지금 넷이 그렇다).
#
# ## 간선은 **티켓 원문으로 확인한 것만** 싣는다
#
# 첫 판에서 "둘 다 계정 설정이니 저장소를 다투겠지" 같은 추측으로 간선을 그었다가, 티켓 원문에
# `선행조건: 없음` 이 박혀 있는 것을 보고 지웠다. **모듈이 가깝다는 것은 선행의 근거가 아니다.**
# 남은 간선이 둘뿐인 것이 이 그래프의 결론이다 — 대부분 독립이고, 진짜 제약은 공유 자원이다.
#
# ## 자원 배타는 간선이 아니다
#
# 같은 파일·같은 Flyway 번호를 만지는 관계에는 순서가 없다 — 먼저 손댄 쪽이 이긴다. 그걸 간선으로
# 적으면 없는 순서가 생겨 층이 왜곡된다(실제로 TRIP-361 이 근거 없이 층 1로 밀렸다).
# `touches` 에 적어 두면 스크립트가 층별로 파생해 준다.
#
# ## touches 는 **예상**이다
#
# 착수 전에는 실제 diff 를 모른다. 자원 배타를 기계가 잡게 하려고 적어 두는 값이고, 착수해서
# 실제 편집 범위가 달라지면 그때 고친다. 티켓이 「관련 파일」을 적어 둔 것은 그대로 옮겼다.
#
# ## verified = 이 파일의 값어치
#
# 간선을 주장만 하고 확인하지 않은 상태가 눈에 보여야 한다. 확인 방법은 역검증과 같다 —
# **간선을 끊고 후행을 빌드해 실제로 깨지는가.** 안 깨지면 그 간선은 상상이었으니 지운다.
#
# 갱신: 2026-09-01 · TRIP-536 처방 머지(#414). 남은 층 0 은 여섯이고 그 중 셋이 마이그레이션을 다툰다

# ─────────────────────────────────────────────────────────────────────────────
# 우리 몫
# ─────────────────────────────────────────────────────────────────────────────

