[[nodes]]
id = "TRIP-361"
ticket = "TRIP-361"
title = "trip_destination region_code 전환 (계약 변경)"
status = "done"
migration = true
touches = [
  "backend/app/src/main/resources/db/migration",
  "backend/modules/trip",
  "backend/docs/design/openapi.yaml",
]
note = """
티켓의 선행조건은 '1번 칸(행정구역 카탈로그)'인데 **이미 있다** — V2.24__region_catalog.sql ·
R__seed_region_catalog.sql 실측. 그래서 선행 간선이 없다.

**착수 시 실측 3건(2026-09-01):**

1. **티켓이 '완료'인데 백엔드는 미구현이었다.** trip_destination 은 V2.3 이후 한 번도 안 건드려졌고
   region varchar(60) 자유 문자열 그대로였다. 형제(357·358·359·360·363·364)가 전부 실제 완료라
   에픽 자식을 일괄로 닫으며 함께 닫힌 것으로 보인다.
2. **티켓의 주된 근거가 이미 다른 방법으로 해소돼 있었다.** "부산 하나를 지우려다 부산 전부를
   잃는다"는 TRIP-364 가 `seq` 로 고쳤다(tripWizardStore.ts 주석). 코드 전환이 아니었다.
3. **경계에서 코드를 버리고 있었다.** GET /regions 는 이미 regionCode 를 주는데 POST /trips 는
   이름만 받는다. 그래서 RegionLookupService.centerOf 가 findExact(name).firstNotNullOfOrNull 로
   동명이지역 중 하나를 임의로 집는다 — 부산 중구를 고르면 서울 중구 좌표가 앵커가 될 수 있다.

**결정(2026-09-01): 내부 정규화만. 계약은 안 바꾼다.** openapi·FE codegen·승인된 테스트가 안 움직인다.
카탈로그 조인과 표기 정규화 이득은 지금 가져가고, 계약 전환은 FE 가 준비될 때 별건으로.

**정본 이탈**: 티켓 AC 는 "region_code 가 NULL 인 행이 남지 않는다"인데 NULL 을 허용했다.
이름만 받는 동안에는 동명이지역(selectable 237개 중 7개 이름·26개 지역 — 중구5·동구5·서구4·
남구4·북구4·강서구2·고성군2)을 원리적으로 해소할 수 없다. 사유는 마이그레이션 주석·도메인 KDoc·
PR 본문 세 곳에 남겼다.

**남은 구멍**: 위 3번(centerOf 임의 선택)은 이 칸이 못 고친다 — 계약이 코드를 받아야 닫힌다.
"""

[[nodes]]
id = "PERSONA-API"
ticket = ""
title = "AI 가 재조회할 페르소나 표면 — /internal/users/{accountId}/persona (TRIP-434 의 선행)"
status = "done"
migration = false
touches = [
  "backend/modules/profile/src/main/kotlin/com/trippilot/profile/adapter/in/web/PersonaInternalController.kt",
]
note = """
**티켓이 없다.** TRIP-434(AI) 가 "선행: 백엔드에 페르소나 API가 존재해야 함"이라고 적어 두었으므로
막고 있는 쪽은 우리다. 처음엔 방향을 반대로 그렸다가 원문을 보고 뒤집었다.

**이 노트의 앞선 판은 두 군데가 틀렸다(실측으로 교정).**

1. "재료는 /me/personalization" — 아니다. 그것은 **사용자에게 "무엇을 넘겼는가"를 알리는 공시
   표면**(BR-U5-45, reflection 소관)이다. 실제 재료는 profile 의 preference_set 이고
   PreferenceFacade.findPreferences(accountId) 가 이미 api-safe 스냅숏으로 노출하고 있었다.
2. "실체는 인증 경계 결정" — 아니다. 그 결정은 TRIP-393 에서 **이미 끝났다**. /internal 하위는
   ServiceAuthenticationToken.ROLE 을 요구하고 사용자 JWT 로는 못 통과하며 /internal/pois 가
   그 형태로 돌고 있었다. 실제 결정은 **응답 어휘**였다.

봉투로 대체할 수 없다 — AI 의 PersonaProvider 는 BR-U4-07("프롬프트 값은 요청자 권한 하에
재조회한 것만")에 따라 ttl_sec=0 으로 매 요청 다시 읽는다. 호출자가 준 값은 규칙이 배제한다.

결정(2026-09-01): **계정 단위 + 우리 어휘 그대로.**
어휘를 우리가 AI enum 으로 접으면(부모님→?, 럭셔리→HIGH, 동행 다중→단일) 그 판단을 백엔드가
떠안고 AI enum 이 바뀔 때마다 따라 고쳐야 한다. generate 봉투의 preference_profile 이 이미
우리 어휘를 그대로 싣는 관례라 필드 이름도 그 스키마에 맞췄다.

남은 것은 AI 쪽 작업이다(TRIP-434) — ContextStore 실구현체가 이 경로를 부르고 PersonaSummary
로 변환한다. 이 노드는 그 선행만 푼다.
"""

