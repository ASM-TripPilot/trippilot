[[nodes]]
id = "UUID-PATH-400"
ticket = ""
title = "UUID 경로변수가 잘못된 값에 500 — 전역 타입변환 실패를 400 으로"
status = "done"
migration = false
touches = [
  "backend/app/src/main/kotlin/com/trippilot/app/web/error/GlobalExceptionHandler.kt",
]
note = """
**실측(2026-09-01)**: `GET /api/v1/trips/not-a-uuid` → `500 INTERNAL`. Spring 의 경로변수 타입변환
실패는 MethodArgumentTypeMismatchException 인데 전역 핸들러가 그것을 모르고 Exception 갈래로
떨어진다. UUID 경로변수를 쓰는 **모든** 엔드포인트가 같다.

TRIP-249 3번(미매핑 경로 500)과 **같은 실패 형태**다 — 클라 입력 오류를 서버 장애로 알리면
프론트·AI 의 재시도·폴백이 5xx 기준으로 갈려 잘못된 갈래를 탄다.

**착수 후 실측으로 범위가 넓어졌다** — 타입 불일치만이 아니라 **필수 쿼리 누락**도 500 이었다
(`/internal/pois` 에서 radiusKm 을 빼면 500). 둘 다 스프링의 파라미터 바인딩 단계 예외라
같은 자리에서 함께 잡았다.

PERSONA-API 의 국소 회피(경로변수를 String 으로 받아 직접 파싱)는 이 노드에서 걷어냈다 —
전역이 잡으므로 중복이다. 역검증에서 전역 핸들러를 빼면 PersonaInternalApiIT 의 400 테스트가
함께 깨져 실제로 전역에 의존함이 확인된다.

계약: 경로별 400 을 39곳에 흩뿌리지 않고 openapi info.description 에 횡단 규약으로 적었다 —
형식 오류까지 중복 선언하면 무엇이 그 엔드포인트 고유의 업무 검증인지 안 보인다.
"""

[[nodes]]
id = "FLAKY-HEALTHPING"
ticket = ""
title = "IntegrationHealthPingTimeoutTest 가 전체 빌드 부하에서만 간헐 실패"
status = "todo"
migration = false
touches = [
  "backend/app/src/test/kotlin/com/trippilot/app/web/IntegrationHealthPingTimeoutTest.kt",
]
note = """
**실측(2026-09-01, UUID-PATH-400 작업 중)**: 전체 빌드에서 1회 실패.
`SocketException: Connection reset is of type ... but expected SocketTimeoutException`
(`thrown.cause.shouldBeInstanceOf<SocketTimeoutException>()`, 45행)

- 격리 실행 `--rerun-tasks` 3회 **전부 통과**
- 같은 코드로 직전 전체 빌드는 통과 — 회귀가 아니다
- 이 노드를 만든 변경(전역 예외 핸들러)과 무관한 영역이다

**원인은 아직 단정하지 못했다.** 테스트는 `ServerSocket(0)` 을 열고 별도 스레드가 accept 만 하며
한 바이트도 쓰지 않는 상황을 만든다. 부하가 걸리면 클라이언트 연결과 accepter 스레드 기동이
경합하는 구조인데, 그것이 RST 로 이어지는 경로를 실제로 재현하지는 못했다.

**재현 시도 2 실패 — 가설이 하나 더 지워졌다(2026-09-16).** 이번 축은 **병렬 소켓 경합**이었다
(스레드 8개 × 150회 = 1200회를 동시에 돌려 포트 재사용·backlog 압력을 만들었다). 결과는
**1199/1200 정상 타임아웃** — `Connection reset` 이 한 번도 안 나왔다.

나머지 1건은 `IllegalArgumentException` 이었다(하네스가 URI 를 만드는 자리). **단서일 수도 있어
적어 둔다** — 경합 중에 `ServerSocket.localPort` 가 `-1` 로 읽혔다면 소켓 수명이 예상과 다르게
움직였다는 뜻이고, 그건 RST 가설과 인접하다. 다만 내 하네스 쪽 결함일 가능성이 더 크고
(공유 리스트·반복 생성), 확인하지 않았으므로 **가설로만 남긴다.**

지금까지 지워진 것 둘:
1. 클라이언트 쪽 CPU 부하(시도 1, 2026-09-15) — 단일 JVM 1200회 + 5코어 점유
2. 병렬 소켓 경합·포트 재사용(시도 2) — 8스레드 동시 1200회

**남은 축이 하루 사이에 좁아졌다.** 같은 "전체 빌드에서만" 부류였던 `FLAKY-OUTBOX-RELAY` 는
원인이 밝혀져 닫혔다(배경 `@Scheduled` 의 기동 직후 1회 발화 — PR #537). 그 간섭원이 사라진
뒤에도 이 flake 가 남는지는 **아직 관측하지 못했다** — 다음 시도 전에 먼저 확인할 것.
둘이 같은 원인이었다면 이미 해소됐을 수도 있다.

**남은 축은 "전체 빌드에만 있는 것"이다.** 같은 JVM 안에서 Testcontainers 의 커넥션 churn,
스프링 컨텍스트 여럿, 그 사이에 끼는 이 소켓 — 이것을 흉내 내려면 `:app:test` 전체를 반복
실행해야 해서 시도당 비용이 크다(회당 ~7분). 다음 시도는 그 비용을 받아들이고 반복 횟수를
정해서 들어간다.

**코드에서 유일하게 식별된 RST 원천**: `finally` 의 `held.forEach { it.close() }` — 수신 버퍼에
읽지 않은 요청이 남은 소켓을 닫으면 FIN 이 아니라 **RST** 가 나간다. 다만 그 시점은 단언 뒤라
현재 실패를 설명하지 못한다. 재현되면 여기부터 본다.

단정하지 말 것: 재현 없이 "타임아웃도 허용"으로 단언을 넓히면 **연결 거부와 타임아웃을 가르는
이 테스트의 목적 자체가 사라진다**(주석 44행이 그 구분을 명시한다). accepter 준비를 래치로
동기화한 뒤 부하를 흉내 내 재현하는 것이 먼저다.

**재현 시도 1 실패 — 가설 하나가 지워졌다(2026-09-15).** 같은 소켓 시나리오를 한 JVM 안에서
**1200회 반복**하며 CPU 5코어를 점유시켜 돌렸다. 결과는 **1200/1200 전부 정상 타임아웃** —
RST 가 한 번도 안 나왔다. 즉 **"클라이언트 쪽 CPU 부하가 accepter 기동을 밀어내 RST 가 된다"는
가설은 틀렸다.** 단순 부하로는 못 만든다.

남은 가설은 **전체 빌드에만 있는 조건** 쪽이다 — 테스트 JVM 여러 개가 동시에 돌며 소켓·포트
테이블을 함께 쓰는 상황(내 하네스는 단일 JVM·순차 소켓이었다). 다음 시도는 부하가 아니라
**병렬 JVM 과 소켓 고갈**을 흉내 내야 한다.

여전히 단언을 넓히지 말 것. 재현 없이 "타임아웃도 허용"으로 가면 이 테스트의 목적이 사라진다.
"""

