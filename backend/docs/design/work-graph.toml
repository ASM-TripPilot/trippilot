[[nodes]]
id = "TRIP-536"
ticket = "TRIP-536"
title = "현재 일정을 고르는 규칙이 없다 — 여행당 1행 제약 부재 + 정렬 없는 firstOrNull (16곳)"
status = "todo"
migration = true
touches = [
  "backend/app/src/main/resources/db/migration",
  "backend/modules/itinerary-generation",
]
note = """
**한때 닫으려 했다가 철회한 노드다.** PR #379(ItineraryApiIT 의 awaitComplete 누락)로 해결됐다고
봤는데, 그건 한 사례였고 간섭 자체는 살아 있다.

실측(2026-08-31): 현재 develop **같은 커밋에서 1회 통과 / 2회 실패**. 희생자가 실행마다 바뀐다 —
CI 는 ReplanApiIT:111, 로컬은 ItineraryApiIT(없는 슬롯에 404 대신 **409**).
단독 실행은 통과하고 전체 스위트에서만 깨진다. TZ·시각은 배제했다(CI 와 같은 UTC·같은 시각에
로컬 단독 실행 통과, 결과 XML 로 실제 실행 확인).

원인 후보: `itinerary` 에 여행당 1행 제약이 없는데(V2.7 PK 는 itinerary_id 뿐), "현재 일정"을
고르는 코드가 **정렬 없이** `findByTrip(tripId).firstOrNull()` 을 쓴다 — 그런 자리가 16곳이고
JPA `findByTripId` 에도 OrderBy 가 없다. 행이 둘인 창은 실재한다(@Async replaceIfCurrent 의
DELETE→INSERT 구간). 어느 행이 먼저 오는지는 Postgres 가 보장하지 않는다.

**테스트만의 문제가 아니다** — 같은 경로를 사용자 요청도 탄다. 창에 조회가 들어오면 사용자가
낡은 일정을 받고, 예외도 로그도 없다.

처방 후보: (1) 여행당 1행을 유니크 인덱스로 못 박는다 — 창이 생기면 INSERT 가 실패해 드러난다.
(2) `findByTrip` 에 정렬을 넣어 16곳이 같은 행을 보게 한다. 1이 근본, 2가 방어다.
어느 쪽이든 **행이 둘인 상태를 만드는 IT** 가 함께 있어야 한다 — 지금은 그 상태를 만드는
테스트가 없어 모든 게이트가 초록이었다.
"""

