단독 실행은 통과하고 전체 스위트에서만 깨진다. TZ·시각은 배제했다(같은 UTC·같은 시각에 단독 실행
통과, 결과 XML 로 실제 실행 확인).

원인: `SlotCandidateService:61` 이 `generationState == PARTIAL` 이면 409 "일정 생성이 진행
중입니다"를 던진다. 비동기 2차 생성이 끝나기 전에 테스트가 요청하면 404 를 기대한 자리에 409 가 온다.

⚠ **한 번 오진했다.** "itinerary 에 여행당 1행 제약이 없어 조회가 아무거나 집는다"고 적었으나
`V2.10__itinerary_trip_unique.sql` 이 `uq_itinerary_trip UNIQUE (trip_id)` 를 이미 걸어 두고
있었다(TRIP-267). V2.7 의 일반 인덱스만 보고 단정한 결과다 — **마이그레이션은 전수로 확인한다.**
그때 넣었던 중복 유니크(V2.42)와 findByTrip 정렬은 되돌렸다. 대신 제약의 존재를 직접 묻는
테스트(ItineraryOnePerTripIT)는 남겼다 — 2.10부터 있던 제약에 확인 테스트가 없었고, 그 공백이
오진을 가능하게 했다.

처방(PR #414, 머지됨): 낡은 전제를 믿던 두 자리를 고쳤다 — `슬롯 키 형식이…` 에 awaitComplete 추가,
ReplanApiIT.generate 가 마무리까지 대기. 그리고 원인의 절반이던 tripOneDay 주석을 사실로 바꿨다
("2차 없이 즉시 COMPLETE" → TRIP-511 이후 하루 여행도 PARTIAL 이다).

⚠ 재계획은 PARTIAL 을 막지 않으므로 ReplanApiIT:111 의 정확한 기전은 **단정하지 않았다.**
전체 스위트 5회 연속 초록으로 관측되지만, 확률적 실패라 "없다"의 증명은 아니다.
"""

