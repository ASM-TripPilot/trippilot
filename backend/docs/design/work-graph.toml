[[nodes]]
id = "REGION-CODE-ANCHOR"
ticket = ""
title = "받은 목적지 코드로 앵커를 잡는다 — 이름 임의 선택의 나머지 절반 (TRIP-859 후속)"
status = "done"
migration = false
touches = [
  "backend/modules/trip/src/main/kotlin/com/trippilot/trip/api",
  "backend/modules/place-data/src/main/kotlin/com/trippilot/placedata/api/RegionLookupFacade.kt",
  "backend/modules/itinerary-generation/src/main/kotlin/com/trippilot/itinerarygeneration/application/GenerateItineraryService.kt",
]
note = """
**티켓이 없다.** TRIP-859(PR #530)가 목적지 코드를 **받아 저장하는 데까지** 했고, 이것이 그 코드를
실제로 쓰게 만드는 나머지다. 검수(2026-09-15)에서 드러났다 — 티켓 제목이 "동명이지역 임의 선택
해소"인데 정작 임의로 고르는 자리가 안 닫혀 있었다.

**남은 구멍의 정확한 위치**: `GenerateItineraryService.kt:307` 의
`destinations.firstNotNullOfOrNull { regions.centerOf(it) }` → `findExact(이름).firstNotNullOfOrNull`.
부산 중구 여행이 regionCode 를 제대로 들고 있어도 **앵커는 서울 중구 좌표를 집을 수 있다.**
거점(숙소)이 없는 날의 폴백이라 범위는 좁지만, 지어낸 좌표가 아니라 **다른 지역의 좌표**라
증상이 "일정이 엉뚱한 동네에서 돈다"로 나온다.

**왜 #530 에 못 넣었나 — 3개 모듈이다.**
1. `TripGenerationContext.destinations` 가 `List<String>`(이름뿐)이라 trip 의 `..api..` 계약을 바꿔야 한다
2. place-data 에 코드로 중심을 찾는 파사드를 연다(`centerOf` 는 이름만 받는다)
3. itinerary-generation 의 앵커 조립이 코드를 먼저 보고, 없을 때만 이름으로 떨어진다

**이름 정합 검사는 대안이 아니다.** 서버에 정본 표시명이 없어(`GET /regions` 가 `name`·`sidoName` 을
따로 주고 표시는 클라가 조립) 이름으로 코드를 검증하면 **같은 이름·다른 시도**를 원리적으로 못 가른다 —
`PoiEntity` 주석의 "시군구명은 유일하지 않다"와 같은 결론이다. 코드를 믿는 것만이 해소다.

선행: TRIP-859(PR #530) 머지.


**닫힘(2026-09-16, PR #550).** `TripDestinationRef(name, regionCode)` 로 trip `..api..` 계약을 넓히고
(`destinations` 는 파생 프로퍼티로 유지 — 기존 호출부 불변), `RegionLookupFacade.centerOfCode` 를 열고,
규칙 자체를 `RegionAnchors.centerOf` 로 빼 **테스트와 생산이 같은 것을 부르게** 했다(규칙을 테스트에 다시
적으면 생산 순서가 뒤집혀도 자기 사본을 보고 통과한다).
"""

