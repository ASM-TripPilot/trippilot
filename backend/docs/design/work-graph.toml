note = """
**해소(2026-09-15, PR #537).** 가설이 맞았다 — **계측으로 확인했다.** `relay()` 진입에 임시 로그를
붙여 `OutboxRelayIT` 를 돌리니 호출 15회 중 1회가 `scheduling-1` 스레드였다.

원인은 처방이 애초에 작동한 적이 없다는 것이었다. 테스트 설정이 주기를 1시간으로 늘려 "껐다"고
적어 두었지만 **`fixedDelay` 는 기동 직후 1회를 막지 못한다.** `initialDelayString` 을 붙이고
테스트에서 첫 발화도 미루자 계측에서 그 호출이 0회가 됐다(운영 기본값 0 — 동작 무변경).

**같은 함정이 셋이었다.** 테스트 설정이 "끈다"고 적어 둔 여행 종료 스위퍼·리마인드 폴러도 구조가
같아 함께 고쳤다. 둘은 아직 안 깨졌을 뿐이다.

**실측(2026-09-15, 10건 일괄 머지 중)**: 전체 빌드 3회 중 1회 실패. 두 테스트가 함께 깨진다 —
`발행하면 아웃박스에 적재되고 릴레이가 구독자에게 배달한다`(expected 1 but was 0)와
`배달에 성공하면 적재부터 배달까지의 지연이 기록된다`(expected true but was false).
격리 실행 `--rerun-tasks` 는 통과한다. 코드 회귀가 아니다.

**깨지는 자리가 단서다.** 첫 테스트는 `relay()` 를 부르기 **전**의 단언에서 깨진다
(`unpublished("배달") shouldBe 1`). 즉 발행 직후 이미 누군가 그 행을 집어갔다는 뜻이고,
테스트가 쓰는 "내 행이 발행될 때까지 돌린다" 관용구로는 막을 수 없는 종류다.

**유력한 원인**: `@Scheduled` 릴레이가 테스트 컨텍스트에서도 산다(`AsyncConfig` 의
`@EnableScheduling`). 테스트 설정이 주기를 1시간(`relay-delay-ms: 3600000`)으로 늘려 두었지만
**fixedDelay 는 컨텍스트 기동 직후 1회 발화한다** — 서로 다른 설정의 스프링 컨텍스트가 여럿이라
그 발화가 다른 테스트 도중에 겹칠 수 있다. IT 가 늘수록 컨텍스트도 늘어 확률이 오른다.

**단정하지 말 것.** 위는 재현으로 확인한 것이 아니라 증상과 코드에서 좁힌 가설이다. 처방 후보는
(가) 테스트 프로파일에서 스케줄링만 끄기(`spring.task.scheduling` 비활성 또는 조건부 `@Scheduled`),
(나) 릴레이 빈을 테스트에서 수동 호출 전용으로 두기. 어느 쪽이든 **먼저 재현**하고 고른다 —
확률이 1/3 이라 반복 실행으로 재현 가능한 편이다.

같은 부류: `FLAKY-HEALTHPING`. 둘 다 "전체 빌드에서만 빨개지는" 형태라 재실행으로 넘기면 영영 못 찾는다.
"""

[[nodes]]
id = "JWT-SIGNING-KEY"
ticket = ""
title = "JWT 서명키가 기동마다 새로 생성된다 — 다중 인스턴스에서 서로의 토큰을 못 읽는다"
status = "done"
migration = false
touches = [
  "backend/common/security/src/main/kotlin/com/trippilot/security/JwtSecurityConfig.kt",
  "backend/app/src/main/resources/application.yml",
]
note = """
**티켓이 없다.** 코드 주석에만 있던 것을 2026-09-15 코드 훑기에서 찾았다
(`JwtSecurityConfig.kt` — "prod 는 Secrets Manager 에서 JWK 로드로 교체(PD-3) … TODO(TRIP-153 후속)").

**현재 동작**: `rsaKey()` 가 **환경 분기 없이** 기동할 때마다 RSA-2048 키페어를 새로 만든다.
주석은 "dev/test 는" 이라고 적었지만 코드에는 그 조건이 없다 — 운영에서도 같다.

**무엇이 잘못되나 — 둘의 무게가 다르다.**

1. **다중 인스턴스에서 치명적이다.** A 가 서명한 액세스 토큰을 B 가 검증하지 못해 **요청마다
   무작위 401** 이 난다. 클라이언트가 리프레시로 새 토큰을 받아도 다음 요청이 또 다른 인스턴스로
   가면 같은 일이 반복된다. 복제본을 둘 이상 띄우는 순간 로그인이 사실상 깨진다.

   **지금 당장 나는 증상은 아니다** — U6 NFR §10 이 "현재 로컬 단일 인스턴스"라고 적어 두었다.
   다만 REL-U6-04 가 그 전환을 **대비해** ShedLock 을 이미 깔아 둔 것처럼, 이것은 전환을 **막는**
   쪽이다. 복제본을 늘리려는 날 이 하나 때문에 못 늘린다.
2. **재배포마다 액세스 토큰이 무효가 된다** — 다만 리프레시 토큰은 JWT 가 아니라 DB 행이라
   (`RefreshSessionJpaEntity`) 재발급으로 회복된다. 401 을 리프레시로 처리하는 클라이언트라면
   대체로 보이지 않는다. 이쪽은 성가심이지 차단이 아니다.

**TRIP-850(실사용 모드 전환)이 덮지 않는다.** 그 티켓은 "스위치 6종의 환경별 값"이고 이것은
스위치가 아니라 **설정 표면 자체가 없는 기능**이다. 켜고 끌 값이 없다.

**처방의 갈림길**(착수 시 결정): 외부 시크릿 저장소(Secrets Manager)에서 JWK 로드 vs 환경변수로
PEM/JWK 주입. 후자가 싸고 이 리포의 다른 시크릿 관례(`SERVICE_AUTH_TOKEN` 등)와 같은 모양이다.
어느 쪽이든 **로드 실패 시 fail-fast** 여야 한다(LC-6) — 조용히 생성으로 떨어지면 지금과 같아진다.


**닫힘(2026-09-16, PR #544).** `JwtSigningKeys` 신설 — base64(PKCS#8) 주입, 비어 있으면 종전대로
기동 시 생성하되 **경고**, `JWT_REQUIRE_CONFIGURED_KEY=true` 면 fail-fast. 환경변수 주입 방식으로 갔다.
덫 하나를 실측으로 잡았다 — `${JWT_REQUIRE_CONFIGURED_KEY:-}` 처럼 기본값을 비우면 빈 문자열이
Boolean 에 바인딩돼 기동이 깨진다. `:-false` 로 두고 compose 를 읽는 테스트로 못 박았다.
"""

