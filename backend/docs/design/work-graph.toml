# 백엔드 남은 작업 그래프 — 노드·간선 정본
#
# ## 왜 파일로 두나
#
# 착수 순서를 표로 적어 두면 **다시 계산이 안 되고, 검증했는지가 기록되지 않고, 파일 충돌을
# 사람 기억에 의존한다.** 티켓 하나가 늘 때마다 표 전체를 손으로 다시 짜야 한다.
# 여기 적어 두면 `backend/scripts/work_graph.py` 가 층·충돌·mermaid 를 계산해 낸다.
#
# ## 노드는 티켓이 아니라 **머지 가능한 최소 단위(PR 하나)** 다
#
# 이 리포에서 실측으로 둘 다 나왔다 — 코드는 다 됐는데 열려 있는 티켓, 티켓 없이 코드 주석에만
# 있는 구멍. 그래서 `ticket` 은 비어 있을 수 있고, 그것이 정상이다(지금 넷이 그렇다).
#
# ## 간선은 **티켓 원문으로 확인한 것만** 싣는다
#
# 첫 판에서 "둘 다 계정 설정이니 저장소를 다투겠지" 같은 추측으로 간선을 그었다가, 티켓 원문에
# `선행조건: 없음` 이 박혀 있는 것을 보고 지웠다. **모듈이 가깝다는 것은 선행의 근거가 아니다.**
# 남은 간선이 둘뿐인 것이 이 그래프의 결론이다 — 대부분 독립이고, 진짜 제약은 공유 자원이다.
#
# ## 자원 배타는 간선이 아니다
#
# 같은 파일·같은 Flyway 번호를 만지는 관계에는 순서가 없다 — 먼저 손댄 쪽이 이긴다. 그걸 간선으로
# 적으면 없는 순서가 생겨 층이 왜곡된다(실제로 TRIP-361 이 근거 없이 층 1로 밀렸다).
# `touches` 에 적어 두면 스크립트가 층별로 파생해 준다.
#
# ## touches 는 **예상**이다
#
# 착수 전에는 실제 diff 를 모른다. 자원 배타를 기계가 잡게 하려고 적어 두는 값이고, 착수해서
# 실제 편집 범위가 달라지면 그때 고친다. 티켓이 「관련 파일」을 적어 둔 것은 그대로 옮겼다.
#
# ## verified = 이 파일의 값어치
#
# 간선을 주장만 하고 확인하지 않은 상태가 눈에 보여야 한다. 확인 방법은 역검증과 같다 —
# **간선을 끊고 후행을 빌드해 실제로 깨지는가.** 안 깨지면 그 간선은 상상이었으니 지운다.
#
# ## 착수해 보면 노드가 쪼개진다 — 그때 원 노드를 닫고 잔여를 새 노드로 잇는다
#
# 한 티켓 안에 **지금 할 수 있는 것과 남을 기다리는 것**이 섞여 있는 일이 잦다. 실측으로 셋이 그랬다 —
# 836(재계획 재적재는 우리 버그, 문구 채움은 AI 계약 대기) · 834(배선은 코드, 실왕복은 사람·기기) ·
# B-4(구독은 지금, 컬럼은 채우는 쪽이 생긴 뒤). 섞인 채로 두면 **티켓이 영원히 안 닫히고**, 그래프는
# "아직 아무것도 안 했다"고 말한다. 쪼개서 된 쪽을 닫고 잔여를 새 노드(`REMINDER-COPY-AI`·
# `PUSH-LIVE-CHECK`)로 잇는다 — 닫은 노드의 note 에 **누가 잇는지**를 반드시 적는다.
#
# ## 스택 PR 은 CI 가 자동으로 안 붙는다 (운영 주의)
#
# 워크플로 트리거가 `pull_request: branches: [develop]` 이라 **base 가 develop 이 아닌 PR** 은
# 체크가 하나도 안 달린다. 위 바퀴들처럼 PR 을 쌓으면 대부분이 여기 해당한다. 수동으로 태운다:
# `gh workflow run backend-ci.yml --ref <branch>`. 이걸 모르면 "체크 없음"을 통과로 읽는다.
#
# 갱신: 2026-09-15 · a~g 바퀴 실행분 반영 — 완료 7건(843·844·846·848·857·859계약·재계획어휘)에
# 더해, 쪼개서 닫은 것 셋(845·834·836)까지 29건이 done 이다. 남은 우리 몫 12건 중 **넷은 우리가
# 못 여는 문(849 날씨키 403 · 847 법무·신고 · 850 실물 산출물 대기 · PUSH-LIVE-CHECK 실기기)** 이고,
# 지금 코드로 착수 가능한 것은 856(역방향 토큰)·858(Apple JWKS)·REPLAN-BOUNDARY 쪽이다.
#
# 이전 갱신: 2026-09-14 · 실사용 준비 티켓 일괄 발행(TRIP-834·843~850·854~860) 반영. 티켓 없던 노드
# 넷이 티켓을 얻었고(APPLE-JWKS→858 · BACKEND-AI-AUTH→856 · TRIP-361-CONTRACT→859 ·
# PUSH-ANDROID-CHANNEL→860), AI-ALTERNATIVES 의 질문은 전용 재계획 경계 설계 확정으로 해소됐다.

# ─────────────────────────────────────────────────────────────────────────────
