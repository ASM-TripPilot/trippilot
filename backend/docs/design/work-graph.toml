ticket = "TRIP-836"
title = "리마인드 문구 AI 채움 — 채움 서비스·wire·컬럼 (836 잔여)"
status = "done"
migration = true
touches = [
  "backend/modules/notification/src/main/kotlin/com/trippilot/notification/application",
  "backend/app/src/main/resources/db/migration",
]
note = """
**836 을 셋으로 쪼갠 나머지.** 재계획 구독(실제 버그)은 PR #528 로 끝났고, 여기 남은 것은
문구 채움 서비스 + AI wire + `notification_schedule.title/body` 컬럼·발화 분기다.

**계약이 열렸다(2026-09-16 실측) — 차단 해소.** `ai/docs/openapi.json` 에
`POST /ai/v1/notification/copies` 가 실재한다. 계약 모양:

- 요청 `ReminderCopyRequest` — `items`(필수) · `request_meta`(필수) · `trip_title`
- 항목 `ReminderCopyItemSchema` — `schedule_key`·`kind`·`date`(필수) · `slots`
- 응답 `ReminderCopyResponse` — `copies`(필수) · `degraded`(필수) · `fallback_mode`
- 문구 `ReminderCopySchema` — `schedule_key`·`title`·`body` 전부 필수

**`schedule_key` 가 맞물림의 전부다** — 요청 항목과 응답 문구를 잇는 키라, 우리 예약 행과 같은
값이어야 문구가 제자리에 붙는다. 슬롯키 규약(`{date}#{poiId}`)과 다른 축이니 착수 시 확인한다.
`degraded` 가 오면 상대가 규칙 문구로 내려간 것이므로 **AI 문구로 표시하지 않는다**(회고 `source` 선례).

**이전 기록(2026-09-15)**: 경로가 없어 컬럼·발화 분기만 먼저 넣으면 채우는 쪽이 없어 항상
null→상수라 동작 변화가 0이었다. 그 전제가 사라졌다.
컬럼·발화 분기만 먼저 넣으면 채우는 쪽이 없어 **항상 null→상수라 동작 변화가 0** 인 죽은 코드가 된다.


**닫힘(2026-09-16, PR #546).** `ReminderCopyPort` + `HttpReminderCopyAdapter` + V2.47(title·body, 둘 다 nullable).
필터 네 겹(degraded 면 통째 무시 · 보낸 적 없는 키 버림 · 한쪽만 온 문구 버림 · 길이 초과 버림)을 전부 역검증했다.
**남은 것 하나 — 실 왕복을 아직 안 태웠다.** `AI_REMINDER_COPY_MODE=http` 로 켜고 한 번 태우면
`schedule_key` 에코와 `degraded` 의미가 같이 확인된다. 계약 게이트는 이름만 본다.
"""

