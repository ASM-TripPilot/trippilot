note = """
**실측(2026-09-01)**: `GET /api/v1/trips/not-a-uuid` → `500 INTERNAL`. Spring 의 경로변수 타입변환
실패는 MethodArgumentTypeMismatchException 인데 전역 핸들러가 그것을 모르고 Exception 갈래로
떨어진다. UUID 경로변수를 쓰는 **모든** 엔드포인트가 같다.

TRIP-249 3번(미매핑 경로 500)과 **같은 실패 형태**다 — 클라 입력 오류를 서버 장애로 알리면
프론트·AI 의 재시도·폴백이 5xx 기준으로 갈려 잘못된 갈래를 탄다.

PERSONA-API 는 이 구멍을 국소 회피했다(경로변수를 String 으로 받아 직접 파싱). 이 노드가 전역에서
잡으면 `PersonaInternalController.parseAccountId` 는 지우고 UUID 를 직접 받아도 된다.

주의: 기존 엔드포인트 다수의 응답 코드가 500→400 으로 바뀐다. 계약(openapi)의 400 선언 유무를
함께 훑어야 한다.
