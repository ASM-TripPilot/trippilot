note = """
야간 조용시간(O-U6-4)을 조사하다 **그보다 먼저 고칠 것**이 나왔다.

푸시 페이로드에 우선순위 신호가 없어 모든 알림이 OS 에게 같게 보였다 — 사용자가 취침 집중 모드를
켜면 SLOT_PRE(일정 5분 전)와 REFLECTION(어제 회고)이 **함께** 막히는데 서버 로그에는 SENT 로 남는다.

배정 기준은 "시각이 곧 내용인가" 하나다. SLOT_PRE·PLAN_B 만 time-sensitive —
남발하면 사용자가 앱 단위로 그 권한을 꺼 버려 정작 필요할 때 못 뚫는다.

