spring:
  application:
    name: trippilot-backend
  # 로컬 개발 DB(docker-compose). 런타임은 app_user 롤. Flyway 마이그레이션은 후속(TRIP-147, app_migrate).
  # 통합테스트는 Testcontainers 가 @ServiceConnection 으로 이 값을 대체한다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trippilot?currentSchema=app}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_user}
  # Flyway 는 마이그레이션 전용 롤(app_migrate=스키마 소유자)로 접속 — 런타임 app_user 와 분리.
  # url 미지정 → 위 datasource url 을 app_migrate 자격으로 재사용.
  flyway:
    user: ${DB_MIGRATE_USER:app_migrate}
    password: ${DB_MIGRATE_PASSWORD:app_migrate}
    schemas: app
    default-schema: app
    create-schemas: false   # 스키마는 인프라가 app_migrate 소유로 선생성 (app_migrate 는 DB CREATE 권한 없음)
  # JPA — 스키마는 Flyway 소유. Hibernate 는 엔티티↔스키마 검증만(생성 금지).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_schema: app

# 소셜 로그인 제공자(SECURITY-12: 평문 시크릿 0). client-id/secret 은 env 로만 주입 —
# dev=application-local.yml(gitignore), prod=Secrets Manager→env. token/user-info-uri 는 비밀 아님(제공자 고정값).
# 값 미주입 시 빈 문자열 → 해당 제공자 로그인 시도 시에만 실패(기동엔 영향 없음).
trippilot:
  social:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    # apple 은 client-secret 을 p8 로 동적 서명 + id_token JWKS 검증이 선행(현재 fail-closed) — 후속 티켓.
  # 지역 지오코딩 경계(국내강제 INV-U1-12) — 기본은 스텁이라 로컬·CI 가 외부에 묶이지 않는다.
  # 스텁은 시드 8개만 알고 **나머지는 전부 국외로 판정한다** — 실서비스에서 이대로 두면
  # 정상 국내 지역이 차단된다. 배포 환경은 kakao 로 켠다.
  # 인증은 위 social.kakao.client-id(= 카카오 REST API 키)를 그대로 쓴다. 별도 키가 아니다.
  # 콘솔에서 카카오맵(OPEN_MAP_AND_LOCAL) 서비스가 켜져 있어야 한다 — 꺼져 있으면 403.
  # kakao 인데 키가 비면 RegionGeocodeModeAnnouncer 가 기동을 막는다(불변식이 조용히 꺼지는 것보다 낫다).
  place:
    geocode:
      mode: ${PLACE_GEOCODE_MODE:stub}

# 통합 테스트용 — AI 서비스 위치(compose 에서 AI_URL 주입). 미설정이면 integration 이 degrade.
ai:
  url: ${AI_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
  # 메트릭은 Micrometer 가 OTLP 로 push 한다(TRIP-218).
  # 스크레이프가 아니라 push 이므로 수집기가 앱에 접근할 필요가 없다.
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
        resource-attributes:
          service.name: trippilot-backend
          deployment.environment: ${DEPLOY_ENV:local}

# ── 관측성(TRIP-218) ──────────────────────────────────────────────────────
# 신호별 담당을 나눠 중복 발행을 막는다.
#   로그          = logback OTLP appender (logback-spring.xml, 마스킹 래퍼 경유)
#   메트릭·트레이스 = OTel Java 에이전트 (-javaagent)
#
# 메트릭이 에이전트 담당인 이유는 위 management.otlp.metrics.export 주석 참조
# (에이전트와 Micrometer push 는 공존하지 못한다 — 실측).
#
# 트레이스·로그 전송은 **에이전트가 있어야** 동작한다. 에이전트가 없으면
# GlobalOpenTelemetry 가 no-op 이라 OTLP 로 나가지 않고, stdout JSON 로그만 남는다
# (조용히 죽지 않도록 ObservabilityConfiguration 이 기동 로그로 알린다).
#
# 실행 예(컨테이너 밖에서 직접 돌릴 때. 컨테이너는 backend/Dockerfile 이 같은 값을 이미 갖는다):
#   JAVA_TOOL_OPTIONS="-javaagent:$HOME/otel/opentelemetry-javaagent.jar" \
#   OTEL_SERVICE_NAME=trippilot-backend \
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
#   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf \
#   OTEL_TRACES_EXPORTER=otlp OTEL_LOGS_EXPORTER=otlp OTEL_METRICS_EXPORTER=otlp \
#   OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=false \
#   OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=false \
#   ./gradlew :app:bootRun
#
# 마지막 세 개가 중요하다.
#   METRICS_EXPORTER=otlp          — 메트릭은 에이전트가 내보낸다(Micrometer push 는 유실됨)
#   LOGBACK_APPENDER_ENABLED=false — 에이전트가 root 로거에 appender 를 자동 부착하면
#                                    마스킹을 우회한 원문이 수집기로 나간다
#   LOGBACK_MDC_ENABLED=false      — 에이전트 2.14.0 에서 NoSuchFieldError 로 기동 실패
