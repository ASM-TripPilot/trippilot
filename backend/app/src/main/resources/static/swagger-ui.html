<!DOCTYPE html>
<!--
  Swagger UI — 설계-우선 스펙(/openapi.yaml, docs/design 정본을 빌드가 복사)을 렌더.
  webjar 경로의 버전은 gradle libs(swaggerUi)와 동일하게 유지할 것. 접근: http://localhost:8080/swagger-ui.html
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TripPilot API</title>
  <link rel="stylesheet" href="/webjars/swagger-ui/5.17.14/swagger-ui.css" />
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/webjars/swagger-ui/5.17.14/swagger-ui-bundle.js"></script>
  <script src="/webjars/swagger-ui/5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout',
    });
  </script>
</body>
</html>
