# 보호 라우트 묶음 — 직전 화면을 저장한 숙소로 고정한 뒤, 열려도 화면이 바뀌지 않아야 한다.
- runFlow:
    file: _common/route.yaml
    label: '/stays/saved'
    env:
      ROUTE: '/stays/saved'
      EXPECT_ID: 'saved-stay-root'

- runFlow:
    file: _common/route-protected.yaml
    label: '보호 /login'
    env:
      ROUTE: '/login'
      PROTECTED_ID: 'auth-login-root'

