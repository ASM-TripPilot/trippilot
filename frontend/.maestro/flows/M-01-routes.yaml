    label: '보호 /reconsent'
    env:
      ROUTE: '/reconsent'
      PROTECTED_ID: 'reconsent-agree'

- openLink: 'trippilot:///force-update'
- waitForAnimationToEnd:
    timeout: 4000
- assertNotVisible: '업데이트가 필요해요'
- assertVisible:
    id: 'saved-stay-root'

# 대조군(단언 반전): 없는 경로는 not-found 화면이어야 한다.
- openLink: 'trippilot:///zz-none'
- extendedWaitUntil:
    visible:
      id: 'not-found-home'
    timeout: 10000
- assertVisible: '페이지를 찾을 수 없어요'
