    label: '/trips/${TRIP_ID}/records'
    env:
      ROUTE: '/trips/${TRIP_ID}/records'
      EXPECT_ID: 'record-trip-view'

# 미래 날짜 = 회고 생성 POST 안 함
- runFlow:
