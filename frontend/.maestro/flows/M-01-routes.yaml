# M-01 라우트 전수 진입 — 루트 app/ 의 라우트 래퍼가 올바른 page 를 꽂는지(1156 pages 그룹 이동·1161 루트 이동).
# 준비: 로그인된 앱, 기존 여행(TRIP_ID)·담은 장소(POI_ID)·저장 숙소(SAVED_STAY_ID)의 실제 id.
# 실행: 라우트마다 딥링크(openLink)로 연다. 단언: 그 page 의 대표 testID 가 보이고, 레드박스·not-found 가 아니다.
# 빈/오류/일정 없음 상태 testID 도 "그 page 가 꽂혔다"의 증거로 인정한다(데이터 없는 계정이라서).
# 제외: /trips/{id}/itinerary/manual — 진입만으로 MANUAL 일정을 POST 한다(데이터 생성). / — M-00 이 탭으로 덮는다.
# 대조군: 없는 경로는 not-found 가 떠야 한다(단언 반전 확인). 보호 라우트는 로그인 상태에서 열리면 안 된다.
appId: com.trippilot.travel
name: M-01 라우트 전수 진입
env:
  TRIP_ID: 36bc6101-08b4-4360-9a4b-c98ed5f3d3ea
  POI_ID: 3d80f917-1db9-47a8-ab30-df7168cbb95c
  SAVED_STAY_ID: 8d7c5d78-6278-4210-957d-7c69f573fbf0
---
- runFlow: _common/launch.yaml

# [region] 래퍼 → /explore?region 리다이렉트(explore-landing)
- runFlow:
    file: _common/route.yaml
    label: '/explore/destination/seoul'
    env:
      ROUTE: '/explore/destination/seoul'
      EXPECT_ID: 'explore-region-chip'

- runFlow:
    file: _common/route.yaml
    label: '/explore/places'
    env:
      ROUTE: '/explore/places'
      EXPECT_ID: 'explore-places-root'

- runFlow:
    file: _common/route.yaml
    label: '/explore/places/${POI_ID}'
    env:
      ROUTE: '/explore/places/${POI_ID}'
      EXPECT_ID: 'explore-place-detail'

- runFlow:
    file: _common/route.yaml
    label: '/explore/region'
    env:
      ROUTE: '/explore/region'
      EXPECT_ID: 'explore-region-search'

- runFlow:
    file: _common/route.yaml
    label: '/explore/saved-places'
    env:
      ROUTE: '/explore/saved-places'
      EXPECT_ID: 'explore-saved-root'

