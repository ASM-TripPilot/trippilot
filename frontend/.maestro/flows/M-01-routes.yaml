# 대표 testID 없음: 가짜 세션 → PlanbDraftPage null
- runFlow:
    file: _common/route-blank.yaml
    label: '/trips/${TRIP_ID}/planb/draft?sessionId=00000000-0000-0000-0000-000000000000'
    env:
      ROUTE: '/trips/${TRIP_ID}/planb/draft?sessionId=00000000-0000-0000-0000-000000000000'

# 대표 testID 없음: 가짜 세션 → 빈 시트
- runFlow:
