# FE 컨테이너(Expo Web 자리 placeholder) — 정적 페이지 + /api 리버스 프록시.
# /api 를 BE 컨테이너로 프록시 → 브라우저는 같은 오리진만 호출(CORS 회피) + FE→BE 컨테이너 통신 검증.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;   # compose 네트워크의 backend 서비스
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
