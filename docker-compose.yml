# TripPilot 로컬 통합 개발 스택 (FE·BE·AI·DB)
# 빌드 도구는 Gradle. compose 는 로컬에서 서비스들을 함께 띄우는 오케스트레이션 전용.
#
# 프로파일별 기동:
#   docker compose up -d                    → db 만 (가장 가벼움 · bootRun 로 앱은 호스트에서)
#   docker compose --profile backend up     → db + backend (백엔드도 컨테이너로)
#   docker compose --profile full up        → 전체 스택
#     · 현재: db + backend  (ai·frontend 는 각 코드 준비되면 아래 주석 해제)
#     · frontend 는 Expo Web(브라우저). 네이티브 실기 검증은 호스트에서: cd frontend && npx expo run:ios
name: trippilot

services:
  # ── DB (PostgreSQL 16) ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: trippilot-db
    environment:
      POSTGRES_DB: trippilot
      POSTGRES_USER: postgres            # 로컬 슈퍼유저(master 대역) — 롤·스키마 부트스트랩용
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - trippilot-pgdata:/var/lib/postgresql/data
      - ./backend/docker/init:/docker-entrypoint-initdb.d:ro   # 최초 1회: app_migrate·app_user 롤 + app 스키마
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trippilot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Redis (숙소·여행 조회 캐시 · U1-TS-4) ───────────────────────
  # 숙소 목록·지역 집계·POI 검색결과의 짧은 TTL 조회 캐시. 원본은 PostgreSQL.
  redis:
    image: redis:7-alpine
    container_name: trippilot-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # 캐시 전용(영속 비활성)
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Backend (Spring Boot / Kotlin) ─────────────────────────────
  backend:
    profiles: ["backend", "full"]
    image: ghcr.io/asm-trippilot/trippilot-backend:${TAG:-develop}   # pull 모드: CI가 발행한 이미지
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trippilot-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
        # ai 는 full 프로파일 전용이라 `--profile backend` 단독 기동에는 없다.
        # required:false 여야 그 경우 의존성이 무시된다 — 빼면 backend-only 가 ai 를 끌어올려
        # 기존 동작(AI 없이 degrade)이 바뀐다.
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/trippilot?currentSchema=app
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_user}
      REDIS_HOST: ${REDIS_HOST:-redis}      # 숙소·여행 조회 캐시
      REDIS_PORT: ${REDIS_PORT:-6379}
      AI_URL: ${AI_URL:-http://ai:8000}     # full 프로파일에서 ai 컨테이너로 해석. backend-only 면 unreachable(degrade)
      # 일정 생성 경계 전환(TRIP-229). 기본 fake 라 평소 동작은 그대로 —
      # 공동 통합테스트에서만 AI_SCHEDULE_MODE=http 로 실 AI 컨테이너에 붙인다.
      TRIPPILOT_AI_SCHEDULE_MODE: ${AI_SCHEDULE_MODE:-fake}
      TRIPPILOT_AI_SCHEDULE_BASE_URL: ${AI_URL:-http://ai:8000}
      # 시간제약(day1 5s / 전체 20s)을 AI 에 실을지. **기본 off** — FE 연동 기간에는 시간 때문에
      # 규칙 폴백으로 강등되는 것을 걷어낸다(TRIP-474). 9월 재도입은 여기를 true 로(TRIP-475).
      TRIPPILOT_AI_SCHEDULE_DEADLINE_ENFORCED: ${AI_SCHEDULE_DEADLINE_ENFORCED:-false}
      # 시한 **값**도 통로를 연다. 켜는 순간 조정이 필요할 수 있는데(실측 TRIP-373: 취향 점수가
      # 후보 건당 ~0.3초 선형) 통로가 없으면 코드를 고쳐야 하고, 그러면 "우리 기본값이 무엇인지"가 흐려진다.
      TRIPPILOT_AI_SCHEDULE_DEADLINE_DAY1_MS: ${AI_SCHEDULE_DAY1_DEADLINE_MS:-5000}
      TRIPPILOT_AI_SCHEDULE_DEADLINE_TOTAL_MS: ${AI_SCHEDULE_TOTAL_DEADLINE_MS:-20000}
      # 소셜 로그인 시크릿 — .env 에서 주입(컨테이너는 기본 프로파일이라 application-local.yml 안 읽음).
      # 미설정이면 빈 값 → 소셜 로그인 시도 시에만 실패(기동 무영향). 값은 .env.example 참고.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # 지역 지오코딩 경계(국내강제). 기본 스텁은 시드 8개만 국내로 안다 —
      # 실 지역명으로 여행을 만들려면 kakao 로 켠다(키는 위 KAKAO_CLIENT_ID 를 그대로 쓴다).
      TRIPPILOT_PLACE_GEOCODE_MODE: ${PLACE_GEOCODE_MODE:-stub}
      # 숙소 콘텐츠 경로. 기본 스텁은 **제주 5곳뿐**이라 다른 지역 검색이 전부 0건이 된다 —
      # 전국 정본(stay 12,782곳)으로 돌리려면 db 로 켠다.
      TRIPPILOT_STAY_CONTENT_MODE: ${STAY_CONTENT_MODE:-stub}
      # 서비스 간 호출(TRIP-393). 비우면 /internal 경계가 닫힌다 — AI 수집분 수신도 막힌다.
      TRIPPILOT_SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # ── AI (통합 테스트 스텁 · 실제 C1/C2 는 후속) ─────────────────
  ai:
    profiles: ["full"]
    image: ghcr.io/asm-trippilot/trippilot-ai:${TAG:-develop}
    build:
      context: ./ai
    container_name: trippilot-ai
    environment:
      # 상대 진입점(ai/main.py)이 읽는 스위치. **전부 비워 두는 것이 기본 동작**이다 —
      # TRIPPILOT_LLM_PROVIDER 가 없으면 UnwiredLlm 으로 조립돼 점수는 규칙 폴백, 일정은 OR-Tools 가 낸다.
      # 통로를 열어 두는 이유: 값이 필요해졌을 때 compose 를 고치는 게 아니라 .env 만 채우면 되게.
      #
      # openai 로 켜면 OPENAI_API_KEY 가 **필수**이고, 없으면 상대가 기동에 실패한다(의도된 fail-fast —
      # 조용히 폴백하면 "실 LLM 으로 테스트했다"가 거짓이 된다).
      TRIPPILOT_LLM_PROVIDER: ${AI_LLM_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # chat|responses (기본 responses — 멘토 게이트웨이가 responses 만 라우팅한다).
      OPENAI_API: ${OPENAI_API:-}
      # 미주입 앱으로 띄운다(3개 라우트 503) — 배선 문제인지 우리 문제인지 가를 때.
      TRIPPILOT_WIRING: ${AI_WIRING:-}
      # 기상청 단기예보(디코딩 키). 미설정 = 날씨 보정 없음.
      WEATHER_API: ${WEATHER_API:-}
      # PlanB RAG 벡터 스토어(TRIP-426) — 미설정 = 미배선(경계 개통은 TRIP-428).
      # 컨테이너 안에서는 ai-vectordb 호스트로 해석된다.
      TRIPPILOT_VECTOR_DB_URL: ${AI_VECTOR_DB_URL:-}
      # 후보 POI 정본 실연동(TRIP-408) — SERVICE_AUTH_TOKEN(.env, TRIP-393)이 있을 때만
      # 백엔드를 바라본다. 비우면 주소도 비어 기존 StaticPoiDb(제주 시드 4곳) 조립 —
      # 주소만 있고 토큰이 없으면 ai 가 기동 실패하므로 둘을 한 변수로 묶는다.
      TRIPPILOT_BACKEND_BASE_URL: ${SERVICE_AUTH_TOKEN:+http://backend:8080}
      TRIPPILOT_SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      # TMAP 실경로 API(TRIP-432). 설정 시 ChainedTravelAdapter 활성화 —
      # 미설정 = 기존 하버사인 추정 그대로.
      TMAP_API_KEY: ${TMAP_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # ── AI 벡터 스토어 (PlanB RAG KB · TRIP-426) ───────────────────
  # 백엔드 db와 분리한 전용 컨테이너 — postgres:16-alpine에는 pgvector extension이
  # 없고, 공유 이미지를 바꾸면 백엔드 스택에 영향이 가서 격리를 택했다.
  ai-vectordb:
    profiles: ["full"]
    image: pgvector/pgvector:pg16
    container_name: trippilot-ai-vectordb
    environment:
      POSTGRES_DB: ai_kb
      POSTGRES_USER: ${AI_VECTOR_DB_USER:-ai_kb}
      POSTGRES_PASSWORD: ${AI_VECTOR_DB_PASSWORD:-ai_kb}
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - trippilot-ai-vectordata:/var/lib/postgresql/data
      - ./ai/docker/vector-init:/docker-entrypoint-initdb.d:ro   # 최초 1회: extension + kb_vectors
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_VECTOR_DB_USER:-ai_kb} -d ai_kb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Frontend (Expo Web 자리 · nginx 정적+프록시 스텁) ──────────
  frontend:
    profiles: ["full"]
    image: ghcr.io/asm-trippilot/trippilot-frontend:${TAG:-develop}
    build:
      context: ./frontend
    container_name: trippilot-frontend
    depends_on:
      - backend
    ports:
      - "19006:80"
    healthcheck:
      # localhost 는 컨테이너 안에서 IPv6(::1)로 풀려 nginx(IPv4)에 refused → 127.0.0.1 명시
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  trippilot-pgdata:
  trippilot-ai-vectordata:
